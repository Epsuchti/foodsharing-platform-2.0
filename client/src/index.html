<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>foodsharing</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="foodsharing – Lebensmittel retten, gemeinsam." />
    <meta name="theme-color" content="#25834a" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- start-up requests (app.config.ts initializeApp) begin while the scripts download; HttpClient (fetch) reuses them -->
    <link rel="preload" href="api/auth/session" as="fetch" crossorigin />
    <link rel="preload" href="api/public/app-info" as="fetch" crossorigin />
    <!-- Inter is used once it was downloaded on an earlier visit (core/theme/web-font.ts). -->
    <script>
      try {
        if (localStorage.getItem('fs.font') === 'inter') document.documentElement.classList.add('fs-inter');
      } catch (e) {}
    </script>
    <!-- Boot spinner: inline styles so it paints before the Angular bundle and the global styles load. -->
    <style>
      html {
        background: #f6f8f4;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #121712;
        }
      }
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: boot-loader-fade-in 200ms ease 150ms both;
      }
      .boot-loader__spinner {
        width: 2.5rem;
        height: 2.5rem;
        box-sizing: border-box;
        border: 4px solid #d8f3df;
        border-top-color: #25834a;
        border-radius: 50%;
        animation: boot-loader-spin 0.8s linear infinite;
      }
      @keyframes boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-loader-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <fs-root>
      <div class="boot-loader" role="status" aria-label="Loading">
        <div class="boot-loader__spinner"></div>
      </div>
    </fs-root>
    <noscript>foodsharing needs JavaScript. / foodsharing braucht JavaScript.</noscript>
  </body>
</html>

<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>foodsharing</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6f4;font-family:Arial,Helvetica,sans-serif;color:#1f2a22;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:28px 28px 8px;">
            <h1 style="margin:0 0 16px;font-size:22px;color:#25834a;">foodsharing</h1>
            <p style="margin:0 0 12px;" th:text="${displayName != null} ? 'Ciao ' + ${displayName} + ',' : 'Ciao,'">Ciao,</p>
            <p style="margin:0 0 20px;">clicca sul pulsante per accedere a foodsharing. Se non hai ancora un account, verrà creato.</p>
            <p style="margin:0 0 24px;">
                <a th:href="${link}" href="#" style="display:inline-block;padding:12px 22px;background:#25834a;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">Accedi ora</a>
            </p>
            <p style="margin:0 0 12px;font-size:13px;color:#56635a;" th:text="'Il link è valido ' + ${validityMinutes} + ' minuti e può essere usato una sola volta.'">Il link è valido 30 minuti.</p>
            <p style="margin:0 0 12px;font-size:13px;color:#56635a;">Non hai richiesto l’accesso? Ignora semplicemente questa e-mail.</p>
            <p style="margin:0 0 20px;font-size:12px;color:#56635a;word-break:break-all;" th:text="${link}">link</p>
        </td>
    </tr>
</table>
</body>
</html>

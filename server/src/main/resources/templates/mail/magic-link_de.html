<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>foodsharing</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6f4;font-family:Arial,Helvetica,sans-serif;color:#1f2a22;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:28px 28px 8px;">
            <h1 style="margin:0 0 16px;font-size:22px;color:#25834a;">foodsharing</h1>
            <p style="margin:0 0 12px;" th:text="${displayName != null} ? 'Hallo ' + ${displayName} + ',' : 'Hallo,'">Hallo,</p>
            <p style="margin:0 0 20px;">klicke auf den Button, um dich bei foodsharing anzumelden. Falls du noch kein Konto hast, wird es dabei erstellt.</p>
            <p style="margin:0 0 24px;">
                <a th:href="${link}" href="#" style="display:inline-block;padding:12px 22px;background:#25834a;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">Jetzt anmelden</a>
            </p>
            <p style="margin:0 0 12px;font-size:13px;color:#56635a;" th:text="'Der Link ist ' + ${validityMinutes} + ' Minuten gültig und kann nur einmal verwendet werden.'">Der Link ist 30 Minuten gültig.</p>
            <p style="margin:0 0 12px;font-size:13px;color:#56635a;">Du hast keine Anmeldung angefordert? Dann kannst du diese E-Mail einfach ignorieren.</p>
            <p style="margin:0 0 20px;font-size:12px;color:#56635a;word-break:break-all;" th:text="${link}">link</p>
        </td>
    </tr>
</table>
</body>
</html>

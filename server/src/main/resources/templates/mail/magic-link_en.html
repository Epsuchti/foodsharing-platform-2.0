<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>foodsharing</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6f4;font-family:Arial,Helvetica,sans-serif;color:#1f2a22;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:28px 28px 8px;">
            <h1 style="margin:0 0 16px;font-size:22px;color:#25834a;">foodsharing</h1>
            <p style="margin:0 0 12px;" th:text="${displayName != null} ? 'Hello ' + ${displayName} + ',' : 'Hello,'">Hello,</p>
            <p style="margin:0 0 20px;">click the button to sign in to foodsharing. If you do not have an account yet, it will be created.</p>
            <p style="margin:0 0 24px;">
                <a th:href="${link}" href="#" style="display:inline-block;padding:12px 22px;background:#25834a;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">Sign in now</a>
            </p>
            <p style="margin:0 0 12px;font-size:13px;color:#56635a;" th:text="'The link is valid for ' + ${validityMinutes} + ' minutes and can only be used once.'">The link is valid for 30 minutes.</p>
            <p style="margin:0 0 12px;font-size:13px;color:#56635a;">You did not ask to sign in? Then simply ignore this email.</p>
            <p style="margin:0 0 20px;font-size:12px;color:#56635a;word-break:break-all;" th:text="${link}">link</p>
        </td>
    </tr>
</table>
</body>
</html>

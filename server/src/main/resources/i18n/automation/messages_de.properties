# Pickup and request policy texts (M4 B4, ported from the reference message.automation.*). MessageFormat: {0}.
# Linked-store messages use {{name}}-style placeholders and are read without arguments.
automation.rule.decline-footer=Diese Aktion wurde automatisch ausgeführt. Bei Fragen oder Problemen wende dich an die Betriebsverantwortlichen.
automation.rule.rules-skipped-near-pickup=Die Abholung findet in zwei Kalendertagen oder weniger statt; die Automationsregeln werden übersprungen.
automation.rule.gap=Zwischen den Abholungen liegt nur {0} Abstand; erforderlich sind mindestens {1}.
automation.rule.experience=Diese Abholung benötigt Erfahrung in diesem Betrieb. Weder du noch eine allfällige begleitende Person haben diese.
automation.rule.no-cleaning-store=Für den Bezirk {0} ist kein Reinigungs-Fairteiler konfiguriert.
automation.rule.cleaning-reminder=Hey {0}\n\nDu hast am {1} einen Abholslot bei {2} gebucht. Bei diesem Betrieb gilt die allgemein geltende Reinigungspflicht: Jedes Mitglied soll alle 6 Monate einen Fairteiler reinigen. Diese Automatisierung setzt diese Pflicht derzeit erst nach {3} ohne Reinigung durch.\n\n{4}\n\nDaher würden wir dich normalerweise aus dem Abholslot austragen. Da aktuell jedoch nur noch {5} freie Reinigungsslots verfügbar sind, lassen wir dich dieses Mal ausnahmsweise im Slot eingetragen.\n\nAktuell sind folgende Reinigungsslots frei:\n\n{6}\n\nBitte buche einen passenden Reinigungsslot hier:\n{7}
automation.rule.cleaning-new-user=Hey {0}\n\nDu hast am {1} einen Abholslot bei {2} gebucht.\n\nDie offizielle Reinigungspflicht lautet: Jedes Mitglied soll alle 6 Monate einen Fairteiler reinigen. Die Automatisierung setzt diese Regel bei dir erst durch, wenn seit deiner Verifizierung ein Zeitraum von {3} vergangen ist.\n\nDu bist seit dem {4} bei Foodsharing verifiziert. Bis zum {5} musst du deshalb noch keine Reinigung nachweisen.\n\nWenn du bis dahin keinen Fairteiler gereinigt hast, musst du danach eine Reinigung einplanen, bevor du wieder Abholslots buchen kannst.\n\nSlots buchen hier: {6}.
automation.rule.cleaning-required=Bei diesem Betrieb gilt die allgemein geltende Reinigungspflicht: Jedes Mitglied soll alle 6 Monate einen Fairteiler reinigen. Diese Automatisierung setzt diese Pflicht derzeit erst nach {3} ohne Reinigung durch.\n\nDu hast in den letzten {0} keinen Fairteiler geputzt. {1} Zudem hast du keine zukünftige Reinigung geplant. Bitte trage dich für eine Reinigung ein, damit du weiterhin abholen kannst. Buch dir doch einen der freien Reinigungsslots. Slots buchen hier: {4}.
automation.rule.no-cleaning-yet=Du hast bisher noch keinen Fairteiler gereinigt.
automation.rule.last-cleaning=Deine letzte Reinigung ist {0} her.
automation.rule.reminder-last-cleaning=Deine letzte Reinigung war am {0}.
automation.rule.all-rules-passed=Alle aktiven Abholungs-Automationsregeln sind erfüllt.
automation.rule.public-holiday=Die Abholung ist am Feiertag {0}; sie wird nicht automatisch bestätigt.
automation.rule.manual-date=Die Abholung ist für diesen Betrieb als manuell zu prüfendes Datum hinterlegt und wird nicht automatisch bestätigt.
automation.rule.holiday-calendar-unavailable=Der Feiertagskalender ist momentan nicht verfügbar; die Abholung wird vorsichtshalber nicht automatisch bestätigt.
automation.rule.day.one={0} Tag
automation.rule.day.other={0} Tage
automation.rule.month.one={0} Monat
automation.rule.month.other={0} Monaten
automation.rule.no-open-cleaning-slots=keine freien Reinigungsslots
automation.rule.or=oder
automation.rule.linked-store.default-message=Hallo {{name}}\n\nDu hast dich für die Abholung bei {{storeName}} am {{pickupDate}} eingetragen. Für diesen Betrieb gilt eine Kopplung: Wer bei {{storeName}} abholt, muss {{requirement}} auch bei {{linkedStoreName}} abholen.\n\nInnerhalb von {{graceMinutes}} Minuten nach deiner Anmeldung haben wir keine passende Abholung bei {{linkedStoreName}} gefunden. Deshalb haben wir dich wieder aus diesem Slot ausgetragen.\n\nDu kannst dich gerne erneut eintragen. Trag dich dann bitte gleich auch für eine passende Abholung bei {{linkedStoreName}} ein.\n\nDanke für dein Verständnis und deinen Einsatz!
automation.rule.linked-store.requirement.same-day=am selben Tag
automation.rule.linked-store.requirement.last-days.one=am selben Tag, am Tag davor oder am Tag danach
automation.rule.linked-store.requirement.last-days.other=innerhalb von {0} Tagen vor oder nach dieser Abholung
automation.rule.linked-store.requirement.after.one=am selben Tag oder am Tag danach
automation.rule.linked-store.requirement.after.other=am selben Tag oder innerhalb von {0} Tagen nach dieser Abholung
automation.rule.linked-store.requirement.before.one=am selben Tag oder am Tag davor
automation.rule.linked-store.requirement.before.other=am selben Tag oder innerhalb der {0} Tage vor dieser Abholung
automation.rule.linked-store.requirement.range=am selben Tag, bis zu {0} Tage davor oder bis zu {1} Tage danach
automation.rule.linked-store.pending=Wartet bis {0} auf eine Abholung bei {1} ({2}); danach wird die Person aus dem Slot ausgetragen.
automation.rule.linked-store.awaiting-confirmation=Wartet, bis die Abholung bei {0} bestätigt ist; erst dann wird dieser Slot bestätigt.
automation.rule.request.distance=Die Anfrage wurde automatisch abgelehnt, weil die Entfernung von {0} km das Maximum von {1} km überschreitet.
automation.rule.request.no-address=Für die Person oder den Betrieb ist keine Adresse mit Koordinaten hinterlegt; die Anfrage wird nicht automatisch bearbeitet.
automation.rule.request.approved=Die Anfrage wurde automatisch angenommen.
automation.rule.failed=Die Automation ist fehlgeschlagen.

automation.rule.linked-store.requirement.before.one=le même jour ou la veille
automation.rule.linked-store.requirement.before.other=le même jour ou dans les {0} jours avant cette collecte
automation.rule.linked-store.requirement.range=le même jour, jusqu’à {0} jours avant ou jusqu’à {1} jours après
automation.rule.linked-store.pending=Attend jusqu’au {0} une collecte chez {1} ({2}) ; ensuite la personne est retirée du créneau.
automation.rule.linked-store.awaiting-confirmation=Attend que la collecte chez {0} soit confirmée ; ce créneau sera confirmé ensuite.

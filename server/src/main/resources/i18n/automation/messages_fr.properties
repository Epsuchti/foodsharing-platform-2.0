automation.rule.linked-store.default-message=Bonjour {{name}}\n\nTu t’es inscrit·e à la collecte chez {{storeName}} le {{pickupDate}}. Ce commerce est couplé : qui collecte chez {{storeName}} doit aussi collecter chez {{linkedStoreName}} {{requirement}}.\n\nDans les {{graceMinutes}} minutes suivant ton inscription, nous n’avons trouvé aucune collecte correspondante chez {{linkedStoreName}}. Nous t’avons donc retiré·e de ce créneau.\n\nTu peux volontiers te réinscrire. Inscris-toi alors aussi tout de suite à une collecte correspondante chez {{linkedStoreName}}.\n\nMerci pour ta compréhension et ton engagement !

# Pickup and request policy texts (M4 B4). MessageFormat: {0}. Linked-store messages use {{name}}-style placeholders.
automation.rule.decline-footer=Cette action a été effectuée automatiquement. En cas de questions ou de problèmes, adresse-toi aux responsables du commerce.
automation.rule.rules-skipped-near-pickup=La collecte a lieu dans deux jours calendaires ou moins ; les règles d’automatisation sont ignorées.
automation.rule.gap=Il n’y a que {0} entre les collectes ; il faut au moins {1}.
automation.rule.experience=Cette collecte demande de l’expérience dans ce commerce. Ni toi ni une éventuelle personne qui t’accompagne ne l’avez.
automation.rule.no-cleaning-store=Aucun Fairteiler de nettoyage n’est configuré pour la région {0}.
automation.rule.cleaning-reminder=Salut {0}\n\nTu as réservé un créneau de collecte chez {2} le {1}. Ce commerce applique l’obligation générale de nettoyage : chaque membre doit nettoyer un Fairteiler tous les 6 mois. Cette automatisation n’applique actuellement cette obligation qu’après {3} sans nettoyage.\n\n{4}\n\nNous devrions donc normalement te retirer du créneau. Comme il ne reste que {5} créneaux de nettoyage libres, nous te laissons exceptionnellement inscrit·e cette fois.\n\nCes créneaux de nettoyage sont libres actuellement :\n\n{6}\n\nMerci de réserver un créneau de nettoyage ici :\n{7}
automation.rule.cleaning-new-user=Salut {0}\n\nTu as réservé un créneau de collecte chez {2} le {1}.\n\nL’obligation officielle de nettoyage est : chaque membre doit nettoyer un Fairteiler tous les 6 mois. L’automatisation n’applique cette règle pour toi qu’une fois {3} écoulés depuis ta vérification.\n\nTu es vérifié·e depuis le {4}. Jusqu’au {5}, tu n’as donc pas encore besoin de justifier un nettoyage.\n\nSi tu n’as pas nettoyé de Fairteiler d’ici là, tu devras planifier un nettoyage avant de pouvoir réserver à nouveau des créneaux.\n\nRéserver des créneaux ici : {6}.
automation.rule.cleaning-required=Ce commerce applique l’obligation générale de nettoyage : chaque membre doit nettoyer un Fairteiler tous les 6 mois. Cette automatisation n’applique actuellement cette obligation qu’après {3} sans nettoyage.\n\nTu n’as pas nettoyé de Fairteiler au cours des derniers {0}. {1} Tu n’as pas non plus de nettoyage prévu. Inscris-toi pour un nettoyage afin de pouvoir continuer à collecter. Réserve un des créneaux de nettoyage libres ici : {4}.
automation.rule.no-cleaning-yet=Tu n’as encore nettoyé aucun Fairteiler.
automation.rule.last-cleaning=Ton dernier nettoyage date d’il y a {0}.
automation.rule.reminder-last-cleaning=Ton dernier nettoyage a eu lieu le {0}.
automation.rule.all-rules-passed=Toutes les règles d’automatisation actives sont respectées.
automation.rule.public-holiday=La collecte tombe le jour férié {0} ; elle n’est pas confirmée automatiquement.
automation.rule.manual-date=Cette date est à vérifier manuellement pour ce commerce ; la collecte n’est pas confirmée automatiquement.
automation.rule.holiday-calendar-unavailable=Le calendrier des jours fériés est indisponible pour le moment ; par précaution, la collecte n’est pas confirmée automatiquement.

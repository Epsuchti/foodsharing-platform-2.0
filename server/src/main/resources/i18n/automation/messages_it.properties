# Pickup and request policy texts (M4 B4). MessageFormat: {0}. Linked-store messages use {{name}}-style placeholders.
automation.rule.decline-footer=Questa azione è stata eseguita automaticamente. Per domande o problemi rivolgiti ai responsabili del negozio.
automation.rule.rules-skipped-near-pickup=Il ritiro è tra due giorni di calendario o meno; le regole di automazione vengono saltate.
automation.rule.gap=Tra i ritiri ci sono solo {0}; ne servono almeno {1}.
automation.rule.experience=Questo ritiro richiede esperienza in questo negozio. Né tu né un’eventuale persona che ti accompagna l’avete.
automation.rule.no-cleaning-store=Per la regione {0} non è configurato alcun Fairteiler per la pulizia.
automation.rule.cleaning-reminder=Ciao {0}\n\nHai prenotato un turno di ritiro presso {2} il {1}. Questo negozio applica l’obbligo generale di pulizia: ogni membro deve pulire un Fairteiler ogni 6 mesi. Questa automazione applica attualmente l’obbligo solo dopo {3} senza pulizia.\n\n{4}\n\nNormalmente ti toglieremmo quindi dal turno. Poiché al momento restano solo {5} turni di pulizia liberi, questa volta ti lasciamo eccezionalmente iscritto/a.\n\nQuesti turni di pulizia sono attualmente liberi:\n\n{6}\n\nPrenota un turno di pulizia adatto qui:\n{7}
automation.rule.cleaning-new-user=Ciao {0}\n\nHai prenotato un turno di ritiro presso {2} il {1}.\n\nL’obbligo ufficiale di pulizia è: ogni membro deve pulire un Fairteiler ogni 6 mesi. L’automazione applica questa regola per te solo quando sono trascorsi {3} dalla tua verifica.\n\nSei verificato/a dal {4}. Fino al {5} non devi quindi ancora dimostrare una pulizia.\n\nSe entro allora non avrai pulito un Fairteiler, dovrai pianificare una pulizia prima di poter prenotare di nuovo turni di ritiro.\n\nPrenota i turni qui: {6}.
automation.rule.cleaning-required=Questo negozio applica l’obbligo generale di pulizia: ogni membro deve pulire un Fairteiler ogni 6 mesi. Questa automazione applica attualmente l’obbligo solo dopo {3} senza pulizia.\n\nNegli ultimi {0} non hai pulito alcun Fairteiler. {1} Inoltre non hai pianificato nessuna pulizia. Iscriviti a una pulizia per poter continuare a ritirare. Prenota uno dei turni di pulizia liberi qui: {4}.
automation.rule.no-cleaning-yet=Finora non hai ancora pulito un Fairteiler.
automation.rule.last-cleaning=La tua ultima pulizia risale a {0} fa.
automation.rule.reminder-last-cleaning=La tua ultima pulizia è stata il {0}.
automation.rule.all-rules-passed=Tutte le regole di automazione attive sono rispettate.
automation.rule.public-holiday=Il ritiro cade nel giorno festivo {0}; non viene confermato automaticamente.
automation.rule.manual-date=Questa data è da verificare manualmente per questo negozio; il ritiro non viene confermato automaticamente.
automation.rule.holiday-calendar-unavailable=Il calendario dei giorni festivi non è al momento disponibile; per precauzione il ritiro non viene confermato automaticamente.
automation.rule.day.one={0} giorno
automation.rule.day.other={0} giorni
automation.rule.month.one={0} mese
automation.rule.month.other={0} mesi
automation.rule.no-open-cleaning-slots=nessun turno di pulizia libero
automation.rule.or=o
automation.rule.linked-store.default-message=Ciao {{name}}\n\nTi sei iscritto/a al ritiro presso {{storeName}} il {{pickupDate}}. Questo negozio è collegato: chi ritira presso {{storeName}} deve ritirare {{requirement}} anche presso {{linkedStoreName}}.\n\nEntro {{graceMinutes}} minuti dalla tua iscrizione non abbiamo trovato alcun ritiro corrispondente presso {{linkedStoreName}}. Per questo ti abbiamo tolto/a da questo turno.\n\nPuoi iscriverti di nuovo. In tal caso iscriviti subito anche a un ritiro corrispondente presso {{linkedStoreName}}.\n\nGrazie per la comprensione e per il tuo impegno!
automation.rule.linked-store.requirement.same-day=lo stesso giorno
automation.rule.linked-store.requirement.last-days.one=lo stesso giorno, il giorno prima o il giorno dopo
automation.rule.linked-store.requirement.last-days.other=entro {0} giorni prima o dopo questo ritiro
automation.rule.linked-store.requirement.after.one=lo stesso giorno o il giorno dopo
automation.rule.linked-store.requirement.after.other=lo stesso giorno o entro {0} giorni dopo questo ritiro
automation.rule.linked-store.requirement.before.one=lo stesso giorno o il giorno prima
automation.rule.linked-store.requirement.before.other=lo stesso giorno o nei {0} giorni prima di questo ritiro
automation.rule.linked-store.requirement.range=lo stesso giorno, fino a {0} giorni prima o fino a {1} giorni dopo
automation.rule.linked-store.pending=Attende fino al {0} un ritiro presso {1} ({2}); poi la persona viene tolta dal turno.
automation.rule.linked-store.awaiting-confirmation=Attende la conferma del ritiro presso {0}; solo allora questo turno viene confermato.
automation.rule.request.distance=La richiesta è stata rifiutata automaticamente perché la distanza di {0} km supera il massimo di {1} km.
automation.rule.request.no-address=Per la persona o il negozio non è noto alcun indirizzo con coordinate; la richiesta non viene gestita automaticamente.
automation.rule.request.approved=La richiesta è stata accettata automaticamente.
automation.rule.failed=L’automazione non è riuscita.

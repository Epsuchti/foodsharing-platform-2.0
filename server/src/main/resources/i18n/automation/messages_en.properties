# Pickup and request policy texts (M4 B4). MessageFormat: {0}. Linked-store messages use {{name}}-style placeholders.
automation.rule.decline-footer=This action was carried out automatically. If you have questions or problems, please contact the store managers.
automation.rule.rules-skipped-near-pickup=The pickup is in two calendar days or less; the automation rules are skipped.
automation.rule.gap=There is only {0} between the pickups; at least {1} are required.
automation.rule.experience=This pickup needs experience in this store. Neither you nor anyone picking up with you has it.
automation.rule.no-cleaning-store=No cleaning Fairteiler is configured for the region {0}.
automation.rule.cleaning-reminder=Hey {0}\n\nYou booked a pickup slot at {2} on {1}. This store applies the general cleaning duty: every member should clean a Fairteiler every 6 months. This automation currently only enforces the duty after {3} without cleaning.\n\n{4}\n\nNormally we would therefore remove you from the pickup slot. As only {5} free cleaning slots are available at the moment, we keep you in the slot this time.\n\nThese cleaning slots are free right now:\n\n{6}\n\nPlease book a suitable cleaning slot here:\n{7}
automation.rule.cleaning-new-user=Hey {0}\n\nYou booked a pickup slot at {2} on {1}.\n\nThe official cleaning duty is: every member should clean a Fairteiler every 6 months. The automation only enforces this rule for you once {3} have passed since your verification.\n\nYou have been verified since {4}. Until {5} you therefore do not need to show a cleaning.\n\nIf you have not cleaned a Fairteiler by then, you will have to plan a cleaning before you can book pickup slots again.\n\nBook slots here: {6}.
automation.rule.cleaning-required=This store applies the general cleaning duty: every member should clean a Fairteiler every 6 months. This automation currently only enforces the duty after {3} without cleaning.\n\nYou have not cleaned a Fairteiler in the last {0}. {1} You also have no cleaning planned. Please sign up for a cleaning so that you can keep picking up. Book one of the free cleaning slots here: {4}.
automation.rule.no-cleaning-yet=You have not cleaned a Fairteiler yet.
automation.rule.last-cleaning=Your last cleaning was {0} ago.
automation.rule.reminder-last-cleaning=Your last cleaning was on {0}.
automation.rule.all-rules-passed=All active pickup automation rules are met.
automation.rule.public-holiday=The pickup is on the public holiday {0}; it is not confirmed automatically.
automation.rule.manual-date=The pickup date is marked for manual review in this store and is not confirmed automatically.
automation.rule.holiday-calendar-unavailable=The public holiday calendar is currently unavailable; to be safe, the pickup is not confirmed automatically.
automation.rule.day.one={0} day
automation.rule.day.other={0} days
automation.rule.month.one={0} month
automation.rule.month.other={0} months
automation.rule.no-open-cleaning-slots=no free cleaning slots
automation.rule.or=or
automation.rule.linked-store.default-message=Hello {{name}}\n\nYou signed up for the pickup at {{storeName}} on {{pickupDate}}. This store is linked: whoever picks up at {{storeName}} must also pick up at {{linkedStoreName}} {{requirement}}.\n\nWithin {{graceMinutes}} minutes after your sign-up we found no matching pickup at {{linkedStoreName}}. We have therefore removed you from this slot.\n\nYou are welcome to sign up again. Please also sign up for a matching pickup at {{linkedStoreName}} right away.\n\nThank you for your understanding and your commitment!
automation.rule.linked-store.requirement.same-day=on the same day
automation.rule.linked-store.requirement.last-days.one=on the same day, the day before or the day after
automation.rule.linked-store.requirement.last-days.other=within {0} days before or after this pickup
automation.rule.linked-store.requirement.after.one=on the same day or the day after
automation.rule.linked-store.requirement.after.other=on the same day or within {0} days after this pickup
automation.rule.linked-store.requirement.before.one=on the same day or the day before
automation.rule.linked-store.requirement.before.other=on the same day or within the {0} days before this pickup
automation.rule.linked-store.requirement.range=on the same day, up to {0} days before or up to {1} days after
automation.rule.linked-store.pending=Waiting until {0} for a pickup at {1} ({2}); after that the person is removed from the slot.
automation.rule.linked-store.awaiting-confirmation=Waiting until the pickup at {0} is confirmed; only then is this slot confirmed.
automation.rule.request.distance=The request was declined automatically because the distance of {0} km exceeds the maximum of {1} km.
automation.rule.request.no-address=No address with coordinates is known for the person or the store; the request is not handled automatically.

# Seed (T15): EinAbs of Zürich Stadt / Winterthur, bookings, comments, guide profile, templates, subscriptions, store aliases.
databaseChangeLog:
  - changeSet:
      id: seed-045-1
      author: platform
      context: seed
      runOnChange: true
      comment: '14 upcoming EinAbs in Zürich Stadt, 1 in Winterthur, past EinAbs of the newcomers.'
      changes:
        - loadUpdateData:
            tableName: intro_pickup
            file: ../intropickup/intro_pickup.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: region_id, type: UUID}
              - column: {name: start_at, type: STRING}
              - column: {name: guide_id, type: UUID}
              - column: {name: visit_fairteiler, type: BOOLEAN}
              - column: {name: slot_count, type: NUMERIC}
              - column: {name: minimum_pickup_count, type: NUMERIC}
              - column: {name: store_id, type: UUID}
              - column: {name: imported, type: BOOLEAN}
              - column: {name: deleted_at, type: STRING}

# Seed (M6 B12): 400 days of platform totals (statistics_daily) ending 2026-11-01, generated by
# server/scripts/gen-statistics-seed.py. Ids: docs/seed-ids.md module 0054 table 0001. Shifted by StatisticsSeedDateShift.
databaseChangeLog:
  - changeSet:
      id: seed-172-1
      author: platform
      context: seed
      comment: 'Daily platform totals for the public statistics page.'
      changes:
        - loadData:
            tableName: statistics_daily
            file: ../statistics/statistics_daily.csv
            relativeToChangelogFile: true
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: stat_day, type: DATE}
              - column: {name: kg_saved, type: NUMERIC}
              - column: {name: pickups, type: NUMERIC}
              - column: {name: foodsavers, type: NUMERIC}
              - column: {name: stores, type: NUMERIC}
              - column: {name: cooperations, type: NUMERIC}
              - column: {name: food_share_points, type: NUMERIC}
              - column: {name: baskets, type: NUMERIC}

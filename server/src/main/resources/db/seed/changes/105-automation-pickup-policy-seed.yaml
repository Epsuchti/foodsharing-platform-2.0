# Seed (M4 B4): pickup policies S-06 (live), S-01, S-02 (cleaning), S-04 (linked to S-01) and S-03 (all off),
# excluded date, cleaning exemption for bieb and 40 audits of the last 7 days (cleaning Fairteiler: seed 180).
# Generated by server/scripts/gen-automation-seed.py + gen-automation-seed-yaml.py; ids in docs/seed-ids.md (0022).
databaseChangeLog:
  # seed-105-1 and seed-105-6 (with dry_run) were replaced by seed-105-8 and seed-105-9 when changelog 192 dropped
  # the column (decision 167).
  - changeSet:
      id: seed-105-8
      author: platform
      context: seed
      runOnChange: true
      comment: 'Pickup policies.'
      changes:
        - loadUpdateData:
            tableName: pickup_policy
            file: ../automation/pickup_policy.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','

# Region seed (T11, docs/seed-ids.md): plan §16 tree, memberships of the seed users, functions, options, pins, postcodes.
databaseChangeLog:
  - changeSet:
      id: seed-020-1
      author: platform
      context: seed
      runOnChange: true
      comment: 'Region tree of plan §16 (parents before children) with global and Zürich working groups.'
      changes:
        - loadUpdateData:
            tableName: region
            file: ../region/region.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: parent_id, type: UUID}
              - column: {name: moderated, type: BOOLEAN}
              - column: {name: sort_order, type: NUMERIC}
              - column: {name: active, type: BOOLEAN}
              - column: {name: has_children, type: BOOLEAN}
              - column: {name: min_pickups, type: NUMERIC}
              - column: {name: min_bananas, type: NUMERIC}
              - column: {name: min_weeks, type: NUMERIC}
              - column: {name: max_active_bookings_per_user, type: NUMERIC}
              - column: {name: prevent_duplicate_guide_bookings, type: BOOLEAN}
              - column: {name: prevent_duplicate_category_bookings, type: BOOLEAN}
              - column: {name: require_fairteiler_visit_by_third, type: BOOLEAN}
              - column: {name: cleaning_store_id, type: UUID}
              - column: {name: learning_pages_mandatory, type: BOOLEAN}
              - column: {name: latitude, type: NUMERIC}
              - column: {name: longitude, type: NUMERIC}

# Seed (B4): weekly schedules of the 18 established stores, one-time pickups / overrides and sign-ups of the past
# 90 days and the next 30 days relative to SEED_NOW 2026-11-02T09:00Z. Generated by server/scripts/gen-pickup-seed.mjs
# (deterministic; edit the script, not the CSVs). Ids: docs/seed-ids.md module 0021.
databaseChangeLog:
  - changeSet:
      id: seed-063-1
      author: platform
      context: seed
      runOnChange: true
      comment: 'Regular pickups.'
      changes:
        - loadUpdateData:
            tableName: regular_pickup
            file: ../pickup/regular_pickup.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID}
              - column: {name: weekday, type: STRING}
              - column: {name: start_time, type: STRING}
              - column: {name: slot_count, type: NUMERIC}
              - column: {name: description, type: STRING}
  - changeSet:
      id: seed-063-2
      author: platform
      context: seed
      runOnChange: true
      comment: 'One-time pickups and overrides.'
      changes:
        - loadUpdateData:
            tableName: pickup
            file: ../pickup/pickup.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID}
              - column: {name: pickup_at, type: STRING}
              - column: {name: slot_count, type: NUMERIC}
              - column: {name: description, type: STRING}
  - changeSet:
      id: seed-063-3
      author: platform
      context: seed
      runOnChange: true
      comment: 'Pickup sign-ups.'
      changes:
        - loadUpdateData:
            tableName: pickup_signup
            file: ../pickup/pickup_signup.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID}
              - column: {name: user_id, type: UUID}
              - column: {name: pickup_at, type: STRING}
              - column: {name: confirmed, type: BOOLEAN}
              - column: {name: confirmed_by, type: UUID}
              - column: {name: confirmed_at, type: STRING}
              - column: {name: reminded_at, type: STRING}

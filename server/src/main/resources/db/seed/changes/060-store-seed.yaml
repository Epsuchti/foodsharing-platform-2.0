# Seed (B2): store categories, groceries, weight categories, chains, KAMs, 25 stores.
databaseChangeLog:
  - changeSet:
      id: seed-060-1
      author: platform
      context: seed
      runOnChange: true
      comment: 'Store categories.'
      changes:
        - loadUpdateData:
            tableName: store_category
            file: ../store/store_category.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
  - changeSet:
      id: seed-060-2
      author: platform
      context: seed
      runOnChange: true
      comment: 'Groceries.'

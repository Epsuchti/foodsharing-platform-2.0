# Seed (B2): store teams, jumpers, an application and an invitation.
databaseChangeLog:
  - changeSet:
      id: seed-061-1
      author: platform
      context: seed
      runOnChange: true
      comment: 'Store memberships.'
      changes:
        - loadUpdateData:
            tableName: store_membership
            file: ../store/store_membership.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID}
              - column: {name: user_id, type: UUID}
              - column: {name: manager, type: BOOLEAN}
              - column: {name: invited_by, type: UUID}
              - column: {name: added_at, type: STRING}

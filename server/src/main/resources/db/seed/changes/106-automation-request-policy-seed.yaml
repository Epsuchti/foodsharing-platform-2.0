# Seed (M4 B4): request policy S-07 (distance 5 km, dry run) with 3 audits. Ids: docs/seed-ids.md (0022).
databaseChangeLog:
  - changeSet:
      id: seed-106-1
      author: platform
      context: seed
      runOnChange: true
      comment: 'Request policies.'
      changes:
        - loadUpdateData:
            tableName: request_policy
            file: ../automation/request_policy.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID}
              - column: {name: enabled, type: BOOLEAN}
              - column: {name: dry_run, type: BOOLEAN}
              - column: {name: distance_rule_enabled, type: BOOLEAN}
              - column: {name: maximum_distance_km, type: NUMERIC}
  - changeSet:
      id: seed-106-2
      author: platform
      context: seed
      runOnChange: true
      comment: 'Request-policy decisions.'
      changes:
        - loadUpdateData:
            tableName: request_policy_audit
            file: ../automation/request_policy_audit.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: policy_id, type: UUID}
              - column: {name: store_id, type: UUID}
              - column: {name: region_id, type: UUID}
              - column: {name: user_id, type: UUID}
              - column: {name: dry_run, type: BOOLEAN}
              - column: {name: status, type: STRING}
              - column: {name: reason, type: STRING}
              - column: {name: message, type: STRING}
              - column: {name: error, type: STRING}

              - column: {name: question_count, type: NUMERIC}
              - column: {name: timed, type: BOOLEAN}
              - column: {name: test, type: BOOLEAN}
  - changeSet:
      id: seed-030-8
      author: platform
      context: seed
      runOnChange: true
      comment: 'quiz@local passed the foodsaver quiz (not yet confirmed).'
      changes:
        - loadUpdateData:
            tableName: user_account
            file: ../quiz/user_quiz_role.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}

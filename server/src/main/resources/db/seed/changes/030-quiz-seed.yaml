# Quiz seed (T13): 7 quizzes with questions and answers in five languages (gws/fr/it machine translated), and the seed users' quiz sessions.
databaseChangeLog:
  - changeSet:
      id: seed-030-1
      author: platform
      context: seed
      runOnChange: true
      comment: 'Quizzes.'
      changes:
        - loadUpdateData:
            tableName: quiz
            file: ../quiz/quiz.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: max_failure_points, type: NUMERIC}
              - column: {name: question_count_timed, type: NUMERIC}
              - column: {name: question_count_untimed, type: NUMERIC}
  - changeSet:
      id: seed-030-2
      author: platform
      context: seed
      runOnChange: true
      comment: 'Quiz names and descriptions.'
      changes:
        - loadUpdateData:
            tableName: quiz_i18n
            file: ../quiz/quiz_i18n.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: owner_id, type: UUID}
  - changeSet:
      id: seed-030-3
      author: platform
      context: seed
      runOnChange: true
      comment: 'Questions.'
      changes:

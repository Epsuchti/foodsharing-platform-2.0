            tableName: quiz_question
            file: ../quiz/quiz_question.csv
            relativeToChangelogFile: true
            primaryKey: id
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: {name: id, type: UUID}
              - column: {name: version, type: NUMERIC}
              - column: {name: created_at, type: STRING}
              - column: {name: updated_at, type: STRING}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: quiz_id, type: UUID}
              - column: {name: duration_seconds, type: NUMERIC}
              - column: {name: mandatory, type: BOOLEAN}
              - column: {name: failure_points, type: NUMERIC}
              - column: {name: deleted_at, type: STRING}
  - changeSet:
      id: seed-030-4
      author: platform
      context: seed
      runOnChange: true
      comment: 'Question texts.'
      changes:

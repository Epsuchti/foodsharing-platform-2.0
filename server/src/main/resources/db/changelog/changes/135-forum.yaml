# Milestone 5 (B6): region and ambassador forums - threads and posts (upstream fs_theme, fs_theme_post; A36, A37).
databaseChangeLog:
  - changeSet:
      id: 135-1
      author: platform
      comment: 'Forum threads (upstream fs_theme + fs_bezirk_has_theme). active=false awaits activation by a moderator.'
      changes:
        - createTable:
            tableName: forum_thread
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_forum_thread, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: region_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_forum_thread_region_id, references: region(id), deleteCascade: true}}
              - column: {name: ambassador_forum, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: title, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: author_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_forum_thread_author_id, references: user_account(id)}}
              - column: {name: status, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: sticky, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: post_count, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: last_post_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: last_post_author_id, type: UUID}
              - column: {name: deleted_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: forum_thread
            indexName: ix_forum_thread_listing
            columns:
              - column: {name: region_id}
              - column: {name: ambassador_forum}
              - column: {name: active}
              - column: {name: sticky, descending: true}
              - column: {name: last_post_at, descending: true}
  - changeSet:
      id: 135-2
      author: platform
      comment: 'Forum posts (upstream fs_theme_post). Body is raw markdown; hidden posts keep their body for moderators.'
      changes:
        - createTable:
            tableName: forum_post
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_forum_post, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: thread_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_forum_post_thread_id, references: forum_thread(id), deleteCascade: true}}
              - column: {name: author_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_forum_post_author_id, references: user_account(id)}}
              - column: {name: body, type: VARCHAR(32600), constraints: {nullable: false}}
              - column: {name: edited_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: edited_by, type: UUID}
              - column: {name: hidden_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: hidden_by, type: UUID}
              - column: {name: hidden_reason, type: VARCHAR(500)}
              - column: {name: deleted_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: forum_post
            indexName: ix_forum_post_thread_created
            columns:
              - column: {name: thread_id}
              - column: {name: created_at}

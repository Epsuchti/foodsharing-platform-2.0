              - column: {name: summary, value: "Codice di condotta, obblighi di diligenza ed esclusione di responsabilità per foodsaver e responsabili dei negozi."}
              - column: {name: body, value: "# Accordo legale\n\n*Stato: 07.01.2015*\n\n## <a id=\"rechtsvereinbarung-fuer-foodsaver\"></a>Accordo legale per [foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver)\n\n### <a id=\"rechtsvereinbarung-teil-i-eigenerklaerung-verhaltenskodex-und-sorgfaltspflichten\"></a>Accordo legale parte I - autodichiarazione - codice di condotta e obblighi di diligenza\n\n*Stato: 7 gennaio 2015*\n\nDichiaro quanto segue:\n\nSarò attivo/a come [foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) nell’ambito di foodsharing. Ciò significa che ritiro alimenti presso donatori e donatrici di alimenti e mi impegno a consumarli personalmente oppure a cederli a terzi esclusivamente a titolo gratuito (privati, mense dei poveri, banche alimentari, missioni di stazione, associazioni di pubblica utilità, Fairteiler, online come cesto alimentare ecc.).\n\nL’obiettivo principale è preservare dalla distruzione tutti gli alimenti ancora commestibili e destinarli al consumo umano. Come foodsaver agisco volontariamente per motivi sociali, etici ed ecologici, per ridurre lo spreco alimentare e con esso la fame, lo spreco di risorse, il cambiamento climatico e molto altro.\n\nI foodsaver sono un complemento efficiente, locale e tempestivo ad altre organizzazioni di pubblica utilità come le [Tafeln](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln) (banche alimentari). L’obiettivo è permettere, oltre ai grandi commercianti di alimentari, al maggior numero possibile di piccoli donatori come panetterie, negozi bio, ristoranti ecc. di collaborare con i foodsaver, affinché nessun alimento ancora commestibile debba essere buttato, indipendentemente dalle dimensioni dell’azienda alimentare.\n\nLa piena soddisfazione dei nostri negozi partner è una parte essenziale del salvataggio di alimenti. Mi impegno a contribuirvi con un comportamento affidabile, cordiale e aperto verso le persone e i negozi a tutti i livelli.\n\nMi impegno a non contattare negozi né avviare collaborazioni finché non avrò superato il [quiz per responsabili dei negozi](https://wiki.foodsharing.network/wiki/Quiz#Quiz_f.C3.BCr_Betriebsverantwortliche). In generale è consentito contattare negozi con più di 3 filiali solo in accordo con il [team catene di negozi](https://wiki.foodsharing.network/wiki/Betrieb#Betriebskette).\n\nL’obiettivo è raggiungere una [quota di ritiro](https://wiki.foodsharing.network/wiki/Abholquote) del 100%. Per garantirla, come foodsaver sono tenuto/a a registrare tutti gli appuntamenti di ritiro sul [sito web](https://foodsharing.de) e a essere ben collegato/a con altri foodsaver. In caso di assenza imprevista, ad es. per malattia, sono tenuto/a a cancellarmi dal calendario il prima possibile e a trovare un/una foodsaver sostituto/a che abbia già ritirato presso il negozio donatore, e solo in caso di emergenza a scegliere un/una foodsaver che non vi abbia mai ritirato. Se 24 ore prima del ritiro non si è trovato alcun sostituto, la ricerca deve proseguire per telefono ed e-mail finché si trova qualcuno. Se la ricerca non ha successo nemmeno un’ora prima del ritiro, la filiale deve essere informata subito per telefono che quel giorno non è possibile effettuare il ritiro.\n\nNelle situazioni eccezionali in cui, nonostante tutti gli sforzi, non è stato possibile effettuare il ritiro, il team del negozio deve essere informato dell’assenza con un messaggio in bacheca e il mancato ritiro va segnalato come propria violazione.\n\nCome foodsaver garantisco di conservare o refrigerare correttamente i prodotti refrigerati e gli alimenti facilmente deperibili fino alla consegna a terzi e, in caso contrario, di non cedere tali alimenti a terzi.\n\nCome foodsaver garantisco di non smaltire alimenti ancora commestibili durante o dopo i ritiri e di occuparmi in modo responsabile e corretto dello smaltimento degli alimenti non più commestibili, ma anche di imballaggi, cartoni ecc.\n\nInoltre mi impegno a lasciare il luogo in cui la merce viene ricevuta o separata almeno pulito come l’ho trovato. Gli alimenti vengono ritirati negli orari desiderati dai negozi donatori. Di solito sono orari fissi, ma i foodsaver sono pronti anche a ritirare alimenti fuori orario.\n\nConfermo di aver letto e compreso le [regole di comportamento](/learn/code-of-conduct) e altri [documenti del wiki di foodsharing](https://wiki.foodsharing.network/wiki/Hauptseite) e mi impegno a comportarmi di conseguenza. Se vengo a sapere che queste regole di comportamento non sono rispettate da altri foodsaver, responsabili dei negozi o ambasciatori, segnalo queste violazioni tramite il modulo «segnala violazione» nel profilo dell’utente interessato.\n\nCome foodsaver dichiaro di rispettare i valori fissati in questo accordo e di non danneggiare foodsharing. Ciò comprende in particolare l’obbligo di astenersi da qualsiasi dichiarazione screditante contro foodsharing, i suoi ambasciatori, foodsaver e altri sostenitori, anche dopo la fine della mia partecipazione come foodsaver. Prendo atto che, in caso di violazione di questa dichiarazione, in particolare se danneggio foodsharing intenzionalmente o per colpa grave con le mie azioni o dichiarazioni, sarò escluso/a dalla partecipazione come foodsaver o tale partecipazione mi sarà vietata.\n\nMi impegno anche a tenermi aggiornato/a su informazioni e novità attuali (partecipare agli incontri regolari di foodsharing, leggere le newsletter, visitare i forum del sito, leggere le e-mail).\n\nfoodsharing è innanzitutto neutrale dal punto di vista della politica di partito. Mi impegno a rispettare a questo riguardo le regole e le indicazioni del documento «[foodsharing und Politik](https://wiki.foodsharing.network/wiki/Foodsharing_und_Politik)» (foodsharing e politica).\n\n### <a id=\"rechtsvereinbarung-teil-ii-haftungsausschluss\"></a>Accordo legale parte II - esclusione di responsabilità\n\n*Stato: gennaio 2015*\n\nDichiaro quanto segue:\n\nSarò attivo/a come foodsaver nell’ambito di foodsharing, ritiro alimenti presso negozi donatori e mi impegno a gustarli personalmente oppure a cederli a terzi esclusivamente a titolo gratuito.\n\nCome foodsaver mi assumo la responsabilità degli alimenti. Ciò significa che tutti i negozi donatori, le associazioni, le fattorie ecc. che cedono alimenti sono esonerati da qualsiasi responsabilità per la commestibilità o l’innocuità sanitaria della merce. È esclusa ogni responsabilità dei donatori, anche per colpa di qualsiasi grado. So che il foodsharing e.V. stesso non diventa partner contrattuale dei donatori e non si assume alcuna responsabilità. Rispondo quindi degli alimenti ritirati e distribuiti e sono io stesso/a responsabile di stipulare eventualmente un’assicurazione di responsabilità civile e contro gli infortuni.\n\nMi impegno a verificare secondo scienza e coscienza l’innocuità delle donazioni alimentari prima di cederle. Ho preso atto delle istruzioni della [Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel) (guida all’igiene degli alimenti) del foodsharing e.V., in particolare sugli alimenti deperibili, e le seguirò. Come foodsaver porto quindi la piena responsabilità degli alimenti che ritiro e devo decidere io stesso/a se sono ancora adatti al consumo o alla cessione.\n\nRinuncio nei confronti del [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand), dei gestori di [foodsharing.de](https://foodsharing.de) e dei rispettivi donatori a far valere qualsiasi risarcimento dei danni, anche nei confronti dei loro fornitori.\n\n## <a id=\"rechtsvereinbarung-fuer-betriebsverantwortliche-r\"></a>Accordo legale per [responsabili dei negozi](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r)\n\n*Accordo legale aggiuntivo per responsabili dei negozi in foodsharing:*\n\nInoltre, come responsabile di negozio, sono tenuto/a a contattare solo negozi per i quali posso garantire che ci siano abbastanza foodsaver pronti a ritirare alimenti, se necessario 7 giorni su 7, dal primo contatto.\n\nPrima di diventare attivo/a come responsabile di negozio, mi impegno a mettermi in contatto con gli ambasciatori della mia regione e a cercare nuovi partner di collaborazione solo dopo averne parlato con loro. Garantisco inoltre di contattare solo negozi gestiti dai proprietari e di contattare il team catene di negozi per tutti i negozi con più di 3 filiali.\n\nAncora prima di contattare un negozio, verifico che non sia già stato registrato. Dopo ogni contatto con il negozio, registro lo stesso giorno su foodsharing.de tutte le informazioni rilevanti o aggiorno tutte le informazioni raccolte che vengono richieste alla registrazione del negozio.\n\nTutti i negozi che creo e contatto nell’ambito di foodsharing fanno parte della rete foodsharing. Se mi viene revocata la responsabilità del negozio a causa di violazioni delle regole di foodsharing, l’ambasciatore o l’ambasciatrice competente assume la responsabilità del negozio fino alla nomina di un nuovo/una nuova responsabile. Lo stesso vale dopo il ritiro volontario come responsabile di negozio. Dopo aver lasciato il negozio volontariamente o involontariamente non è consentito continuare a ritirarvi alimenti. Inoltre è vietato porre fine alla collaborazione tra foodsharing e un negozio senza il consenso e l’accordo degli ambasciatori del Land o del team orga.\n\nDevo fare in modo che in tutti i negozi di cui sono responsabile ci sia un buon clima e che tutte le persone coinvolte - foodsaver e personale - si trovino bene. Per prevenire problemi o risolvere rapidamente quelli sorti, comunicherò a sufficienza.\n\nMi impegno a esaminare ogni violazione delle regole di comportamento ed eventualmente a trarne le conseguenze, a mediare e, d’accordo con gli ambasciatori competenti, a togliere singoli foodsaver dal team.\n\nInoltre scriverò subito in bacheca tutte le informazioni importanti sullo stato della collaborazione e le modifiche, oppure le inserirò sotto «negozio».\n\nInoltre, come responsabile di negozio, mi impegno a rappresentare sempre foodsharing in modo responsabile e motivato. Sono consapevole di avere una funzione di esempio nei confronti dei foodsaver, dei responsabili dei negozi e dei colleghi ambasciatori, che mi fa piacere e che prendo sul serio. Ho letto e fatto mio il [documento del wiki](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r) sui miei compiti e sugli altri obblighi come responsabile di negozio e lo sostengo.\n\n---\n\n*Articolo di*: [AG Recht](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Recht) (*[Contatto](mailto:recht@foodsharing.network)*)\\\n*Ultima revisione il 07.01.2015*\n\n---\n\n*Originale nel wiki di foodsharing: [Rechtsvereinbarung](https://wiki.foodsharing.network/wiki/Rechtsvereinbarung)*\n"}

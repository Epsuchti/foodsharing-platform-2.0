              - column: {name: body, value: "# Legal agreement\n\n*As of: 07.01.2015*\n\n## <a id=\"rechtsvereinbarung-fuer-foodsaver\"></a>Legal agreement for [foodsavers](https://wiki.foodsharing.network/wiki/Foodsaver)\n\n### <a id=\"rechtsvereinbarung-teil-i-eigenerklaerung-verhaltenskodex-und-sorgfaltspflichten\"></a>Legal agreement part I - self-declaration - code of conduct and duties of care\n\n*As of: 7 January 2015*\n\nI declare the following:\n\nI will be active as a [foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) within foodsharing. This means that I collect food from food donors and commit to either consuming it myself or passing it on to third parties exclusively free of charge (privately, soup kitchens, food banks, station missions, non-profit associations, Fairteiler, online as a food basket etc.).\n\nThe highest goal is to save all food that is still edible from destruction and to make it available for human consumption. As a foodsaver I act voluntarily for social, ethical and ecological reasons, in order to minimise food waste and with it hunger, the waste of resources, climate change and much more.\n\nFoodsavers are an efficient, local and timely complement to other non-profit organisations such as the [Tafeln](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln) (food banks). The aim is to enable not only large food retailers but as many small food donors as possible, such as bakeries, organic shops, restaurants etc., to cooperate with the foodsavers, so that no food that is still edible has to be thrown away, regardless of the size of the food business.\n\nThe complete satisfaction of our cooperating businesses is an essential part of saving food. I commit to working towards this with reliable, friendly and open behaviour towards people and businesses at all levels.\n\nI commit not to approach any businesses or build up cooperations as long as I have not passed the [quiz for store managers](https://wiki.foodsharing.network/wiki/Quiz#Quiz_f.C3.BCr_Betriebsverantwortliche). In general, approaching businesses with more than 3 branches is only allowed in agreement with the [store chains team](https://wiki.foodsharing.network/wiki/Betrieb#Betriebskette).\n\nThe aim is to reach a [pickup rate](https://wiki.foodsharing.network/wiki/Abholquote) of 100%. To ensure this, as a foodsaver I am expected to enter all pickup dates on the [website](https://foodsharing.de) and to be well connected with other foodsavers. In the event of an unexpected absence, e.g. due to illness, I am obliged to sign out of the calendar as quickly as possible and to find a replacement foodsaver who has already picked up at the donating business, and only in an emergency to choose a foodsaver who has never picked up at the business. If no replacement has been found 24 hours before the pickup, the search for a replacement must be continued by phone and email until someone is found. If the search has still not been successful one hour before the pickup, the branch must be informed by phone immediately that no pickup can take place on that day.\n\nIn the exceptional situations in which no pickup could take place despite all efforts, the store's team must be informed of the absence by a wall post, and the missed pickup must be reported as one's own violation.\n\nAs a foodsaver I assure that I will store or chill chilled goods and perishable food properly until they are handed over to third parties, and otherwise will not pass such food on to third parties.\n\nAs a foodsaver I guarantee not to dispose of any food that is still edible during or after the pickups, and to take care responsibly and properly of disposing of food that is no longer edible, but also of packaging, cardboard boxes etc.\n\nFurthermore, I commit to leaving the place where the goods are received or sorted at least as clean as I found it. The food is collected at the times the donating businesses wish. Normally these are fixed times, but the foodsavers are also ready to collect food outside the fixed times.\n\nI confirm that I have read and understood the [code of conduct](/learn/code-of-conduct) and other [foodsharing wiki documents](https://wiki.foodsharing.network/wiki/Hauptseite), and I commit to behaving according to them. If I learn that this code of conduct is not being kept by other foodsavers, store managers or ambassadors, I report these violations via the \"report a violation\" form in the profile of the user concerned.\n\nAs a foodsaver I declare that I will respect the values set out in this agreement and not harm foodsharing. This includes in particular the duty to refrain from any discrediting statements against foodsharing, its ambassadors, foodsavers and other supporters, also after my participation as a foodsaver has ended. I take note that if I break this declaration, in particular if I harm foodsharing intentionally or through gross negligence by my actions or statements, I will be excluded from participating as a foodsaver or my participation as a foodsaver will be prohibited.\n\nI also commit to keeping up to date with current information and news (attending regular foodsharing meetings, reading newsletters, visiting forums on the homepage, reading emails).\n\nfoodsharing is first and foremost neutral in terms of party politics. I commit to following the rules and guidelines in the document \"[foodsharing und Politik](https://wiki.foodsharing.network/wiki/Foodsharing_und_Politik)\" (foodsharing and politics) in this respect.\n\n### <a id=\"rechtsvereinbarung-teil-ii-haftungsausschluss\"></a>Legal agreement part II - disclaimer of liability\n\n*As of: January 2015*\n\nI declare the following:\n\nI will be active as a foodsaver within foodsharing, collect food from donating businesses and commit to either enjoying it myself or passing it on to third parties exclusively free of charge.\n\nAs a foodsaver I take on responsibility for the food. This means that all donating businesses, associations, farms etc. that give away food are released from any liability for the edibility or the health safety of the goods. Any liability of the food donors, including for negligence of any degree, is excluded. I am aware that foodsharing e.V. itself does not become a contractual partner of the food donors and does not assume any liability. I am therefore liable for the food collected and distributed and am myself responsible for taking out liability and accident insurance if necessary.\n\nI commit to checking the donated food for its safety to the best of my knowledge and belief before passing it on. I have taken note of the instructions in the [Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel) (hygiene guide for food) of foodsharing e.V., in particular on perishable food, and will follow them. As a foodsaver I therefore bear full responsibility for the food I collect and must decide myself whether it is still suitable for consumption or for passing on.\n\nTowards [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand), the operators of [foodsharing.de](https://foodsharing.de) and the respective food donors, I waive the assertion of any claims for damages, also towards their suppliers.\n\n## <a id=\"rechtsvereinbarung-fuer-betriebsverantwortliche-r\"></a>Legal agreement for [store managers](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r)\n\n*Additional legal agreement for store managers at foodsharing:*\n\nIn addition, as a store manager I am responsible for only approaching businesses for which I can guarantee that enough foodsavers are ready who, if necessary, can collect food 7 days a week from the first contact.\n\nBefore I become active as a store manager, I commit to getting in touch with the ambassadors of my region and to looking for new cooperation partners only after agreement with them. In doing so, I assure that I will only approach owner-managed businesses and will contact the store chains team for all businesses with more than 3 branches.\n\nEven before I approach a business, I check whether the business has not already been entered. After every contact with the business, I enter all relevant information on foodsharing.de on the same day or update all information I have learned that is asked for when entering the business.\n\nAll businesses that I create and approach within foodsharing are part of the foodsharing network. If my store management is withdrawn because of violations of the foodsharing rules, the responsible ambassador takes over the store management until a new store manager is appointed. The same applies after voluntary withdrawal as a store manager. After leaving the business voluntarily or involuntarily, it is not permitted to continue collecting food at this business. Furthermore, it is forbidden to end the cooperation between foodsharing and a business without the consent of and agreement with the federal state ambassadors or the orga team.\n\nI have to make sure that there is a good atmosphere at all businesses for which I am store manager and that everyone involved - foodsavers and employees - feels comfortable. To prevent problems or to solve problems that have arisen quickly, I will communicate sufficiently.\n\nI commit to checking every violation of the code of conduct and, if necessary, drawing consequences, mediating and, after agreement with the ambassadors concerned, removing individual foodsavers from the team.\n\nIn addition, I will immediately post all important information about the status of the cooperation as well as changes on the wall or incorporate them under \"store\".\n\nIn addition, as a store manager I agree to always represent foodsharing responsibly and with motivation. I am aware that I have a role model function towards the foodsavers, store managers and fellow ambassadors, which I enjoy and take seriously. I have read and internalised the [wiki document](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r) on my tasks and other obligations as a store manager and stand behind it.\n\n---\n\n*Article by*: [AG Recht](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Recht) (*[Contact](mailto:recht@foodsharing.network)*)\\\n*Last revised on 07.01.2015*\n\n---\n\n*Original in the foodsharing wiki: [Rechtsvereinbarung](https://wiki.foodsharing.network/wiki/Rechtsvereinbarung)*\n"}

              - column: {name: body, value: "# Rächtsvereibarig\n\n*Stand: 07.01.2015*\n\n## <a id=\"rechtsvereinbarung-fuer-foodsaver\"></a>Rächtsvereibarig für [Foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver)\n\n### <a id=\"rechtsvereinbarung-teil-i-eigenerklaerung-verhaltenskodex-und-sorgfaltspflichten\"></a>Rächtsvereibarig Teil I - Eigeerklärig - Verhaltenskodex und Sorgfaltspflichte\n\n*Stand: 7. Januar 2015*\n\nIch erklär s Folgende:\n\nIch wird im Rahme vo foodsharing als [Foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) tätig. Das heisst, ich hol bi Läbesmittelspänder\\*innen Läbesmittel ab und verpflicht mich, die entweder sälber z bruuche oder nur gratis a Dritti wiiterzgäh (privat, Suppechuchi, Tafle, Bahnhofmissione, gmeinnützigi Verein, Fairteiler, online als Ässechorb etc.).\n\nS oberscht Ziel isch, alli no gniessbare Läbesmittel vor de Vernichtig z bewahre und si em Mänsch zum Ässe zuezfüehre. Als Foodsaver handle ich ehreamtlich us soziale, ethische und ökologische Gründ, zum d Läbesmittelverschwändig und demit de Hunger, d Ressourceverschwändig und de Klimawandel und vill meh z minimiere.\n\nD Foodsaver sind e effizienti, lokali und zeitnahi Ergänzig zu andere gmeinnützige Organisatione wie z.B. de [Tafeln](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln). S Ziel isch, nebscht grosse Läbesmittelhändler\\*innen möglichst allne chliine Läbesmittelspänder\\*innen wie Beckereie, Bioläde, Restaurant etc. d Kooperation mit de Foodsaver z ermögliche, so dass unabhängig vo de Grössi vom Läbesmittelbetrieb kei no gniessbari Läbesmittel weggrüert wärde müend.\n\nD umfassendi Zfridenheit vo eusne Kooperationsbetriebe isch en elementare Teil vom Läbesmittelrette. Ich verpflicht mich, mich defür mit zueverlässigem, fründlichem und offenem Verhalte gägenüber de Mänsche und Betriebe uf allne Ebene iizsetze.\n\nIch verpflicht mich, kei Betriebe aazfroge oder Kooperatione ufzbaue, solang ich s [Quiz zum Betriebsverantwortliche](https://wiki.foodsharing.network/wiki/Quiz#Quiz_f.C3.BCr_Betriebsverantwortliche) nöd bestande ha. Generell isch s nur i Absprach mit em [Betriebsketteteam](https://wiki.foodsharing.network/wiki/Betrieb#Betriebskette) erlaubt, Betriebe mit meh als 3 Filiale aazfroge.\n\nS Ziel isch, e [Abholquote](https://wiki.foodsharing.network/wiki/Abholquote) vo 100% z erreiche. Zum die z garantiere, bin ich als Foodsaver aaghalte, alli Abholtermin uf de [Website](https://foodsharing.de) iiztrage und guet mit andere Foodsaver vernetzt z sii. Bi emene unerwartete Usfall, z.B. wäge Chrankheit etc., bin ich verpflichtet, mich so schnell wie möglich us em Kaländer uszträge und mich um en Ersatzfoodsaver z kümmere, wo scho mal bi dem Läbesmittelspändebetrieb abgholt hät, und nur im Notfall en Foodsaver z wähle, wo bi dem Betrieb no nie abgholt hät. Wänn sich bis 24 Stund vor em Abholtermin kein Ersatz gfunde hät, mues d Suechi nach emene Ersatz per Telefon und Mail wiitergaa, bis öpper gfunde isch. Wänn d Suechi au bis e Stund vor em Abholtermin nöd erfolgriich isch, mues d Filiale sofort telefonisch informiert wärde, dass a dem Tag kei Abholig cha gmacht wärde.\n\nI de Usnahmesituatione, wo trotz allne Bemüehige kei Abholig hät chönne stattfinde, mues s Team vom Betrieb per Pinnwandiitrag über s Nöd-Erschiine informiert und s Nöd-Abhole als eigene Verstoss gmäldet wärde.\n\nAls Foodsaver sicher ich zue, Chüehlwaar und liecht verderblichi Läbesmittel bis zur Übergab a Dritti sachgrächt z lagere oder z chüehle und susch söttigi Läbesmittel nöd a Dritti wiiterzgäh.\n\nAls Foodsaver garantier ich, während de Abholige oder nachher kei no ässbare Läbesmittel z entsorge und mich verantwortigsvoll und fachgrächt um d Entsorgig vo de nümme gniessbare Läbesmittel, aber au vo Verpackige, Kartons etc. z kümmere.\n\nWiiter verpflicht ich mich, de Ort, wo d Waar entgägegnoh oder trennt wird, mindestens so suuber z hinterlah, wie ich ihn aatroffe ha. D Läbesmittel wärded zu de Ziite abgholt, wo d Läbesmittelspändebetriebe s wünsched. Normalerwiis sind das feschti Ziite, aber d Foodsaver stönd au parat, zum usserhalb vo de Termin Läbesmittel abzhole.\n\nIch bestätig, dass ich d [Verhaltensregle](/learn/code-of-conduct) und anderi [foodsharing-Wiki-Dokumänt](https://wiki.foodsharing.network/wiki/Hauptseite) gläse und verstande ha, und verpflicht mich, mich dernah z verhalte. Wänn ich erfahre, dass die Verhaltensregle vo andere Foodsaver, Betriebsverantwortliche oder Botschafter\\*innen nöd iighalte wärded, meld ich die Verstöss über s Formular \"Verstoss mälde\" im Profil vom jewiilige User.\n\nAls Foodsaver erklär ich, d Wärt, wo i dere Vereibarig festghalte sind, z achte und foodsharing nöd z schädige. Das beinhaltet bsunders d Pflicht, jedi diskreditierendi Uussag gäge foodsharing, ihri Botschafter\\*innen, Foodsaver und anderi Unterstützer\\*innen z unterlah, au nach em Änd vo minere Teilnahm als Foodsaver. Ich nimm zur Kenntnis, dass ich bi emene Verstoss gäge die Erklärig, bsunders wänn ich foodsharing dur mini Handlige oder Uussage absichtlich oder grob fahrlässig schädige, vo de Teilnahm als Foodsaver usgschlosse wird oder mir d Teilnahm als Foodsaver verbote wird.\n\nIch verpflicht mich au, mich über aktuelli Informatione und Neuigkeite uf em Laufende z halte (regelmässig a foodsharing-Träffe gaa, Newsletter läse, Forum uf de Homepage bsueche, Mails läse).\n\nfoodsharing isch in erschter Linie parteipolitisch neutral. Ich verpflicht mich, mich i dem Bezug a d Regle und Vorgabe im Dokumänt „[foodsharing und Politik](https://wiki.foodsharing.network/wiki/Foodsharing_und_Politik)“ z halte.\n\n### <a id=\"rechtsvereinbarung-teil-ii-haftungsausschluss\"></a>Rächtsvereibarig Teil II - Haftigsusschluss\n\n*Stand: Januar 2015*\n\nIch erklär s Folgende:\n\nIch wird im Rahme vo foodsharing als Foodsaver tätig, hol bi Läbesmittelspänderbetriebe Läbesmittel ab und verpflicht mich, die entweder sälber z gniesse oder nur gratis a Dritti wiiterzgäh.\n\nAls Foodsaver übernimm ich d Verantwortig für d Läbesmittel. Das heisst, dass alli Läbesmittelspändebetriebe, Verein, Buurehöf etc., wo Läbesmittel abgänd, vo jeder Haftig für d Gniessbarkeit oder d gsundheitlichi Unbedänklichkeit vo de Waar befreit sind. E Haftig vo de Läbesmittelspändende, au für Fahrlässigkeit jede Grads, isch usgschlosse. Mir isch bekannt, dass de foodsharing e.V. sälber nöd Vertragspartner vo de Läbesmittelspändende wird und kei Haftig übernimmt. Drum haft ich für d abgholte und verteilte Läbesmittel und bin sälber verantwortlich, mich allefalls um e Haftpflicht- und Unfallversicherig z kümmere.\n\nIch verpflicht mich, d Läbesmittelspände vor de Wiitergab nach beschtem Wüsse und Gwüsse uf ihri Unbedänklichkeit z prüefe. D Verhaltensaawiisige im [Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel) vom foodsharing e.V., bsunders zu verderbliche Läbesmittel, han ich zur Kenntnis gnoh und wird si befolge. Ich trage demit als Foodsaver di voll Verantwortig für d Läbesmittel, wo ich abhole, und mues sälber entscheide, öb si zum Ässe oder für d Wiitergab no geeignet sind.\n\nIch verzicht gägenüber em [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand), de Betriibende vo [foodsharing.de](https://foodsharing.de) und gägenüber de jewiilige Läbesmittelspändende uf jede Schadeersatz, au gägenüber dene ihre Lieferant\\*innen.\n\n## <a id=\"rechtsvereinbarung-fuer-betriebsverantwortliche-r\"></a>Rächtsvereibarig für [Betriebsverantwortlichi](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r)\n\n*Zuesatzrächtsvereibarig für Betriebsverantwortlichi bi foodsharing:*\n\nZuesätzlich bin ich als Betriebsverantwortlichi\\*r defür verantwortlich, nur Betriebe aazfroge, wo ich au garantiere cha, dass gnueg Foodsaver parat stönd, wo im Notfall au 7 Täg i de Wuche ab em erschte Kontakt Läbesmittel abhole chönd.\n\nBevor ich als Betriebsverantwortlichi\\*r aktiv wird, verpflicht ich mich, mit de Botschafter\\*innen vo minere Region in Kontakt z trätte und erscht nach Absprach mit ihne neui Kooperationspartner\\*innen z sueche. Debii versicher ich, nur inhaber\\*innegfüehrti Betriebe aazfroge und für alli Betriebe mit meh als 3 Filiale s Betriebsketteteam z kontaktiere.\n\nNo bevor ich en Betrieb aafroge, prüef ich, öb de Betrieb nöd scho iitreit isch. Nach jedem Kontakt mit em Betrieb trag ich alli relevante Informatione no am gliiche Tag bi foodsharing.de ii oder aktualisier alli Informatione, wo ich erfahre ha und wo bi de Betriebsiitragig abgfroget wärded.\n\nAlli Betriebe, wo ich im Rahme vo foodsharing aaleg und aafroge, sind Teil vom foodsharing-Netzwerk. Wänn mir wäge Verstöss gäge d foodsharing-Regle d Betriebsverantwortig entzoge wird, übernimmt bis zur Ernennig vo emene neue Betriebsverantwortliche de/di zueständig Botschafter\\*in d Betriebsverantwortig. S Gliiche gilt nach emene freiwillige Rückzug als Betriebsverantwortlichi\\*r. Es isch nöd erlaubt, nach em freiwillige oder unfreiwillige Verlah vom Betrieb wiiterhin i dem Betrieb Läbesmittel abzhole. Wiiter isch s verbote, d Kooperation zwüsche foodsharing und emene Betrieb ohni Iiverständnis und Absprach mit de Bundeslandbotschafter\\*innen oder em Orgateam z beände.\n\nIch mues defür sorge, dass i allne Betriebe, wo ich d Betriebsverantwortig ha, e gueti Stimmig herrscht und sich alli Beteiligte - Foodsaver und Aagstellti - wohl fühled. Zum Problem vorzbeuge oder entstandeni Problem schnell z löse, wird ich gnueg kommuniziere.\n\nIch verpflicht mich, jede Verstoss gäge d Verhaltensregle z prüefe und allefalls Konsequänze z zieh, z schlichte und einzelni Foodsaver, nach Absprach mit de zuegehörige Botschafter\\*innen, us em Team z neh.\n\nUsserdem schriib ich alli wichtige Informatione zum Stand vo de Kooperation und Änderige sofort uf d Pinnwand oder arbeite si under “Betrieb” ii.\n\nZuesätzlich erklär ich mich als Betriebsverantwortlichi\\*r bereit, foodsharing immer verantwortigsbewusst und motiviert z repräsentiere. Ich bi mir bewusst, dass ich gägenüber de Foodsaver, Betriebsverantwortliche und Botschafter\\*innekolleg\\*innen e Vorbildfunktion ha, wo mir Freud macht und wo ich ärnst nimm. S [Wiki-Dokumänt](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r) über mini Ufgabe und anderi Verpflichtige als Betriebsverantwortlichi\\*r han ich gläse, verinnerlicht und stah dehinder.\n\n---\n\n*Artikel vo*: [AG Recht](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Recht) (*[Kontakt](mailto:recht@foodsharing.network)*)\\\n*Letschti Überarbeitig am 07.01.2015*\n\n---\n\n*Original im foodsharing-Wiki: [Rechtsvereinbarung](https://wiki.foodsharing.network/wiki/Rechtsvereinbarung)*\n"}

# Milestone 2 (T10): persisted bells (docs/conventions.md A12) and the seed date shift state (A13). Number 019 is the
# last free number of the M1 range; it is used because the bell entity lands in T10, before the M2 range starts.
databaseChangeLog:
  - changeSet:
      id: 019-1
      author: platform
      comment: Bell notifications (UI arrives in M4; M2 persists them and exposes them via the dev API).
      changes:
        - createTable:
            tableName: bell
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_bell, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_bell_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: type, type: VARCHAR(60), constraints: {nullable: false}}
              - column: {name: title_key, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: params, type: VARCHAR(4000)}
              - column: {name: link, type: VARCHAR(500)}
              - column: {name: icon, type: VARCHAR(60)}
              - column: {name: identifier, type: VARCHAR(200)}
              - column: {name: mail_outbox_id, type: UUID}
              - column: {name: read_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: deleted_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: bell
            indexName: ix_bell_user_id_created_at
            columns:
              - column: {name: user_id}
              - column: {name: created_at}
        - createIndex:
            tableName: bell
            indexName: ix_bell_identifier
            columns:
              - column: {name: identifier}
  - changeSet:
      id: 019-2
      author: platform
      comment: Last anchor the local seed data was shifted to (dev SeedDateShiftRunner, local profile only).
      changes:
        - createTable:
            tableName: seed_shift_state
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_seed_shift_state, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: last_shift_anchor, type: DATE, constraints: {nullable: false}}

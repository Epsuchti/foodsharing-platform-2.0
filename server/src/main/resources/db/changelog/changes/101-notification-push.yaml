# Milestone 4 (B2): web push subscriptions (upstream fs_push_notification_subscription) and bell list index (A23).
databaseChangeLog:
  - changeSet:
      id: 101-1
      author: platform
      comment: 'Web push subscriptions per browser; endpoint_hash = SHA-256 hex of the endpoint (unique).'
      changes:
        - createTable:
            tableName: push_subscription
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_push_subscription, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_push_subscription_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: endpoint, type: VARCHAR(2000), constraints: {nullable: false}}
              - column: {name: endpoint_hash, type: VARCHAR(64), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_push_subscription_endpoint_hash}}
              - column: {name: p256dh, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: auth, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: user_agent, type: VARCHAR(300)}
              - column: {name: last_success_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: failure_count, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
        - createIndex:
            tableName: push_subscription
            indexName: ix_push_subscription_user_id
            columns:
              - column: {name: user_id}
  - changeSet:
      id: 101-2
      author: platform
      comment: 'Bells: pushed_at and the index of the bell list (own bells, unread first, newest first).'
      changes:
        - addColumn:
            tableName: bell
            columns:
              - column: {name: pushed_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: bell
            indexName: ix_bell_user_id_read_at_created_at
            columns:
              - column: {name: user_id}
              - column: {name: read_at}
              - column: {name: created_at, descending: true}

databaseChangeLog:
  - changeSet:
      id: 004-1
      author: platform
      comment: Action history (plan §10.1) plus trace_id.
      changes:
        - createTable:
            tableName: history_entry
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_history_entry, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: actor_id, type: UUID}
              - column: {name: actor_type, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: subject_type, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: subject_id, type: UUID, constraints: {nullable: false}}
              - column: {name: secondary_subject_id, type: UUID}
              - column: {name: action, type: VARCHAR(60), constraints: {nullable: false}}
              - column: {name: field, type: VARCHAR(100)}
              - column: {name: old_value, type: VARCHAR(32600)}
              - column: {name: new_value, type: VARCHAR(32600)}
              - column: {name: reason, type: VARCHAR(2000)}
              - column: {name: metadata, type: VARCHAR(32600)}
              - column: {name: region_id, type: UUID}
              - column: {name: trace_id, type: VARCHAR(32)}
        - createIndex:
            tableName: history_entry
            indexName: ix_history_entry_subject_type_subject_id_occurred_at
            columns:
              - column: {name: subject_type}
              - column: {name: subject_id}
              - column: {name: occurred_at, descending: true}
        - createIndex:
            tableName: history_entry
            indexName: ix_history_entry_actor_id_occurred_at
            columns:
              - column: {name: actor_id}
              - column: {name: occurred_at, descending: true}
        - createIndex:
            tableName: history_entry
            indexName: ix_history_entry_region_id_occurred_at
            columns:
              - column: {name: region_id}
              - column: {name: occurred_at, descending: true}
        - createIndex:
            tableName: history_entry
            indexName: ix_history_entry_action
            columns:
              - column: {name: action}

databaseChangeLog:
  - changeSet:
      id: 006-1
      author: platform
      comment: Outgoing mails (transactional outbox, sent by MailOutboxJob with retries and backoff).
      changes:
        - createTable:
            tableName: mail_outbox
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_mail_outbox, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: to_address, type: VARCHAR(320), constraints: {nullable: false}}
              - column: {name: subject, type: VARCHAR(500), constraints: {nullable: false}}
              - column: {name: text_body, type: VARCHAR(32600), constraints: {nullable: false}}
              - column: {name: html_body, type: VARCHAR(32600)}
              - column: {name: language, type: VARCHAR(5), constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: attempts, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: next_attempt_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: last_error, type: VARCHAR(2000)}
              - column: {name: sent_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: template, type: VARCHAR(100), constraints: {nullable: false}}
        - createIndex:
            tableName: mail_outbox
            indexName: ix_mail_outbox_status_next_attempt_at
            columns:
              - column: {name: status}
              - column: {name: next_attempt_at}

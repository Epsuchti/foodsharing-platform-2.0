# Milestone 3 (B2): store team memberships (upstream fs_betrieb_team).
databaseChangeLog:
  - changeSet:
      id: 061-1
      author: platform
      comment: 'Team, jumpers, applications and invitations.'
      changes:
        - createTable:
            tableName: store_membership
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_store_membership, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_store_membership_store_id, references: store(id), deleteCascade: true}}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_store_membership_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: status, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: manager, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: application_text, type: VARCHAR(4000)}
              - column: {name: invited_by, type: UUID, constraints: {foreignKeyName: fk_store_membership_invited_by, references: user_account(id)}}
              - column: {name: added_at, type: TIMESTAMP WITH TIME ZONE}
        - addUniqueConstraint:
            tableName: store_membership
            columnNames: store_id, user_id
            constraintName: uq_store_membership_store_id_user_id
        - createIndex:
            tableName: store_membership
            indexName: ix_store_membership_user_id
            columns:
              - column: {name: user_id}

# Milestone 4 (B4): static public-holiday table (provider static, A26); canton NULL = national holiday.
databaseChangeLog:
  - changeSet:
      id: 111-1
      author: platform
      comment: 'Public holidays per country and canton.'
      changes:
        - createTable:
            tableName: holiday_calendar
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_holiday_calendar, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: country, type: VARCHAR(2), constraints: {nullable: false}}
              - column: {name: canton, type: VARCHAR(2)}
              - column: {name: holiday_date, type: DATE, constraints: {nullable: false}}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: holiday_calendar
            columnNames: country, canton, holiday_date
            constraintName: uq_holiday_calendar_country_canton_date
        - createIndex:
            tableName: holiday_calendar
            indexName: ix_holiday_calendar_date
            columns:
              - column: {name: holiday_date}

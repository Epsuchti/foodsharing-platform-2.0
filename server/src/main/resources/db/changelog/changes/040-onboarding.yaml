# Milestone 2 (T22): learning progress, confirmed region steps, nudges (plan §11).
databaseChangeLog:
  - changeSet:
      id: 040-1
      author: platform
      comment: 'Learning chapters a user has read.'
      changes:
        - createTable:
            tableName: learning_progress
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_learning_progress, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_learning_progress_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: chapter_key, type: VARCHAR(60), constraints: {nullable: false}}
              - column: {name: read_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: learning_progress
            columnNames: user_id, chapter_key
            constraintName: uq_learning_progress_user_id_chapter_key
  - changeSet:
      id: 040-2
      author: platform
      comment: 'Region extra onboarding steps confirmed for a user.'
      changes:
        - createTable:
            tableName: user_onboarding_step_done
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_user_onboarding_step_done, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_user_onboarding_step_done_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: step_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_user_onboarding_step_done_step_id, references: region_onboarding_step(id), deleteCascade: true}}
              - column: {name: confirmed_by, type: UUID, constraints: {foreignKeyName: fk_user_onboarding_step_done_confirmed_by, references: user_account(id)}}
              - column: {name: confirmed_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: user_onboarding_step_done
            columnNames: user_id, step_id
            constraintName: uq_user_onboarding_step_done_user_id_step_id
  - changeSet:
      id: 040-3
      author: platform
      comment: 'Nudges sent to newcomers (at most one per kind and 30 days).'
      changes:
        - createTable:
            tableName: onboarding_nudge
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_onboarding_nudge, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_onboarding_nudge_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: kind, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: sent_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createIndex:
            tableName: onboarding_nudge
            indexName: ix_onboarding_nudge_user_id_kind_sent_at
            columns:
              - column: {name: user_id}
              - column: {name: kind}
              - column: {name: sent_at}

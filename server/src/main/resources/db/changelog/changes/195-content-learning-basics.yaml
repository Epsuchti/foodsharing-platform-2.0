              - column: {name: title, value: "Voraussetzungen für Rollen in foodsharing"}
              - column: {name: body, value: "*Stand: 08.11.2026 - 00:00 Uhr*\n\nBei foodsharing gibt es verschiedene Rollen und Aufgaben. Das beginnt mit den Foodsharer:innen (das sind wir alle), und es gibt die weiteren Rollen, die etwas mehr Verantwortung beinhalten und für die man deswegen auch weitere Voraussetzungen erfüllen muss. Sie sind in diesem Artikel zusammengestellt.\n\n### <a id=\"allgemeines-fuer-alle-rollen\"></a>Allgemeines für alle Rollen\n\n1. Menschen erhalten bei foodsharing auf Antrag die folgenden Status und damit die Möglichkeit, die entsprechenden Rollen auszuüben, falls sie die jeweils angegebenen Voraussetzungen erfüllen.\n2. Bei Wegfall einer Voraussetzung wird der entsprechende Status entzogen; tritt die Voraussetzung wieder ein, erhält der:die Foodsaver:in oder Foodsharer:in den Status zurück.\n\n### <a id=\"voraussetzungen-fuer-foodsharer-innen\"></a>Voraussetzungen für Foodsharer:innen\n\n- mindestens 18 Jahre alt\n- Account auf der foodsharing-Plattform\n- Akzeptierung der foodsharing-Grundlagen\n- Zustimmung zur Datenschutzerklärung\n- keine rote Karte\n\n### <a id=\"voraussetzungen-fuer-unverifizierte-foodsaver-innen\"></a>Voraussetzungen für unverifizierte Foodsaver:innen\n\n- Foodsharer:in\n- bestandenes Foodsaver:innen-Quiz\n- Bestätigung der Rechtsvereinbarung (Deutschland, Österreich) für Foodsaver:innen\n- keine gelb-rote Karte, deren Dauer noch nicht abgelaufen ist\n\n### <a id=\"voraussetzungen-fuer-verifizierte-foodsaver-innen\"></a>Voraussetzungen für verifizierte Foodsaver:innen\n\n- unverifizierte:r Foodsharer:in\n- korrekte Daten im Profil: Name, Adresse, Geburtsdatum, repräsentatives Foto\n- mindestens 3 erfolgreich absolvierte Einführungsabholungen innerhalb von 6 Monaten\n- keine gelbe Karte, deren Dauer noch nicht abgelaufen ist\n\n### <a id=\"voraussetzungen-fuer-betriebsverantwortliche\"></a>Voraussetzungen für Betriebsverantwortliche\n\n- verifizierte:r Foodsaver:in\n- bestandenes Quiz für Betriebsverantwortliche\n- Zustimmung zur Datenschutzbelehrung (Ergänzung zur Datenschutzerklärung)\n- Zustimmung zur Rechtsvereinbarung für Betriebsverantwortliche (Ergänzung zur Rechtsvereinbarung)\n\n### <a id=\"voraussetzungen-fuer-botschafter-innen\"></a>Voraussetzungen für Botschafter:innen\n\n- verifizierte:r Foodsaver:in seit mindestens 6 Monaten\n- keine Konsequenzen für relevante Regelverletzungen, die noch nicht tilgungsfähig sind\n- Betriebsverantwortliche:r\n- bestandenes Quiz für Botschafter:innen\n- mindestens 30 Abholungen bei foodsharing\n- demokratisch gewählt im Bezirk gemäß den „Festlegungen für Botschafter:innen-Wahlen” bei foodsharing\n- ein Begrüßungsgespräch durch das Botschafter:innen-Begrüßungsteam\n- In den ersten 2 Jahren nach Gründung eines Bezirks entfallen für die Botschafter:innen als Voraussetzung die Anzahl der Abholungen, die Dauer als verifizierte:r Foodsaver:in und die Voraussetzung der Wahl.\n\n---\n\n*Artikel von*: [AG Wiki](https://wiki.foodsharing.network/wiki/Gruppe_Wiki) (*[Kontakt](mailto:wiki@foodsharing.network)*)\\\n*Letzte Überarbeitung am 08.11.2026*\n\n---\n\n*Original im foodsharing-Wiki: [Voraussetzungen für Rollen in foodsharing](https://wiki.foodsharing.network/wiki/Voraussetzungen_f%C3%BCr_Rollen_in_foodsharing)*\n"}
        - insert:
            tableName: content_page_i18n
            columns:
              - column: {name: id, value: "00000012-0002-4000-8000-000000001052"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: created_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000105"}
              - column: {name: language, value: "en"}
              - column: {name: title, value: "Requirements for roles in foodsharing"}
              - column: {name: body, value: "*As of: 08.11.2026 - 00:00*\n\nThere are different roles and tasks at foodsharing. It starts with the foodsharers (that is all of us), and there are further roles that involve a bit more responsibility and for which you therefore have to meet further requirements. They are compiled in this article.\n\n### <a id=\"allgemeines-fuer-alle-rollen\"></a>General points for all roles\n\n1. On request, people at foodsharing receive the following statuses and with them the possibility to take on the corresponding roles, if they meet the requirements given for each.\n2. If a requirement no longer applies, the corresponding status is withdrawn; if the requirement is met again, the foodsaver or foodsharer gets the status back.\n\n### <a id=\"voraussetzungen-fuer-foodsharer-innen\"></a>Requirements for foodsharers\n\n- at least 18 years old\n- account on the foodsharing platform\n- acceptance of the foodsharing basics\n- consent to the privacy policy\n- no red card\n\n### <a id=\"voraussetzungen-fuer-unverifizierte-foodsaver-innen\"></a>Requirements for unverified foodsavers\n\n- foodsharer\n- passed foodsaver quiz\n- confirmation of the legal agreement (Germany, Austria) for foodsavers\n- no yellow-red card whose duration has not yet expired\n\n### <a id=\"voraussetzungen-fuer-verifizierte-foodsaver-innen\"></a>Requirements for verified foodsavers\n\n- unverified foodsharer\n- correct data in the profile: name, address, date of birth, representative photo\n- at least 3 successfully completed intro pickups within 6 months\n- no yellow card whose duration has not yet expired\n\n### <a id=\"voraussetzungen-fuer-betriebsverantwortliche\"></a>Requirements for store managers\n\n- verified foodsaver\n- passed quiz for store managers\n- consent to the data protection notice (supplement to the privacy policy)\n- consent to the legal agreement for store managers (supplement to the legal agreement)\n\n### <a id=\"voraussetzungen-fuer-botschafter-innen\"></a>Requirements for ambassadors\n\n- verified foodsaver for at least 6 months\n- no consequences for relevant rule violations that cannot yet be expunged\n- store manager\n- passed quiz for ambassadors\n- at least 30 pickups at foodsharing\n- democratically elected in the district according to the \"rules for ambassador elections\" at foodsharing\n- a welcome talk with the ambassador welcome team\n- In the first 2 years after a district is founded, the number of pickups, the time as a verified foodsaver and the election do not apply as requirements for ambassadors.\n\n---\n\n*Article by*: [AG Wiki](https://wiki.foodsharing.network/wiki/Gruppe_Wiki) (*[Contact](mailto:wiki@foodsharing.network)*)\\\n*Last revised on 08.11.2026*\n\n---\n\n*Original in the foodsharing wiki: [Voraussetzungen für Rollen in foodsharing](https://wiki.foodsharing.network/wiki/Voraussetzungen_f%C3%BCr_Rollen_in_foodsharing)*\n"}

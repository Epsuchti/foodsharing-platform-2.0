              - column: {name: language, value: "en"}
              - column: {name: title, value: "Hygiene rules"}
              - column: {name: body, value: "*Valid from 13.12.2024*\\\n*[Changes](https://drive.google.com/file/d/1XtVCJDSJlYDkLY2lctcN7s1zybYO8FhT) compared with the previous version (pdf)*\n\n**Detailed explanations and practical guides**\\\nFor practical work as a foodsaver, there are some further texts with tips and information.\n\n- *[Erläuterungen zu den Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen)* (explanations of the hygiene rules) - explanations of every single rule, why it is important for foodsharing and what it means in practice.\n- *[Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel)* (hygiene guide for food) - a series of articles on handling saved food\n\n*Further development of the hygiene rules*\\\nThe hygiene rules are developed further by the *AG Hygiene* (hygiene working group). Suggestions and ideas can be sent to the hygiene working group at any time (preferably by email to [hygiene@foodsharing.network](mailto:hygiene@foodsharing.network)).\\\nThe working group reviews all ideas and suggestions it receives; the rules in force are planned to change once a year – usually in November.\\\nEveryone interested is warmly invited to [join the working group](https://foodsharing.de/?page=bezirk&bid=1686).\n\n### <a id=\"praeambel\"></a>Preamble\n\nThe hygiene rules set minimum requirements for foodsharing and all foodsavers. On the one hand, they are meant to guarantee that the legal hygiene regulations are followed in practical work with food. On the other hand, the rules are meant to protect against mistakes and give advice on how to handle food so that it can be eaten safely.\\\nIt can make sense to make rules somewhat stricter for individual situations, stores or districts if local conditions require it.\n\n***Every district can therefore tighten the rules for its area; however, the adjustments must not contradict the hygiene rules stated here.***\n\n### <a id=\"a-taetigkeitsverbote-beim-umgang-mit-lebensmitteln-42-43-ifsg\"></a>A) Activities prohibited when handling food (§§42, 43 IfSG)\n\n1\\) Clean clothes, hair and hands are a prerequisite for handling food.\n\n2\\) With the following symptoms of illness, you are obliged to see a doctor before handling open, sensitive food:\n\n- diarrhoea, severe nausea, vomiting, severe cough\n- contagious diseases, in particular cholera, typhoid, paratyphoid, dysentery, salmonellosis, EHEC, hepatitis A or E:\n- skin diseases and open wounds that are inflamed, festering or weeping\n- fever over 38.5°C\n\nHandling food afterwards is only allowed if the doctor issues a written certificate of clearance.\\\n[Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#A.29_T.C3.A4tigkeitsverbote_beim_Umgang_mit_Lebensmitteln_.28.C2.A7.C2.A742.2C_43_IfSG.29)\n\n### <a id=\"b-umgang-mit-lebensmitteln\"></a>B) Handling food\n\n#### <a id=\"1-direkter-umgang-transport-und-lagerung\"></a>1) Direct handling, transport and storage\n\n- **a)** *Unpackaged baked goods*: pastry tongs, gloves (preferably washable reusable gloves) or carefully washed hands are mandatory.\n\n  For all other food, gloves are usually not necessary, unless they are recommended for special reasons (or by official instructions).\n\n  For cakes and gateaux, solid containers should be used where possible. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1a.29_-_Unverpackte_Backwaren)\n- **b)** *Chilled goods*: the cold chain should be kept where possible: [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - *Transport* in a cool bag or cool box with ice packs with at most 20 minutes of interruption, without exposure to sun or heat\n  - *Storage* without interruption in a fridge or (only for a short time) in a cool bag or cool box with ice packs\n- **c)** *Chilled goods* are: [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - food that, according to the packaging, should be stored at +2 to +8°C\n  - pasta and potato salad, prepared dishes with oil/fat\n  - cakes with a filling that is not baked through, cream cakes and gateaux\n- **d)** *Partly rotten food* should be packed separately from other food. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1d.29_-_Angefaulte_Lebensmittel)\n- **e)** Unpackaged food may only be transported and stored in *clean*, *food-safe packaging*. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_1._Absatz_-_Lebensmittelechte_.28und_saubere.29_Verpackungen)\n\n  Food-safe packaging can be recognised\n  - by the words \"for food\" or the glass-and-fork symbol\n  - by original labels that prove the original use for food\n\n  [Sources of food-safe packaging](https://docs.google.com/spreadsheets/d/1LpZBgtloqpNjDI9X3-7v91wSae61WqxbBAPyc7KrqoQ)\n\n  For *hot food*, only containers designed for the corresponding temperature may be used.\n\n  *Exception*: [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_Ausnahme_-_nicht-lebensmittelechte_Verpackungen)\n  - Food handed over by a store in packaging that is not food-safe or is dirty should be repacked at the pickup place if possible. If necessary, it can also be judged inedible at the pickup and left behind.\n\n#### <a id=\"2-weitergabe-allgemein\"></a>2) Passing on in general\n\nThe following rules apply only to ***passing on*** saved food.\\\nFoodsavers can use all saved food and other saved goods themselves without restriction at their own risk, or use them as animal feed.\\\n[Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_Weitergabe_allgemein)\n\n- **a)** Foodsavers are *responsible* for the food they pass on. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2a.29_-_Verantwortlichkeit_der_Foodsaver)\n- **b)** The recipient has a *claim for damages* for consequential damage only in the case of gross negligence or intent. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl%C3%A4ssigkeit_.28und_Vorsatz.29)\n- **c)** To rule out *gross negligence*: [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl.C3.A4ssigkeit_.28und_Vorsatz.29)\n  - the food must be transported and stored correctly (see section B1) )\n  - food must be sorted out after its use-by date\n  - every single item must be *checked* for edibility before it is passed on:\n    - Only pass on what you would still eat yourself!\n    - ***Eye-nose-mouth test***: check appearance, smell and, if appropriate, taste (as far as possible without opening the packaging)!\n- **d)** It is *forbidden* to pass on food [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2d.29_-_Verbotene_Lebensmittel)\n  - with mould or black spots\n  - after the use-by date\n  - with a use-by date whose innermost packaging has been opened\n  - with a best-before date whose innermost packaging has been opened, if the time of opening is unknown or long ago\n  - with swollen vacuum packaging\n- **e)** It is also forbidden to pass on *medicines*. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2e.29_-_Arzneimittel)\n- **f)** *Animal feed* may be passed on. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2f.29_-_Tierfutter)\n- **g)** *Non-edible items* (e.g. cleaning and care products, cosmetics, books, clothes) must be passed on so clearly separated from food and feed that any risk of confusion is excluded. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2g.29_-_Nicht-Essbares)\n\n### <a id=\"c-zusaetzliche-regeln-fuer-verschiedene-stufen-der-weitergabe\"></a>C) Additional rules for different levels of passing on\n\nSaved food must be divided into 4 levels of passing on:\n\n- Level 1: non-personal passing on\n- Level 2: personal passing on\n- Level 3: own consumption or animal feed\n- Level 4: disposal.\n\nDepending on the level, further rules apply in addition to those of section B). [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Teil_C.29_-_Stufen_der_Weitergabe)\n\n#### <a id=\"stufe-1-nicht-persoenliche-weitergabe\"></a>Level 1) Non-personal passing on\n\nwithout direct contact with the recipients (e.g. Fairteiler, other organisations) [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#1.29_-_Nicht-pers%C3%B6nliche_Weitergabe)\n\n- **a)** It is *forbidden* to pass on\n  - minced meat, raw fish, products made from unheated raw milk\n  - freshly prepared dishes with raw egg, liquid egg\n  - creams, pudding, tiramisu, mayonnaise (if homemade with egg or milk)\n  - raw eggs after the best-before date\n  - mushrooms you picked yourself\n  - alcoholic drinks, food containing alcohol or THC, energy drinks\n  - food with mould or rotten spots\n  - food that must be kept chilled whose cold chain was interrupted\n  - prepared dishes, if customers could have had direct contact with the food\n  - prepared dishes offered warm\n  - prepared dishes that need chilling\n  - food with a use-by or best-before date whose (innermost) packaging is open\n  - food that was handed over or stored in packaging that is not food-safe or is dirty\n\n  [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1a.29_-_Verbotene_Lebensmittel)\n- **b)** *Food with soil on it* must not be stored above other food. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1b.29_-_Erdbehaftete_Lebensmittel)\n- **c)** *Prepared* dishes must be covered or in a closed container. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **d)** *List of ingredients*: for homemade dishes, all ingredients and the date of preparation must be written on them. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **e)** *Decanted* food must be labelled with the complete list of ingredients, the date of decanting and, if applicable, the best-before date. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n\n#### <a id=\"stufe-2-persoenliche-weitergabe\"></a>Level 2) Personal passing on\n\nwith the possibility of talking to the recipients [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_-_Pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Forbidden*: [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2a.29_-_Verbotene_Lebensmittel)\n  - food that is only *conditionally and with caution* edible or *very unsightly* (e.g. fruit/vegetables with very soft spots or parts, a brown half, roughly torn or tough, dried-out bread)\n  - food whose *cold chain* was interrupted for a longer time (depending on the food and the current weather – rule of thumb: the direct way from the store to the fridge is fine)\n- **b)** *Decision by person in the individual case*: food may only be passed on if you *trust* the recipients to handle and judge the food responsibly (e.g. alcohol, fish or partly rotten fruit/vegetables). [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2b.29_-_Entscheidung_im_Einzelfall)\n- **c)** *Verbal advice*: where appropriate, the recipients should be told [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2c.29_-_M%C3%BCndliche_Hinweise)\n  - that the food must be used *quickly*\n  - that they should *check* the food again before eating it\n  - if the *cold chain* could not be kept\n\n#### <a id=\"stufe-3-eigenkonsum-oder-tierfutter\"></a>Level 3) Own consumption or animal feed\n\n- **a)** Foodsavers can eat food themselves or pass it on as animal feed. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n- **b)** Foodsavers may use other saved things apart from food and feed themselves, but may not pass them on in the name of foodsharing. [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n\n#### <a id=\"stufe-4-entsorgung\"></a>Level 4) Disposal\n\nFood that does not fall into categories 1), 2) or 3) must be disposed of properly (bin, composting etc.). [Explanation](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#4.29_-_Entsorgung)\n\n---\n\n*Article by*: [AG Hygiene - Austausch und (Fach)Wissen](https://foodsharing.de/?page=bezirk&bid=1686) (*[Contact](mailto:hygiene@foodsharing.network)*)\\\n*Last revised on 13.12.2024*\n\n---\n\n*Original in the foodsharing wiki: [Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln)*\n"}

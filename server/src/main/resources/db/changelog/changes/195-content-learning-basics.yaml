              - column: {name: title, value: "Contexte et identité"}
              - column: {name: body, value: "## <a id=\"lebensmittelverschwendung\"></a>Gaspillage alimentaire\n\n- Environ 4 milliards de tonnes d’aliments sont produites chaque année dans le monde. Plus de 1,3 milliard de tonnes en sont gaspillées. [1]\n- Dans les pays industrialisés, environ 40 % des aliments gaspillés sont parfaitement consommables. [1]\n- Nous sommes tous et toutes responsables du fait que les commerçant·es, intermédiaires, producteur·rices et restaurateur·rices jettent chaque année des millions de tonnes d’aliments.\n- Les 2/3 de l’ensemble du gaspillage alimentaire pourraient être évités grâce à l’engagement des entreprises alimentaires, des foodsavers et des particuliers.\n- Ce n’est qu’ensemble que nous pouvons arrêter la folie de la société d’abondance, chacun·e faisant sa part et agissant de manière responsable.\n\n## <a id=\"ausgangssituation\"></a>Situation de départ\n\n- Chaque jour, des aliments sont gaspillés à une échelle extrême, alors qu’environ 57 000 personnes meurent encore de faim chaque jour. [2]\n- Dans les pays industrialisés, une part particulièrement importante de ce gaspillage a lieu au niveau des consommateur·rices : plus de 150 kg par personne et par an. [3]\n- Des pommes talées, des concombres trop tordus, des courgettes trop petites et même des produits trop chers ou trop bon marché finissent très vite chez nous dans les poubelles des commerces, alors que dans la grande majorité des cas ils seraient parfaitement consommables.\n- Les ménages privés ne sont pas non plus à l’abri du gaspillage : des emballages trop grands, trop de produits, des prix trop bas et souvent, hélas, une simple irréflexion entraînent aussi à la maison beaucoup de déchets alimentaires évitables.\n\n## <a id=\"ansatzpunkte\"></a>Points d’action\n\nComme le gaspillage se produit à de nombreux endroits du cycle de production et de consommation, nous pouvons aussi le combattre à de nombreux endroits.\\\nNous agissons donc à trois niveaux :\n\n1. *Auprès des commerces et des [entreprises](https://wiki.foodsharing.network/wiki/Betrieb) alimentaires* : sur la base de coopérations, des aliments sont sauvés de la poubelle, collectés et redistribués. Par ailleurs, nous voulons sensibiliser nos partenaires au fait qu’une planification meilleure ou plus prudente des achats et des stocks, mais aussi par exemple des offres à prix réduit pour des aliments plus tout à fait parfaits, peuvent également réduire le gaspillage alimentaire. Effet secondaire : le volume des poubelles d’ordures ménagères et des biodéchets peut baisser jusqu’à 70 %. [4]\n2. *Auprès des consommateur·rices dans la sphère privée* : nous mettons à disposition sur foodsharing.de l’infrastructure numérique pour toutes les personnes qui veulent elles-mêmes sauver ou partager de la nourriture. Nous souhaitons que de plus en plus de personnes utilisent cette offre, par exemple pour donner leurs restes d’aliments via un panier alimentaire virtuel avant de partir en vacances. En outre, nous voulons attirer l’attention sur le sujet en général, diffuser par des informations solides et des offres éducatives des connaissances et des idées pour une gestion plus durable des aliments, et encourager plus d’attention envers les aliments.\n3. *Auprès des producteur·rices* : nous voulons motiver les gens et soutenir leur engagement pour qu’ils sauvent les « fruits et légumes de rebut » de la pourriture. Par exemple, au moment des récoltes, nous organisons des actions pour ramasser dans les champs les produits qui ne correspondent pas aux normes visuelles strictes de l’industrie agricole et de ses acheteurs et qui y seraient sinon simplement laissés. On peut ainsi sauver des quantités énormes de carottes tordues, de concombres cassés ou de pommes talées.\n\n## <a id=\"selbstverstaendnis\"></a>Identité\n\n- foodsharing est un [mouvement écologiste](/learn/principles). Notre but est de préserver les ressources naturelles de notre planète. Gaspiller des aliments, c’est gaspiller les ressources utilisées pour les produire (eau, énergie, surfaces agricoles et de stockage, temps de travail, matières premières p. ex. pour les emballages).\n\n- foodsharing n’est pas une organisation sociale (*plus exactement : caritative*). Nous ne voulons pas avoir la prétention de décider quelles personnes sont dans le besoin ou quels projets méritent davantage d’être soutenus que d’autres. Nous voulons rendre les aliments accessibles [sans condition](/learn/principles) à toutes les personnes et favoriser ainsi le respect envers eux.\n\n- Chez foodsharing, nous donnons les aliments excédentaires d’entreprises et de particuliers. Les aliments sont toujours donnés gratuitement et jamais vendus ou utilisés comme monnaie d’échange. Bien entendu, les foodsavers peuvent consommer eux-mêmes les marchandises sauvées.\n\n- foodsharing travaille [indépendamment](/learn/principles) des partis politiques et des confessions. foodsharing distribue des aliments à toutes les personnes. Aucune forme d’exclusion ou de discrimination n’est tolérée.\n\n- Nous ne sommes pas en concurrence avec d’[autres initiatives](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln) qui luttent contre le gaspillage alimentaire, comme les Tafeln (banques alimentaires), mais nous coopérons avec elles. Nous saluons et soutenons tout engagement contre le gaspillage alimentaire.\n\n  Nous laissons volontiers la priorité à toutes les organisations caritatives pour distribuer des aliments sauvés aux personnes dans le besoin. foodsharing ne doit être que le « dernier rempart avant la poubelle » pour tous les aliments que d’autres organisations ne peuvent pas redistribuer.\n\n- Avec les milliers de foodsavers bénévoles dans toute l’Allemagne, foodsharing veut vivre une nouvelle culture du respect de la nourriture, afin d’accorder aux aliments, avec les magasins partenaires, l’estime qu’ils méritent.\n\n- L’objectif à long terme de foodsharing est de se rendre superflu en mettant fin au gaspillage alimentaire systématique à grande échelle.\n\n- Pour plus d’informations sur ce sujet, nous vous recommandons chaleureusement le film « Taste the Waste » de notre membre fondateur Valentin Thurn.\n\n## <a id=\"foodsharing\"></a>foodsharing\n\nfoodsharing est une initiative pour\n\n- organiser des [foodsavers](https://wiki.foodsharing.network/wiki/Foodsaver) qui sauvent des aliments (et aussi d’autres produits non comestibles) auprès d’entreprises alimentaires de toutes sortes\n- organiser des [foodsharers](https://wiki.foodsharing.network/wiki/Foodsharer) qui veulent donner des aliments gratuitement\n- organiser des événements sur le sujet, faire avancer l’internationalisation de foodsharing et bien plus encore\n\n- Le [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) exploite la plateforme en ligne, principalement avec des bénévoles très engagé·es non rémunéré·es qui s’occupent de tâches centrales, p. ex. [programmation](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform), [relations presse centrales](https://wiki.foodsharing.network/wiki/Pressetext), questions juridiques, règles centrales, coordination des [groupes de travail centraux](https://foodsharing.de/?page=groups), [graphisme](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Materialien_-_Grafikdateien), coordination des districts et des [Länder](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Bundesland-Botschafter.2Ainnen), [rencontres nationales et internationales, internationalisation et traduction](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#International_-_foodsharing_International), soutenu·es seulement par quelques mini-jobs et postes à temps partiel.\n\n- En outre, plus de 100 autres foodsavers très actif·ves s’engagent dans d’autres domaines.\n\n- Le sauvetage des aliments est organisé en districts qui comprennent généralement une ou plusieurs villes ou un arrondissement. La coordination d’un district est entre les mains des [ambassadeur·rices](https://wiki.foodsharing.network/wiki/Botschafter*in) foodsharing ; les coopérations avec les différents commerces sont suivies par des [responsables de commerce](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r).\n\n- Nous essayons de grandir de manière organique et soucieuse de fiabilité : il ne s’agit pas de conclure le plus vite possible le plus de coopérations et d’accueillir le plus de gens possible. Nous préférons prendre le temps de bien faire notre travail, avec soin, avant de passer à l’étape suivante.\n\n- Tous les foodsavers sont des sauveteur·euses d’aliments [soigneusement formé·es](https://wiki.foodsharing.network/wiki/Foodsaver#Wie_man_Foodsaver_wird) et fiables, dont le travail est encadré et sécurisé par les [règles de conduite](/learn/code-of-conduct) internes, les [règles d’hygiène](/learn/hygiene-rules) et l’[accord juridique](/learn/legal-agreement). Ils et elles peuvent s’identifier à tout moment avec leur [carte de foodsaver](https://wiki.foodsharing.network/wiki/Ausweis).\n\n- Tous les foodsavers doivent accepter l’exclusion de responsabilité avec l’[accord juridique](/learn/legal-agreement) avant de pouvoir collecter des aliments. Elle a été rédigée par deux cabinets d’avocats de sorte que toutes les entreprises alimentaires donatrices sont juridiquement libérées de toute responsabilité, y compris pour négligence. Chaque foodsaver assume lui-même la responsabilité des aliments sauvés et de leur don.\n\n## <a id=\"die-foodsharing-plattform\"></a>La plateforme foodsharing\n\n- foodsharing.de est [gratuit](https://wiki.foodsharing.network/wiki/Umgang_mit_Geld_bei_foodsharing), non commercial et sans publicité, et le restera.\n\n- La plateforme a été programmée bénévolement et est constamment développée par les nombreux bénévoles de la [tech team](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform).\n\n- Depuis l’été 2012, plus de 300 000 bénévoles qui veulent agir contre le gaspillage alimentaire se sont inscrits. Plus de 70 000 d’entre eux sauvent déjà activement des aliments dans environ 7000 commerces.\n\nGrâce à nos partenaires écologiques [manitu.de](https://manitu.de) (hébergement web, coûts du trafic) et [Greensta.de](https://Greensta.de) (comptes e-mail), qui nous soutiennent gratuitement, les serveurs de la plateforme foodsharing fonctionnent à 100 % à l’électricité hydraulique.\n\n## <a id=\"verweise\"></a>Références\n\n[1] n.tv, 2011. Verschwendung ist schockierend. [Online]. http://www.n-tv.de/wissen/Verschwendung-ist-schockierend-article4210226.html. [Consulté le 09.07.2013].\n\n[2] ver.di publik, 2013. Der Hunger ist von Menschen gemacht. [*Plus en ligne*. https://publik.verdi.de/2013/ausgabe-03/spezial/finanzen/seiten-20-21/A0. [Consulté le 09.07.2013]].\n\n[3] Swedish Institute for Food and Biotechnology (SIK), Gothenburg, Sweden, 2011. Global Food Losses and Food Waste. [Online]. http://large.stanford.edu/courses/2012/ph240/briggs1/docs/mb060e00.pdf\n\n[4] Bio Company (Berlin), magazine client, 2013-07. Tonnen sind kein Platz für Lebensmittel. https://drive.google.com/file/d/12pIcqTvVaRGC-4iBnTu5xGafFGrdikkj\n\n---\n\n*Article de* : [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Contact](mailto:vorstand@foodsharing.network)*)\\\n*Dernière révision le 12.08.2026*\n\n---\n\n*Original dans le wiki foodsharing : [Kontext und Selbstverständnis](https://wiki.foodsharing.network/wiki/Kontext_und_Selbstverst%C3%A4ndnis)*\n"}

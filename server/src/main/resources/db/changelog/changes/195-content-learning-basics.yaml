              - column: {name: title, value: "Regelverletzige – Konsequänze und Bearbeitig"}
              - column: {name: body, value: "*Gültig ab 01.10.2020*\n\n***Erlüüterige und Begründige***\\\nWie Regelverletzige bearbeitet wärded, wird im Wiki-Artikel [Regelverletzungen](https://wiki.foodsharing.network/wiki/Regelverletzungen) usfüehrlich erklärt. De Artikel [Regelverletzungen - Erläuterungen](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen) git Begründige und Erklärige zu jeder einzelne Festlegig.\n\nDie Festlegige wärded vo de *AG Verhaltensregeln und Meldesystem* wiiterentwicklet. Verbesserigsvorschläg und Idee chönd jederziit a d AG Verhaltensregle gschickt wärde (am beschte per Mail a [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nD AG luegt alli Idee und Vorschläg aa, wo iigönd.\n\nZur [Mitarbet i de Arbetsgruppe](https://foodsharing.de/?page=bezirk&bid=1640) sind alli Interessierte härzlich iiglade.\n\n### <a id=\"begriffe-und-abkuerzungen\"></a>Begriff und Abkürzige\n\n- Meldig vo ere Regelverletzig (**MRV**)\n- [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (**LMG**)\n- [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) im Bezirk (**LS**)\n- Persone mit BOT-Rächt in eme Bezirk, egal under wellere Bezeichnig (**BOT**) - inklusiv Bundesland-Bezirk, Staat-Bezirk, Kontinent-Bezirk und anderi\n\n### <a id=\"konsequenzen-fuer-regelverletzungen\"></a>Konsequänze für Regelverletzige\n\n\"Regle\" im Sinn vo dem Abschnitt sind alli Festlegige i de foodsharing-Grundlage 2 (\"Verhaltensregle\") und 3 (\"Regelverletzige - Konsequänze und Bearbeitig\").\n\n- **a)** E ***Verwarnig*** cha bi allne Regelverletzige usgsproche wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#a.29_.E2.80.93_Verwarnung)\n- **b)** E vorübergehendi ***Suspendierig vo Abholige*** dur Entzug vo de Verifizierig und allefalls Sperrig für wiiteri Aktivitäte bi foodsharing für bis 3 Mönet (***gälbi Charte***) cha usgsproche wärde\n  - **i)** bi Verletzige vo de [Regle A)-C)](/learn/code-of-conduct#a-allgemeines-verhalten-bei-foodsharing), wo d Kooperation mit emene Betrieb gfährded\n  - **ii)** bi Verletzig vo de Regle [C6)](/learn/code-of-conduct#c-betriebe-betriebsteam-planung-von-abholungen)\n  - **iii)** bi Verletzige vo de Hygieneregle, wo d Gsundheit vo Dritte gfährded\n  - **iv)** wänn s Aaseh vo foodsharing bi Betriebe oder i de Öffentlichkeit gschädigt wird\n  - **v)** bi Verstoss gäge d Rächtsvereibarig und Regelverletzige, wo de Grundsätz vo foodsharing widerspräched\n  - **vi)** wänn (nach korrekter Tilgig) 3 nöd tilgti Verwarnige vorliged\n\n  Wänn d Suspendierig abgloffe isch, wird de Foodsaver uf Aafrog bi emene BOT vom Stammbezirk wieder verifiziert.\n\n  [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#b.29_.E2.80.93_Suspendierung_.28Gelbe_Karte.29)\n- **c)** E ***Herabstufig zum Foodsharer*** (***gälb-roti Charte***) cha usgsproche wärde, wänn 2 gälbi Charte vorliged.\\\n  Glichziitig wird für 3-6 Mönet es Verbot fürs nomal Mache vom FS-Quiz festgleit, eventuell au e Sperrig für wiiteri Aktivitäte bi foodsharing für di gliich Duur.\\\n  De Bezirk, wo s usgsproche hät, cha s Verbot und d Sperrig jederziit ufhebe. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#c.29_.E2.80.93_Herabstufung_zum_Foodsharer_.28Gelb-rote_Karte.29)\n- **d)** E ***dauerhafti Sperrig vom Account*** mit Verbot vo de Neuaameldig (***roti Charte***) cha usgsproche wärde bi\n  - **i)** Verurteilig wäge ere Straftat während de Aktivität für foodsharing\n  - **ii)** Verurteilig wäge ere Straftat gäge Mitglieder oder Eigetum vo foodsharing\n  - **iii)** ere Verletzig vo de [Grundsätz](/learn/principles), wo trotz früenerer gälber, gälb-roter oder roter Charte zum 2. Mal passiert\n  - **iv)** wänn 2 gälb-roti Charte vorliged. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#d.29_.E2.80.93_Sperrung_des_Accounts_.28Rote_Karte.29)\n  - **v)** wänn das nach gältendem Rächt nötig isch oder wänn ohni sofortigi Sperrig e akuti, erheblichi Gfahr für foodsharing e.V. oder Dritti bestaht. I dene Fäll entscheidet und dokumentiert de Vorstand vom foodsharing e.V. d Massnahm i eigener Verantwortig.\n\nErlüüterig\n\n### <a id=\"a-umgang-mit-regelverletzungen\"></a>A) Umgang mit Regelverletzige\n\n- **1)** D Meldig vo ere Regelverletzig hät nöd de Zwäck, unaagmässes Verhalte restriktiv z verfolge. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **2)** S Ziel isch vilmeh, sich aktiv mit bestimmte Situatione z beschäftige, zum Verständnis für d Regle z schaffe und e Lösig z finde, wo alli Beteiligte akzeptiere chönd. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **3)** E Konsequänz uszspräche sött nur di letscht Möglichkeit sii. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **4)** D Meldig sött in eme möglichst chliine Chreis vo Lüüt bearbeitet wärde, will s es sehr vertraulichs Thema isch. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A4%29)\n- **5)** Bi jeder MRV sött de einzelni Fall berücksichtigt und kei pauschali Beurteilig gmacht wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A5%29)\n\n### <a id=\"b-gruppen-fuer-die-meldungsbearbeitung\"></a>B) Gruppe für d Bearbeitig vo Meldige\n\n- **1)** Für d Bearbeitig vo MRV richtet jede Bezirk e [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (LMG) ii. Si heisst \"Meldungen *Bezirksname*\" und hät d Mailadrässe \"meldungen.*bezirksname*@foodsharing.network\". Bis d LMG in eme Bezirk iigrichtet isch, übernimmt di bestehendi Verifizierigs-AG (under verschidene Bezeichnige) ihri Ufgab. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B1%29)\n- **2)** Empfohle wird zuesätzlich e [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (LS), wo mer i de Fäll nach C3) und D8) aarüefe cha. Si heisst denn \"Schiedsstelle *Bezirksname*\" und hät d Mailadrässe \"schiedsstelle.*bezirksname*@foodsharing.network\". [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B2%29)\n- **3)** D Mitglieder vo LMG und LS wärded vo de FS vom Bezirk demokratisch gwählt. Niemer darf Mitglied i meh als ere LMG oder LS sii. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B3%29)\n- **4)** Foodsaver mit nöd tilgte gälbe, gälb-rote oder rote Charte dörfed nöd Mitglied i LMG oder LS sii. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B4%29)\n- **5)** Für d Vermittlig nach D8) ii) cha jede Bezirk demokratisch e wiiteri Arbetsgruppe bestimme. D Mitglieder vo dere Gruppe dörfed nöd i de LMG oder LS vom Bezirk und au nöd BOT für de Bezirk sii. *Erlüüterig*\n\n### <a id=\"c-zustaendigkeiten\"></a>C) Zueständigkeite\n\n- **1)** Zueständig für d Bearbeitig vo ere MRV isch grundsätzlich de Stammbezirk vo de gmäldete Person.\\\n  Bi emene Wächsel vom Stammbezirk wärded offeni, nöd abgschlossni Meldige vom vorige Stammbezirk fertig bearbeitet, wänn nöd beidi Bezirk zäme öppis anders abmached. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **2)** Meldige wärded grundsätzlich vo de LMG vom Bezirk bearbeitet. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **3)** Für Meldige gäge Mitglieder vo de LMG oder BOTs vo ihrem Stammbezirk cha d meldend Person abwiichend festlege, dass d Meldig vo de LS bearbeitet wird. Falls kei LS existiert, gaht d Meldig i dem Fall au a d LMG. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C3%29)\n- **4)** Für Meldige gäge Foodsharer isch de Bezirk zueständig, wo für de Wohnort vom gmäldete Foodsharer zueständig isch, falls de Wohnort bekannt isch. Susch isch de Stammbezirk vo de meldende Person zueständig. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C4%29)\n- **5)** D Umsetzig und Bestätigung vo gälb-rote und rote Charte macht de Vorstand vom foodsharing e.V. nach de Vorussetzige für d Umsetzig vo gälb-rote und rote Charte. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C5%29)\n- **6)** D gmäldet Person cha einzelni Mitglieder vo ere bearbeitende Gruppe ablehne, wo si für befange haltet. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C6%29)\n- **7)** Betroffeni Persone dörfed kei MRV bearbeite. Als betroffe gälted d meldend und d gmäldet Person und alli, wo i de gmäldete Situation debii gsii sind. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C7%29)\n\n### <a id=\"d-bearbeitung-einer-meldung\"></a>D) Bearbeitig vo ere Meldig\n\n- **1)** D MRV wird vo de meldende Person direkt a di zueständig Gruppe gschickt. Wänn e Gruppe e MRV überchunnt, für die si nöd zueständig isch, git si d MRV a di zueständig Gruppe wiiter. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D1%29)\n- **2)** D Meldig und alli wiitere Biiträg (Nachrichte, Mails, Gsprächsnotize und -protokoll, Stellungnahme, Entscheid, Aarüefe vo ere andere Gruppe) wärded im Forum vo de Gruppe dokumentiert, wo d Meldig im Moment bearbeitet. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D2%29)\n- **3)** D Meldig wird nöd bearbeitet, falls si meh als 2 Mönet nach em gmäldete Ereignis iigreicht wird. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D3%29)\n- **4)** Vor de Bearbeitig vo ere Meldig mues d LMG für d gmäldet Person d Tilgig vo Meldige und Konsequänze nach Abschnitt F) mache. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D4%29)\n- **5)** D gmäldet Person mues über d Meldig und de Grund vo de Meldig - in anonymisierter Form nach E3) - informiert und ufgforderet wärde, innert 2 Wuche nach dere Mitteilig Stellig z näh. ([Mail-Muster](https://drive.google.com/file/d/1nE8G9K16J4btsBVnh0TaPElf8nqfLyCK)) D meldend Person wird über de Aafang vo de Bearbeitig und d Möglichkeit vo ere wiitere Stellungnahm innert 2 Wuche nach dere Mitteilig informiert. ([Mail-Muster](https://drive.google.com/file/d/1OjLUKYdfi0KXSTtPaeWCktTrovYS3W-y))\n\n  E Konsequänz darf erscht usgsproche wärde, wänn beidi Nachrichte und alli iigangne Stellungnahme schriftlich (Mail oder Papier) vorliged. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D5%29)\n- **6)** D meldend Person cha im Meldigsformular oder spöter uf Aafrog vo de bearbeitende Gruppe uf d anonymisiert Form nach E3) verzichte. ([Mail-Muster](https://drive.google.com/file/d/1gYknWLB7uKJZXmnVPcZP1JdIL_eret93))\\\n  Wänn de Nöd-Verzicht d Bearbeitig vo de Meldig verhinderet, ändet d Bearbeitig dur die Gruppe mit em Entscheid \"kei Konsequänz\". ([Mail-Muster a GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [Mail-Muster a MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D6%29)\n- **7)** De Entscheid mitsamt de Begründig wird de meldende und de gmäldete Person per Mail oder uf Papier mitteilt, zäme mit ere Frischt für d Bitt um Vermittlig nach D8). ([Mail-Muster a GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [Mail-Muster a MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D7%29)\n- **8)** D meldend und d gmäldet Person chönd innert ere Frischt vo 2 Wuche di vorgseh Gruppe um Vermittlig bitte, falls s si git. Die Gruppe isch\n  - **i)** bi Bearbeitig dur d LMG d LS, falls si existiert; susch isch kei Vermittlig möglich;\n  - **ii)** bi Bearbeitig dur d LS d Gruppe, wo de Bezirk nach B5) bestimmt hät.\n\n  D Vermittligsgruppe cha d Vermittlig ohni Begründig ablehne. ([Mail-Muster](https://drive.google.com/file/d/1pZTqeFJARkQC0Q4GYSIZNBb-1xuBfn3l)) [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D8%29)\n- **9)** Falls e Konsequänz usgsproche wird, wird si im Forum vo de LMG dokumentiert, wo für d gmäldet Person zueständig isch. Debii müend mindestens Datum und Grund vo de Meldig und d Konsequänz mit em Datum vom Entscheid gspicheret wärde. ([Mail-Muster](https://drive.google.com/file/d/1G-tvtx1j3im3QcBN_5nf40B54hnT5lom)) [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D9%29)\n- **10)** D Gruppe, wo d Konsequänz usgsproche hät, cha si vorziitig beände. Bi gälb-rote und rote Charte mues de Vorstand vom foodsharing e.V. zuestimme. *Erlüüterig*\n- **11)** D Gruppe, wo d Konsequänz usgsproche hät, cha si mit de Zuestimmig vo allne andere Gruppe, wo a de Bearbeitig beteiligt sind, ganz zruggneh. Bi gälb-rote und rote Charte mues de Vorstand vom foodsharing e.V. zuestimme. De Entscheid wird de gmäldete und de meldende Person mit Begründig mitteilt. D meldend und d gmäldet Person chönd innert ere Frischt vo 2 Wuche di Gruppe nach D8) um Vermittlig bitte. *Erlüüterig*\n\n### <a id=\"e-datenschutz-vertraulichkeit-selbstauskunft\"></a>E) Dateschutz / Vertraulichkeit / Sälbstuskunft\n\n- **1)** **Vertraulichkeit:** Alles, was MRV betrifft, mues streng vertraulich behandlet wärde. Alli Beteiligte sind zur Verschwiegeheit verpflichtet, ussert d meldend Person, d gmäldet Person und alli Persone, wo i de Meldig gnännt wärded, händ de Herusgab schriftlich zuegstimmt. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **2)** **Wiitergab:** Wiitergäh darf mer nur a Persone und Gremie, wo für d Bearbeitig vom jewiilige, einzelne Fall zueständig sind. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **3)** **Anonymisierti Form:** D Meldig darf de gmäldete Person nur in anonymisierter Form mitteilt wärde, das heisst, de Name vo de meldende Person darf nöd usegäh wärde.\n\n  Wänn d gmäldet Person Mitglied vo ere bearbeitende oder beteiligte Gruppe isch, isch d anonymisiert Form nöd möglich. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E3%29)\n- **4)** **Sälbstuskunft:** Jede FS cha bi de LMG vo sim Stammbezirk d Konsequänze, wo im Moment gäge ihn vorliged, und di zuegehörige Meldige in anonymisierter Form nach E3) aafordere. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E4%29)\n- **5)** **Uskunft für Bezirk:** Jede Bezirk cha für sini Foodsaver vo dere ihrem Stammbezirk e Ufstellig vo de vorliegende Konsequänze verlange, bim Wächsel vom Stammbezirk au de neu Stammbezirk vom vorige. D Ufstellig enthaltet zu jeder Meldig nur Nummere, Datum und Grund vo de Meldig und d Konsequänz mit em Datum vom Entscheid. [*Erlüüterig*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E5%29)\n\n### <a id=\"f-tilgung-von-meldungen-und-konsequenzen\"></a>F) Tilgig vo Meldige und Konsequänze\n\n- **1)** D gmäldet Person cha bi de LMG d Tilgig vo Meldige und Konsequänze gäge sich beaatrage. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F1%29)\n- **2)** D LMG isch denn verpflichtet, alli Meldige z tilge, bi dene definitiv entschiede worde isch, kei Konsequänz uszspräche. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F2%29)\n- **3)** D LMG isch denn usserdem verpflichtet, alli Konsequänze z tilge, wo de Entscheid bi ere\n  - **i)** Verwarnig 6 Mönet\n  - **ii)** gälbe Charte 2 Jahr\n  - **iii)** gälb-rote Charte 3 Jahr\n  - **iv)** rote Charte 5 Jahr\n\n  zrugg liit und innert dere Frischt kei wiiteri Konsequänz vorliit. D LMG isch denn verpflichtet, alli rote Charte z tilge, wo d Konsequänz vor meh als 5 Jahr beändet worde isch, wänn innert dere Frischt kei wiiteri Konsequänz vorliit. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **4)** Wänn e Konsequänz tilgt wird, cha das dezue füehre, dass di nächst-früener Konsequänz au tilgt wärde mues. [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **5)** Für d Tilgig vo ere Konsequänz informiert d LMG alli Gruppe, wo a de Bearbeitig vo de entsprächende Meldig beteiligt gsii sind. ([Mail-Muster](https://drive.google.com/file/d/1Bxffjz-JdtOOBaBHp74PkbkjIlpJb2su)) Si lösched oder vernichted, soviel technisch möglich:\n  - d Meldig, Stellungnahme, Entscheid und alli wiitere Forumsbiiträg und Kommentär\n  - alli Mails, anderi Nachrichte und Dateie, au us em Papierchorb\n  - alli Papierdokumänt\n\n  [Erlüüterig](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F5%29)\n\n---\n\n*Artikel vo*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Kontakt](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Letschti Überarbeitig am 20.08.2026*\n\n---\n\n*Original im foodsharing-Wiki: [Regelverletzungen – Konsequenzen und Bearbeitung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Konsequenzen_und_Bearbeitung)*\n"}

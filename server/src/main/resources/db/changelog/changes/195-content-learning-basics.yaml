              - column: {name: body, value: "*Stand: 07.01.2015*\n\n## <a id=\"rechtsvereinbarung-fuer-foodsaver\"></a>Rechtsvereinbarung für [Foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver)\n\n### <a id=\"rechtsvereinbarung-teil-i-eigenerklaerung-verhaltenskodex-und-sorgfaltspflichten\"></a>Rechtsvereinbarung Teil I - Eigenerklärung - Verhaltenskodex und Sorgfaltspflichten\n\n*Stand: 07. Januar 2015*\n\nIch erkläre das Folgende:\n\nIch werde im Rahmen von foodsharing als [Foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) tätig werden. Das heißt, ich hole bei Lebensmittelspender\\*innen Lebensmittel ab und verpflichte mich, diese entweder selbst zu verbrauchen oder ausschließlich unentgeltlich an Dritte weiterzugeben (privat, Suppenküchen, Tafeln, Bahnhofsmissionen, gemeinnützige Vereine, Fairteiler, online als Essenskorb etc.).\n\nDas oberste Ziel ist es, alle noch genießbaren Lebensmittel vor der Vernichtung zu bewahren und sie dem menschlichen Verzehr zuzuführen. Als Foodsaver handle ich ehrenamtlich aus sozialen, ethischen und ökologischen Gründen, um die Lebensmittelverschwendung und damit den Hunger, die Ressourcenverschwendung und den Klimawandel uvm. zu minimieren.\n\nDie Foodsaver sind eine effiziente, lokale und zeitnahe Ergänzung zu anderen gemeinnützigen Organisationen wie z.B. den [Tafeln](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln). Zielsetzung ist es, neben großen Lebensmittelhändler\\*innen möglichst allen kleinen Lebensmittelspender\\*innen wie Bäckereien, Bioläden, Restaurants etc. die Kooperation mit den Foodsavern zu ermöglichen, so dass unabhängig von der Größe des Lebensmittelbetriebes keine noch genießbaren Lebensmittel weggeworfen werden müssen.\n\nDie umfassende Zufriedenheit unserer Kooperationsbetriebe ist ein elementarer Teil des Lebensmittelrettens. Ich verpflichte mich, mich dafür mit zuverlässigem, freundlichem und aufgeschlossenem Verhalten gegenüber den Menschen und Betrieben auf allen Ebenen einzusetzen.\n\nIch verpflichte mich, keine Betriebe anzusprechen bzw. Kooperationen aufzubauen, so lange ich nicht das [Quiz zum Betriebsverantwortlichen](https://wiki.foodsharing.network/wiki/Quiz#Quiz_f.C3.BCr_Betriebsverantwortliche) bestanden habe. Generell ist es nur in Absprache mit dem [Betriebskettenteam](https://wiki.foodsharing.network/wiki/Betrieb#Betriebskette) gestattet, Betriebe mit mehr als 3 Filialen anzusprechen.\n\nZiel ist es, eine [Abholquote](https://wiki.foodsharing.network/wiki/Abholquote) von 100% zu erreichen. Um diese zu gewährleisten, bin ich als Foodsaver dazu angehalten, alle Abholtermine auf der [Website](https://foodsharing.de) einzutragen und gut mit anderen Foodsavern vernetzt zu sein. Bei unerwartetem Ausfall wie z.B. durch Krankheit etc. bin ich dazu verpflichtet, mich schnellstmöglich aus dem Kalender auszutragen und mich um einen Ersatzfoodsaver zu kümmern, der schon mal bei dem Lebensmittelspendebetrieb abgeholt hat, und nur im Notfall einen Foodsaver zu wählen, der bei dem Betrieb noch nie abgeholt hat. Sollte sich bis 24 Stunden vor dem Abholtermin kein Ersatz gefunden haben, muss das Suchen nach einem Ersatz via Telefon und E-Mail fortgeführt werden, bis jemand gefunden wird. Ist die Suche auch bis zu einer Stunde vor Abholtermin nicht erfolgreich, muss die Filiale umgehend telefonisch informiert werden, dass an dem betreffenden Tag keine Abholung vorgenommen werden kann.\n\nIn den Ausnahmesituationen, in denen trotz aller Bemühungen keine Abholung stattfinden konnte, muss das Team des Betriebes per Pinnwandeintrag über das Nichterscheinen informiert werden sowie das Nichtabholen als eigener Verstoß gemeldet werden.\n\nAls Foodsaver sichere ich zu, Kühlware und leicht verderbliche Lebensmittel bis zur Übergabe an Dritte sachgerecht zu lagern bzw. zu kühlen und andernfalls solche Lebensmittel nicht an Dritte weiterzugeben.\n\nAls Foodsaver garantiere ich, während der Abholungen oder danach keine noch essbaren Lebensmittel zu entsorgen und mich verantwortlich und fachgerecht um die Entsorgung der nicht mehr genießbaren Lebensmittel, aber auch Verpackungen, Kartons etc. zu kümmern.\n\nDesweiteren verpflichte ich mich, den Ort, an dem die Ware entgegengenommen bzw. getrennt wird, mindestens so sauber zu hinterlassen, wie ich ihn vorgefunden habe. Die Lebensmittel werden zu den Zeiten abgeholt, zu welchen es die Lebensmittelspendebetriebe wünschen. Normalerweise sind dies feste Zeiten, allerdings stehen die Foodsaver auch bereit, um außerterminlich Lebensmittel abzuholen.\n\nIch bestätige, die [Verhaltensregeln](/learn/code-of-conduct) und andere [foodsharing-Wiki-Dokumente](https://wiki.foodsharing.network/wiki/Hauptseite) gelesen und verstanden zu haben, und verpflichte mich, mich nach diesen zu verhalten. Wenn ich Kenntnis davon erlange, dass diese Verhaltensregeln von anderen Foodsavern, Betriebsverantwortlichen oder Botschafter\\*innen nicht eingehalten werden, melde ich diese Verstöße über das Formular \"Verstoß melden\" im Profil des jeweiligen Users.\n\nAls Foodsaver erkläre ich, die in dieser Vereinbarung festgehaltenen Werte zu achten und foodsharing nicht zu schädigen. Dies beinhaltet insbesondere die Pflicht, jegliche diskreditierenden Aussagen gegen foodsharing, ihren Botschafter\\*innen, Foodsavern und anderen Unterstützer\\*innen, auch nach Beendigung meiner Teilnahme als Foodsaver, zu unterlassen. Ich nehme zur Kenntnis, dass ich bei Verstoß gegen diese Erklärung, insbesondere wenn ich foodsharing durch meine Handlungen oder Aussagen vorsätzlich oder grob fahrlässig schädige, von einer Teilnahme als Foodsaver ausgeschlossen werde bzw. mir die Teilnahme als Foodsaver untersagt wird.\n\nIch verpflichte mich auch, mich über aktuelle Informationen und Neuigkeiten auf dem Laufenden zu halten (regelmäßige foodsharing-Treffen aufsuchen, Newsletter lesen, Foren auf der Homepage besuchen, Mails lesen).\n\nfoodsharing ist in erster Linie parteipolitisch neutral. Ich verpflichte mich, mich diesbezüglich an die Regeln und Vorgaben im Dokument „[foodsharing und Politik](https://wiki.foodsharing.network/wiki/Foodsharing_und_Politik)“ zu halten.\n\n### <a id=\"rechtsvereinbarung-teil-ii-haftungsausschluss\"></a>Rechtsvereinbarung Teil II - Haftungsausschluss\n\n*Stand: Januar 2015*\n\nIch erkläre das Folgende:\n\nIch werde im Rahmen von foodsharing als Foodsaver tätig, hole bei Lebensmittelspenderbetrieben Lebensmittel ab und verpflichte mich, diese entweder selbst zu genießen oder ausschließlich unentgeltlich an Dritte weiterzugeben.\n\nAls Foodsaver übernehme ich die Verantwortung für die Lebensmittel. Das heißt, dass alle Lebensmittelspendebetriebe, Vereine, Bauernhöfe etc., die Lebensmittel abgeben, von jeglicher Haftung für die Genießbarkeit bzw. gesundheitliche Unbedenklichkeit der Ware entbunden werden. Eine Haftung der Lebensmittelspendenden, auch für Fahrlässigkeit jeden Grades, ist ausgeschlossen. Mir ist bekannt, dass der foodsharing e.V. selbst nicht Vertragspartner der Lebensmittelspendenden wird und keine Haftung übernimmt. Somit hafte ich für die abgeholten und verteilten Lebensmittel und bin selber dafür verantwortlich, mich ggf. um eine Haftpflicht- und Unfallversicherung zu kümmern.\n\nIch verpflichte mich, die Lebensmittelspenden vor der Weitergabe nach bestem Wissen und Gewissen auf ihre Unbedenklichkeit zu überprüfen. Die Verhaltensanweisungen im [Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel) des foodsharing e.V., insbesondere zu verderblichen Lebensmitteln, habe ich zur Kenntnis genommen und werde sie befolgen. Ich trage damit als Foodsaver die volle Verantwortung für die Lebensmittel, die ich abhole, und muss selbst entscheiden, ob diese für den Verzehr bzw. die Weitergabe noch geeignet sind.\n\nIch verzichte gegenüber dem [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand), den Betreibenden von [foodsharing.de](https://foodsharing.de) sowie gegenüber den jeweiligen Lebensmittelspendenden auf die Geltendmachung jeglichen Schadenersatzes, auch deren Lieferant\\*innen gegenüber.\n\n## <a id=\"rechtsvereinbarung-fuer-betriebsverantwortliche-r\"></a>Rechtsvereinbarung für [Betriebsverantwortliche\\*r](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r)\n\n*Zusatzrechtsvereinbarung für Betriebsverantwortliche bei foodsharing:*\n\nZusätzlich bin ich als Betriebsverantwortliche\\*r dafür verantwortlich, nur Betriebe anzusprechen, bei denen ich auch garantieren kann, dass genügend Foodsaver bereit stehen, die notfalls auch 7 Tage die Woche ab Erstkontakt Lebensmittel abholen können.\n\nBevor ich als Betriebsverantwortliche\\*r aktiv werde, verpflichte ich mich, mit den Botschafter\\*innen meiner Region in Kontakt zu treten und erst nach Absprache mit ihnen neue Kooperationspartner\\*innen zu suchen. Dabei versichere ich, nur inhaber\\*innengeführte Betriebe anzusprechen und für alle Betriebe mit mehr als 3 Filialen das Betriebskettenteam zu kontaktieren.\n\nNoch bevor ich einen Betrieb anspreche, überprüfe ich, ob der Betrieb nicht bereits eingetragen wurde. Nach jedem Kontakt zum Betrieb trage ich alle relevanten Informationen noch am selben Tag bei foodsharing.de ein bzw. aktualisiere alle in Erfahrung gebrachten Informationen, die bei der Betriebseintragung abgefragt werden.\n\nAlle Betriebe, die von mir im Rahmen von foodsharing angelegt und angesprochen werden, sind Teil des foodsharing-Netzwerkes. Wird mir aufgrund von Verstößen gegen die foodsharing-Regeln die Betriebsverantwortlichkeit entzogen, dann übernimmt bis zur Ernennung eines neuen Betriebsverantwortlichen der/die zuständige Botschafter\\*in die Betriebsverantwortlichkeit. Das Gleiche gilt nach freiwilligem Rückzug als Betriebsverantwortliche\\*r. Es ist nicht gestattet, nach freiwilligem oder unfreiwilligem Verlassen des Betriebes weiterhin Lebensmittel in diesem Betrieb abzuholen. Des Weiteren ist es untersagt, die Kooperation zwischen foodsharing und einem Betrieb ohne Einverständnis und Absprache mit den Bundeslandbotschafter\\*innen bzw. des Orgateams zu beenden.\n\nIch habe dafür Sorge zu tragen, dass es bei allen Betrieben, bei denen ich die Betriebsverantwortlichkeit innehabe, eine gute Stimmung gibt und sich alle Beteiligten - Foodsaver sowie Angestellten - wohlfühlen. Damit Problemen vorgebeugt wird bzw. entstandene Probleme schnell gelöst werden, werde ich ausreichend Kommunikation betreiben.\n\nIch verpflichte mich, jeden Verstoß gegen die Verhaltensregeln zu überprüfen und ggf. Konsequenzen zu ziehen, zu schlichten und einzelne Foodsaver, nach Absprache mit den zugehörigen Botschafter\\*innen, aus dem Team zu nehmen.\n\nAußerdem werde ich alle wichtigen Informationen zum Status der Kooperation sowie Änderungen umgehend auf die Pinnwand schreiben bzw. unter “Betrieb” einarbeiten.\n\nZusätzlich erkläre ich mich als Betriebsverantwortliche\\*r bereit, foodsharing immer verantwortungsbewusst und motiviert zu repräsentieren. Ich bin mir bewusst, dass ich im Hinblick auf die Foodsaver, Betriebsverantwortlichen und Botschafter\\*innenkolleg\\*innen eine Vorbildfunktion innehabe, die mir Freude bereitet und die ich ernstnehme. Das [Wiki-Dokument](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r) bezüglich meiner Aufgaben und anderen Verpflichtungen als Betriebsverantwortliche\\*r habe ich gelesen, verinnerlicht und stehe dahinter.\n\n---\n\n*Artikel von*: [AG Recht](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Recht) (*[Kontakt](mailto:recht@foodsharing.network)*)\\\n*Letzte Überarbeitung am 07.01.2015*\n\n---\n\n*Original im foodsharing-Wiki: [Rechtsvereinbarung](https://wiki.foodsharing.network/wiki/Rechtsvereinbarung)*\n"}

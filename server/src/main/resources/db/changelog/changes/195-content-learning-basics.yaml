              - column: {name: body, value: "*Stand: 08.11.2026 - 00:00 Uhr*\n\nBi foodsharing git s verschideni Rolle und Ufgabe. Das faht a mit de Foodsharer:innen (das sind mir alli), und es git wiiteri Rolle, wo chli meh Verantwortig mit sich bringed und für die mer drum au wiiteri Vorussetzige erfülle mues. Si sind i dem Artikel zämegstellt.\n\n### <a id=\"allgemeines-fuer-alle-rollen\"></a>Allgemeins für alli Rolle\n\n1. Mänsche überchömed bi foodsharing uf Aatrag die folgende Status und demit d Möglichkeit, die entsprächende Rolle uszüebe, wänn si die jewiils aagäbne Vorussetzige erfülled.\n2. Wänn e Vorussetzig wegfallt, wird de entsprächend Status entzoge; wänn d Vorussetzig wieder erfüllt isch, überchunnt de:die Foodsaver:in oder Foodsharer:in de Status zrugg.\n\n### <a id=\"voraussetzungen-fuer-foodsharer-innen\"></a>Vorussetzige für Foodsharer:innen\n\n- mindestens 18 Jahr alt\n- Account uf de foodsharing-Plattform\n- Akzeptierig vo de foodsharing-Grundlage\n- Zuestimmig zur Dateschutzerklärig\n- kei roti Charte\n\n### <a id=\"voraussetzungen-fuer-unverifizierte-foodsaver-innen\"></a>Vorussetzige für unverifizierti Foodsaver:innen\n\n- Foodsharer:in\n- bestandes Foodsaver:innen-Quiz\n- Bestätigung vo de Rächtsvereibarig (Dütschland, Österriich) für Foodsaver:innen\n- kei gälb-roti Charte, wo d Duur no nöd abgloffe isch\n\n### <a id=\"voraussetzungen-fuer-verifizierte-foodsaver-innen\"></a>Vorussetzige für verifizierti Foodsaver:innen\n\n- unverifizierti:r Foodsharer:in\n- korrekti Date im Profil: Name, Adrässe, Geburtsdatum, repräsentativs Foto\n- mindestens 3 erfolgriich absolvierti Iifüehrigsabholige innert 6 Mönet\n- kei gälbi Charte, wo d Duur no nöd abgloffe isch\n\n### <a id=\"voraussetzungen-fuer-betriebsverantwortliche\"></a>Vorussetzige für Betriebsverantwortlichi\n\n- verifizierti:r Foodsaver:in\n- bestandes Quiz für Betriebsverantwortlichi\n- Zuestimmig zur Dateschutzbelehrig (Ergänzig zur Dateschutzerklärig)\n- Zuestimmig zur Rächtsvereibarig für Betriebsverantwortlichi (Ergänzig zur Rächtsvereibarig)\n\n### <a id=\"voraussetzungen-fuer-botschafter-innen\"></a>Vorussetzige für Botschafter:innen\n\n- verifizierti:r Foodsaver:in sit mindestens 6 Mönet\n- kei Konsequänze für relevanti Regelverletzige, wo no nöd tilgigsfähig sind\n- Betriebsverantwortlichi:r\n- bestandes Quiz für Botschafter:innen\n- mindestens 30 Abholige bi foodsharing\n- demokratisch gwählt im Bezirk nach de „Festlegige für Botschafter:innen-Wahle” bi foodsharing\n- es Begrüessigsgspräch mit em Botschafter:innen-Begrüessigsteam\n- I de erschte 2 Jahr nach de Gründig vomene Bezirk falled für d Botschafter:innen als Vorussetzig d Aazahl Abholige, d Duur als verifizierti:r Foodsaver:in und d Wahl weg.\n\n---\n\n*Artikel vo*: [AG Wiki](https://wiki.foodsharing.network/wiki/Gruppe_Wiki) (*[Kontakt](mailto:wiki@foodsharing.network)*)\\\n*Letschti Überarbeitig am 08.11.2026*\n\n---\n\n*Original im foodsharing-Wiki: [Voraussetzungen für Rollen in foodsharing](https://wiki.foodsharing.network/wiki/Voraussetzungen_f%C3%BCr_Rollen_in_foodsharing)*\n"}

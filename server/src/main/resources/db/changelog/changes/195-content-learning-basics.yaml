              - column: {name: title, value: "Principles"}
              - column: {name: body, value: "*Valid from 09.08.2017*\n\nAll legal entities, individuals, foodsharing local groups and foodsharing local associations acting under the name foodsharing commit to keeping the following principles in their work for foodsharing:\n\n## <a id=\"grundsatz-1-organisation-fuer-mehr-lebensmittelwertschaetzung-und-nachhaltige-ernaehrungssysteme\"></a>Principle 1 - An organisation for more appreciation of food and for sustainable food systems\n\nfoodsharing is an organisation for more appreciation of food and considers a drastic reduction of food waste an ethical, ecological and climate-policy necessity. We therefore stand up for a resource-saving, future-proof food system and for a comprehensive reduction of greenhouse gas emissions. This means:\n\n1. We raise awareness of the causes of food waste and other wasteful practices, and of possible solutions. To do so, we do educational work, network with important actors from, for example, business and civil society, and bring our topics into politics.\n2. We create structures and spaces in which the topics named in this principle are discussed. Through our work we save resources and greenhouse gases and at the same time build knowledge, networks and social relationships.\n3. We save food and other goods and make sure that nothing that is still good ends up in the bin. Where possible, foodsharing supports organisations that pursue goals similar to those of foodsharing, and their events, for example with saved food.\n\n## <a id=\"grundsatz-2-bekaempfung-der-lebensmittelverschwendung\"></a>Principle 2 - Fighting food waste\n\nfoodsharing primarily pursues a claim of sustainability and therefore does not focus on who consumes the food or goods, but on keeping them out of the bin. That is why foodsharing saves surplus food and other surplus goods from being thrown away and distributes them to people, groups and institutions both in need and not in need. Active members (foodsavers) may use part of the saved goods for their own consumption. Beyond food alone, and where relevant and necessary, we also save other goods from the bin: in view of an impending climate crisis, all resources should be handled with care and not wasted.\n\n### <a id=\"das-bedeutet\"></a>This means:\n\n1. Food and other surplus goods may only be passed on free of charge, without anything in return.\n2. The hygiene rules drawn up by the hygiene working group and the code of conduct must be followed.\n3. Using saved food for foodsharing events (e.g. educational work, chopping parties and public relations campaigns) has priority over other pickups.\n\n## <a id=\"grundsatz-3-umgang-mit-geld\"></a>Principle 3 - Handling money\n\nThe work of foodsharing is in principle voluntary. Where possible and necessary, it can be supported by staff financed and funded in different ways. When handling money, the principle is: \"As little as possible, as much as necessary\".\n\nThe foodsharing e.V. and all local groups are subject to the principle of transparency.\n\n### <a id=\"das-bedeutet-sowohl-fuer-den-foodsharing-e-v-als-auch-fuer-die-bezirksvereine-und-ortsgruppen\"></a>This means for the foodsharing e.V. as well as for the district associations and local groups:\n\n1. We act selflessly. We do not pursue commercial purposes of our own.\n2. No person may be favoured by expenses that are alien to the purpose of foodsharing or by disproportionately high remuneration.\n3. Our funds come primarily from voluntary contributions and donations. Public grants are also possible to fulfil the purposes of the association.\n4. When accepting donations, care must be taken that the idea and the social mission of foodsharing are not harmed by the donor. No money may be accepted for saved food. In case of doubt, the national foodsharing e.V. decides what is permitted and what is not.\n5. Membership without a membership fee must be possible in every foodsharing association without any exception.\n6. Necessary expenses of office holders for fulfilling their association duties can be reimbursed. In addition, activities can be paid within the limits of volunteer allowances.\n7. Paid positions can be created for educational work and for organising the national foodsharing structure.\n8. Financial and activity reports should be transparently available online every year.\n9. Access to the foodsharing platform is and remains free of charge.\n\n## <a id=\"grundsatz-4-parteipolitik-und-toleranz\"></a>Principle 4 - Party politics and tolerance\n\nfoodsharing works independently of political parties and religious affiliation.\n\nAny discrimination, such as racism or sexism, is not tolerated, nor are harassment, insults, abuse, exclusion, defamation and fascist statements. foodsharing therefore does not cooperate with parties, organisations or individuals who hold such or other discriminatory positions.\n\n## <a id=\"grundsatz-5-kooperation-und-zusammenarbeit\"></a>Principle 5 - Cooperation and working together\n\nThe work of the foodsharing local groups is mostly local. The local groups respect the district boundaries and work together closely and well, without competing with each other.\n\n### <a id=\"das-bedeutet-2\"></a>This means:\n\n1. Transparent and fair communication is the basis of our work. We build structures and decision-making processes on it.\n2. In case of disagreements in regional foodsharing work, e.g. when new associations are founded or with existing local groups, an amicable solution on site should be sought first.\n3. The local groups exchange information and experience regionally and nationally.\n4. All local groups help each other with the aim of supporting local foodsharing work effectively.\n\n## <a id=\"grundsatz-6-foodsharing-namensnutzung\"></a>Principle 6 - Use of the foodsharing name\n\nThe word and figurative mark 'foodsharing' as well as 'foodsharing Akademie' are legally protected as registered trademarks by the foodsharing e.V.\n\n### <a id=\"das-bedeutet-3\"></a>This means:\n\n1. The name of a local group is in principle the name of the place following the name \"foodsharing\" and, if applicable, e.V., e.g. \"foodsharing München e.V.\"\n2. All newly founded local groups and their names require the express consent of the foodsharing e.V.\n3. The name \"foodsharing\" must be applied for in writing at the foodsharing e.V. and is only given to local groups for specific foodsharing projects.\n4. Every local group must adopt the foodsharing logo in shape and colour according to the design manual. The logo can be requested from the working group \"Materialien - Grafikdateien\" (materials - graphic files).\n\n## <a id=\"grundsatz-7-umgang-mit-konflikten\"></a>Principle 7 - Dealing with conflicts\n\nDisputes among foodsavers, among local groups and in the network are not carried out in public.\n\n### <a id=\"das-bedeutet-4\"></a>This means:\n\n1. Disputes and disagreements must first be raised and settled internally. It is important to stay as factual and polite as possible, to keep a cool head and to answer in a considered way.\n2. If conflicts can be solved neither by a conversation nor by mediation, the local reporting group, arbitration board, chain conflict resolution (KKL) or the national conflict resolution office (ÜKBS) decides. If these structures fail, are corrupt and/or the foodsharing e.V. is directly affected (e.g. through damage to its reputation in the press, lawsuits, liability questions or in serious cases, e.g. sexual assault, right-wing extremism), the foodsharing e.V. decides itself.\n\n## <a id=\"grundsatz-8-einhaltung-der-grundsaetze\"></a>Principle 8 - Keeping the principles\n\nThe foodsharing e.V. makes sure the foodsharing principles are kept. If the foodsharing principles are not kept, the foodsharing e.V. can initiate an exclusion from the foodsharing platform.\n\nThere is no right to access the foodsharing platform.\n\nIn the long run, these tasks are to be taken over by a federal association to be founded by the local associations.\n\n---\n\n*Article by*: [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Contact](mailto:vorstand@foodsharing.network)*)\\\n*Last revised on 10.08.2026*\n\n---\n\n*Original in the foodsharing wiki: [Grundsätze](https://wiki.foodsharing.network/wiki/Grunds%C3%A4tze)*\n"}

              - column: {name: title, value: "Regole d’igiene"}
              - column: {name: body, value: "*In vigore dal 13.12.2024*\\\n*[Modifiche](https://drive.google.com/file/d/1XtVCJDSJlYDkLY2lctcN7s1zybYO8FhT) rispetto alla versione precedente (pdf)*\n\n**Spiegazioni dettagliate e guide per la pratica**\\\nPer il lavoro pratico come foodsaver ci sono alcuni altri testi con consigli e informazioni.\n\n- *[Erläuterungen zu den Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen)* (spiegazioni delle regole d’igiene) - spiegazioni di ogni singola regola, perché è importante per foodsharing e che cosa significa concretamente.\n- *[Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel)* (guida all’igiene degli alimenti) - una serie di articoli sul trattamento degli alimenti salvati\n\n*Sviluppo delle regole d’igiene*\\\nLe regole d’igiene vengono sviluppate dall’*AG Hygiene* (gruppo di lavoro Igiene). Proposte e idee possono essere inviate in qualsiasi momento al gruppo di lavoro Igiene (possibilmente per e-mail a [hygiene@foodsharing.network](mailto:hygiene@foodsharing.network)).\\\nIl gruppo di lavoro esamina tutte le idee e le proposte ricevute; una modifica delle regole in vigore è prevista una volta all’anno – di solito a novembre.\\\nTutte le persone interessate sono cordialmente invitate a [collaborare nel gruppo di lavoro](https://foodsharing.de/?page=bezirk&bid=1686).\n\n### <a id=\"praeambel\"></a>Preambolo\n\nLe regole d’igiene stabiliscono requisiti minimi per foodsharing e tutti i foodsaver. Da un lato devono garantire il rispetto delle norme igieniche di legge nel lavoro pratico con gli alimenti. Dall’altro devono proteggere dagli errori e dare indicazioni su come trattare gli alimenti in modo che possano essere consumati senza rischi.\\\nPuò essere sensato rendere alcune regole un po’ più severe per singole situazioni, negozi o distretti, se le condizioni locali lo richiedono.\n\n***Ogni distretto può quindi rendere più severe le regole per la propria area; gli adattamenti non devono però contraddire le regole d’igiene qui riportate.***\n\n### <a id=\"a-taetigkeitsverbote-beim-umgang-mit-lebensmitteln-42-43-ifsg\"></a>A) Divieti di attività nel trattamento degli alimenti (§§42, 43 IfSG)\n\n1\\) Vestiti, capelli e mani puliti sono il presupposto per trattare gli alimenti.\n\n2\\) In presenza dei seguenti sintomi si è tenuti a consultare un medico prima di trattare alimenti delicati non confezionati:\n\n- diarrea, forte nausea, vomito, forte tosse\n- malattie contagiose, in particolare colera, tifo, paratifo, dissenteria, salmonellosi, EHEC, epatite A o E:\n- malattie della pelle e ferite aperte infiammate, purulente o essudanti\n- febbre oltre 38,5°C\n\nIl successivo trattamento di alimenti è consentito solo se il medico rilascia un certificato scritto di idoneità.\\\n[Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#A.29_T.C3.A4tigkeitsverbote_beim_Umgang_mit_Lebensmitteln_.28.C2.A7.C2.A742.2C_43_IfSG.29)\n\n### <a id=\"b-umgang-mit-lebensmitteln\"></a>B) Trattamento degli alimenti\n\n#### <a id=\"1-direkter-umgang-transport-und-lagerung\"></a>1) Contatto diretto, trasporto e conservazione\n\n- **a)** *Prodotti da forno non confezionati*: pinza per pasticceria, guanti (possibilmente guanti riutilizzabili lavabili) o mani lavate accuratamente sono obbligatori.\n\n  Per tutti gli altri alimenti i guanti di regola non sono necessari, a meno che siano raccomandati per motivi particolari (o da disposizioni delle autorità).\n\n  Per torte e dolci vanno usati possibilmente contenitori rigidi. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1a.29_-_Unverpackte_Backwaren)\n- **b)** *Prodotti refrigerati*: la catena del freddo va rispettata, se possibile: [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - *Trasporto* in una borsa o box frigo con siberini, con al massimo 20 minuti di interruzione, senza esposizione al sole o al calore\n  - *Conservazione* senza interruzione in un frigorifero o (solo per poco tempo) in una borsa o box frigo con siberini\n- **c)** Sono *prodotti refrigerati*: [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - alimenti che secondo la confezione vanno conservati tra +2 e +8°C\n  - insalata di pasta e di patate, piatti preparati con olio/grasso\n  - torte con ripieno non cotto, torte alla crema e alla panna\n- **d)** Gli *alimenti parzialmente marci* vanno imballati separatamente dagli altri alimenti. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1d.29_-_Angefaulte_Lebensmittel)\n- **e)** Gli alimenti non confezionati possono essere trasportati e conservati solo in *imballaggi puliti* e *idonei agli alimenti*. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_1._Absatz_-_Lebensmittelechte_.28und_saubere.29_Verpackungen)\n\n  Gli imballaggi idonei agli alimenti si riconoscono\n  - dalla dicitura «per alimenti» o dal simbolo bicchiere e forchetta\n  - dalle etichette originali che dimostrano l’uso originario per alimenti\n\n  [Fonti di approvvigionamento di imballaggi idonei agli alimenti](https://docs.google.com/spreadsheets/d/1LpZBgtloqpNjDI9X3-7v91wSae61WqxbBAPyc7KrqoQ)\n\n  Per gli *alimenti caldi* possono essere usati solo contenitori adatti alla temperatura corrispondente.\n\n  *Eccezione*: [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_Ausnahme_-_nicht-lebensmittelechte_Verpackungen)\n  - Gli alimenti consegnati da un negozio in un imballaggio non idoneo agli alimenti o sporco andrebbero possibilmente reimballati già sul luogo del ritiro. Possono anche, se del caso, essere giudicati non commestibili al ritiro e lasciati lì.\n\n#### <a id=\"2-weitergabe-allgemein\"></a>2) Cessione in generale\n\nLe seguenti regole valgono solo per la ***cessione*** di alimenti salvati.\\\nI foodsaver possono usare personalmente, senza limitazioni e a proprio rischio, tutti gli alimenti salvati e anche altri beni salvati, oppure usarli come cibo per animali.\\\n[Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_Weitergabe_allgemein)\n\n- **a)** I foodsaver sono *responsabili* degli alimenti che cedono. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2a.29_-_Verantwortlichkeit_der_Foodsaver)\n- **b)** Un *diritto al risarcimento* del destinatario o della destinataria per danni conseguenti sussiste solo in caso di colpa grave o dolo. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl%C3%A4ssigkeit_.28und_Vorsatz.29)\n- **c)** Per escludere la *colpa grave*: [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl.C3.A4ssigkeit_.28und_Vorsatz.29)\n  - gli alimenti devono essere trasportati e conservati correttamente (vedi sezione B1) )\n  - gli alimenti vanno scartati dopo la data di scadenza\n  - prima della cessione ogni singolo pezzo va *controllato* per verificarne la commestibilità:\n    - Cedere solo ciò che si mangerebbe ancora anche personalmente!\n    - ***Test occhio-naso-bocca***: controllare aspetto, odore ed eventualmente sapore (per quanto possibile senza aprire la confezione)!\n- **d)** È *vietato* cedere alimenti [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2d.29_-_Verbotene_Lebensmittel)\n  - con muffa o macchie nere\n  - dopo la data di scadenza\n  - con data di scadenza e confezione più interna aperta\n  - con termine minimo di conservazione e confezione più interna aperta, se il momento dell’apertura è sconosciuto o lontano nel tempo\n  - con confezioni sottovuoto gonfie\n- **e)** È inoltre vietato cedere *medicinali*. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2e.29_-_Arzneimittel)\n- **f)** Il *cibo per animali* può essere ceduto. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2f.29_-_Tierfutter)\n- **g)** Gli *articoli non commestibili* (ad es. prodotti per la pulizia e la cura, cosmetici, libri, vestiti) devono essere ceduti così chiaramente separati da alimenti e mangimi da escludere ogni rischio di confusione. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2g.29_-_Nicht-Essbares)\n\n### <a id=\"c-zusaetzliche-regeln-fuer-verschiedene-stufen-der-weitergabe\"></a>C) Regole aggiuntive per i diversi livelli di cessione\n\nGli alimenti salvati devono essere suddivisi in 4 livelli di cessione:\n\n- Livello 1: cessione non personale\n- Livello 2: cessione personale\n- Livello 3: consumo proprio o cibo per animali\n- Livello 4: smaltimento.\n\nA seconda del livello valgono altre regole in aggiunta a quelle della sezione B). [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Teil_C.29_-_Stufen_der_Weitergabe)\n\n#### <a id=\"stufe-1-nicht-persoenliche-weitergabe\"></a>Livello 1) Cessione non personale\n\nsenza contatto diretto con i destinatari (ad es. Fairteiler, altre organizzazioni) [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#1.29_-_Nicht-pers%C3%B6nliche_Weitergabe)\n\n- **a)** È *vietato* cedere\n  - carne macinata, pesce crudo, prodotti a base di latte crudo non riscaldato\n  - piatti appena preparati con uova crude, uova liquide\n  - creme, budini, tiramisù, maionese (se fatti in casa con uova o latte)\n  - uova crude dopo il termine minimo di conservazione\n  - funghi raccolti personalmente\n  - bevande alcoliche, alimenti contenenti alcol o THC, energy drink\n  - alimenti con muffa o parti marce\n  - alimenti da conservare al freddo la cui catena del freddo è stata interrotta\n  - piatti preparati, se i clienti hanno potuto avere un contatto diretto con gli alimenti\n  - piatti preparati offerti caldi\n  - piatti preparati che richiedono refrigerazione\n  - alimenti con data di scadenza o termine minimo di conservazione la cui confezione (più interna) è aperta\n  - alimenti consegnati o conservati in imballaggi non idonei agli alimenti o sporchi\n\n  [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1a.29_-_Verbotene_Lebensmittel)\n- **b)** Gli alimenti *con terra* non devono essere conservati sopra altri alimenti. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1b.29_-_Erdbehaftete_Lebensmittel)\n- **c)** I piatti *preparati* devono essere coperti o in un contenitore chiuso. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **d)** *Elenco degli ingredienti*: sui piatti fatti in casa vanno scritti tutti gli ingredienti e la data di preparazione. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **e)** Gli alimenti *travasati* devono essere etichettati con l’elenco completo degli ingredienti, la data del travaso ed eventualmente il termine minimo di conservazione. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n\n#### <a id=\"stufe-2-persoenliche-weitergabe\"></a>Livello 2) Cessione personale\n\ncon la possibilità di parlare con i destinatari [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_-_Pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Vietato*: [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2a.29_-_Verbotene_Lebensmittel)\n  - alimenti commestibili ormai solo *con riserva e con cautela* o *molto poco invitanti* (ad es. frutta/verdura con parti molto molli, metà marrone, pane strappato malamente o duro e secco)\n  - alimenti la cui *catena del freddo* è stata interrotta a lungo (a seconda dell’alimento e del tempo – regola pratica: il tragitto diretto dal negozio al frigorifero va bene)\n- **b)** *Decisione secondo la persona caso per caso*: gli alimenti possono essere ceduti solo se si *ritiene* i destinatari capaci di trattare e valutare gli alimenti in modo responsabile (ad es. per alcol, pesce o frutta/verdura parzialmente marcia). [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2b.29_-_Entscheidung_im_Einzelfall)\n- **c)** *Indicazioni orali*: se del caso, i destinatari andrebbero avvertiti [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2c.29_-_M%C3%BCndliche_Hinweise)\n  - che gli alimenti vanno consumati *rapidamente*\n  - che devono *controllare* ancora una volta gli alimenti prima del consumo\n  - se la *catena del freddo* non ha potuto essere rispettata\n\n#### <a id=\"stufe-3-eigenkonsum-oder-tierfutter\"></a>Livello 3) Consumo proprio o cibo per animali\n\n- **a)** I foodsaver possono consumare personalmente gli alimenti o cederli come cibo per animali. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n- **b)** I foodsaver possono usare personalmente altre cose salvate oltre ad alimenti e mangimi, ma non cederle a nome di foodsharing. [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n\n#### <a id=\"stufe-4-entsorgung\"></a>Livello 4) Smaltimento\n\nGli alimenti che non rientrano nelle categorie 1), 2) o 3) devono essere smaltiti correttamente (bidone, compostaggio ecc.). [Spiegazione](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#4.29_-_Entsorgung)\n\n---\n\n*Articolo di*: [AG Hygiene - Austausch und (Fach)Wissen](https://foodsharing.de/?page=bezirk&bid=1686) (*[Contatto](mailto:hygiene@foodsharing.network)*)\\\n*Ultima revisione il 13.12.2024*\n\n---\n\n*Originale nel wiki di foodsharing: [Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln)*\n"}

              - column: {name: body, value: "## <a id=\"lebensmittelverschwendung\"></a>Spreco alimentare\n\n- Ogni anno nel mondo vengono prodotti circa 4 miliardi di tonnellate di alimenti. Di questi, oltre 1,3 miliardi di tonnellate vengono sprecati. [1]\n- Nei paesi industrializzati circa il 40% degli alimenti sprecati è perfettamente commestibile. [1]\n- Siamo tutti responsabili del fatto che commercianti, grossisti, produttori e ristoratori buttino ogni anno milioni di tonnellate di alimenti.\n- I 2/3 dello spreco alimentare complessivo potrebbero essere evitati grazie all’impegno di aziende alimentari, foodsaver e privati.\n- Solo insieme possiamo fermare la follia della società dell’abbondanza, se ognuno fa la sua parte e agisce in modo responsabile.\n\n## <a id=\"ausgangssituation\"></a>Situazione di partenza\n\n- Ogni giorno si sprecano alimenti in misura estrema, nonostante circa 57.000 persone muoiano ancora di fame ogni giorno. [2]\n- Nei paesi industrializzati una parte particolarmente grande di questo spreco avviene a livello dei consumatori: oltre 150 kg per persona all’anno. [3]\n- Mele ammaccate, cetrioli troppo storti, zucchine troppo piccole e perfino prodotti troppo cari o troppo economici finiscono qui molto in fretta nei rifiuti dei commercianti, anche se nella stragrande maggioranza dei casi sarebbero perfettamente commestibili.\n- Neanche le economie domestiche sono al riparo dallo spreco: confezioni troppo grandi, troppi prodotti, prezzi troppo bassi e spesso purtroppo semplice sventatezza portano anche in casa a molti rifiuti alimentari evitabili.\n\n## <a id=\"ansatzpunkte\"></a>Punti di intervento\n\nPoiché lo spreco avviene in molti punti diversi del ciclo di produzione e consumo, possiamo anche combatterlo in molti punti diversi.\\\nInterveniamo quindi su tre fronti:\n\n1. *Presso i commercianti e le [aziende](https://wiki.foodsharing.network/wiki/Betrieb) alimentari*: sulla base di collaborazioni, gli alimenti vengono salvati dall’essere buttati, ritirati e ridistribuiti. D’altra parte vogliamo sensibilizzare i nostri partner sul fatto che anche una pianificazione migliore o più prudente degli acquisti e delle scorte, ma anche ad esempio offerte scontate per alimenti non più del tutto perfetti, possono ridurre lo spreco alimentare. Come effetto collaterale, il volume dei bidoni dei rifiuti indifferenziati e organici può diminuire fino al 70%. [4]\n2. *Presso i consumatori nella sfera privata*: su foodsharing.de mettiamo a disposizione l’infrastruttura digitale per tutte le persone che vogliono salvare o condividere cibo. Vorremmo che sempre più persone usassero questa offerta, ad esempio per distribuire i propri alimenti avanzati con un cesto alimentare virtuale prima di partire per le vacanze. Inoltre vogliamo richiamare l’attenzione sul tema in generale, diffondere conoscenze e idee per un rapporto più sostenibile con gli alimenti con informazioni fondate e offerte educative, e stimolare in generale una maggiore attenzione verso il cibo.\n3. *Presso i produttori*: vogliamo motivare le persone e sostenere il loro impegno affinché salvino «frutta e verdura di scarto» dal marcire o deteriorarsi. Ad esempio, nel periodo del raccolto organizziamo azioni per raccogliere dai campi i prodotti che non corrispondono ai rigidi standard estetici dell’industria agricola e dei suoi acquirenti e che altrimenti verrebbero semplicemente lasciati lì. Si possono così salvare enormi quantità di carote storte, cetrioli rotti o mele ammaccate.\n\n## <a id=\"selbstverstaendnis\"></a>Identità\n\n- foodsharing è un [movimento ambientalista](/learn/principles). Il nostro obiettivo è preservare le risorse naturali del nostro pianeta. Sprecare alimenti significa sprecare le risorse impiegate per produrli (acqua, energia, superfici agricole e di stoccaggio, tempo di lavoro, materie prime ad esempio per gli imballaggi).\n\n- foodsharing non è un’organizzazione sociale (*più precisamente: caritativa*). Non vogliamo arrogarci il diritto di decidere quali persone siano bisognose o quali progetti siano più meritevoli di sostegno di altri. Vogliamo rendere gli alimenti accessibili [senza condizioni](/learn/principles) a tutte le persone e promuovere così il rispetto verso di essi.\n\n- Noi di foodsharing regaliamo alimenti in eccedenza di aziende e privati. Gli alimenti vengono sempre ceduti gratuitamente e mai venduti o usati come merce di scambio. Naturalmente i foodsaver possono consumare personalmente le merci salvate.\n\n- foodsharing lavora [indipendentemente](/learn/principles) dai partiti politici e dalle confessioni. foodsharing distribuisce alimenti a tutte le persone. Non è tollerata alcuna forma di esclusione o discriminazione.\n\n- Non siamo in concorrenza con [altre iniziative](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln) che si impegnano contro lo spreco alimentare, come ad esempio le Tafeln (banche alimentari), ma collaboriamo con loro. Accogliamo con favore e sosteniamo ogni impegno contro lo spreco alimentare.\n\n  Lasciamo volentieri la precedenza a tutte le organizzazioni caritative nel distribuire alimenti salvati ai bisognosi. foodsharing deve essere solo l’«ultimo baluardo prima della spazzatura» per tutti gli alimenti che altre organizzazioni non possono ridistribuire.\n\n- Insieme alle migliaia di foodsaver volontari in tutta la Germania, foodsharing vuole vivere una nuova cultura del rispetto per il cibo, per dare agli alimenti, insieme ai negozi partner, il valore che meritano.\n\n- L’obiettivo a lungo termine di foodsharing è rendersi superfluo ponendo fine allo spreco alimentare sistematico su larga scala.\n\n- Per ulteriori informazioni su questo tema vi raccomandiamo di cuore il film «Taste the Waste» del nostro membro fondatore Valentin Thurn.\n\n## <a id=\"foodsharing\"></a>foodsharing\n\nfoodsharing è un’iniziativa per\n\n- organizzare [foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) che salvano alimenti (e anche altri prodotti non commestibili) da aziende alimentari di ogni tipo\n- organizzare [foodsharer](https://wiki.foodsharing.network/wiki/Foodsharer) che vogliono cedere alimenti gratuitamente\n- organizzare eventi sul tema, far progredire l’internazionalizzazione di foodsharing e molto altro\n\n- Il [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) gestisce la piattaforma online, soprattutto con volontari molto impegnati non retribuiti che si occupano di compiti centrali, ad es. [programmazione](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform), [relazioni centrali con la stampa](https://wiki.foodsharing.network/wiki/Pressetext), questioni legali, regole centrali, coordinamento dei [gruppi di lavoro centrali](https://foodsharing.de/?page=groups), [grafica](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Materialien_-_Grafikdateien), coordinamento dei distretti e dei [Länder](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Bundesland-Botschafter.2Ainnen), [incontri nazionali e internazionali, internazionalizzazione e traduzione](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#International_-_foodsharing_International), sostenuti solo da pochi minijob e posti a tempo parziale.\n\n- Inoltre più di 100 altri foodsaver molto attivi si impegnano in altri ambiti.\n\n- Il salvataggio di alimenti è organizzato in distretti che comprendono per lo più una o più città o un circondario. Il coordinamento in un distretto è nelle mani degli [ambasciatori e ambasciatrici](https://wiki.foodsharing.network/wiki/Botschafter*in) foodsharing; le collaborazioni con i singoli negozi sono seguite dai [responsabili dei negozi](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r).\n\n- Cerchiamo di crescere in modo organico e attento all’affidabilità: non si tratta di concludere il più rapidamente possibile il maggior numero di collaborazioni e di accogliere più persone possibile. Preferiamo prenderci il tempo per fare il nostro lavoro bene e con cura, prima di fare il passo successivo.\n\n- Tutti i foodsaver sono salvatori e salvatrici di alimenti [formati con cura](https://wiki.foodsharing.network/wiki/Foodsaver#Wie_man_Foodsaver_wird) e affidabili, il cui lavoro è guidato e tutelato dalle [regole di comportamento](/learn/code-of-conduct) interne, dalle [regole d’igiene](/learn/hygiene-rules) e dall’[accordo legale](/learn/legal-agreement). Possono identificarsi in qualsiasi momento con la loro [tessera foodsaver](https://wiki.foodsharing.network/wiki/Ausweis).\n\n- Tutti i foodsaver devono accettare l’esclusione di responsabilità con l’[accordo legale](/learn/legal-agreement) prima di poter ritirare alimenti. È stata redatta da due studi legali in modo che tutte le aziende alimentari che cedono alimenti siano legalmente liberate da qualsiasi responsabilità, anche per negligenza. Ogni foodsaver si assume personalmente la responsabilità degli alimenti salvati e della loro cessione.\n\n## <a id=\"die-foodsharing-plattform\"></a>La piattaforma foodsharing\n\n- foodsharing.de è [gratuito](https://wiki.foodsharing.network/wiki/Umgang_mit_Geld_bei_foodsharing), non commerciale e senza pubblicità, e rimarrà tale.\n\n- La piattaforma è stata programmata da volontari e viene continuamente sviluppata dai molti volontari del [tech team](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform).\n\n- Dall’estate 2012 si sono già registrate oltre 300.000 persone volontarie che vogliono fare qualcosa contro lo spreco alimentare. Più di 70.000 di loro salvano già attivamente alimenti in circa 7000 negozi.\n\nGrazie ai nostri partner ecologici [manitu.de](https://manitu.de) (web hosting, costi del traffico) e [Greensta.de](https://Greensta.de) (account e-mail), che ci sostengono gratuitamente, i server della piattaforma foodsharing funzionano al 100% con energia idroelettrica.\n\n## <a id=\"verweise\"></a>Riferimenti\n\n[1] n.tv, 2011. Verschwendung ist schockierend. [Online]. http://www.n-tv.de/wissen/Verschwendung-ist-schockierend-article4210226.html. [Consultato il 09.07.2013].\n\n[2] ver.di publik, 2013. Der Hunger ist von Menschen gemacht. [*Non più online*. https://publik.verdi.de/2013/ausgabe-03/spezial/finanzen/seiten-20-21/A0. [Consultato il 09.07.2013]].\n\n[3] Swedish Institute for Food and Biotechnology (SIK), Gothenburg, Sweden, 2011. Global Food Losses and Food Waste. [Online]. http://large.stanford.edu/courses/2012/ph240/briggs1/docs/mb060e00.pdf\n\n[4] Bio Company (Berlin), rivista per i clienti, 2013-07. Tonnen sind kein Platz für Lebensmittel. https://drive.google.com/file/d/12pIcqTvVaRGC-4iBnTu5xGafFGrdikkj\n\n---\n\n*Articolo di*: [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Contatto](mailto:vorstand@foodsharing.network)*)\\\n*Ultima revisione il 12.08.2026*\n\n---\n\n*Originale nel wiki di foodsharing: [Kontext und Selbstverständnis](https://wiki.foodsharing.network/wiki/Kontext_und_Selbstverst%C3%A4ndnis)*\n"}

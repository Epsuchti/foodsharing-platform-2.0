              - column: {name: title, value: "Regelverletzungen – Konsequenzen und Bearbeitung"}
              - column: {name: body, value: "*Gültig ab 01.10.2020*\n\n***Erläuterungen und Begründungen***\\\nDie Bearbeitung von Regelverletzungen wird im Wiki-Artikel [Regelverletzungen](https://wiki.foodsharing.network/wiki/Regelverletzungen) ausführlich erläutert. Der Artikel [Regelverletzungen - Erläuterungen](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen) bietet Begründungen und Erklärungen zu jeder einzelnen Festlegung.\n\nDiese Festlegungen werden weiterentwickelt von der *AG Verhaltensregeln und Meldesystem*. Verbesserungsvorschläge und Ideen können jederzeit an die AG Verhaltensregeln geschickt werden (möglichst per E-Mail an [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nDie AG sichtet alle eingegangenen Ideen und Vorschläge.\n\nZur [Mitarbeit in der Arbeitsgruppe](https://foodsharing.de/?page=bezirk&bid=1640) sind alle Interessierten herzlich eingeladen.\n\n### <a id=\"begriffe-und-abkuerzungen\"></a>Begriffe und Abkürzungen\n\n- Meldung einer Regelverletzung (**MRV**)\n- [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (**LMG**)\n- [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) im Bezirk (**LS**)\n- Personen mit BOT-Rechten in einem Bezirk, egal unter welcher Bezeichnung (**BOT**) - inklusive Bundesland-Bezirke, Staat-Bezirke, Kontinent-Bezirke u.a.\n\n### <a id=\"konsequenzen-fuer-regelverletzungen\"></a>Konsequenzen für Regelverletzungen\n\n\"Regeln\" im Sinne dieses Abschnitts sind alle Festlegungen in den foodsharing-Grundlagen 2 (\"Verhaltensregeln\") und 3 (\"Regelverletzungen - Konsequenzen und Bearbeitung\").\n\n- **a)** Eine ***Verwarnung*** kann bei allen Regelverletzungen ausgesprochen werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#a.29_.E2.80.93_Verwarnung)\n- **b)** Eine vorübergehende ***Suspendierung von Abholungen*** durch Entzug der Verifizierung und ggf. Sperrung für weitere Aktivitäten innerhalb von foodsharing für bis zu 3 Monate (***gelbe Karte***) kann ausgesprochen werden\n  - **i)** bei Verletzungen der [Regeln A)-C)](/learn/code-of-conduct#a-allgemeines-verhalten-bei-foodsharing), durch welche die Kooperation mit einem Betrieb gefährdet wird\n  - **ii)** bei Verletzung der Regel [C6)](/learn/code-of-conduct#c-betriebe-betriebsteam-planung-von-abholungen)\n  - **iii)** bei Verletzungen der Hygieneregeln, durch die die Gesundheit von Dritten gefährdet wird\n  - **iv)** bei Schädigung des Ansehens von foodsharing bei Betrieben oder in der Öffentlichkeit\n  - **v)** bei Verstoß gegen die Rechtsvereinbarung und Regelverletzungen, die den Grundsätzen von foodsharing widersprechen\n  - **vi)** wenn (nach korrekter Tilgung) 3 nicht-getilgte Verwarnungen vorliegen\n\n  Nach Ablauf der Suspendierung wird der Foodsaver nach Aufforderung an eine\\*n BOT des Stammbezirks wieder verifiziert.\n\n  [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#b.29_.E2.80.93_Suspendierung_.28Gelbe_Karte.29)\n- **c)** Eine ***Herabstufung zum Foodsharer*** (***gelb-rote Karte***) kann ausgesprochen werden, wenn 2 gelbe Karten vorliegen.\\\n  Gleichzeitig wird für die Dauer von 3-6 Monaten ein Verbot für die erneute Absolvierung des FS-Quiz festgelegt, eventuell auch eine Sperrung für weitere Aktivitäten innerhalb von foodsharing für dieselbe Dauer.\\\n  Der aussprechende Bezirk kann das Verbot und die Sperrung jederzeit aufheben. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#c.29_.E2.80.93_Herabstufung_zum_Foodsharer_.28Gelb-rote_Karte.29)\n- **d)** Eine ***dauerhafte Sperrung des Accounts*** mit Verbot der Wiederanmeldung (***rote Karte***) kann ausgesprochen werden bei\n  - **i)** Verurteilung wegen einer Straftat während der Aktivität für foodsharing\n  - **ii)** Verurteilung wegen einer Straftat gegen Mitglieder oder Eigentum von foodsharing\n  - **iii)** einer Verletzung der [Grundsätze](/learn/principles), die trotz vorheriger gelber, gelb-roter oder roter Karte zum 2. Mal geschieht\n  - **iv)** wenn 2 gelb-rote Karten vorliegen. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#d.29_.E2.80.93_Sperrung_des_Accounts_.28Rote_Karte.29)\n  - **v)** wenn dies nach geltendem Recht geboten ist oder wenn ohne sofortige Sperrung eine akute, erhebliche Gefahr für foodsharing e.V. oder Dritte besteht. In diesen Fällen entscheidet und dokumentiert der Vorstand des foodsharing e.V. eigenverantwortlich die Maßnahme.\n\nErläuterung\n\n### <a id=\"a-umgang-mit-regelverletzungen\"></a>A) Umgang mit Regelverletzungen\n\n- **1)** Die Meldung einer Regelverletzung hat nicht den Zweck einer restriktiven Verfolgung von unangemessenem Verhalten. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **2)** Ziel ist vielmehr die aktive Beschäftigung mit bestimmten Situationen, um Verständnis für die Regeln zu schaffen und eine Lösung zu finden, die alle Beteiligten akzeptieren können. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **3)** Eine Konsequenz auszusprechen, sollte nur die letzte Möglichkeit sein. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **4)** Die Meldung soll in einem möglichst kleinen Kreis von Leuten bearbeitet werden, da es sich um ein sehr vertrauliches Thema handelt. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A4%29)\n- **5)** Bei jeder MRV soll der einzelne Fall berücksichtigt und nicht eine pauschale Beurteilung vorgenommen werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A5%29)\n\n### <a id=\"b-gruppen-fuer-die-meldungsbearbeitung\"></a>B) Gruppen für die Meldungsbearbeitung\n\n- **1)** Für die Bearbeitung von MRV richtet jeder Bezirk eine [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (LMG) ein. Sie hat den Namen \"Meldungen *Bezirksname*\" und die E-Mailadresse \"meldungen.*bezirksname*@foodsharing.network\". Bis zur Einrichtung der LMG in einem Bezirk übernimmt die vorhandene Verifizierungs-AG (unter verschiedenen Bezeichnungen) deren Aufgabe. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B1%29)\n- **2)** Die Einrichtung einer zusätzlichen [Lokalen Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (LS) wird empfohlen, die in den Fällen gemäß C3) und D8) angerufen werden kann. Sie hat dann den Namen \"Schiedsstelle *Bezirksname*\" und die E-Mailadresse \"schiedsstelle.*bezirksname*@foodsharing.network\". [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B2%29)\n- **3)** Die Mitglieder von LMG und LS werden von den FS des Bezirks demokratisch gewählt. Niemand darf Mitglied in mehr als einer der LMG oder LS sein. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B3%29)\n- **4)** Foodsaver mit nicht-getilgten gelben, gelb-roten oder roten Karten dürfen nicht Mitglied in LMG oder LS sein. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B4%29)\n- **5)** Für die Vermittlung gemäß D8) ii) kann jeder Bezirk demokratisch eine weitere Arbeitsgruppe benennen. Die Mitglieder dieser Gruppe dürfen nicht in der LMG oder LS des Bezirks sein und auch nicht BOT für den Bezirk sein. *Erläuterung*\n\n### <a id=\"c-zustaendigkeiten\"></a>C) Zuständigkeiten\n\n- **1)** Zuständig für die Bearbeitung einer MRV ist grundsätzlich der Stammbezirk der gemeldeten Person.\\\n  Bei einem Stammbezirkswechsel werden vorliegende, nicht abschließend bearbeitete Meldungen vom vorigen Stammbezirk abschließend bearbeitet, wenn nicht beide Bezirke gemeinsam etwas anderes vereinbaren. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **2)** Meldungen werden grundsätzlich von der LMG des Bezirks bearbeitet. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **3)** Für Meldungen gegen Mitglieder der LMG oder BOTs ihres Stammbezirks kann die meldende Person abweichend festlegen, dass die Meldung durch die LS bearbeitet wird. Falls keine LS existiert, geht die Meldung in diesem Fall ebenfalls an die LMG. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C3%29)\n- **4)** Für Meldungen gegen Foodsharer ist der Bezirk zuständig, der für den Wohnort des gemeldeten Foodsharers zuständig ist, falls der Wohnort bekannt ist. Ansonsten ist der Stammbezirk der meldenden Person zuständig. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C4%29)\n- **5)** Die Umsetzung und Bestätigung von gelb-roten und roten Karten erfolgt durch den Vorstand des foodsharing e.V. gemäß den Voraussetzungen für die Umsetzung von Gelb-Roten und Roten Karten. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C5%29)\n- **6)** Die gemeldete Person kann einzelne Mitglieder einer bearbeitenden Gruppe ablehnen, die sie für befangen hält. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C6%29)\n- **7)** Betroffene Personen dürfen MRV nicht bearbeiten. Als betroffen gelten meldende und gemeldete Person sowie alle bei der gemeldeten Situation Anwesenden. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C7%29)\n\n### <a id=\"d-bearbeitung-einer-meldung\"></a>D) Bearbeitung einer Meldung\n\n- **1)** Die MRV wird von der meldenden Person direkt an die zuständige Gruppe geschickt. Erhält eine Gruppe eine MRV, für die sie nicht zuständig ist, gibt sie die MRV an die zuständige Gruppe weiter. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D1%29)\n- **2)** Die Meldung und alle weiteren Beiträge (Nachrichten, E-Mails, Gesprächsvermerke und –protokolle, Stellungnahmen, Entscheidung, Anrufung einer anderen Gruppe) werden im Forum der Gruppe dokumentiert, die zu diesem Zeitpunkt die Meldung bearbeitet. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D2%29)\n- **3)** Die Meldung wird nicht bearbeitet, falls sie mehr als 2 Monate nach dem gemeldeten Ereignis abgegeben wird. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D3%29)\n- **4)** Vor der Bearbeitung einer Meldung muss die LMG für die gemeldete Person die Tilgung von Meldungen und Konsequenzen gemäß Abschnitt F) vornehmen. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D4%29)\n- **5)** Die gemeldete Person muss über die Meldung und den Grund der Meldung - in anonymisierter Form gemäß E3) - informiert werden und zu einer Stellungnahme innerhalb von 2 Wochen nach dieser Mitteilung aufgefordert werden. ([E-Mail-Muster](https://drive.google.com/file/d/1nE8G9K16J4btsBVnh0TaPElf8nqfLyCK)) Die meldende Person wird über den Beginn der Bearbeitung und die Möglichkeit zu einer weiteren Stellungnahme innerhalb von 2 Wochen nach dieser Mitteilung informiert. ([E-Mail-Muster](https://drive.google.com/file/d/1OjLUKYdfi0KXSTtPaeWCktTrovYS3W-y))\n\n  Eine Konsequenz darf erst ausgesprochen werden, wenn beide Nachrichten sowie alle eingegangenen Stellungnahmen schriftlich (E-Mail oder Papier) vorliegen. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D5%29)\n- **6)** Die meldende Person kann im Meldungsformular oder später auf Anfrage der bearbeitenden Gruppe auf die anonymisierte Form gemäß E3) verzichten. ([E-Mail-Muster](https://drive.google.com/file/d/1gYknWLB7uKJZXmnVPcZP1JdIL_eret93))\\\n  Wenn der Nichtverzicht die Bearbeitung der Meldung verhindert, dann endet die Bearbeitung durch diese Gruppe mit der Entscheidung \"keine Konsequenz\". ([E-Mail-Muster an GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [E-Mail-Muster an MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D6%29)\n- **7)** Die Entscheidung einschließlich der Begründung wird der meldenden und der gemeldeten Person per E-Mail oder in Papierform mitgeteilt, zusammen mit einer Frist für die Bitte um Vermittlung gemäß D8). ([E-Mail-Muster an GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [E-Mail-Muster an MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D7%29)\n- **8)** Meldende und gemeldete Person können innerhalb einer Frist von 2 Wochen die vorgesehene Gruppe um Vermittlung bitten, falls es sie gibt. Diese Gruppe ist\n  - **i)** bei Bearbeitung durch die LMG die LS, falls sie existiert; ansonsten ist eine Vermittlung nicht möglich;\n  - **ii)** bei Bearbeitung durch die LS die durch den Bezirk nach B5) benannte Gruppe.\n\n  Die Vermittlungsgruppe kann die Vermittlung ohne Begründung ablehnen. ([E-Mail-Muster](https://drive.google.com/file/d/1pZTqeFJARkQC0Q4GYSIZNBb-1xuBfn3l)) [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D8%29)\n- **9)** Falls eine Konsequenz ausgesprochen wird, dann wird diese im Forum der für die gemeldete Person zuständigen LMG dokumentiert. Dabei muss mindestens Datum und Grund der Meldung sowie die Konsequenz mit dem Datum der Entscheidung gespeichert werden. ([E-Mail-Muster](https://drive.google.com/file/d/1G-tvtx1j3im3QcBN_5nf40B54hnT5lom)) [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D9%29)\n- **10)** Die aussprechende Gruppe kann eine Konsequenz vorzeitig beenden. Bei gelb-roten und roten Karten muss der Vorstand des foodsharing e.V. zustimmen. *Erläuterung*\n- **11)** Die aussprechende Gruppe kann mit Zustimmung aller anderen an der Bearbeitung der Meldung beteiligten Gruppen eine Konsequenz vollständig zurücknehmen. Bei gelb-roten und roten Karten muss der Vorstand des foodsharing e.V. zustimmen. Die Entscheidung wird der gemeldeten und meldenden Person mit Begründung mitgeteilt. Meldende und gemeldete Person können innerhalb einer Frist von 2 Wochen die nach D8) vorgesehene Gruppe um Vermittlung bitten. *Erläuterung*\n\n### <a id=\"e-datenschutz-vertraulichkeit-selbstauskunft\"></a>E) Datenschutz / Vertraulichkeit / Selbstauskunft\n\n- **1)** **Vertraulichkeit:** Alles, was MRV betrifft, muss streng vertraulich behandelt werden. Alle Beteiligten sind zur Verschwiegenheit verpflichtet, außer wenn meldende Person, gemeldete Person und alle in der Meldung genannten Personen der Herausgabe schriftlich zugestimmt haben. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **2)** **Weitergabe:** Die Weitergabe ist nur zulässig an Personen und Gremien, die für die Bearbeitung des jeweiligen, einzelnen Falles zuständig sind. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **3)** **Anonymisierte Form:** Die Mitteilung der Meldung an die gemeldete Person ist nur in anonymisierter Form erlaubt, d.h. der Name des/der Meldenden darf nicht herausgegeben werden.\n\n  Wenn die gemeldete Person Mitglied einer bearbeitenden oder beteiligten Gruppe ist, dann ist die anonymisierte Form nicht möglich. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E3%29)\n- **4)** **Selbstauskunft:** Jeder FS kann bei der LMG seines Stammbezirks die aktuell gegen ihn vorliegenden Konsequenzen sowie die zugehörigen Meldungen in anonymisierter Form gemäß E3) anfordern. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E4%29)\n- **5)** **Auskunft für Bezirke:** Jeder Bezirk kann für seine Foodsaver von deren Stammbezirk eine Aufstellung der vorliegenden Konsequenzen verlangen, beim Wechsel des Stammbezirks auch der neue Stammbezirk vom vorigen. Die Auflistung enthält zu jeder Meldung nur Nummer, Datum und Grund der Meldung sowie die Konsequenz mit dem Datum der Entscheidung. [*Erläuterung*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E5%29)\n\n### <a id=\"f-tilgung-von-meldungen-und-konsequenzen\"></a>F) Tilgung von Meldungen und Konsequenzen\n\n- **1)** Die gemeldete Person kann bei der LMG die Tilgung von Meldungen und Konsequenzen gegen sich beantragen. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F1%29)\n- **2)** Die LMG ist dann verpflichtet, alle Meldungen zu tilgen, bei denen endgültig entschieden wurde, keine Konsequenz auszusprechen. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F2%29)\n- **3)** Die LMG ist dann außerdem verpflichtet, alle Konsequenzen zu tilgen, bei denen die Entscheidung bei einer\n  - **i)** Verwarnung 6 Monate\n  - **ii)** gelben Karte nach 2 Jahre\n  - **iii)** gelb-roten Karte 3 Jahre\n  - **iv)** roten Karte 5 Jahre\n\n  zurückliegt und innerhalb dieser Frist keine weitere Konsequenz vorliegt. Die LMG ist dann verpflichtet, alle roten Karten zu tilgen, bei denen die Konsequenz vor mehr als 5 Jahren beendet wurde, wenn innerhalb dieser Frist keine weitere Konsequenz vorliegt. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **4)** Wenn eine Konsequenz getilgt wird, dann kann das dazu führen, dass die nächst-frühere Konsequenz ebenfalls getilgt werden muss. [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **5)** Für die Tilgung einer Konsequenz informiert die LMG alle an der Bearbeitung der entsprechenden Meldung beteiligten Gruppen. ([E-Mail-Muster](https://drive.google.com/file/d/1Bxffjz-JdtOOBaBHp74PkbkjIlpJb2su)) Sie löschen bzw. vernichten, soweit technisch möglich:\n  - die Meldung, Stellungnahmen, Entscheidung und alle weiteren Forumsbeiträge und Kommentare\n  - alle E-Mails, sonstigen Nachrichten und Dateien, auch aus dem Papierkorb\n  - alle Papierdokumente\n\n  [Erläuterung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F5%29)\n\n---\n\n*Artikel von*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Kontakt](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Letzte Überarbeitung am 20.08.2026*\n\n---\n\n*Original im foodsharing-Wiki: [Regelverletzungen – Konsequenzen und Bearbeitung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Konsequenzen_und_Bearbeitung)*\n"}

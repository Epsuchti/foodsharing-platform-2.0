              - column: {name: body, value: "*Gültig ab 13.12.2024*\\\n*[Änderungen](https://drive.google.com/file/d/1XtVCJDSJlYDkLY2lctcN7s1zybYO8FhT) gegenüber der vorigen Fassung (pdf)*\n\n**Ausführliche Erläuterungen und Leitfäden für die Praxis**\\\nFür die praktische Arbeit als Foodsaver gibt es einige weitere Texte mit Tipps und Infos.\n\n- *[Erläuterungen zu den Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen)* - Erklärungen zu jeder einzelnen Regel, warum sie wichtig für foodsharing ist und was sie konkret bedeutet.\n- *[Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel)* - eine Reihe von Artikeln zum Umgang mit geretteten Lebensmitteln\n\n*Weiterentwicklung der Hygieneregeln*\\\nDie Hygieneregeln werden weiterentwickelt von der *AG Hygiene*. Verbesserungsvorschläge und Ideen können jederzeit an die AG Hygiene geschickt werden (möglichst per E-Mail an [hygiene@foodsharing.network](mailto:hygiene@foodsharing.network)).\\\nDie AG sichtet alle eingegangenen Ideen und Vorschläge; eine Änderung der gültigen Regeln ist einmal pro Jahr – in der Regel im November – vorgesehen.\\\nZur [Mitarbeit in der Arbeitsgruppe](https://foodsharing.de/?page=bezirk&bid=1686) sind alle Interessierten herzlich eingeladen.\n\n### <a id=\"praeambel\"></a>Präambel\n\nDie Hygieneregeln legen Mindestanforderungen für foodsharing und alle Foodsaver fest. Dadurch soll bei der praktischen Arbeit mit Lebensmitteln einerseits die Einhaltung der gesetzlichen Hygienevorschriften garantiert werden. Andererseits sollen die Regeln vor Fehlern schützen und Hinweise geben, wie man mit Lebensmitteln so umgeht, dass sie unbedenklich verzehrt werden können.\\\nEs kann dabei durchaus sinnvoll sein, für einzelne Situationen, Betriebe oder Bezirke Regeln etwas stärker zu fassen, wenn die Gegebenheiten vor Ort es nötig machen.\n\n***Jeder Bezirk kann deswegen die Regeln für seinen Bereich verschärfen; die Anpassungen dürfen allerdings nicht den hier stehenden Hygieneregeln widersprechen.***\n\n### <a id=\"a-taetigkeitsverbote-beim-umgang-mit-lebensmitteln-42-43-ifsg\"></a>A) Tätigkeitsverbote beim Umgang mit Lebensmitteln (§§42, 43 IfSG)\n\n1\\) Für den Umgang mit Lebensmitteln sind saubere Kleidung, Haare und Hände Voraussetzung.\n\n2\\) Bei folgenden Krankheitssymptomen ist man verpflichtet, vor dem Umgang mit offenen empfindlichen Lebensmitteln einen Arzt aufzusuchen:\n\n- bei Durchfall, starker Übelkeit, Erbrechen, starkem Husten\n- bei ansteckenden Krankheiten, insbesondere Cholera, Typhus, Paratyphus, Ruhr, Salmonellose, EHEC, Hepatitis A oder E:\n- Hauterkrankungen und offene Wunden, die entzündet sind, eitern oder nässen\n- bei Fieber über 38,5°C\n\nDer anschließende Umgang mit Lebensmitteln ist nur erlaubt, wenn der Arzt eine schriftliche Unbedenklichkeitsbescheinigung ausstellt.\\\n[Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#A.29_T.C3.A4tigkeitsverbote_beim_Umgang_mit_Lebensmitteln_.28.C2.A7.C2.A742.2C_43_IfSG.29)\n\n### <a id=\"b-umgang-mit-lebensmitteln\"></a>B) Umgang mit Lebensmitteln\n\n#### <a id=\"1-direkter-umgang-transport-und-lagerung\"></a>1) Direkter Umgang, Transport und Lagerung\n\n- **a)** *Unverpackte Backwaren*: Gebäckzange, Handschuhe (möglichst abwaschbare Mehrweghandschuhe) oder sorgfältig gewaschene Hände sind zwingend erforderlich.\n\n  Für alle anderen Lebensmittel sind Handschuhe in der Regel nicht erforderlich, außer wenn es aus besonderen Anlässen (oder behördlichen Anweisungen) empfohlen ist.\n\n  Für Kuchen und Torten sollten möglichst feste Behälter verwendet werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1a.29_-_Unverpackte_Backwaren)\n- **b)** *Kühlwaren*: Die Kühlkette soll, wenn möglich, eingehalten werden: [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - *Transport* in einer Kühltasche oder Kühlbox mit Kühlelementen mit maximal 20 Minuten Unterbrechung ohne Sonnen- oder Hitzeeinwirkung\n  - *Lagerung* ununterbrochen in einem Kühlschrank oder (nur für kurze Zeit) in einer Kühltasche oder Kühlbox mit Kühlelementen\n- **c)** *Kühlwaren* sind: [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - Lebensmittel die laut Verpackung bei +2 bis +8°C gelagert werden sollen\n  - Nudel- und Kartoffelsalat, zubereitete Speisen mit Öl/Fett\n  - Kuchen mit nicht durchgebackener Füllung, Creme- und Sahnetorten\n- **d)** *Angefaulte Lebensmittel* sollen getrennt von anderen Lebensmitteln verpackt werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1d.29_-_Angefaulte_Lebensmittel)\n- **e)** Unverpackte Lebensmittel dürfen nur in *sauberen*, *lebensmittelechten Verpackungen* transportiert und gelagert werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_1._Absatz_-_Lebensmittelechte_.28und_saubere.29_Verpackungen)\n\n  Lebensmittelechte Verpackungen sind erkennbar\n  - an der Angabe \"für Lebensmittel\" oder dem Glas-und-Gabel-Symbol\n  - an Original-Etiketten, die die ursprüngliche Verwendung für Lebensmittel belegen\n\n  [Bezugsquellen für lebensmittelechte Verpackungen](https://docs.google.com/spreadsheets/d/1LpZBgtloqpNjDI9X3-7v91wSae61WqxbBAPyc7KrqoQ)\n\n  Bei *heißen Lebensmitteln* dürfen nur Behälter verwendet werden, die für die entsprechende Temperatur ausgelegt sind.\n\n  *Ausnahme*: [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_Ausnahme_-_nicht-lebensmittelechte_Verpackungen)\n  - Lebensmittel, die von einem Betrieb in einer nicht-lebensmittelechten oder verschmutzten Verpackung übergeben werden, sollten möglichst noch am Abholort umgepackt werden. Sie können ggf. auch bei der Abholung als ungenießbar beurteilt und zurückgelassen werden.\n\n#### <a id=\"2-weitergabe-allgemein\"></a>2) Weitergabe allgemein\n\nDie folgenden Regeln gelten nur für die ***Weitergabe*** von geretteten Lebensmitteln.\\\nFoodsaver können ohne Einschränkung alle geretteten Lebensmittel und auch andere gerettete Güter auf eigenes Risiko selbst verwenden oder als Tierfutter nutzen.\\\n[Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_Weitergabe_allgemein)\n\n- **a)** Foodsaver sind *verantwortlich* für Lebensmittel, die sie weitergeben. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2a.29_-_Verantwortlichkeit_der_Foodsaver)\n- **b)** Ein *Haftungsanspruch* des/der Empfänger\\*in für Folgeschäden besteht nur bei grober Fahrlässigkeit oder Vorsatz. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl%C3%A4ssigkeit_.28und_Vorsatz.29)\n- **c)** Um *grobe Fahrlässigkeit* auszuschließen: [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl.C3.A4ssigkeit_.28und_Vorsatz.29)\n  - müssen die Lebensmittel korrekt transportiert und gelagert werden (siehe Abschnitt B1) )\n  - müssen Lebensmittel nach dem Verbrauchsdatum aussortiert werden\n  - muss vor der Weitergabe jedes einzelne Stück auf Genießbarkeit *geprüft werden*:\n    - Nur weitergeben, was man auch noch selbst essen würde !\n    - ***Auge-Nase-Mund-Test***: Aussehen, Geruch und ggf. Geschmack prüfen (soweit ohne Öffnen der Verpackung möglich) !\n- **d)** *Verboten* ist die Weitergabe von Lebensmitteln [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2d.29_-_Verbotene_Lebensmittel)\n  - mit Schimmel oder schwarzen Stellen\n  - nach dem Verbrauchsdatum\n  - mit VD bei geöffneter innerster Verpackung\n  - mit MHD bei geöffneter innerster Verpackung, wenn der Zeitpunkt des Öffnens unbekannt ist oder lange zurückliegt\n  - mit aufgeblähten Vakuumverpackungen\n- **e)** Verboten ist außerdem die Weitergabe von *Arzneimitteln*. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2e.29_-_Arzneimittel)\n- **f)** *Tierfutter* darf weitergegeben werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2f.29_-_Tierfutter)\n- **g)** *Nicht-Essbares* (z.B. Reinigungs- und Pflegeprodukte, Kosmetika, Bücher, Kleidung) muss so klar getrennt von Lebens- und Futtermitteln weitergegeben werden, dass die Gefahr einer Verwechslung ausgeschlossen ist. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2g.29_-_Nicht-Essbares)\n\n### <a id=\"c-zusaetzliche-regeln-fuer-verschiedene-stufen-der-weitergabe\"></a>C) Zusätzliche Regeln für verschiedene Stufen der Weitergabe\n\nGerettete Lebensmittel müssen für 4 Stufen der Weitergabe aufgeteilt werden:\n\n- Stufe 1: nicht-persönliche Weitergabe\n- Stufe 2: persönliche Weitergabe\n- Stufe 3: Eigenkonsum oder Tierfutter\n- Stufe 4: Entsorgung.\n\nJe nach Stufe gelten weitere Regeln zusätzlich zu denen aus Abschnitt B). [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Teil_C.29_-_Stufen_der_Weitergabe)\n\n#### <a id=\"stufe-1-nicht-persoenliche-weitergabe\"></a>Stufe 1) Nicht-persönliche Weitergabe\n\nohne direkten Kontakt zu den Empfänger\\*innen (z.B. Fairteiler, andere Organisationen) [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#1.29_-_Nicht-pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Verboten* ist die Weitergabe von\n  - Hackfleisch, rohem Fisch, Produkten aus nicht erhitzter Rohmilch\n  - frisch zubereiteten Speisen mit rohem Ei, Flüssigei\n  - Cremes, Pudding, Tiramisu, Mayonnaise (wenn selbstgemacht mit Ei oder Milch)\n  - rohen Eiern nach Ablauf des MHD\n  - selbstgesammelten Pilzen\n  - Alkoholika, alkohol- oder THC-haltigen Lebensmitteln, Energy-Drinks\n  - Lebensmitteln mit Schimmel oder faulen Stellen\n  - Kühlpflichtigen Lebensmitteln, bei denen die Kühlkette unterbrochen wurde\n  - zubereiteten Speisen, falls Kund\\*innen unmittelbaren Kontakt mit den Lebensmitteln haben konnten\n  - zubereiteten, warm angebotenen Speisen\n  - zubereiteten kühlbedürftigen Speisen\n  - Lebensmitteln mit VD oder MHD, deren (innerste) Packung geöffnet ist\n  - Lebensmitteln, die in nicht-lebensmittelechten oder verschmutzten Verpackungen übergeben wurden oder darin gelagert wurden\n\n  [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1a.29_-_Verbotene_Lebensmittel)\n- **b)** *Erdbehaftete* Lebensmittel dürfen nicht oberhalb von anderen Lebensmitteln lagern. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1b.29_-_Erdbehaftete_Lebensmittel)\n- **c)** *Zubereitete* Speisen müssen abgedeckt oder in verschlossenem Behälter sein. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **d)** *Zutatenliste*: Bei selbstgemachten Speisen müssen alle Zutaten und das Datum der Zubereitung draufgeschrieben werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **e)** *Umgefüllte* Lebensmittel müssen mit der vollständigen Zutatenliste, dem Umfülldatum und ggf. dem MHD beschriftet sein. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n\n#### <a id=\"stufe-2-persoenliche-weitergabe\"></a>Stufe 2) Persönliche Weitergabe\n\nmit der Möglichkeit zum Gespräch mit den Empfänger\\*innen [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_-_Pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Verboten*: [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2a.29_-_Verbotene_Lebensmittel)\n  - Lebensmittel, die nur noch *bedingt und mit Vorsicht* genießbar oder *sehr unansehnlich* sind (z.B. Obst/Gemüse mit sehr weichen Stellen oder Teilen, brauner Hälfte, wild abgerissenes oder zäh-vertrocknetes Brot)\n  - Lebensmittel, bei denen die *Kühlkette* für längere Zeit unterbrochen war (je nach Lebensmittel und aktuellem Wetter – Faustregel: direkter Weg vom Betrieb zum Kühlschrank geht)\n- **b)** *Entscheidung nach Person im Einzelfall*: Lebensmittel dürfen nur weitergegeben werden, wenn man Empfänger\\*innen die verantwortungsvolle Behandlung und Beurteilung der Lebensmittel *zutraut* (z.B. bei Alkohol, Fisch oder angefaultem Obst/Gemüse). [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2b.29_-_Entscheidung_im_Einzelfall)\n- **c)** *Mündliche Hinweise*: Die Empfänger\\*innen sollten ggf. darauf hingewiesen werden, [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2c.29_-_M%C3%BCndliche_Hinweise)\n  - dass die Lebensmittel *schnell* verbraucht werden müssen\n  - dass sie die Lebensmittel vor dem Verbrauch noch einmal *prüfen* sollen\n  - falls die *Kühlkette* nicht eingehalten werden konnte\n\n#### <a id=\"stufe-3-eigenkonsum-oder-tierfutter\"></a>Stufe 3) Eigenkonsum oder Tierfutter\n\n- **a)** Foodsaver können Lebensmittel selbst verbrauchen oder als Futter für Tiere weitergeben. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n- **b)** Foodsaver dürfen andere gerettete Dinge außer Lebens- und Futtermitteln selbst verbrauchen, aber nicht im Namen von foodsharing weitergeben. [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n\n#### <a id=\"stufe-4-entsorgung\"></a>Stufe 4) Entsorgung\n\nLebensmittel, die nicht in die Kategorien 1), 2) oder 3) fallen, müssen fachgerecht entsorgt werden (Mülltonne, Kompostierung usw.). [Erläuterung](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#4.29_-_Entsorgung)\n\n---\n\n*Artikel von*: [AG Hygiene - Austausch und (Fach)Wissen](https://foodsharing.de/?page=bezirk&bid=1686) (*[Kontakt](mailto:hygiene@foodsharing.network)*)\\\n*Letzte Überarbeitung am 13.12.2024*\n\n---\n\n*Original im foodsharing-Wiki: [Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln)*\n"}

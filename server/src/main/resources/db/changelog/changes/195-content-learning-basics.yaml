              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000106"}
              - column: {name: language, value: "fr"}
              - column: {name: title, value: "Accord juridique"}
              - column: {name: body, value: "*État : 07.01.2015*\n\n## <a id=\"rechtsvereinbarung-fuer-foodsaver\"></a>Accord juridique pour les [foodsavers](https://wiki.foodsharing.network/wiki/Foodsaver)\n\n### <a id=\"rechtsvereinbarung-teil-i-eigenerklaerung-verhaltenskodex-und-sorgfaltspflichten\"></a>Accord juridique partie I - déclaration personnelle - code de conduite et devoirs de diligence\n\n*État : 7 janvier 2015*\n\nJe déclare ce qui suit :\n\nJe serai actif·ve comme [foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) dans le cadre de foodsharing. Cela signifie que je collecte des aliments auprès de donateur·rices d’aliments et que je m’engage soit à les consommer moi-même, soit à les donner exclusivement gratuitement à des tiers (à titre privé, soupes populaires, banques alimentaires, missions de gare, associations d’utilité publique, Fairteiler, en ligne comme panier alimentaire, etc.).\n\nLe but premier est de préserver de la destruction tous les aliments encore consommables et de les destiner à la consommation humaine. En tant que foodsaver, j’agis bénévolement pour des raisons sociales, éthiques et écologiques, afin de réduire le gaspillage alimentaire et donc la faim, le gaspillage des ressources, le changement climatique et bien plus encore.\n\nLes foodsavers sont un complément efficace, local et rapide à d’autres organisations d’utilité publique comme les [Tafeln](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln) (banques alimentaires). L’objectif est de permettre, en plus des grands commerces alimentaires, à un maximum de petits donateur·rices comme les boulangeries, magasins bio, restaurants, etc. de coopérer avec les foodsavers, afin qu’aucun aliment encore consommable ne doive être jeté, quelle que soit la taille de l’entreprise alimentaire.\n\nLa pleine satisfaction de nos commerces partenaires est une partie essentielle du sauvetage des aliments. Je m’engage à y contribuer par un comportement fiable, aimable et ouvert envers les personnes et les commerces à tous les niveaux.\n\nJe m’engage à ne démarcher aucun commerce et à ne mettre en place aucune coopération tant que je n’ai pas réussi le [quiz pour responsables de commerce](https://wiki.foodsharing.network/wiki/Quiz#Quiz_f.C3.BCr_Betriebsverantwortliche). En général, il n’est permis de démarcher des commerces de plus de 3 succursales qu’en accord avec l’[équipe chaînes de commerces](https://wiki.foodsharing.network/wiki/Betrieb#Betriebskette).\n\nL’objectif est d’atteindre un [taux de collecte](https://wiki.foodsharing.network/wiki/Abholquote) de 100 %. Pour le garantir, je suis tenu·e en tant que foodsaver d’inscrire toutes les dates de collecte sur le [site web](https://foodsharing.de) et d’être bien en réseau avec d’autres foodsavers. En cas d’absence imprévue, p. ex. pour cause de maladie, je suis tenu·e de me désinscrire du calendrier le plus vite possible et de trouver un·e foodsaver de remplacement qui a déjà collecté auprès du commerce donateur, et de ne choisir qu’en cas d’urgence un·e foodsaver qui n’y a encore jamais collecté. Si aucun remplacement n’a été trouvé 24 heures avant la collecte, la recherche doit être poursuivie par téléphone et e-mail jusqu’à ce que quelqu’un soit trouvé. Si la recherche n’aboutit toujours pas une heure avant la collecte, la succursale doit être informée immédiatement par téléphone qu’aucune collecte ne peut avoir lieu ce jour-là.\n\nDans les situations exceptionnelles où, malgré tous les efforts, aucune collecte n’a pu avoir lieu, l’équipe du commerce doit être informée de l’absence par un message sur le mur et la collecte manquée doit être signalée comme sa propre infraction.\n\nEn tant que foodsaver, je garantis de stocker ou de réfrigérer correctement les produits réfrigérés et les aliments périssables jusqu’à leur remise à des tiers, et à défaut de ne pas donner de tels aliments à des tiers.\n\nEn tant que foodsaver, je garantis de ne jeter aucun aliment encore comestible pendant ou après les collectes et de m’occuper de manière responsable et appropriée de l’élimination des aliments qui ne sont plus consommables, mais aussi des emballages, cartons, etc.\n\nEn outre, je m’engage à laisser le lieu où la marchandise est reçue ou triée au moins aussi propre que je l’ai trouvé. Les aliments sont collectés aux heures souhaitées par les commerces donateurs. Normalement, ce sont des horaires fixes, mais les foodsavers sont aussi prêts à collecter des aliments en dehors de ces horaires.\n\nJe confirme avoir lu et compris les [règles de conduite](/learn/code-of-conduct) et d’autres [documents du wiki foodsharing](https://wiki.foodsharing.network/wiki/Hauptseite), et je m’engage à m’y conformer. Si j’apprends que ces règles de conduite ne sont pas respectées par d’autres foodsavers, responsables de commerce ou ambassadeur·rices, je signale ces infractions via le formulaire « signaler une infraction » dans le profil de l’utilisateur·rice concerné·e.\n\nEn tant que foodsaver, je déclare respecter les valeurs fixées dans cet accord et ne pas nuire à foodsharing. Cela inclut en particulier l’obligation de s’abstenir de tout propos discréditant contre foodsharing, ses ambassadeur·rices, foodsavers et autres soutiens, y compris après la fin de ma participation en tant que foodsaver. Je prends acte qu’en cas d’infraction à cette déclaration, en particulier si je nuis à foodsharing intentionnellement ou par négligence grave par mes actes ou mes propos, je serai exclu·e de la participation en tant que foodsaver ou que cette participation me sera interdite.\n\nJe m’engage aussi à me tenir informé·e des informations et nouveautés actuelles (participer aux rencontres foodsharing régulières, lire les newsletters, consulter les forums du site, lire les e-mails).\n\nfoodsharing est avant tout neutre sur le plan de la politique partisane. Je m’engage à respecter à cet égard les règles et prescriptions du document « [foodsharing und Politik](https://wiki.foodsharing.network/wiki/Foodsharing_und_Politik) » (foodsharing et politique).\n\n### <a id=\"rechtsvereinbarung-teil-ii-haftungsausschluss\"></a>Accord juridique partie II - exclusion de responsabilité\n\n*État : janvier 2015*\n\nJe déclare ce qui suit :\n\nJe serai actif·ve comme foodsaver dans le cadre de foodsharing, je collecte des aliments auprès de commerces donateurs et je m’engage soit à les savourer moi-même, soit à les donner exclusivement gratuitement à des tiers.\n\nEn tant que foodsaver, j’assume la responsabilité des aliments. Cela signifie que tous les commerces donateurs, associations, fermes, etc. qui donnent des aliments sont libérés de toute responsabilité quant à la comestibilité ou l’innocuité sanitaire de la marchandise. Toute responsabilité des donateur·rices, y compris pour une négligence de quelque degré que ce soit, est exclue. Je sais que le foodsharing e.V. lui-même ne devient pas partenaire contractuel des donateur·rices et n’assume aucune responsabilité. Je suis donc responsable des aliments collectés et distribués et il m’appartient de souscrire le cas échéant une assurance responsabilité civile et accidents.\n\nJe m’engage à vérifier en mon âme et conscience l’innocuité des dons alimentaires avant de les donner. J’ai pris connaissance des instructions du [Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel) (guide d’hygiène des aliments) du foodsharing e.V., en particulier sur les aliments périssables, et je les suivrai. J’assume donc en tant que foodsaver l’entière responsabilité des aliments que je collecte et je dois décider moi-même s’ils sont encore propres à la consommation ou au don.\n\nJe renonce envers le [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand), les exploitant·es de [foodsharing.de](https://foodsharing.de) ainsi qu’envers les donateur·rices concerné·es à faire valoir tout droit à des dommages et intérêts, y compris envers leurs fournisseur·euses.\n\n## <a id=\"rechtsvereinbarung-fuer-betriebsverantwortliche-r\"></a>Accord juridique pour les [responsables de commerce](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r)\n\n*Accord juridique complémentaire pour les responsables de commerce chez foodsharing :*\n\nEn outre, en tant que responsable de commerce, je suis chargé·e de ne démarcher que des commerces pour lesquels je peux garantir que suffisamment de foodsavers sont prêt·es à collecter des aliments, si nécessaire 7 jours sur 7, dès le premier contact.\n\nAvant d’agir en tant que responsable de commerce, je m’engage à prendre contact avec les ambassadeur·rices de ma région et à ne chercher de nouveaux partenaires de coopération qu’après accord avec eux. Je garantis à cet égard de ne démarcher que des commerces gérés par leurs propriétaires et de contacter l’équipe chaînes de commerces pour tous les commerces de plus de 3 succursales.\n\nAvant même de démarcher un commerce, je vérifie qu’il n’a pas déjà été enregistré. Après chaque contact avec le commerce, j’enregistre le jour même toutes les informations pertinentes sur foodsharing.de ou je mets à jour toutes les informations obtenues qui sont demandées lors de l’enregistrement du commerce.\n\nTous les commerces que je crée et démarche dans le cadre de foodsharing font partie du réseau foodsharing. Si la responsabilité du commerce m’est retirée en raison d’infractions aux règles de foodsharing, l’ambassadeur·rice compétent·e reprend la responsabilité du commerce jusqu’à la nomination d’un·e nouveau·elle responsable. Il en va de même après un retrait volontaire en tant que responsable de commerce. Après avoir quitté le commerce volontairement ou involontairement, il n’est pas permis de continuer à y collecter des aliments. En outre, il est interdit de mettre fin à la coopération entre foodsharing et un commerce sans l’accord des ambassadeur·rices de Land ou de l’équipe d’orga.\n\nJe dois veiller à ce que l’ambiance soit bonne dans tous les commerces dont j’ai la responsabilité et que toutes les personnes impliquées - foodsavers et employé·es - s’y sentent bien. Pour prévenir les problèmes ou résoudre rapidement ceux qui surviennent, je communiquerai suffisamment.\n\nJe m’engage à examiner chaque infraction aux règles de conduite et, le cas échéant, à en tirer les conséquences, à concilier et, après accord avec les ambassadeur·rices concerné·es, à retirer certain·es foodsavers de l’équipe.\n\nEn outre, j’écrirai immédiatement sur le mur toutes les informations importantes sur l’état de la coopération ainsi que les changements, ou je les intégrerai sous « commerce ».\n\nEn outre, en tant que responsable de commerce, je m’engage à toujours représenter foodsharing de manière responsable et motivée. Je suis conscient·e d’avoir un rôle de modèle envers les foodsavers, les responsables de commerce et les collègues ambassadeur·rices, ce qui me fait plaisir et que je prends au sérieux. J’ai lu et intégré le [document du wiki](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r) sur mes tâches et autres obligations en tant que responsable de commerce, et je le soutiens.\n\n---\n\n*Article de* : [AG Recht](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Recht) (*[Contact](mailto:recht@foodsharing.network)*)\\\n*Dernière révision le 07.01.2015*\n\n---\n\n*Original dans le wiki foodsharing : [Rechtsvereinbarung](https://wiki.foodsharing.network/wiki/Rechtsvereinbarung)*\n"}

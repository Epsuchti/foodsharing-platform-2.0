              - column: {name: body, value: "*Gültig ab 02.01.2020*\n\n**Erläuterungen und Begründungen**\\\nZu den neuen Verhaltensregeln gibt es eine [Seite mit Erläuterungen](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen), auf der für jede einzelne Regel erklärt wird, warum sie wichtig für foodsharing ist.\n\nDie Verhaltensregeln werden weiterentwickelt von der *AG Verhaltensregeln und Meldesystem*. Verbesserungsvorschläge und Ideen können jederzeit an die AG Verhaltensregeln geschickt werden (möglichst per Email an [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nDie AG sichtet alle eingegangenen Ideen und Vorschläge; eine Änderung der gültigen Regeln ist zweimal pro Jahr – in der Regel im Mai und im November – vorgesehen.\\\nZur [Mitarbeit in der Arbeitsgruppe](https://foodsharing.de/?page=bezirk&bid=1640) sind alle Interessierten herzlich eingeladen.\n\n### <a id=\"praeambel\"></a>Präambel\n\nfoodsharing braucht einheitliche Verhaltensregeln für alle Foodsaver, um als große, inzwischen sogar internationale Bewegung gemeinschaftlich zusammenarbeiten zu können und in der Öffentlichkeit – bei Kooperationsbetrieben, Privatleuten und in der Politik – ein positives Bild und Vertrauen in uns zu schaffen und zu erhalten.\n\nDiese Regeln sind daher Grundlage für alle Foodsaver und alle foodsharing-Bezirke. Angesichts der vielen verschiedenen Ansätze in der Praxis ist es aber nicht möglich, allgemeine Regeln für jede Situation für alle Bezirke festzulegen. Daher gibt es ein paar Regeln (B7, C3 teilweise, C4) , die von den Bezirken den lokalen Gegebenheiten und Vorstellungen angepasst werden können und sollen; sie sind kursiv gesetzt.\n\nAußerdem steht es jedem Bezirk frei, in Maßen Regeln zu ergänzen, wenn die Ergänzungen nicht den anderen Regeln widersprechen.\n\n**In diesem Text werden folgende Abkürzungen verwendet**:\\\nFS = Foodsaver, BV = Betriebsverantwortliche(r), BOT = Botschafter\\*in\n\n## <a id=\"a-allgemeines-verhalten-bei-foodsharing\"></a>A) Allgemeines Verhalten bei foodsharing\n\n- **A1)** Der Umgang mit anderen FS erfolgt stets freundlich, respektvoll und friedlich. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A1.29_.E2.80.93_Freundlicher_Umgang_untereinander)\n- **A2)** FS untereinander verwenden als Anrede das “Du”. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A2.29_.E2.80.93_Duzen_als_Standard)\n- **A3)** Meinungsverschiedenheiten in einem Betriebsteam sollen teamintern, innerhalb eines Bezirks bezirksintern diskutiert werden. Persönliche Streitigkeiten werden nicht in Foren, auf Pinnwänden oder im Teamchat ausgetragen. Sie sind per privater Nachricht oder persönlich zu klären oder mit Unterstützung der für den Bezirk vorgesehenen Gruppen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A4)** Bei Streitigkeiten und Konflikten gilt es, immer sachlich und höflich zu bleiben, Ironie und Sarkasmus zu vermeiden, einen kühlen Kopf zu bewahren und überlegt zu antworten, insbesondere bei politischen Diskussionen oder anderen ernsten Themen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A5)** Private Nachrichten und darin enthaltene Informationen dürfen nur mit Erlaubnis des Absenders/der Absenderin veröffentlicht oder weitergegeben werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A5.29_.E2.80.93_Ver.C3.B6ffentlichung_von_privaten_Nachrichten)\n- **A6)** Auf der Online-Plattform sind urheberrechtlich geschützte Werke und Materialien, Werbung und Spam nicht gestattet.\\\n  Beiträge, durch welche eine dieser Regeln verletzt wird, und foodsharing-fremde Themen können gelöscht werden. Über die Löschung entscheiden in Arbeitsgruppen deren Admins, bei Veranstaltungen der/die Termin-Erstellende, bei Betriebs-Pinnwänden die Betriebsverantwortlichen. In Foren entscheidet die [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) auf Antrag eines Forumsmitglieds, die Löschung wird von der ZMG durchgeführt. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_-_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A7)** In Foren wird vor der Löschung eines Beitrags eine PN mit dem Text und Begründung für das Löschen an den/die Autor\\*in geschickt.\\\n  Transparenz ist wichtig. Deswegen wird jeder gelöschte Beitrag markiert in Form von: \"Dieser Beitrag/Dieses Thema von [...] wurde gelöscht, weil durch ihn/es eine Verhaltensregel von foodsharing verletzt wurde oder das Thema nicht zum Aufgabenbereich von foodsharing gehört.\" [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_.E2.80.93_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A8)** FS sind verpflichtet, in ihrem Profil auf der foodsharing-Plattform Name, Postadresse, Geburtsdatum, ein Profilfoto, auf dem sie erkennbar sind, und, falls vorhanden, eine Telefonnummer (empfohlen) korrekt einzutragen, aktuell zu halten und sie auf Anfrage mit einem Ausweisdokument nachzuweisen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A8.29_.E2.80.93_Verpflichtung_zur_Angabe_korrekter_pers.C3.B6nlicher_Daten)\n- **A9)** Informationen zu den internen Abläufen bei foodsharing (z.B. persönliche Daten anderer Foodsaver, Details zu Kooperationen, Abholzeiten) dürfen nur innerhalb von foodsharing und nur an die Foodsaver kommuniziert werden, die sie für die Arbeit bei foodsharing benötigen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A9.29_-_Vertraulichkeit_von_Foodsaver-Daten_und_foodsharing-internen_Informationen)\n\n## <a id=\"b-verhalten-bei-abholungen\"></a>B) Verhalten bei Abholungen\n\n- **B1)** Bei Abholterminen ist pünktliches Erscheinen und angemessenes Auftreten wichtig. Das Mitbringen von Tieren in den Betrieb ist verboten.\\\n  Die Mitnahme von Kindern ist nicht erlaubt. BV können in Absprache mit dem Betrieb Ausnahmen für einzelne FS und einzelne Kinder zulassen.\\\n  Der FS-Ausweis ist bei Abholungen grundsätzlich mitzuführen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B1.29.2C_Satz_1_.E2.80.93_P.C3.BCnktlichkeit_und_Auftreten)\n- **B2)** Abholungen außerhalb der festgelegten Termine sind nur nach Absprache mit einem BV erlaubt. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B2.29_.E2.80.93_Abholungen_au.C3.9Ferhalb_der_vereinbarten_Termine)\n- **B3)** Holen mehrere FS gemeinsam ab, dann betreten und verlassen sie den Betrieb gemeinsam und führen die Abholung ohne Streit oder Diskussion durch. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B3.29_.E2.80.93_mehrere_Abholer.2Ainnen)\n- **B4)** Die abholenden FS nehmen immer alle vom Betrieb übergebenen Lebensmittel mit, die noch genießbar sind. Ausnahmen können mit dem Betrieb vereinbart werden.\\\n  Alle FS übernehmen gleich viele Lebensmittel, außer wenn alle mit einer anderen Aufteilung einverstanden sind. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B4.29_.E2.80.93_alle_LM_mitnehmen_.28.3F.29)\n- **B5)** Bei einer Abholung dürfen den Betrieb nur betreten:\\\n  – für den Termin eingetragene oder als Ersatz einspringende FS mit Ausweis;\\\n  – angehende FS nach Akzeptierung der Rechtsvereinbarung im Rahmen einer Einführungsabholung gemeinsam mit einem FS\\\n  Weitere Personen müssen als \"Tragehilfe\" abseits des Betriebs warten. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B5.29_.E2.80.93_Wer_darf_abholen_gehen)\n- **B6)** Während der Abholung ist Rücksicht auf die Kundschaft und Beschäftigten des Betriebs zu nehmen. Diskussionen werden nicht geführt.\\\n  Die Abholenden richten sich nach den Wünschen der Beschäftigten und hinterlassen den Abholort ordentlich. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B6.29_.E2.80.93_Verhalten_im_Betrieb)\n- **B7)** *Eine vom Betrieb gewünschte Wartezeit (Abweichung von der vereinbarten Uhrzeit) bis 15 Minuten muss akzeptiert werden, danach kann die Abholung höflich abgesagt werden.* [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B7.29_.E2.80.93_Wartezeit)\n- **B8)** Wenn sich die Beschäftigten eines Betriebs unfreundlich verhalten, bleiben die Abholenden trotzdem höflich; sie können anschließend einen der BV informieren. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B8.29_.E2.80.93_Keine_Diskussionen_mit_Mitarbeitenden)\n- **B9)** Kommentare zu Menge, Art und Verwendung der von den FS geretteten LM sind zu unterlassen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B9.29_-_Wenn_nichts_zu_retten_ist)\n- **B10)** Es dürfen keine Lebensmittel verkauft oder als Tauschware genutzt werden, auch nicht solche, für die gerettete Lebensmittel verarbeitet wurden. Pfand für Kisten, Flaschen oder dergleichen darf angenommen oder verlangt werden, falls er bei der Abholung bezahlt wurde. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B10.29_-_kein_Verkauf.2C_kein_Tauschen)\n- **B11)** Für die Abholungen sollen möglichst ökologisch schonende Mittel eingesetzt werden. Weite Autofahrten und die unnötige Verwendung von Einwegartikeln sollen nach Möglichkeit vermieden werden. Wenn die Abholung ohne PKW möglich ist, sollen die BV durch ausreichende Slot-Anzahl dafür sorgen, dass diese Art der Abholung möglich gemacht und gefördert wird. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B11.29_.E2.80.93_.C3.B6kologische_Mittel)\n- **B12)** Das Ziel bei foodsharing ist, Lebensmittel vor der Tonne zu retten. Die Abholenden entscheiden eigenständig, an wen die Lebensmittel weitergegeben werden. Bedürftigkeit ist nicht entscheidend. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B12.29_.E2.80.93_nicht_nur_an_Bed.C3.BCrftige)\n- **B13)** Alle Abholenden sollen sich bemühen, die geretteten Lebensmittel vollständig zu verbrauchen oder zu fairteilen (an Menschen, notfalls auch an Tiere). [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B13.29_.E2.80.93_gerettete_Lebensmittel_wegwerfen.3F)\n\n## <a id=\"c-betriebe-betriebsteam-planung-von-abholungen\"></a>C) Betriebe, Betriebsteam, Planung von Abholungen\n\n- **C1)** Vor einer Abholung müssen FS die aktuelle Fassung der Betriebs-Besonderheiten sowie aktuelle Pinnwandeinträge und Beiträge im Teamchat kennen. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C1.29_.E2.80.93_aktuelle_Informationen_lesen_vor_Abholungen)\n- **C2)** Alle Abholungen bei Betrieben werden über die jeweilige Betriebsseite auf der Online-Plattform von foodsharing koordiniert. Für einzelne Betriebe können in Absprache mit den BOTs ergänzend auch andere Kommunikationswege genutzt werden, sofern dadurch kein Teammitglied ausgeschlossen wird. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C2.29_.E2.80.93_Organisation_nur_.C3.BCber_die_foodsharing-Plattform)\n- **C3)** Wer sich für einen Abholtermin einträgt, ist für die Abholung verantwortlich. Wer in Ausnahmefällen einen Abholtermin nicht wahrnehmen kann, muss sich unverzüglich aus dem Termin austragen *und per Nachricht an das Team nach Ersatz suchen.\\\n  Bei einer Absage weniger als 24 Stunden vor dem Termin muss der/die FS per Nachricht an das Team und telefonisch Ersatz suchen und im Notfall eine\\*n BV telefonisch informieren.* [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C3.29_.E2.80.93_Austragen_aus_Abholterminen)\n- **C4)** *Mitteilungen von Beschäftigten eines Betriebs an die Abholenden müssen direkt an mindestens eine\\*n BV weitergegeben werden (Empfehlung).* [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C4_.E2.80.93_Mitteilungen_des_Betriebs)\n- **C5)** Spezielle Regelungen für einen Betrieb werden stets von den BV mit dem Betrieb vereinbart und in den Besonderheiten auf der Betriebsseite festgelegt. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C5.29_.E2.80.93_Festlegungen_f.C3.BCr_Abholungen_in_einem_Betrieb)\n- **C6)** Neue Betriebe dürfen initiativ nur von Leuten mit bestandenem BV-Quiz in Absprache mit einem BOT und bei Betriebsketten dem/der zuständigen KAM oder der Gruppe Betriebsketten angesprochen werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C6.29_.E2.80.93_Ansprechen_von_Betrieben)\n- **C7)** Vor dem Ansprechen eines Betriebs muss geprüft werden, ob der Betrieb auf der Online-Plattform schon eingetragen wurde; falls nicht, dann muss er eingetragen werden. [Erläuterung](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C7.29_.E2.80.93_neue_Betriebe_eintragen_auf_Plattform)\n\n---\n\n*Artikel von*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Kontakt](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Letzte Überarbeitung am 01.02.2020*\n\n---\n\n*Original im foodsharing-Wiki: [Verhaltensregeln](https://wiki.foodsharing.network/wiki/Verhaltensregeln)*\n"}
        - insert:
            tableName: content_page_i18n
            columns:
              - column: {name: id, value: "00000012-0002-4000-8000-000000001022"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: created_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000102"}
              - column: {name: language, value: "en"}
              - column: {name: title, value: "Code of conduct"}
              - column: {name: body, value: "*Valid from 02.01.2020*\n\n**Explanations and reasons**\\\nFor the new code of conduct there is a [page with explanations](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen) that explains for each rule why it is important for foodsharing.\n\nThe code of conduct is developed further by the *AG Verhaltensregeln und Meldesystem* (working group code of conduct and reporting system). Suggestions and ideas can be sent to the working group at any time (preferably by email to [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nThe working group reviews all ideas and suggestions it receives; the rules in force are planned to change twice a year – usually in May and November.\\\nEveryone interested is warmly invited to [join the working group](https://foodsharing.de/?page=bezirk&bid=1640).\n\n### <a id=\"praeambel\"></a>Preamble\n\nfoodsharing needs a uniform code of conduct for all foodsavers so that, as a large and by now even international movement, it can work together and create and keep a positive image of and trust in us in public – with cooperating businesses, private individuals and in politics.\n\nThese rules are therefore the basis for all foodsavers and all foodsharing districts. Given the many different approaches in practice, however, it is not possible to set general rules for every situation for all districts. That is why there are a few rules (B7, C3 in part, C4) that the districts can and should adapt to local conditions and ideas; they are set in italics.\n\nIn addition, every district is free to add rules in moderation, as long as the additions do not contradict the other rules.\n\n**The following abbreviations are used in this text**:\\\nFS = foodsaver, BV = store manager, BOT = ambassador\n\n## <a id=\"a-allgemeines-verhalten-bei-foodsharing\"></a>A) General behaviour at foodsharing\n\n- **A1)** Dealing with other FS is always friendly, respectful and peaceful. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A1.29_.E2.80.93_Freundlicher_Umgang_untereinander)\n- **A2)** FS address each other informally (\"Du\" in German). [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A2.29_.E2.80.93_Duzen_als_Standard)\n- **A3)** Differences of opinion in a store team should be discussed within the team, within a district within the district. Personal disputes are not carried out in forums, on walls or in the team chat. They are to be settled by private message or in person, or with the support of the groups provided for the district. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A4)** In disputes and conflicts, always stay factual and polite, avoid irony and sarcasm, keep a cool head and answer in a considered way, especially in political discussions or on other serious topics. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A5)** Private messages and the information in them may only be published or passed on with the permission of the sender. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A5.29_.E2.80.93_Ver.C3.B6ffentlichung_von_privaten_Nachrichten)\n- **A6)** Copyrighted works and materials, advertising and spam are not allowed on the online platform.\\\n  Posts that break one of these rules, and topics unrelated to foodsharing, can be deleted. In working groups their admins decide on deletion, for events the person who created the event, on store walls the store managers. In forums the [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (local arbitration board) decides at the request of a forum member; the deletion is carried out by the ZMG. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_-_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A7)** In forums, before a post is deleted, a private message with the text and the reason for the deletion is sent to the author.\\\n  Transparency is important. That is why every deleted post is marked as follows: \"This post/topic by [...] was deleted because it broke a foodsharing rule of conduct or the topic is not within the scope of foodsharing.\" [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_.E2.80.93_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A8)** FS must enter their name, postal address, date of birth, a profile photo on which they can be recognised and, if available, a phone number (recommended) correctly in their profile on the foodsharing platform, keep them up to date and prove them with an identity document on request. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A8.29_.E2.80.93_Verpflichtung_zur_Angabe_korrekter_pers.C3.B6nlicher_Daten)\n- **A9)** Information about internal processes at foodsharing (e.g. personal data of other foodsavers, details of cooperations, pickup times) may only be communicated within foodsharing and only to the foodsavers who need it for their work at foodsharing. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A9.29_-_Vertraulichkeit_von_Foodsaver-Daten_und_foodsharing-internen_Informationen)\n\n## <a id=\"b-verhalten-bei-abholungen\"></a>B) Behaviour during pickups\n\n- **B1)** Punctuality and appropriate behaviour are important at pickups. Bringing animals into the store is forbidden.\\\n  Bringing children is not allowed. In agreement with the store, BV can allow exceptions for individual FS and individual children.\\\n  The FS ID card must always be carried during pickups. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B1.29.2C_Satz_1_.E2.80.93_P.C3.BCnktlichkeit_und_Auftreten)\n- **B2)** Pickups outside the fixed times are only allowed after agreement with a BV. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B2.29_.E2.80.93_Abholungen_au.C3.9Ferhalb_der_vereinbarten_Termine)\n- **B3)** If several FS pick up together, they enter and leave the store together and carry out the pickup without arguing or discussing. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B3.29_.E2.80.93_mehrere_Abholer.2Ainnen)\n- **B4)** The FS picking up always take all the food handed over by the store that is still edible. Exceptions can be agreed with the store.\\\n  All FS take the same amount of food, unless everyone agrees to a different split. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B4.29_.E2.80.93_alle_LM_mitnehmen_.28.3F.29)\n- **B5)** During a pickup, only the following may enter the store:\\\n  – FS with an ID card who are signed up for the slot or step in as a replacement;\\\n  – prospective FS after accepting the legal agreement, during an intro pickup together with an FS\\\n  Other people must wait away from the store as \"carrying help\". [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B5.29_.E2.80.93_Wer_darf_abholen_gehen)\n- **B6)** During the pickup, be considerate of the store's customers and employees. No discussions are held.\\\n  The people picking up follow the wishes of the employees and leave the pickup place tidy. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B6.29_.E2.80.93_Verhalten_im_Betrieb)\n- **B7)** *A waiting time requested by the store (deviation from the agreed time) of up to 15 minutes must be accepted; after that, the pickup can be politely cancelled.* [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B7.29_.E2.80.93_Wartezeit)\n- **B8)** If the employees of a store behave unfriendly, the people picking up stay polite anyway; afterwards they can inform one of the BV. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B8.29_.E2.80.93_Keine_Diskussionen_mit_Mitarbeitenden)\n- **B9)** Comments on the amount, type and use of the food saved by the FS are to be avoided. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B9.29_-_Wenn_nichts_zu_retten_ist)\n- **B10)** No food may be sold or used for barter, not even food made from saved food. A deposit for crates, bottles or the like may be accepted or asked for if it was paid at the pickup. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B10.29_-_kein_Verkauf.2C_kein_Tauschen)\n- **B11)** Pickups should use means that are as ecologically gentle as possible. Long car journeys and the unnecessary use of disposable items should be avoided where possible. If the pickup is possible without a car, the BV should provide enough slots to make this kind of pickup possible and encourage it. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B11.29_.E2.80.93_.C3.B6kologische_Mittel)\n- **B12)** The goal at foodsharing is to save food from the bin. The people picking up decide independently to whom the food is passed on. Need is not decisive. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B12.29_.E2.80.93_nicht_nur_an_Bed.C3.BCrftige)\n- **B13)** Everyone picking up should try to use up or share (\"fairteilen\") all the saved food (with people, if necessary also with animals). [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B13.29_.E2.80.93_gerettete_Lebensmittel_wegwerfen.3F)\n\n## <a id=\"c-betriebe-betriebsteam-planung-von-abholungen\"></a>C) Stores, store team, planning pickups\n\n- **C1)** Before a pickup, FS must know the current version of the store's particulars as well as current wall posts and messages in the team chat. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C1.29_.E2.80.93_aktuelle_Informationen_lesen_vor_Abholungen)\n- **C2)** All pickups at stores are coordinated via the store's page on the foodsharing online platform. For individual stores, other communication channels can be used in addition in agreement with the BOTs, as long as no team member is excluded by this. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C2.29_.E2.80.93_Organisation_nur_.C3.BCber_die_foodsharing-Plattform)\n- **C3)** Whoever signs up for a pickup slot is responsible for the pickup. Whoever cannot make a pickup slot in exceptional cases must sign out of the slot immediately *and look for a replacement by message to the team.\\\n  If cancelling less than 24 hours before the slot, the FS must look for a replacement by message to the team and by phone and, in an emergency, inform a BV by phone.* [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C3.29_.E2.80.93_Austragen_aus_Abholterminen)\n- **C4)** *Messages from a store's employees to the people picking up must be passed on directly to at least one BV (recommendation).* [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C4_.E2.80.93_Mitteilungen_des_Betriebs)\n- **C5)** Special arrangements for a store are always agreed with the store by the BV and set down in the particulars on the store page. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C5.29_.E2.80.93_Festlegungen_f.C3.BCr_Abholungen_in_einem_Betrieb)\n- **C6)** New stores may only be approached on one's own initiative by people who have passed the BV quiz, in agreement with a BOT and, for store chains, with the responsible KAM or the store chains group. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C6.29_.E2.80.93_Ansprechen_von_Betrieben)\n- **C7)** Before approaching a store, it must be checked whether the store has already been entered on the online platform; if not, it must be entered. [Explanation](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C7.29_.E2.80.93_neue_Betriebe_eintragen_auf_Plattform)\n\n---\n\n*Article by*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Contact](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Last revised on 01.02.2020*\n\n---\n\n*Original in the foodsharing wiki: [Verhaltensregeln](https://wiki.foodsharing.network/wiki/Verhaltensregeln)*\n"}
        - insert:
            tableName: content_page_i18n
            columns:
              - column: {name: id, value: "00000012-0002-4000-8000-000000001023"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: created_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000102"}
              - column: {name: language, value: "gws"}
              - column: {name: title, value: "Verhaltensregle"}
              - column: {name: body, value: "*Gültig ab 02.01.2020*\n\n**Erlüüterige und Begründige**\\\nZu de neue Verhaltensregle git s e [Siite mit Erlüüterige](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen), wo für jedi einzelni Regle erklärt wird, werum si für foodsharing wichtig isch.\n\nD Verhaltensregle wärded vo de *AG Verhaltensregeln und Meldesystem* wiiterentwicklet. Verbesserigsvorschläg und Idee chönd jederziit a d AG Verhaltensregle gschickt wärde (am beschte per Mail a [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nD AG luegt alli Idee und Vorschläg aa, wo iigönd; e Änderig vo de gültige Regle isch zweimal im Jahr – meistens im Mai und im November – vorgseh.\\\nZur [Mitarbet i de Arbetsgruppe](https://foodsharing.de/?page=bezirk&bid=1640) sind alli Interessierte härzlich iiglade.\n\n### <a id=\"praeambel\"></a>Präambel\n\nfoodsharing bruucht einheitlichi Verhaltensregle für alli Foodsaver, damit mir als grossi, inzwüsche sogar internationali Bewegig zäme schaffe chönd und i de Öffentlichkeit – bi Kooperationsbetriebe, Privatlüüt und i de Politik – es positivs Bild und Vertroue i eus schaffed und bhalted.\n\nDie Regle sind drum d Grundlag für alli Foodsaver und alli foodsharing-Bezirk. Will s i de Praxis so vill verschideni Aasätz git, isch s aber nöd möglich, allgemeini Regle für jedi Situation für alli Bezirk festzlege. Drum git s es paar Regle (B7, C3 teilwiis, C4), wo d Bezirk de lokale Gegäbeheite und Vorstellige aapasse chönd und söled; si sind kursiv gsetzt.\n\nUsserdem staht s jedem Bezirk frei, i Mass Regle z ergänze, wänn d Ergänzige de andere Regle nöd widerspräched.\n\n**I dem Text wärded die folgende Abkürzige bruucht**:\\\nFS = Foodsaver, BV = Betriebsverantwortlichi(r), BOT = Botschafter\\*in\n\n## <a id=\"a-allgemeines-verhalten-bei-foodsharing\"></a>A) Allgemeins Verhalte bi foodsharing\n\n- **A1)** De Umgang mit andere FS isch immer fründlich, respektvoll und friedlich. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A1.29_.E2.80.93_Freundlicher_Umgang_untereinander)\n- **A2)** FS säged enand \"Du\". [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A2.29_.E2.80.93_Duzen_als_Standard)\n- **A3)** Meinigsverschiedeheite in eme Betriebsteam söled im Team, innerhalb vomene Bezirk im Bezirk diskutiert wärde. Persönlichi Striitigkeite wärded nöd i Forum, uf Pinnwänd oder im Teamchat usgfochte. Si sind per privater Nachricht oder persönlich z kläre oder mit Unterstützig vo de Gruppe, wo für de Bezirk vorgseh sind. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A4)** Bi Striitigkeite und Konflikt gilt s, immer sachlich und höflich z bliibe, Ironie und Sarkasmus z vermiide, en chüele Chopf z bhalte und überleit z antworte, bsunders bi politische Diskussione oder andere ärnste Theme. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A5)** Privati Nachrichte und d Informatione drin dörfed nur mit Erlaubnis vom Absänder oder de Absänderin veröffentlicht oder wiitergäh wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A5.29_.E2.80.93_Ver.C3.B6ffentlichung_von_privaten_Nachrichten)\n- **A6)** Uf de Online-Plattform sind urheberrächtlich gschützti Wärk und Materialie, Wärbig und Spam nöd erlaubt.\\\n  Biiträg, wo e vo dene Regle verletzed, und Theme, wo nüüt mit foodsharing z tue händ, chönd glöscht wärde. Über s Lösche entscheided i Arbetsgruppe ihri Admins, bi Veraastaltige d Person, wo de Termin erstellt hät, bi Betriebs-Pinnwänd d Betriebsverantwortliche. I Forum entscheidet d [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) uf Aatrag vomene Forumsmitglied, glöscht wird vo de ZMG. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_-_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A7)** I Forum wird vor em Lösche vomene Biitrag e PN mit em Text und de Begründig fürs Lösche a de Autor oder d Autorin gschickt.\\\n  Transparenz isch wichtig. Drum wird jede glöschti Biitrag so markiert: \"De Biitrag/S Thema vo [...] isch glöscht worde, will er/es e Verhaltensregle vo foodsharing verletzt hät oder s Thema nöd zum Ufgabebereich vo foodsharing ghört.\" [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_.E2.80.93_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A8)** FS sind verpflichtet, i ihrem Profil uf de foodsharing-Plattform Name, Postadrässe, Geburtsdatum, es Profilfoto, wo mer si druf erkännt, und, falls vorhande, e Telefonnummere (empfohle) korrekt iiztrage, aktuell z bhalte und uf Aafrog mit emene Uswiis z bewiise. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A8.29_.E2.80.93_Verpflichtung_zur_Angabe_korrekter_pers.C3.B6nlicher_Daten)\n- **A9)** Informatione zu de interne Abläuf bi foodsharing (z.B. persönlichi Date vo andere Foodsaver, Details zu Kooperatione, Abholziite) dörfed nur innerhalb vo foodsharing und nur a d Foodsaver wiitergäh wärde, wo si für d Arbet bi foodsharing bruuched. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A9.29_-_Vertraulichkeit_von_Foodsaver-Daten_und_foodsharing-internen_Informationen)\n\n## <a id=\"b-verhalten-bei-abholungen\"></a>B) Verhalte bi Abholige\n\n- **B1)** Bi Abholtermin isch pünktlichs Erschiine und aagmässes Uftrete wichtig. Tier in Betrieb mitbringe isch verbote.\\\n  Chind mitneh isch nöd erlaubt. BV chönd i Absprach mit em Betrieb Usnahme für einzelni FS und einzelni Chind zuelah.\\\n  De FS-Uswiis mues bi Abholige grundsätzlich debii sii. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B1.29.2C_Satz_1_.E2.80.93_P.C3.BCnktlichkeit_und_Auftreten)\n- **B2)** Abholige usserhalb vo de feschte Termin sind nur nach Absprach mit emene BV erlaubt. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B2.29_.E2.80.93_Abholungen_au.C3.9Ferhalb_der_vereinbarten_Termine)\n- **B3)** Wänn mehreri FS zäme abholed, gönd si zäme in Betrieb ine und zäme use und mached d Abholig ohni Striit oder Diskussion. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B3.29_.E2.80.93_mehrere_Abholer.2Ainnen)\n- **B4)** D FS, wo abholed, nämed immer alli Läbesmittel mit, wo de Betrieb übergit und wo no gniessbar sind. Usnahme chönd mit em Betrieb abgmacht wärde.\\\n  Alli FS nämed gliich vill Läbesmittel, ussert alli sind mit ere andere Ufteilig iiverstande. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B4.29_.E2.80.93_alle_LM_mitnehmen_.28.3F.29)\n- **B5)** Bi ere Abholig dörfed nur die in Betrieb:\\\n  – FS mit Uswiis, wo für de Termin iitreit sind oder als Ersatz iispringed;\\\n  – aagehendi FS nach de Akzeptierig vo de Rächtsvereibarig im Rahme vo ere Iifüehrigsabholig zäme mit emene FS\\\n  Wiiteri Persone müend als \"Traghilf\" abseits vom Betrieb warte. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B5.29_.E2.80.93_Wer_darf_abholen_gehen)\n- **B6)** Während de Abholig nimmt mer Rücksicht uf d Kundschaft und d Aagstellte vom Betrieb. Es wärded kei Diskussione gfüehrt.\\\n  Die, wo abholed, richted sich nach de Wünsch vo de Aagstellte und hinterlönd de Abholort ordentlich. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B6.29_.E2.80.93_Verhalten_im_Betrieb)\n- **B7)** *E Wartezit, wo de Betrieb wünscht (Abwiichig vo de abgmachte Ziit), bis 15 Minute mues akzeptiert wärde, nachher cha d Abholig höflich abgseit wärde.* [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B7.29_.E2.80.93_Wartezeit)\n- **B8)** Wänn sich d Aagstellte vomene Betrieb unfründlich verhalted, bliibed die, wo abholed, trotzdem höflich; si chönd nachher en BV informiere. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B8.29_.E2.80.93_Keine_Diskussionen_mit_Mitarbeitenden)\n- **B9)** Kommentär zu Mängi, Art und Verwändig vo de Läbesmittel, wo d FS gerettet händ, sind z unterlah. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B9.29_-_Wenn_nichts_zu_retten_ist)\n- **B10)** Es dörfed kei Läbesmittel verchauft oder als Tuuschwaar bruucht wärde, au kei, wo us gerettete Läbesmittel gmacht worde sind. Depot für Chischte, Fläsche oder so cha aagnoh oder verlangt wärde, falls es bi de Abholig zahlt worde isch. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B10.29_-_kein_Verkauf.2C_kein_Tauschen)\n- **B11)** Für d Abholige söled möglichst umweltschonendi Mittel iigsetzt wärde. Wiiti Autofahrte und unnötigi Iiwägartikel söled wänn möglich vermide wärde. Wänn d Abholig ohni Auto möglich isch, söled d BV mit gnueg Slots defür sorge, dass die Art Abholig möglich gmacht und gförderet wird. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B11.29_.E2.80.93_.C3.B6kologische_Mittel)\n- **B12)** S Ziel bi foodsharing isch, Läbesmittel vor em Chübel z rette. Die, wo abholed, entscheided sälber, wem si d Läbesmittel wiitergänd. Bedürftigkeit isch nöd entscheidend. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B12.29_.E2.80.93_nicht_nur_an_Bed.C3.BCrftige)\n- **B13)** Alli, wo abholed, söled sich Müeh gäh, d gerettete Läbesmittel ganz z bruuche oder z fairteile (a Mänsche, im Notfall au a Tier). [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B13.29_.E2.80.93_gerettete_Lebensmittel_wegwerfen.3F)\n\n## <a id=\"c-betriebe-betriebsteam-planung-von-abholungen\"></a>C) Betriebe, Betriebsteam, Planig vo Abholige\n\n- **C1)** Vor ere Abholig müend FS di aktuell Fassig vo de Betriebs-Bsunderheite und di aktuelle Pinnwandiiträg und Biiträg im Teamchat kenne. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C1.29_.E2.80.93_aktuelle_Informationen_lesen_vor_Abholungen)\n- **C2)** Alli Abholige bi Betriebe wärded über d Betriebssiite uf de Online-Plattform vo foodsharing koordiniert. Für einzelni Betriebe chönd i Absprach mit de BOTs ergänzend au anderi Kommunikationswäg bruucht wärde, solang debii keis Teammitglied usgschlosse wird. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C2.29_.E2.80.93_Organisation_nur_.C3.BCber_die_foodsharing-Plattform)\n- **C3)** Wer sich für en Abholtermin iiträit, isch für d Abholig verantwortlich. Wer i Usnahmefäll en Abholtermin nöd wahrnäh cha, mues sich sofort usträge *und per Nachricht as Team en Ersatz sueche.\\\n  Bi ere Absag weniger als 24 Stund vor em Termin mues de/die FS per Nachricht as Team und telefonisch en Ersatz sueche und im Notfall en BV telefonisch informiere.* [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C3.29_.E2.80.93_Austragen_aus_Abholterminen)\n- **C4)** *Mitteilige vo Aagstellte vomene Betrieb a die, wo abholed, müend direkt a mindestens en BV wiitergäh wärde (Empfehlig).* [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C4_.E2.80.93_Mitteilungen_des_Betriebs)\n- **C5)** Speziell Regelige für en Betrieb wärded immer vo de BV mit em Betrieb abgmacht und i de Bsunderheite uf de Betriebssiite festgleit. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C5.29_.E2.80.93_Festlegungen_f.C3.BCr_Abholungen_in_einem_Betrieb)\n- **C6)** Neui Betriebe dörfed us eigener Initiative nur vo Lüüt mit bestandenem BV-Quiz aagfroget wärde, i Absprach mit emene BOT und bi Betriebskette mit em/de zueständige KAM oder de Gruppe Betriebskette. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C6.29_.E2.80.93_Ansprechen_von_Betrieben)\n- **C7)** Bevor mer en Betrieb aafroget, mues mer prüefe, öb de Betrieb uf de Online-Plattform scho iitreit isch; wänn nöd, mues er iitreit wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C7.29_.E2.80.93_neue_Betriebe_eintragen_auf_Plattform)\n\n---\n\n*Artikel vo*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Kontakt](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Letschti Überarbeitig am 01.02.2020*\n\n---\n\n*Original im foodsharing-Wiki: [Verhaltensregeln](https://wiki.foodsharing.network/wiki/Verhaltensregeln)*\n"}

              - column: {name: body, value: "*Gültig ab 09.08.2017*\n\nAlli juristische Persone, Einzelpersone, foodsharing-Ortsgruppe und foodsharing-Ortsverein, wo under em Name foodsharing uftreted, verpflichted sich, die folgende Grundsätz bi ihrem Engagement für foodsharing iizhalte:\n\n## <a id=\"grundsatz-1-organisation-fuer-mehr-lebensmittelwertschaetzung-und-nachhaltige-ernaehrungssysteme\"></a>Grundsatz 1 - Organisation für meh Wertschätzig vo Läbesmittel und nachhaltigi Ernährigssystem\n\nfoodsharing isch e Organisation für meh Wertschätzig vo Läbesmittel und luegt e drastischi Reduktion vo de Läbesmittelverschwändig als ethischi, ökologischi und klimapolitischi Notwändigkeit aa. Drum setzed mir eus für es ressourceschonends, zuekunftsfähigs Ernährigssystem und e umfassendi Iidämmig vo de Treibhusgas-Emissione ii. Das bedüütet:\n\n1. Mir schaffed es Bewusstsii für d Ursache vo de Läbesmittelverschwändig und anderi verschwänderischi Praktike, und für möglichi Lösige. Dafür mached mir Bildigsarbet, vernetzed eus mit wichtige Akteur:innen us z.B. Wirtschaft und Zivilgsellschaft und bringed eusi Theme i d Politik ii.\n2. Mir schaffed Strukture und Rüüm, wo über die Theme us em Grundsatz gredt wird. Dur eusi Arbet spared mir Ressource und Treibhusgas ii und bouled glichziitig Wüsse, Netzwerk und soziali Beziehige uf.\n3. Mir retted Läbesmittel und anderi Waar und luege, dass nüüt, wo no guet isch, im Chübel landet. Wänn möglich, unterstützt foodsharing Organisatione, wo ähnlichi Ziel verfolged wie foodsharing, und ihri Veraastaltige, z.B. mit gerettete Läbesmittel.\n\n## <a id=\"grundsatz-2-bekaempfung-der-lebensmittelverschwendung\"></a>Grundsatz 2 - Bekämpfig vo de Läbesmittelverschwändig\n\nfoodsharing verfolgt in erschter Linie en Nachhaltigkeitsaaspruch und leit drum de Fokus nöd druf, wer d Läbesmittel oder Waare konsumiert, sondern dass si nöd im Abfall landed. Drum rettet foodsharing überschüssigi Läbesmittel und anderi überschüssigi Waare vor em Wegwärfe und verteilt si a bedürftigi und au a nöd bedürftigi Persone, Gruppe und Iirichtige. Debii dörfed Aktivi (Foodsaver) en Teil vo de gerettete Waare sälber bruuche. Drüber use retted mir, über d Läbesmittel hinus und wo relevant und nötig, au anderi Waare vor em Chübel: Will mer mit allne Ressource vor em Hintergrund vo de drohende Klimakrise sorgfältig umgaa und si nöd verschwände sött.\n\n### <a id=\"das-bedeutet\"></a>Das bedüütet:\n\n1. Läbesmittel und anderi überschüssigi Waare dörfed nur gratis, ohni jedi Gägeleistig, wiitergäh wärde.\n2. Debii müend d Hygieneregle vo de AG Hygiene und d Verhaltensregle iighalte wärde.\n3. Wänn gerettete Läbesmittel für foodsharing-Veraastaltige bruucht wärded (z.B. Bildigsarbet, Schnippelpartys und Aktione für d Öffentlichkeitsarbet), händ die Vorrang vor andere Abholige.\n\n## <a id=\"grundsatz-3-umgang-mit-geld\"></a>Grundsatz 3 - Umgang mit Gäld\n\nD Arbet vo foodsharing isch grundsätzlich ehreamtlich. Si cha – wänn möglich und nötig – vo underschiedlich finanzierte und geförderete Mitarbeitende unterstützt wärde. Grundsätzlich gilt bim Umgang mit Gäld s Prinzip: \"So wenig wie möglich, so vill wie nötig\".\n\nDe foodsharing e.V. und alli Ortsgruppe sind em Grundsatz vo de Transparenz unterstellt.\n\n### <a id=\"das-bedeutet-sowohl-fuer-den-foodsharing-e-v-als-auch-fuer-die-bezirksvereine-und-ortsgruppen\"></a>Das bedüütet für de foodsharing e.V. und au für d Bezirksverein und Ortsgruppe:\n\n1. Mir schaffed selbschtlos. Mir verfolged kei eigewirtschaftlichi Zwäck.\n2. Kei Person darf dur Usgabe, wo em Zwäck vo foodsharing fremd sind, oder dur unverhältnismässig hochi Vergüetig begünstigt wärde.\n3. Eusi Mittel chömed in erschter Linie us freiwillige Biiträg und Spände. Zum d Vereinszwäck z erfülle, sind zuesätzlich öffentlichi Biiträg möglich.\n4. Wänn mer Spändegäld aanimmt, mues mer druf luege, dass d Idee und de sozial Uftrag vo foodsharing dur de Spänder oder d Spänderin nöd gschädigt wird. Für gerettete Läbesmittel darf kei Gäld aagnoh wärde. Im Zwiifelsfall entscheidet de überregional foodsharing e.V., was zuelässig isch und was nöd.\n5. E Mitgliedschaft ohni Mitgliederbiitrag mues i jedem foodsharing-Verein ohni jedi Usnahm möglich sii.\n6. Nötigi Uslage vo Amtsinhaber:innen für ihri Vereinsufgabe chönd zrugg zahlt wärde. Drüber use chönd Tätigkeite im Rahme vo Ehreamtspauschale vergüetet wärde.\n7. Für Bildigsarbet und d Organisation vo de überregionale foodsharing-Struktur chönd bezahlti Stelle gschaffe wärde.\n8. Finanz- und Tätigkeitsbricht söled jährlich online transparent iisehbar sii.\n9. De Zuegang zur foodsharing-Plattform isch und bliibt gratis.\n\n## <a id=\"grundsatz-4-parteipolitik-und-toleranz\"></a>Grundsatz 4 - Parteipolitik und Toleranz\n\nfoodsharing schaffet unabhängig vo politische Parteie und vo de Religionszuegehörigkeit.\n\nJedi Diskriminierig, wie zum Biispiel Rassismus oder Sexismus, wird gliich wenig toleriert wie Belästigige, Beleidigige, Beschimpfige, Usgränzig, Diffamierig und faschistischi Üsserige. foodsharing schaffet drum nöd mit Parteie, Organisatione oder Einzelpersone zäme, wo söttigi oder anderi diskriminierendi Positione verträtted.\n\n## <a id=\"grundsatz-5-kooperation-und-zusammenarbeit\"></a>Grundsatz 5 - Kooperation und Zämearbet\n\nD Arbet vo de Ortsgruppe vo foodsharing isch meistens lokal. D Ortsgruppe respektiered d Bezirksgränze und schaffed eng und guet zäme, ohni gägenand z konkurriere.\n\n### <a id=\"das-bedeutet-2\"></a>Das bedüütet:\n\n1. E transparenti und fairi Kommunikation isch d Basis vo eusere Arbet. Druf bouled mir Strukture und Entscheidigsprozäss uf.\n2. Bi Unstimmigkeite i de regionale foodsharing-Arbet, z. B. bi neue Vereinsgründige oder bi Ortsgruppe, wo s scho git, sött mer zerscht e einvernehmlichi Lösig vor Ort sueche.\n3. D Ortsgruppe tuusched regional und überregional Informatione und Erfahrige us.\n4. Alli Ortsgruppe hälfed enand, mit em Ziel, d lokali foodsharing-Arbet wirksam z unterstütze.\n\n## <a id=\"grundsatz-6-foodsharing-namensnutzung\"></a>Grundsatz 6 - Bruuch vom Name foodsharing\n\nD Wort-Bild-Marke 'foodsharing' und 'foodsharing Akademie' sind als iigtrageni Markezeiche vom foodsharing e.V. rächtlich gschützt.\n\n### <a id=\"das-bedeutet-3\"></a>Das bedüütet:\n\n1. De Name vo de Ortsgruppe isch grundsätzlich de Ortsname, wo hinder em Name „foodsharing“ und allefalls e.V. staht, z.B. \"foodsharing München e.V.\"\n2. Alli neu gründete Ortsgruppe und ihre Name bruuched d usdrücklichi Zuestimmig vom foodsharing e.V.\n3. De Name „foodsharing“ mues mer schriftlich bim foodsharing e.V. beaatrage, und er wird nur a Ortsgruppe für konkreti foodsharing-Projekt vergäh.\n4. S Logo vo foodsharing mues jedi Ortsgruppe i Form und Farb nach de Vorgabe im Design Manual übernäh. S Logo cha mer bi de AG “Materialien - Grafikdateien” aafroge.\n\n## <a id=\"grundsatz-7-umgang-mit-konflikten\"></a>Grundsatz 7 - Umgang mit Konflikt\n\nStriitigkeite under Foodsaver, under Ortsgruppe und im Netzwerk wärded nöd öffentlich usgfochte.\n\n### <a id=\"das-bedeutet-4\"></a>Das bedüütet:\n\n1. Striitigkeite und Unstimmigkeite sind zerscht intern aazspräche und z kläre. Debii gilt s, möglichst sachlich und höflich z bliibe, en chüele Chopf z bhalte und überleit z antworte.\n2. Wänn Konflikt weder über es Gspräch no über e Mediation glöst wärde chönd, entscheidet di jewiilig lokal Meldegruppe, Schiedsstell, Kette-Konfliktlösig (KKL) oder di überregional Konfliktbearbeitigsstell (ÜKBS). Wänn die Strukture versaged, korrupt sind und/oder de foodsharing e.V. direkt betroffe isch (z.B. dur Ruefschädigung i de Presse, Klage, Haftigsfroge oder i schwääre Fäll, z.B. bi sexuelle Übergriff, Rächtsextremismus), entscheidet de foodsharing e.V. sälber.\n\n## <a id=\"grundsatz-8-einhaltung-der-grundsaetze\"></a>Grundsatz 8 - Iihalte vo de Grundsätz\n\nDe foodsharing e.V. luegt, dass d foodsharing-Grundsätz iighalte wärded. Wänn d foodsharing-Grundsätz nöd iighalte wärded, cha de foodsharing e.V. en Usschluss vo de foodsharing-Plattform iileite.\n\nEs git kei Aaspruch uf en Zuegang zur foodsharing-Plattform.\n\nLangfrischtig söled die Ufgabe vomene Bundesverband übernoh wärde, wo d Ortsverein no gründe wänd.\n\n---\n\n*Artikel vo*: [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Kontakt](mailto:vorstand@foodsharing.network)*)\\\n*Letschti Überarbeitig am 10.08.2026*\n\n---\n\n*Original im foodsharing-Wiki: [Grundsätze](https://wiki.foodsharing.network/wiki/Grunds%C3%A4tze)*\n"}
        - insert:
            tableName: content_page_i18n
            columns:
              - column: {name: id, value: "00000012-0002-4000-8000-000000001014"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: created_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000101"}
              - column: {name: language, value: "fr"}
              - column: {name: title, value: "Principes"}
              - column: {name: body, value: "*En vigueur depuis le 09.08.2017*\n\nToutes les personnes morales, personnes individuelles, groupes locaux foodsharing et associations locales foodsharing agissant sous le nom de foodsharing s’engagent à respecter les principes suivants dans leur engagement pour foodsharing :\n\n## <a id=\"grundsatz-1-organisation-fuer-mehr-lebensmittelwertschaetzung-und-nachhaltige-ernaehrungssysteme\"></a>Principe 1 - Une organisation pour davantage de respect des aliments et des systèmes alimentaires durables\n\nfoodsharing est une organisation pour davantage de respect des aliments et considère une réduction drastique du gaspillage alimentaire comme une nécessité éthique, écologique et climatique. Nous nous engageons donc pour un système alimentaire économe en ressources et durable, et pour une réduction globale des émissions de gaz à effet de serre. Cela signifie :\n\n1. Nous sensibilisons aux causes du gaspillage alimentaire et d’autres pratiques de gaspillage, ainsi qu’aux solutions possibles. Pour cela, nous faisons un travail éducatif, nous nous mettons en réseau avec des acteur·rices important·es, par exemple de l’économie et de la société civile, et nous portons nos thèmes dans la politique.\n2. Nous créons des structures et des espaces où l’on parle des thèmes cités dans ce principe. Par notre travail, nous économisons des ressources et des gaz à effet de serre et développons en même temps des connaissances, des réseaux et des relations sociales.\n3. Nous sauvons des aliments et d’autres marchandises et veillons à ce que rien de ce qui est encore bon ne finisse à la poubelle. Si possible, foodsharing soutient les organisations qui poursuivent des objectifs similaires à ceux de foodsharing ainsi que leurs événements, par exemple avec des aliments sauvés.\n\n## <a id=\"grundsatz-2-bekaempfung-der-lebensmittelverschwendung\"></a>Principe 2 - Lutte contre le gaspillage alimentaire\n\nfoodsharing poursuit avant tout une exigence de durabilité et ne met donc pas l’accent sur qui consomme les aliments ou les marchandises, mais sur le fait qu’ils ne finissent pas à la poubelle. C’est pourquoi foodsharing sauve les aliments et autres marchandises excédentaires de la poubelle et les distribue à des personnes, groupes et institutions dans le besoin comme à ceux qui ne le sont pas. Les membres actifs (foodsavers) peuvent utiliser une partie des marchandises sauvées pour leur propre consommation. Au-delà des seuls aliments, et là où c’est pertinent et nécessaire, nous sauvons aussi d’autres marchandises de la poubelle : face à une crise climatique menaçante, toutes les ressources doivent être traitées avec soin et non gaspillées.\n\n### <a id=\"das-bedeutet\"></a>Cela signifie :\n\n1. Les aliments et autres marchandises excédentaires ne peuvent être donnés que gratuitement, sans aucune contrepartie.\n2. Les règles d’hygiène élaborées par le groupe de travail Hygiène ainsi que les règles de conduite doivent être respectées.\n3. L’utilisation d’aliments sauvés pour des événements foodsharing (p. ex. travail éducatif, soirées épluchage et actions de relations publiques) a la priorité sur les autres collectes.\n\n## <a id=\"grundsatz-3-umgang-mit-geld\"></a>Principe 3 - Gestion de l’argent\n\nLe travail de foodsharing est en principe bénévole. Il peut – si possible et nécessaire – être soutenu par des collaborateur·rices financé·es et subventionné·es de différentes manières. Pour la gestion de l’argent, le principe est : « aussi peu que possible, autant que nécessaire ».\n\nLe foodsharing e.V. et tous les groupes locaux sont soumis au principe de transparence.\n\n### <a id=\"das-bedeutet-sowohl-fuer-den-foodsharing-e-v-als-auch-fuer-die-bezirksvereine-und-ortsgruppen\"></a>Cela signifie, tant pour le foodsharing e.V. que pour les associations de district et les groupes locaux :\n\n1. Nous agissons de manière désintéressée. Nous ne poursuivons pas de buts économiques propres.\n2. Aucune personne ne doit être favorisée par des dépenses étrangères au but de foodsharing ou par une rémunération disproportionnée.\n3. Nos moyens proviennent en premier lieu de contributions volontaires et de dons. Des subventions publiques sont en outre possibles pour remplir les buts de l’association.\n4. Lors de l’acceptation de dons, il faut veiller à ce que l’idée et la mission sociale de foodsharing ne soient pas lésées par le ou la donateur·rice. Aucun argent ne peut être accepté pour des aliments sauvés. En cas de doute, le foodsharing e.V. national décide de ce qui est admissible ou non.\n5. Une adhésion sans cotisation doit être possible dans chaque association foodsharing, sans aucune exception.\n6. Les frais nécessaires des titulaires de fonctions pour remplir leurs tâches associatives peuvent être remboursés. En outre, des activités peuvent être rémunérées dans le cadre de forfaits pour bénévoles.\n7. Des postes rémunérés peuvent être créés pour le travail éducatif et l’organisation de la structure nationale de foodsharing.\n8. Les rapports financiers et d’activité doivent être consultables en ligne chaque année, en toute transparence.\n9. L’accès à la plateforme foodsharing est et reste gratuit.\n\n## <a id=\"grundsatz-4-parteipolitik-und-toleranz\"></a>Principe 4 - Politique partisane et tolérance\n\nfoodsharing travaille indépendamment des partis politiques et des appartenances religieuses.\n\nToute discrimination, comme le racisme ou le sexisme, n’est pas tolérée, pas plus que le harcèlement, les insultes, les injures, l’exclusion, la diffamation et les propos fascistes. foodsharing ne coopère donc pas avec des partis, organisations ou personnes individuelles qui défendent de telles positions ou d’autres positions discriminatoires.\n\n## <a id=\"grundsatz-5-kooperation-und-zusammenarbeit\"></a>Principe 5 - Coopération et collaboration\n\nLe travail des groupes locaux de foodsharing est principalement local. Les groupes locaux respectent les limites des districts et travaillent ensemble étroitement et bien, sans se faire concurrence.\n\n### <a id=\"das-bedeutet-2\"></a>Cela signifie :\n\n1. Une communication transparente et équitable est la base de notre travail. Nous construisons nos structures et nos processus de décision sur elle.\n2. En cas de désaccords dans le travail régional de foodsharing, p. ex. lors de la création de nouvelles associations ou avec des groupes locaux existants, il faut d’abord rechercher une solution à l’amiable sur place.\n3. Les groupes locaux échangent informations et expériences au niveau régional et national.\n4. Tous les groupes locaux s’entraident dans le but de soutenir efficacement le travail local de foodsharing.\n\n## <a id=\"grundsatz-6-foodsharing-namensnutzung\"></a>Principe 6 - Utilisation du nom foodsharing\n\nLa marque verbale et figurative « foodsharing » ainsi que « foodsharing Akademie » sont protégées juridiquement en tant que marques déposées par le foodsharing e.V.\n\n### <a id=\"das-bedeutet-3\"></a>Cela signifie :\n\n1. Le nom du groupe local est en principe le nom de la localité placé après le nom « foodsharing » et, le cas échéant, e.V., p. ex. « foodsharing München e.V. »\n2. Tous les groupes locaux nouvellement créés et leur nom nécessitent l’accord exprès du foodsharing e.V.\n3. Le nom « foodsharing » doit être demandé par écrit au foodsharing e.V. et n’est attribué qu’à des groupes locaux pour des projets foodsharing concrets.\n4. Chaque groupe local doit reprendre le logo de foodsharing dans la forme et la couleur prescrites par le manuel de design. Le logo peut être demandé au groupe de travail « Materialien - Grafikdateien » (matériel - fichiers graphiques).\n\n## <a id=\"grundsatz-7-umgang-mit-konflikten\"></a>Principe 7 - Gestion des conflits\n\nLes différends entre foodsavers, entre groupes locaux et au sein du réseau ne sont pas réglés en public.\n\n### <a id=\"das-bedeutet-4\"></a>Cela signifie :\n\n1. Les différends et désaccords doivent d’abord être abordés et réglés en interne. Il s’agit de rester aussi factuel·le et poli·e que possible, de garder la tête froide et de répondre de manière réfléchie.\n2. Si les conflits ne peuvent être résolus ni par une discussion ni par une médiation, c’est le groupe local de signalement, l’instance d’arbitrage, la résolution des conflits de chaînes (KKL) ou l’instance nationale de traitement des conflits (ÜKBS) qui décide. Si ces structures échouent, sont corrompues et/ou si le foodsharing e.V. est directement concerné (p. ex. par une atteinte à sa réputation dans la presse, des plaintes, des questions de responsabilité ou dans des cas graves, p. ex. agressions sexuelles, extrémisme de droite), le foodsharing e.V. décide lui-même.\n\n## <a id=\"grundsatz-8-einhaltung-der-grundsaetze\"></a>Principe 8 - Respect des principes\n\nLe foodsharing e.V. veille au respect des principes de foodsharing. En cas de non-respect des principes de foodsharing, le foodsharing e.V. peut engager une exclusion de la plateforme foodsharing.\n\nIl n’existe aucun droit d’accès à la plateforme foodsharing.\n\nÀ terme, ces tâches doivent être reprises par une fédération nationale à créer par les associations locales.\n\n---\n\n*Article de* : [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Contact](mailto:vorstand@foodsharing.network)*)\\\n*Dernière révision le 10.08.2026*\n\n---\n\n*Original dans le wiki foodsharing : [Grundsätze](https://wiki.foodsharing.network/wiki/Grunds%C3%A4tze)*\n"}
        - insert:
            tableName: content_page_i18n
            columns:
              - column: {name: id, value: "00000012-0002-4000-8000-000000001015"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: created_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000101"}
              - column: {name: language, value: "it"}
              - column: {name: title, value: "Principi"}
              - column: {name: body, value: "*In vigore dal 09.08.2017*\n\nTutte le persone giuridiche, le singole persone, i gruppi locali foodsharing e le associazioni locali foodsharing che agiscono con il nome foodsharing si impegnano a rispettare i seguenti principi nel loro impegno per foodsharing:\n\n## <a id=\"grundsatz-1-organisation-fuer-mehr-lebensmittelwertschaetzung-und-nachhaltige-ernaehrungssysteme\"></a>Principio 1 - Un’organizzazione per un maggiore rispetto del cibo e sistemi alimentari sostenibili\n\nfoodsharing è un’organizzazione per un maggiore rispetto del cibo e considera una drastica riduzione dello spreco alimentare una necessità etica, ecologica e di politica climatica. Ci impegniamo quindi per un sistema alimentare che risparmi risorse e sia sostenibile nel tempo, e per una riduzione complessiva delle emissioni di gas serra. Questo significa:\n\n1. Creiamo consapevolezza sulle cause dello spreco alimentare e di altre pratiche di spreco, e sulle possibili soluzioni. Per questo facciamo lavoro educativo, ci mettiamo in rete con attori importanti, ad esempio dell’economia e della società civile, e portiamo i nostri temi nella politica.\n2. Creiamo strutture e spazi in cui si parla dei temi citati in questo principio. Con il nostro lavoro risparmiamo risorse e gas serra e allo stesso tempo costruiamo conoscenze, reti e relazioni sociali.\n3. Salviamo alimenti e altre merci e facciamo in modo che nulla di ancora buono finisca nella spazzatura. Se possibile, foodsharing sostiene le organizzazioni che perseguono obiettivi simili a quelli di foodsharing e i loro eventi, ad esempio con alimenti salvati.\n\n## <a id=\"grundsatz-2-bekaempfung-der-lebensmittelverschwendung\"></a>Principio 2 - Lotta allo spreco alimentare\n\nfoodsharing persegue in primo luogo un’esigenza di sostenibilità e non si concentra quindi su chi consuma gli alimenti o le merci, ma sul fatto che non finiscano nella spazzatura. Per questo foodsharing salva alimenti e altre merci in eccedenza dall’essere buttati e li distribuisce sia a persone, gruppi e istituzioni bisognosi sia a chi non lo è. I membri attivi (foodsaver) possono usare una parte delle merci salvate per il proprio consumo. Oltre ai soli alimenti, e dove rilevante e necessario, salviamo dalla spazzatura anche altre merci: di fronte a una crisi climatica incombente, tutte le risorse vanno trattate con cura e non sprecate.\n\n### <a id=\"das-bedeutet\"></a>Questo significa:\n\n1. Gli alimenti e le altre merci in eccedenza possono essere ceduti solo gratuitamente, senza alcuna controprestazione.\n2. Vanno rispettate le regole d’igiene elaborate dal gruppo di lavoro Igiene e le regole di comportamento.\n3. L’uso di alimenti salvati per eventi foodsharing (ad es. lavoro educativo, feste di taglio della verdura e azioni di pubbliche relazioni) ha la precedenza sugli altri ritiri.\n\n## <a id=\"grundsatz-3-umgang-mit-geld\"></a>Principio 3 - Gestione del denaro\n\nIl lavoro di foodsharing è per principio volontario. Può essere sostenuto – se possibile e necessario – da collaboratori e collaboratrici finanziati e sovvenzionati in modi diversi. Nella gestione del denaro vale il principio: «Il meno possibile, quanto necessario».\n\nIl foodsharing e.V. e tutti i gruppi locali sono soggetti al principio della trasparenza.\n\n### <a id=\"das-bedeutet-sowohl-fuer-den-foodsharing-e-v-als-auch-fuer-die-bezirksvereine-und-ortsgruppen\"></a>Questo significa sia per il foodsharing e.V. sia per le associazioni distrettuali e i gruppi locali:\n\n1. Agiamo in modo disinteressato. Non perseguiamo scopi economici propri.\n2. Nessuna persona può essere favorita da spese estranee allo scopo di foodsharing o da una retribuzione sproporzionatamente alta.\n3. I nostri mezzi provengono in primo luogo da contributi volontari e donazioni. Per adempiere agli scopi dell’associazione sono inoltre possibili contributi pubblici.\n4. Nell’accettare donazioni occorre fare attenzione che l’idea e la missione sociale di foodsharing non vengano danneggiate dal donatore o dalla donatrice. Per alimenti salvati non si può accettare denaro. In caso di dubbio decide il foodsharing e.V. nazionale che cosa è ammesso e che cosa no.\n5. In ogni associazione foodsharing deve essere possibile, senza alcuna eccezione, essere membri senza quota associativa.\n6. Le spese necessarie dei titolari di cariche per adempiere ai loro compiti associativi possono essere rimborsate. Inoltre, le attività possono essere retribuite nell’ambito di indennità forfettarie per volontari.\n7. Possono essere creati posti retribuiti per il lavoro educativo e l’organizzazione della struttura nazionale di foodsharing.\n8. I rapporti finanziari e di attività devono essere consultabili online ogni anno in modo trasparente.\n9. L’accesso alla piattaforma foodsharing è e rimane gratuito.\n\n## <a id=\"grundsatz-4-parteipolitik-und-toleranz\"></a>Principio 4 - Politica di partito e tolleranza\n\nfoodsharing lavora indipendentemente dai partiti politici e dall’appartenenza religiosa.\n\nQualsiasi discriminazione, come ad esempio il razzismo o il sessismo, non è tollerata, così come molestie, offese, insulti, esclusione, diffamazione e dichiarazioni fasciste. foodsharing non collabora quindi con partiti, organizzazioni o singole persone che sostengono posizioni di questo tipo o altre posizioni discriminatorie.\n\n## <a id=\"grundsatz-5-kooperation-und-zusammenarbeit\"></a>Principio 5 - Cooperazione e collaborazione\n\nIl lavoro dei gruppi locali di foodsharing ha per lo più un riferimento locale. I gruppi locali rispettano i confini dei distretti e collaborano strettamente e bene, senza farsi concorrenza.\n\n### <a id=\"das-bedeutet-2\"></a>Questo significa:\n\n1. Una comunicazione trasparente e corretta è la base del nostro lavoro. Su di essa costruiamo strutture e processi decisionali.\n2. In caso di disaccordi nel lavoro regionale di foodsharing, ad es. alla fondazione di nuove associazioni o con gruppi locali già esistenti, va cercata prima di tutto una soluzione consensuale sul posto.\n3. I gruppi locali si scambiano informazioni ed esperienze a livello regionale e nazionale.\n4. Tutti i gruppi locali si aiutano a vicenda con l’obiettivo di sostenere efficacemente il lavoro locale di foodsharing.\n\n## <a id=\"grundsatz-6-foodsharing-namensnutzung\"></a>Principio 6 - Uso del nome foodsharing\n\nIl marchio denominativo e figurativo «foodsharing» e «foodsharing Akademie» sono protetti legalmente come marchi registrati dal foodsharing e.V.\n\n### <a id=\"das-bedeutet-3\"></a>Questo significa:\n\n1. Il nome del gruppo locale è per principio il nome della località posto dopo il nome «foodsharing» ed eventualmente e.V., ad es. «foodsharing München e.V.»\n2. Tutti i gruppi locali di nuova fondazione e il loro nome necessitano del consenso esplicito del foodsharing e.V.\n3. Il nome «foodsharing» va richiesto per iscritto al foodsharing e.V. e viene concesso solo a gruppi locali per progetti foodsharing concreti.\n4. Ogni gruppo locale deve riprendere il logo di foodsharing nella forma e nel colore secondo le indicazioni del manuale di design. Il logo può essere richiesto al gruppo di lavoro «Materialien - Grafikdateien» (materiali - file grafici).\n\n## <a id=\"grundsatz-7-umgang-mit-konflikten\"></a>Principio 7 - Gestione dei conflitti\n\nLe controversie tra foodsaver, tra gruppi locali e nella rete non vengono affrontate in pubblico.\n\n### <a id=\"das-bedeutet-4\"></a>Questo significa:\n\n1. Controversie e disaccordi vanno prima affrontati e chiariti internamente. È importante restare il più possibile oggettivi ed educati, mantenere la calma e rispondere in modo ponderato.\n2. Se i conflitti non possono essere risolti né con un colloquio né con una mediazione, decide il gruppo locale delle segnalazioni, l’organo di conciliazione, la risoluzione dei conflitti con le catene (KKL) o l’ufficio nazionale per la gestione dei conflitti (ÜKBS). Se queste strutture falliscono, sono corrotte e/o il foodsharing e.V. è direttamente coinvolto (ad es. per danni alla reputazione sulla stampa, denunce, questioni di responsabilità o in casi gravi, ad es. aggressioni sessuali, estremismo di destra), decide il foodsharing e.V. stesso.\n\n## <a id=\"grundsatz-8-einhaltung-der-grundsaetze\"></a>Principio 8 - Rispetto dei principi\n\nIl foodsharing e.V. vigila sul rispetto dei principi di foodsharing. In caso di mancato rispetto dei principi di foodsharing, il foodsharing e.V. può avviare un’esclusione dalla piattaforma foodsharing.\n\nNon esiste alcun diritto di accesso alla piattaforma foodsharing.\n\nIn prospettiva, questi compiti devono essere assunti da una federazione nazionale da fondare a partire dalle associazioni locali.\n\n---\n\n*Articolo di*: [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Contatto](mailto:vorstand@foodsharing.network)*)\\\n*Ultima revisione il 10.08.2026*\n\n---\n\n*Originale nel wiki di foodsharing: [Grundsätze](https://wiki.foodsharing.network/wiki/Grunds%C3%A4tze)*\n"}

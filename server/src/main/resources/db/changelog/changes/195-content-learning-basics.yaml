              - column: {name: title, value: "Règles d’hygiène"}
              - column: {name: body, value: "*En vigueur depuis le 13.12.2024*\\\n*[Modifications](https://drive.google.com/file/d/1XtVCJDSJlYDkLY2lctcN7s1zybYO8FhT) par rapport à la version précédente (pdf)*\n\n**Explications détaillées et guides pratiques**\\\nPour le travail pratique de foodsaver, il existe quelques autres textes avec des conseils et des informations.\n\n- *[Erläuterungen zu den Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen)* (explications des règles d’hygiène) - explications de chaque règle, pourquoi elle est importante pour foodsharing et ce qu’elle signifie concrètement.\n- *[Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel)* (guide d’hygiène des aliments) - une série d’articles sur la manipulation des aliments sauvés\n\n*Développement des règles d’hygiène*\\\nLes règles d’hygiène sont développées par l’*AG Hygiene* (groupe de travail Hygiène). Les propositions et idées peuvent être envoyées à tout moment au groupe de travail Hygiène (de préférence par e-mail à [hygiene@foodsharing.network](mailto:hygiene@foodsharing.network)).\\\nLe groupe de travail examine toutes les idées et propositions reçues ; une modification des règles en vigueur est prévue une fois par an – en général en novembre.\\\nToutes les personnes intéressées sont chaleureusement invitées à [collaborer au groupe de travail](https://foodsharing.de/?page=bezirk&bid=1686).\n\n### <a id=\"praeambel\"></a>Préambule\n\nLes règles d’hygiène fixent des exigences minimales pour foodsharing et tous les foodsavers. Elles doivent d’une part garantir le respect des prescriptions légales d’hygiène dans le travail pratique avec les aliments. D’autre part, elles doivent protéger contre les erreurs et donner des indications sur la manière de manipuler les aliments pour qu’ils puissent être consommés sans danger.\\\nIl peut tout à fait être judicieux de rendre certaines règles un peu plus strictes pour certaines situations, certains commerces ou districts, si les conditions locales l’exigent.\n\n***Chaque district peut donc durcir les règles pour son territoire ; les adaptations ne doivent toutefois pas contredire les règles d’hygiène énoncées ici.***\n\n### <a id=\"a-taetigkeitsverbote-beim-umgang-mit-lebensmitteln-42-43-ifsg\"></a>A) Interdictions d’activité lors de la manipulation d’aliments (§§42, 43 IfSG)\n\n1\\) Des vêtements, des cheveux et des mains propres sont une condition pour manipuler des aliments.\n\n2\\) En cas des symptômes suivants, on est tenu de consulter un médecin avant de manipuler des aliments sensibles non emballés :\n\n- diarrhée, fortes nausées, vomissements, forte toux\n- maladies contagieuses, en particulier choléra, typhoïde, paratyphoïde, dysenterie, salmonellose, EHEC, hépatite A ou E :\n- maladies de peau et plaies ouvertes qui sont enflammées, suppurent ou suintent\n- fièvre supérieure à 38,5°C\n\nLa manipulation d’aliments n’est ensuite autorisée que si le médecin délivre un certificat écrit de non-contagion.\\\n[Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#A.29_T.C3.A4tigkeitsverbote_beim_Umgang_mit_Lebensmitteln_.28.C2.A7.C2.A742.2C_43_IfSG.29)\n\n### <a id=\"b-umgang-mit-lebensmitteln\"></a>B) Manipulation des aliments\n\n#### <a id=\"1-direkter-umgang-transport-und-lagerung\"></a>1) Manipulation directe, transport et stockage\n\n- **a)** *Produits de boulangerie non emballés* : une pince à pâtisserie, des gants (si possible des gants réutilisables lavables) ou des mains soigneusement lavées sont obligatoires.\n\n  Pour tous les autres aliments, les gants ne sont en général pas nécessaires, sauf s’ils sont recommandés pour des raisons particulières (ou par des instructions officielles).\n\n  Pour les gâteaux et les tartes, il faut si possible utiliser des récipients rigides. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1a.29_-_Unverpackte_Backwaren)\n- **b)** *Produits réfrigérés* : la chaîne du froid doit si possible être respectée : [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - *Transport* dans un sac ou une glacière avec des blocs réfrigérants, avec au maximum 20 minutes d’interruption, sans exposition au soleil ou à la chaleur\n  - *Stockage* sans interruption dans un réfrigérateur ou (seulement pour une courte durée) dans un sac ou une glacière avec des blocs réfrigérants\n- **c)** Sont des *produits réfrigérés* : [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - les aliments qui, selon l’emballage, doivent être conservés entre +2 et +8°C\n  - les salades de pâtes et de pommes de terre, les plats préparés avec de l’huile/de la graisse\n  - les gâteaux à garniture non cuite, les tartes à la crème et à la chantilly\n- **d)** Les *aliments en partie avariés* doivent être emballés séparément des autres aliments. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1d.29_-_Angefaulte_Lebensmittel)\n- **e)** Les aliments non emballés ne peuvent être transportés et stockés que dans des *emballages propres* et *aptes au contact alimentaire*. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_1._Absatz_-_Lebensmittelechte_.28und_saubere.29_Verpackungen)\n\n  Les emballages aptes au contact alimentaire se reconnaissent\n  - à la mention « pour aliments » ou au symbole verre et fourchette\n  - aux étiquettes d’origine qui prouvent l’utilisation initiale pour des aliments\n\n  [Sources d’approvisionnement en emballages aptes au contact alimentaire](https://docs.google.com/spreadsheets/d/1LpZBgtloqpNjDI9X3-7v91wSae61WqxbBAPyc7KrqoQ)\n\n  Pour les *aliments chauds*, seuls des récipients conçus pour la température correspondante peuvent être utilisés.\n\n  *Exception* : [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_Ausnahme_-_nicht-lebensmittelechte_Verpackungen)\n  - Les aliments remis par un commerce dans un emballage non apte au contact alimentaire ou sale devraient si possible être reconditionnés sur le lieu de collecte. Ils peuvent aussi, le cas échéant, être jugés impropres à la consommation lors de la collecte et laissés sur place.\n\n#### <a id=\"2-weitergabe-allgemein\"></a>2) Don en général\n\nLes règles suivantes s’appliquent uniquement au ***don*** d’aliments sauvés.\\\nLes foodsavers peuvent utiliser eux-mêmes sans restriction, à leurs propres risques, tous les aliments sauvés et aussi les autres biens sauvés, ou les utiliser comme nourriture pour animaux.\\\n[Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_Weitergabe_allgemein)\n\n- **a)** Les foodsavers sont *responsables* des aliments qu’ils et elles donnent. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2a.29_-_Verantwortlichkeit_der_Foodsaver)\n- **b)** Un *droit à réparation* du ou de la bénéficiaire pour des dommages consécutifs n’existe qu’en cas de négligence grave ou d’intention. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl%C3%A4ssigkeit_.28und_Vorsatz.29)\n- **c)** Pour exclure une *négligence grave* : [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl.C3.A4ssigkeit_.28und_Vorsatz.29)\n  - les aliments doivent être transportés et stockés correctement (voir section B1) )\n  - les aliments doivent être triés après la date limite de consommation\n  - chaque pièce doit être *contrôlée* avant le don pour vérifier qu’elle est consommable :\n    - Ne donner que ce que l’on mangerait encore soi-même !\n    - ***Test œil-nez-bouche*** : vérifier l’aspect, l’odeur et le cas échéant le goût (dans la mesure du possible sans ouvrir l’emballage) !\n- **d)** Il est *interdit* de donner des aliments [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2d.29_-_Verbotene_Lebensmittel)\n  - avec de la moisissure ou des taches noires\n  - après la date limite de consommation\n  - avec une date limite de consommation lorsque l’emballage le plus intérieur est ouvert\n  - avec une date de durabilité minimale lorsque l’emballage le plus intérieur est ouvert, si le moment de l’ouverture est inconnu ou remonte à longtemps\n  - avec des emballages sous vide gonflés\n- **e)** Il est en outre interdit de donner des *médicaments*. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2e.29_-_Arzneimittel)\n- **f)** La *nourriture pour animaux* peut être donnée. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2f.29_-_Tierfutter)\n- **g)** Les *produits non comestibles* (p. ex. produits de nettoyage et de soin, cosmétiques, livres, vêtements) doivent être donnés si clairement séparés des aliments et de la nourriture pour animaux que tout risque de confusion est exclu. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2g.29_-_Nicht-Essbares)\n\n### <a id=\"c-zusaetzliche-regeln-fuer-verschiedene-stufen-der-weitergabe\"></a>C) Règles supplémentaires pour les différents niveaux de don\n\nLes aliments sauvés doivent être répartis en 4 niveaux de don :\n\n- Niveau 1 : don non personnel\n- Niveau 2 : don personnel\n- Niveau 3 : consommation personnelle ou nourriture pour animaux\n- Niveau 4 : élimination.\n\nSelon le niveau, d’autres règles s’appliquent en plus de celles de la section B). [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Teil_C.29_-_Stufen_der_Weitergabe)\n\n#### <a id=\"stufe-1-nicht-persoenliche-weitergabe\"></a>Niveau 1) Don non personnel\n\nsans contact direct avec les bénéficiaires (p. ex. Fairteiler, autres organisations) [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#1.29_-_Nicht-pers%C3%B6nliche_Weitergabe)\n\n- **a)** Il est *interdit* de donner\n  - de la viande hachée, du poisson cru, des produits à base de lait cru non chauffé\n  - des plats fraîchement préparés avec des œufs crus, des œufs liquides\n  - des crèmes, du pudding, du tiramisu, de la mayonnaise (si faits maison avec des œufs ou du lait)\n  - des œufs crus après la date de durabilité minimale\n  - des champignons cueillis soi-même\n  - des boissons alcoolisées, des aliments contenant de l’alcool ou du THC, des boissons énergisantes\n  - des aliments avec de la moisissure ou des parties pourries\n  - des aliments à conserver au frais dont la chaîne du froid a été interrompue\n  - des plats préparés, si des client·es ont pu avoir un contact direct avec les aliments\n  - des plats préparés servis chauds\n  - des plats préparés qui doivent être réfrigérés\n  - des aliments avec une date limite de consommation ou de durabilité minimale dont l’emballage (le plus intérieur) est ouvert\n  - des aliments remis ou stockés dans des emballages non aptes au contact alimentaire ou sales\n\n  [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1a.29_-_Verbotene_Lebensmittel)\n- **b)** Les aliments *avec de la terre* ne doivent pas être stockés au-dessus d’autres aliments. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1b.29_-_Erdbehaftete_Lebensmittel)\n- **c)** Les plats *préparés* doivent être couverts ou dans un récipient fermé. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **d)** *Liste des ingrédients* : pour les plats faits maison, tous les ingrédients et la date de préparation doivent être inscrits dessus. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **e)** Les aliments *transvasés* doivent être étiquetés avec la liste complète des ingrédients, la date de transvasement et le cas échéant la date de durabilité minimale. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n\n#### <a id=\"stufe-2-persoenliche-weitergabe\"></a>Niveau 2) Don personnel\n\navec la possibilité de parler avec les bénéficiaires [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_-_Pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Interdit* : [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2a.29_-_Verbotene_Lebensmittel)\n  - les aliments qui ne sont plus consommables que *sous réserve et avec prudence* ou qui sont *très peu appétissants* (p. ex. fruits/légumes avec des parties très molles, une moitié brune, pain arraché grossièrement ou dur et desséché)\n  - les aliments dont la *chaîne du froid* a été interrompue pendant longtemps (selon l’aliment et la météo – règle empirique : le trajet direct du commerce au réfrigérateur est acceptable)\n- **b)** *Décision selon la personne au cas par cas* : les aliments ne peuvent être donnés que si l’on *fait confiance* aux bénéficiaires pour manipuler et juger les aliments de manière responsable (p. ex. pour l’alcool, le poisson ou les fruits/légumes en partie avariés). [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2b.29_-_Entscheidung_im_Einzelfall)\n- **c)** *Indications orales* : il faut le cas échéant signaler aux bénéficiaires [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2c.29_-_M%C3%BCndliche_Hinweise)\n  - que les aliments doivent être consommés *rapidement*\n  - qu’ils doivent encore *contrôler* les aliments avant de les consommer\n  - si la *chaîne du froid* n’a pas pu être respectée\n\n#### <a id=\"stufe-3-eigenkonsum-oder-tierfutter\"></a>Niveau 3) Consommation personnelle ou nourriture pour animaux\n\n- **a)** Les foodsavers peuvent consommer eux-mêmes les aliments ou les donner comme nourriture pour animaux. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n- **b)** Les foodsavers peuvent utiliser eux-mêmes d’autres choses sauvées, en dehors des aliments et de la nourriture pour animaux, mais pas les donner au nom de foodsharing. [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n\n#### <a id=\"stufe-4-entsorgung\"></a>Niveau 4) Élimination\n\nLes aliments qui n’entrent pas dans les catégories 1), 2) ou 3) doivent être éliminés correctement (poubelle, compostage, etc.). [Explication](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#4.29_-_Entsorgung)\n\n---\n\n*Article de* : [AG Hygiene - Austausch und (Fach)Wissen](https://foodsharing.de/?page=bezirk&bid=1686) (*[Contact](mailto:hygiene@foodsharing.network)*)\\\n*Dernière révision le 13.12.2024*\n\n---\n\n*Original dans le wiki foodsharing : [Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln)*\n"}

              - column: {name: title, value: "Règles de conduite"}
              - column: {name: body, value: "*En vigueur depuis le 02.01.2020*\n\n**Explications et justifications**\\\nPour les nouvelles règles de conduite, il existe une [page d’explications](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen) qui explique pour chaque règle pourquoi elle est importante pour foodsharing.\n\nLes règles de conduite sont développées par l’*AG Verhaltensregeln und Meldesystem* (groupe de travail règles de conduite et système de signalement). Les propositions d’amélioration et les idées peuvent être envoyées à tout moment au groupe de travail (de préférence par e-mail à [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nLe groupe de travail examine toutes les idées et propositions reçues ; une modification des règles en vigueur est prévue deux fois par an – en général en mai et en novembre.\\\nToutes les personnes intéressées sont chaleureusement invitées à [collaborer au groupe de travail](https://foodsharing.de/?page=bezirk&bid=1640).\n\n### <a id=\"praeambel\"></a>Préambule\n\nfoodsharing a besoin de règles de conduite uniformes pour tous les foodsavers afin de pouvoir travailler ensemble en tant que grand mouvement, désormais même international, et de créer et conserver en public – auprès des commerces partenaires, des particuliers et dans la politique – une image positive et la confiance en nous.\n\nCes règles sont donc la base pour tous les foodsavers et tous les districts foodsharing. Vu les nombreuses approches différentes dans la pratique, il n’est toutefois pas possible de fixer des règles générales pour chaque situation et pour tous les districts. C’est pourquoi il existe quelques règles (B7, C3 en partie, C4) que les districts peuvent et doivent adapter aux conditions et idées locales ; elles sont en italique.\n\nEn outre, chaque district est libre d’ajouter des règles avec mesure, tant que les ajouts ne contredisent pas les autres règles.\n\n**Les abréviations suivantes sont utilisées dans ce texte** :\\\nFS = foodsaver, BV = responsable de commerce, BOT = ambassadeur·rice\n\n## <a id=\"a-allgemeines-verhalten-bei-foodsharing\"></a>A) Comportement général chez foodsharing\n\n- **A1)** Les relations avec les autres FS sont toujours aimables, respectueuses et pacifiques. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A1.29_.E2.80.93_Freundlicher_Umgang_untereinander)\n- **A2)** Entre FS, on se tutoie. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A2.29_.E2.80.93_Duzen_als_Standard)\n- **A3)** Les divergences d’opinion dans une équipe de commerce doivent être discutées au sein de l’équipe, au sein d’un district au sein du district. Les différends personnels ne sont pas réglés dans les forums, sur les murs ou dans le chat d’équipe. Ils doivent être clarifiés par message privé ou en personne, ou avec le soutien des groupes prévus pour le district. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A4)** En cas de différends et de conflits, il faut toujours rester factuel·le et poli·e, éviter l’ironie et le sarcasme, garder la tête froide et répondre de manière réfléchie, en particulier lors de discussions politiques ou sur d’autres sujets sérieux. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A5)** Les messages privés et les informations qu’ils contiennent ne peuvent être publiés ou transmis qu’avec l’autorisation de l’expéditeur ou de l’expéditrice. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A5.29_.E2.80.93_Ver.C3.B6ffentlichung_von_privaten_Nachrichten)\n- **A6)** Les œuvres et contenus protégés par le droit d’auteur, la publicité et le spam ne sont pas autorisés sur la plateforme en ligne.\\\n  Les contributions qui enfreignent l’une de ces règles et les sujets étrangers à foodsharing peuvent être supprimés. La suppression est décidée dans les groupes de travail par leurs admins, pour les événements par la personne qui les a créés, sur les murs de commerce par les responsables du commerce. Dans les forums, c’est la [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (instance locale d’arbitrage) qui décide à la demande d’un membre du forum ; la suppression est effectuée par la ZMG. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_-_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A7)** Dans les forums, avant la suppression d’une contribution, un message privé avec le texte et la justification de la suppression est envoyé à l’auteur·rice.\\\n  La transparence est importante. C’est pourquoi chaque contribution supprimée est marquée ainsi : « Cette contribution/ce sujet de [...] a été supprimé·e parce qu’il enfreignait une règle de conduite de foodsharing ou que le sujet ne relève pas du domaine de foodsharing. » [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_.E2.80.93_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A8)** Les FS sont tenu·es d’indiquer correctement dans leur profil sur la plateforme foodsharing leur nom, adresse postale, date de naissance, une photo de profil sur laquelle on les reconnaît et, si disponible, un numéro de téléphone (recommandé), de les tenir à jour et de les justifier sur demande par une pièce d’identité. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A8.29_.E2.80.93_Verpflichtung_zur_Angabe_korrekter_pers.C3.B6nlicher_Daten)\n- **A9)** Les informations sur les processus internes de foodsharing (p. ex. données personnelles d’autres foodsavers, détails des coopérations, horaires de collecte) ne peuvent être communiquées qu’au sein de foodsharing et uniquement aux foodsavers qui en ont besoin pour leur travail chez foodsharing. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A9.29_-_Vertraulichkeit_von_Foodsaver-Daten_und_foodsharing-internen_Informationen)\n\n## <a id=\"b-verhalten-bei-abholungen\"></a>B) Comportement lors des collectes\n\n- **B1)** Lors des collectes, la ponctualité et une attitude appropriée sont importantes. Il est interdit d’amener des animaux dans le commerce.\\\n  Il n’est pas permis d’amener des enfants. En accord avec le commerce, les BV peuvent autoriser des exceptions pour certain·es FS et certains enfants.\\\n  La carte de FS doit toujours être emportée lors des collectes. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B1.29.2C_Satz_1_.E2.80.93_P.C3.BCnktlichkeit_und_Auftreten)\n- **B2)** Les collectes en dehors des créneaux fixés ne sont autorisées qu’après accord avec un·e BV. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B2.29_.E2.80.93_Abholungen_au.C3.9Ferhalb_der_vereinbarten_Termine)\n- **B3)** Si plusieurs FS collectent ensemble, ils et elles entrent dans le commerce et en sortent ensemble et effectuent la collecte sans dispute ni discussion. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B3.29_.E2.80.93_mehrere_Abholer.2Ainnen)\n- **B4)** Les FS qui collectent emportent toujours tous les aliments remis par le commerce qui sont encore consommables. Des exceptions peuvent être convenues avec le commerce.\\\n  Tous les FS prennent la même quantité d’aliments, sauf si tout le monde est d’accord avec une autre répartition. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B4.29_.E2.80.93_alle_LM_mitnehmen_.28.3F.29)\n- **B5)** Lors d’une collecte, seules les personnes suivantes peuvent entrer dans le commerce :\\\n  – les FS inscrit·es pour le créneau ou qui remplacent quelqu’un, avec leur carte ;\\\n  – les futur·es FS après acceptation de l’accord juridique, dans le cadre d’une collecte d’introduction avec un·e FS\\\n  Les autres personnes doivent attendre à l’écart du commerce en tant qu’« aide pour porter ». [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B5.29_.E2.80.93_Wer_darf_abholen_gehen)\n- **B6)** Pendant la collecte, il faut avoir des égards pour la clientèle et le personnel du commerce. On ne mène pas de discussions.\\\n  Les personnes qui collectent suivent les souhaits du personnel et laissent le lieu de collecte en ordre. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B6.29_.E2.80.93_Verhalten_im_Betrieb)\n- **B7)** *Un temps d’attente demandé par le commerce (écart par rapport à l’heure convenue) jusqu’à 15 minutes doit être accepté ; ensuite, la collecte peut être annulée poliment.* [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B7.29_.E2.80.93_Wartezeit)\n- **B8)** Si le personnel d’un commerce se montre désagréable, les personnes qui collectent restent malgré tout polies ; elles peuvent ensuite informer un·e des BV. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B8.29_.E2.80.93_Keine_Diskussionen_mit_Mitarbeitenden)\n- **B9)** Il faut s’abstenir de tout commentaire sur la quantité, le type et l’utilisation des aliments sauvés par les FS. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B9.29_-_Wenn_nichts_zu_retten_ist)\n- **B10)** Aucun aliment ne peut être vendu ou utilisé comme monnaie d’échange, pas même ceux pour lesquels des aliments sauvés ont été transformés. Une consigne pour des caisses, bouteilles ou autres peut être acceptée ou demandée si elle a été payée lors de la collecte. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B10.29_-_kein_Verkauf.2C_kein_Tauschen)\n- **B11)** Pour les collectes, il faut utiliser des moyens aussi respectueux de l’environnement que possible. Les longs trajets en voiture et l’utilisation inutile d’articles jetables doivent être évités dans la mesure du possible. Si la collecte est possible sans voiture, les BV doivent prévoir assez de créneaux pour rendre ce type de collecte possible et l’encourager. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B11.29_.E2.80.93_.C3.B6kologische_Mittel)\n- **B12)** Le but de foodsharing est de sauver les aliments de la poubelle. Les personnes qui collectent décident elles-mêmes à qui les aliments sont donnés. Le besoin n’est pas déterminant. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B12.29_.E2.80.93_nicht_nur_an_Bed.C3.BCrftige)\n- **B13)** Toutes les personnes qui collectent doivent s’efforcer de consommer entièrement les aliments sauvés ou de les « fairteiler » (partager, avec des personnes, au besoin aussi avec des animaux). [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B13.29_.E2.80.93_gerettete_Lebensmittel_wegwerfen.3F)\n\n## <a id=\"c-betriebe-betriebsteam-planung-von-abholungen\"></a>C) Commerces, équipe du commerce, planification des collectes\n\n- **C1)** Avant une collecte, les FS doivent connaître la version actuelle des particularités du commerce ainsi que les messages actuels sur le mur et dans le chat d’équipe. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C1.29_.E2.80.93_aktuelle_Informationen_lesen_vor_Abholungen)\n- **C2)** Toutes les collectes dans les commerces sont coordonnées via la page du commerce sur la plateforme en ligne de foodsharing. Pour certains commerces, d’autres moyens de communication peuvent être utilisés en complément en accord avec les BOT, à condition qu’aucun membre de l’équipe n’en soit exclu. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C2.29_.E2.80.93_Organisation_nur_.C3.BCber_die_foodsharing-Plattform)\n- **C3)** Quiconque s’inscrit à un créneau de collecte est responsable de la collecte. Quiconque ne peut exceptionnellement pas assurer un créneau doit se désinscrire immédiatement *et chercher un remplacement par message à l’équipe.\\\n  En cas d’annulation moins de 24 heures avant le créneau, le ou la FS doit chercher un remplacement par message à l’équipe et par téléphone et, en cas d’urgence, informer un·e BV par téléphone.* [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C3.29_.E2.80.93_Austragen_aus_Abholterminen)\n- **C4)** *Les communications du personnel d’un commerce aux personnes qui collectent doivent être transmises directement à au moins un·e BV (recommandation).* [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C4_.E2.80.93_Mitteilungen_des_Betriebs)\n- **C5)** Les règles particulières pour un commerce sont toujours convenues par les BV avec le commerce et fixées dans les particularités sur la page du commerce. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C5.29_.E2.80.93_Festlegungen_f.C3.BCr_Abholungen_in_einem_Betrieb)\n- **C6)** Les nouveaux commerces ne peuvent être démarchés de sa propre initiative que par des personnes ayant réussi le quiz BV, en accord avec un·e BOT et, pour les chaînes, avec le ou la KAM responsable ou le groupe chaînes de commerces. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C6.29_.E2.80.93_Ansprechen_von_Betrieben)\n- **C7)** Avant de démarcher un commerce, il faut vérifier s’il est déjà enregistré sur la plateforme en ligne ; sinon, il doit être enregistré. [Explication](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C7.29_.E2.80.93_neue_Betriebe_eintragen_auf_Plattform)\n\n---\n\n*Article de* : [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Contact](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Dernière révision le 01.02.2020*\n\n---\n\n*Original dans le wiki foodsharing : [Verhaltensregeln](https://wiki.foodsharing.network/wiki/Verhaltensregeln)*\n"}

              - column: {name: title, value: "Conditions pour les rôles dans foodsharing"}
              - column: {name: body, value: "*État : 08.11.2026 - 00h00*\n\nIl existe différents rôles et tâches chez foodsharing. Cela commence par les foodsharers (c’est-à-dire nous tous et toutes), et il y a d’autres rôles qui impliquent un peu plus de responsabilité et pour lesquels il faut donc remplir d’autres conditions. Elles sont réunies dans cet article.\n\n### <a id=\"allgemeines-fuer-alle-rollen\"></a>Généralités pour tous les rôles\n\n1. Sur demande, les personnes reçoivent chez foodsharing les statuts suivants et donc la possibilité d’exercer les rôles correspondants, si elles remplissent les conditions indiquées pour chacun.\n2. Si une condition n’est plus remplie, le statut correspondant est retiré ; si la condition est de nouveau remplie, le ou la foodsaver ou foodsharer retrouve le statut.\n\n### <a id=\"voraussetzungen-fuer-foodsharer-innen\"></a>Conditions pour les foodsharers\n\n- avoir au moins 18 ans\n- compte sur la plateforme foodsharing\n- acceptation des bases de foodsharing\n- consentement à la déclaration de protection des données\n- pas de carton rouge\n\n### <a id=\"voraussetzungen-fuer-unverifizierte-foodsaver-innen\"></a>Conditions pour les foodsavers non vérifié·es\n\n- foodsharer\n- quiz foodsaver réussi\n- confirmation de l’accord juridique (Allemagne, Autriche) pour les foodsavers\n- pas de carton jaune-rouge dont la durée n’est pas encore écoulée\n\n### <a id=\"voraussetzungen-fuer-verifizierte-foodsaver-innen\"></a>Conditions pour les foodsavers vérifié·es\n\n- foodsharer non vérifié·e\n- données correctes dans le profil : nom, adresse, date de naissance, photo représentative\n- au moins 3 collectes d’introduction réussies en 6 mois\n- pas de carton jaune dont la durée n’est pas encore écoulée\n\n### <a id=\"voraussetzungen-fuer-betriebsverantwortliche\"></a>Conditions pour les responsables de commerce\n\n- foodsaver vérifié·e\n- quiz pour responsables de commerce réussi\n- consentement à la notice de protection des données (complément à la déclaration de protection des données)\n- consentement à l’accord juridique pour responsables de commerce (complément à l’accord juridique)\n\n### <a id=\"voraussetzungen-fuer-botschafter-innen\"></a>Conditions pour les ambassadeur·rices\n\n- foodsaver vérifié·e depuis au moins 6 mois\n- pas de conséquences pour des violations de règles pertinentes qui ne peuvent pas encore être effacées\n- responsable de commerce\n- quiz pour ambassadeur·rices réussi\n- au moins 30 collectes chez foodsharing\n- élu·e démocratiquement dans le district selon les « règles pour les élections des ambassadeur·rices » de foodsharing\n- un entretien d’accueil avec l’équipe d’accueil des ambassadeur·rices\n- Durant les 2 premières années après la création d’un district, le nombre de collectes, la durée comme foodsaver vérifié·e et l’élection ne sont pas exigés des ambassadeur·rices.\n\n---\n\n*Article de* : [AG Wiki](https://wiki.foodsharing.network/wiki/Gruppe_Wiki) (*[Contact](mailto:wiki@foodsharing.network)*)\\\n*Dernière révision le 08.11.2026*\n\n---\n\n*Original dans le wiki foodsharing : [Voraussetzungen für Rollen in foodsharing](https://wiki.foodsharing.network/wiki/Voraussetzungen_f%C3%BCr_Rollen_in_foodsharing)*\n"}
        - insert:
            tableName: content_page_i18n
            columns:
              - column: {name: id, value: "00000012-0002-4000-8000-000000001055"}
              - column: {name: version, valueNumeric: 0}
              - column: {name: created_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: updated_at, valueDate: "2026-11-10T00:00:00"}
              - column: {name: owner_id, value: "00000012-0001-4000-8000-000000000105"}
              - column: {name: language, value: "it"}
              - column: {name: title, value: "Requisiti per i ruoli in foodsharing"}
              - column: {name: body, value: "*Stato: 08.11.2026 - ore 00:00*\n\nIn foodsharing ci sono diversi ruoli e compiti. Si inizia con i foodsharer (cioè tutti noi), e ci sono altri ruoli che comportano un po’ più di responsabilità e per i quali bisogna quindi soddisfare ulteriori requisiti. Sono raccolti in questo articolo.\n\n### <a id=\"allgemeines-fuer-alle-rollen\"></a>Aspetti generali per tutti i ruoli\n\n1. Su richiesta, le persone ricevono in foodsharing i seguenti status e quindi la possibilità di svolgere i ruoli corrispondenti, se soddisfano i requisiti indicati per ciascuno.\n2. Se un requisito viene meno, lo status corrispondente viene revocato; se il requisito è di nuovo soddisfatto, il o la foodsaver o foodsharer riottiene lo status.\n\n### <a id=\"voraussetzungen-fuer-foodsharer-innen\"></a>Requisiti per i foodsharer\n\n- almeno 18 anni\n- account sulla piattaforma foodsharing\n- accettazione delle basi di foodsharing\n- consenso all’informativa sulla privacy\n- nessun cartellino rosso\n\n### <a id=\"voraussetzungen-fuer-unverifizierte-foodsaver-innen\"></a>Requisiti per foodsaver non verificati\n\n- foodsharer\n- quiz foodsaver superato\n- conferma dell’accordo legale (Germania, Austria) per foodsaver\n- nessun cartellino giallo-rosso la cui durata non sia ancora scaduta\n\n### <a id=\"voraussetzungen-fuer-verifizierte-foodsaver-innen\"></a>Requisiti per foodsaver verificati\n\n- foodsharer non verificato/a\n- dati corretti nel profilo: nome, indirizzo, data di nascita, foto rappresentativa\n- almeno 3 ritiri introduttivi completati con successo entro 6 mesi\n- nessun cartellino giallo la cui durata non sia ancora scaduta\n\n### <a id=\"voraussetzungen-fuer-betriebsverantwortliche\"></a>Requisiti per responsabili dei negozi\n\n- foodsaver verificato/a\n- quiz per responsabili dei negozi superato\n- consenso all’informativa sulla protezione dei dati (complemento all’informativa sulla privacy)\n- consenso all’accordo legale per responsabili dei negozi (complemento all’accordo legale)\n\n### <a id=\"voraussetzungen-fuer-botschafter-innen\"></a>Requisiti per ambasciatori e ambasciatrici\n\n- foodsaver verificato/a da almeno 6 mesi\n- nessuna conseguenza per violazioni rilevanti delle regole che non siano ancora cancellabili\n- responsabile di negozio\n- quiz per ambasciatori superato\n- almeno 30 ritiri in foodsharing\n- eletto/a democraticamente nel distretto secondo le «regole per le elezioni degli ambasciatori» di foodsharing\n- un colloquio di benvenuto con il team di benvenuto degli ambasciatori\n- Nei primi 2 anni dopo la fondazione di un distretto, per gli ambasciatori non valgono come requisiti il numero di ritiri, la durata come foodsaver verificato/a e l’elezione.\n\n---\n\n*Articolo di*: [AG Wiki](https://wiki.foodsharing.network/wiki/Gruppe_Wiki) (*[Contatto](mailto:wiki@foodsharing.network)*)\\\n*Ultima revisione il 08.11.2026*\n\n---\n\n*Originale nel wiki di foodsharing: [Voraussetzungen für Rollen in foodsharing](https://wiki.foodsharing.network/wiki/Voraussetzungen_f%C3%BCr_Rollen_in_foodsharing)*\n"}

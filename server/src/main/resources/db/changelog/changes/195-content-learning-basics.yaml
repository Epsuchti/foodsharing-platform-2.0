              - column: {name: title, value: "Violations des règles – conséquences et traitement"}
              - column: {name: body, value: "*En vigueur depuis le 01.10.2020*\n\n***Explications et justifications***\\\nLe traitement des violations des règles est expliqué en détail dans l’article du wiki [Regelverletzungen](https://wiki.foodsharing.network/wiki/Regelverletzungen) (violations des règles). L’article [Regelverletzungen - Erläuterungen](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen) donne des justifications et des explications pour chaque disposition.\n\nCes dispositions sont développées par l’*AG Verhaltensregeln und Meldesystem* (groupe de travail règles de conduite et système de signalement). Les propositions et idées peuvent être envoyées à tout moment au groupe de travail (de préférence par e-mail à [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nLe groupe de travail examine toutes les idées et propositions reçues.\n\nToutes les personnes intéressées sont chaleureusement invitées à [collaborer au groupe de travail](https://foodsharing.de/?page=bezirk&bid=1640).\n\n### <a id=\"begriffe-und-abkuerzungen\"></a>Termes et abréviations\n\n- Signalement d’une violation des règles (**MRV**)\n- [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (groupe local de signalement, **LMG**)\n- [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (instance locale d’arbitrage) dans le district (**LS**)\n- Personnes ayant des droits BOT dans un district, quelle que soit leur dénomination (**BOT**) - y compris les districts de Land, d’État, de continent, etc.\n\n### <a id=\"konsequenzen-fuer-regelverletzungen\"></a>Conséquences des violations des règles\n\nLes « règles » au sens de cette section sont toutes les dispositions des bases foodsharing 2 (« règles de conduite ») et 3 (« violations des règles - conséquences et traitement »).\n\n- **a)** Un ***avertissement*** peut être prononcé pour toute violation des règles. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#a.29_.E2.80.93_Verwarnung)\n- **b)** Une ***suspension temporaire des collectes*** par retrait de la vérification et, le cas échéant, une interdiction d’autres activités au sein de foodsharing pendant jusqu’à 3 mois (***carton jaune***) peut être prononcée\n  - **i)** en cas de violation des [règles A)-C)](/learn/code-of-conduct#a-allgemeines-verhalten-bei-foodsharing) qui met en danger la coopération avec un commerce\n  - **ii)** en cas de violation de la règle [C6)](/learn/code-of-conduct#c-betriebe-betriebsteam-planung-von-abholungen)\n  - **iii)** en cas de violation des règles d’hygiène mettant en danger la santé de tiers\n  - **iv)** en cas d’atteinte à la réputation de foodsharing auprès des commerces ou en public\n  - **v)** en cas d’infraction à l’accord juridique et de violations des règles contraires aux principes de foodsharing\n  - **vi)** s’il existe (après effacement correct) 3 avertissements non effacés\n\n  À la fin de la suspension, le ou la foodsaver est de nouveau vérifié·e sur demande auprès d’un·e BOT de son district d’origine.\n\n  [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#b.29_.E2.80.93_Suspendierung_.28Gelbe_Karte.29)\n- **c)** Une ***rétrogradation au statut de foodsharer*** (***carton jaune-rouge***) peut être prononcée s’il y a 2 cartons jaunes.\\\n  En même temps, une interdiction de repasser le quiz FS est fixée pour une durée de 3 à 6 mois, éventuellement aussi une interdiction d’autres activités au sein de foodsharing pour la même durée.\\\n  Le district qui la prononce peut lever l’interdiction à tout moment. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#c.29_.E2.80.93_Herabstufung_zum_Foodsharer_.28Gelb-rote_Karte.29)\n- **d)** Un ***blocage permanent du compte*** avec interdiction de se réinscrire (***carton rouge***) peut être prononcé en cas de\n  - **i)** condamnation pour une infraction pénale commise pendant l’activité pour foodsharing\n  - **ii)** condamnation pour une infraction pénale contre des membres ou des biens de foodsharing\n  - **iii)** violation des [principes](/learn/principles) qui se produit pour la 2e fois malgré un carton jaune, jaune-rouge ou rouge antérieur\n  - **iv)** existence de 2 cartons jaune-rouge. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#d.29_.E2.80.93_Sperrung_des_Accounts_.28Rote_Karte.29)\n  - **v)** si le droit applicable l’exige ou si, sans blocage immédiat, il existe un danger aigu et important pour foodsharing e.V. ou des tiers. Dans ces cas, le comité de foodsharing e.V. décide et documente la mesure sous sa propre responsabilité.\n\nExplication\n\n### <a id=\"a-umgang-mit-regelverletzungen\"></a>A) Gestion des violations des règles\n\n- **1)** Le signalement d’une violation des règles n’a pas pour but de poursuivre de manière restrictive un comportement inapproprié. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **2)** Le but est plutôt de s’occuper activement de certaines situations, afin de faire comprendre les règles et de trouver une solution que toutes les personnes concernées peuvent accepter. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **3)** Prononcer une conséquence ne devrait être que le dernier recours. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **4)** Le signalement doit être traité dans un cercle de personnes aussi restreint que possible, car il s’agit d’un sujet très confidentiel. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A4%29)\n- **5)** Pour chaque MRV, il faut tenir compte du cas particulier et ne pas porter de jugement global. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A5%29)\n\n### <a id=\"b-gruppen-fuer-die-meldungsbearbeitung\"></a>B) Groupes de traitement des signalements\n\n- **1)** Pour traiter les MRV, chaque district met en place un [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (LMG). Il porte le nom « Meldungen *nom du district* » et l’adresse e-mail « meldungen.*nomdudistrict*@foodsharing.network ». Jusqu’à la création du LMG dans un district, le groupe de vérification existant (sous différentes dénominations) assume sa tâche. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B1%29)\n- **2)** La création d’une [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (LS) supplémentaire est recommandée ; elle peut être saisie dans les cas prévus en C3) et D8). Elle porte alors le nom « Schiedsstelle *nom du district* » et l’adresse e-mail « schiedsstelle.*nomdudistrict*@foodsharing.network ». [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B2%29)\n- **3)** Les membres du LMG et de la LS sont élu·es démocratiquement par les FS du district. Personne ne peut être membre de plus d’un LMG ou d’une LS. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B3%29)\n- **4)** Les foodsavers ayant des cartons jaunes, jaune-rouge ou rouges non effacés ne peuvent pas être membres d’un LMG ou d’une LS. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B4%29)\n- **5)** Pour la médiation selon D8) ii), chaque district peut désigner démocratiquement un autre groupe de travail. Les membres de ce groupe ne peuvent pas faire partie du LMG ou de la LS du district ni être BOT du district. *Explication*\n\n### <a id=\"c-zustaendigkeiten\"></a>C) Compétences\n\n- **1)** Est en principe compétent pour le traitement d’un MRV le district d’origine de la personne signalée.\\\n  En cas de changement de district d’origine, les signalements en cours non traités définitivement sont traités définitivement par l’ancien district d’origine, sauf si les deux districts conviennent ensemble d’autre chose. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **2)** Les signalements sont en principe traités par le LMG du district. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **3)** Pour les signalements contre des membres du LMG ou des BOT de leur district d’origine, la personne qui signale peut décider à titre dérogatoire que le signalement soit traité par la LS. S’il n’existe pas de LS, le signalement va dans ce cas aussi au LMG. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C3%29)\n- **4)** Pour les signalements contre des foodsharers, le district compétent est celui du lieu de résidence du ou de la foodsharer signalé·e, si ce lieu est connu. Sinon, c’est le district d’origine de la personne qui signale. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C4%29)\n- **5)** La mise en œuvre et la confirmation des cartons jaune-rouge et rouges sont effectuées par le comité de foodsharing e.V. selon les conditions de mise en œuvre des cartons jaune-rouge et rouges. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C5%29)\n- **6)** La personne signalée peut récuser certains membres d’un groupe de traitement qu’elle estime partiaux. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C6%29)\n- **7)** Les personnes concernées ne peuvent pas traiter de MRV. Sont considérées comme concernées la personne qui signale et la personne signalée ainsi que toutes les personnes présentes lors de la situation signalée. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C7%29)\n\n### <a id=\"d-bearbeitung-einer-meldung\"></a>D) Traitement d’un signalement\n\n- **1)** Le MRV est envoyé directement par la personne qui signale au groupe compétent. Si un groupe reçoit un MRV pour lequel il n’est pas compétent, il le transmet au groupe compétent. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D1%29)\n- **2)** Le signalement et toutes les autres contributions (messages, e-mails, notes et procès-verbaux d’entretiens, prises de position, décision, saisine d’un autre groupe) sont documentés dans le forum du groupe qui traite le signalement à ce moment-là. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D2%29)\n- **3)** Le signalement n’est pas traité s’il est déposé plus de 2 mois après l’événement signalé. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D3%29)\n- **4)** Avant de traiter un signalement, le LMG doit effectuer pour la personne signalée l’effacement des signalements et des conséquences selon la section F). [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D4%29)\n- **5)** La personne signalée doit être informée du signalement et de son motif - sous forme anonymisée selon E3) - et invitée à prendre position dans les 2 semaines suivant cette communication. ([modèle d’e-mail](https://drive.google.com/file/d/1nE8G9K16J4btsBVnh0TaPElf8nqfLyCK)) La personne qui signale est informée du début du traitement et de la possibilité de prendre à nouveau position dans les 2 semaines suivant cette communication. ([modèle d’e-mail](https://drive.google.com/file/d/1OjLUKYdfi0KXSTtPaeWCktTrovYS3W-y))\n\n  Une conséquence ne peut être prononcée que lorsque les deux messages ainsi que toutes les prises de position reçues sont disponibles par écrit (e-mail ou papier). [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D5%29)\n- **6)** La personne qui signale peut renoncer à la forme anonymisée selon E3) dans le formulaire de signalement ou plus tard à la demande du groupe de traitement. ([modèle d’e-mail](https://drive.google.com/file/d/1gYknWLB7uKJZXmnVPcZP1JdIL_eret93))\\\n  Si le refus d’y renoncer empêche le traitement du signalement, le traitement par ce groupe se termine par la décision « pas de conséquence ». ([modèle d’e-mail à la GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [modèle d’e-mail à la MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D6%29)\n- **7)** La décision, motivation comprise, est communiquée à la personne qui signale et à la personne signalée par e-mail ou sur papier, avec un délai pour demander une médiation selon D8). ([modèle d’e-mail à la GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [modèle d’e-mail à la MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D7%29)\n- **8)** La personne qui signale et la personne signalée peuvent, dans un délai de 2 semaines, demander une médiation au groupe prévu, s’il existe. Ce groupe est\n  - **i)** en cas de traitement par le LMG, la LS si elle existe ; sinon une médiation n’est pas possible ;\n  - **ii)** en cas de traitement par la LS, le groupe désigné par le district selon B5).\n\n  Le groupe de médiation peut refuser la médiation sans justification. ([modèle d’e-mail](https://drive.google.com/file/d/1pZTqeFJARkQC0Q4GYSIZNBb-1xuBfn3l)) [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D8%29)\n- **9)** Si une conséquence est prononcée, elle est documentée dans le forum du LMG compétent pour la personne signalée. Il faut au moins enregistrer la date et le motif du signalement ainsi que la conséquence avec la date de la décision. ([modèle d’e-mail](https://drive.google.com/file/d/1G-tvtx1j3im3QcBN_5nf40B54hnT5lom)) [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D9%29)\n- **10)** Le groupe qui a prononcé une conséquence peut y mettre fin de manière anticipée. Pour les cartons jaune-rouge et rouges, le comité de foodsharing e.V. doit donner son accord. *Explication*\n- **11)** Avec l’accord de tous les autres groupes ayant participé au traitement du signalement, le groupe qui a prononcé une conséquence peut la retirer entièrement. Pour les cartons jaune-rouge et rouges, le comité de foodsharing e.V. doit donner son accord. La décision est communiquée avec sa motivation à la personne signalée et à la personne qui signale. Celles-ci peuvent, dans un délai de 2 semaines, demander une médiation au groupe prévu selon D8). *Explication*\n\n### <a id=\"e-datenschutz-vertraulichkeit-selbstauskunft\"></a>E) Protection des données / confidentialité / renseignements sur soi\n\n- **1)** **Confidentialité :** Tout ce qui concerne les MRV doit être traité de manière strictement confidentielle. Toutes les personnes impliquées sont tenues au secret, sauf si la personne qui signale, la personne signalée et toutes les personnes nommées dans le signalement ont accepté la divulgation par écrit. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **2)** **Transmission :** La transmission n’est autorisée qu’aux personnes et instances compétentes pour le traitement du cas particulier concerné. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **3)** **Forme anonymisée :** La communication du signalement à la personne signalée n’est autorisée que sous forme anonymisée, c.-à-d. que le nom de la personne qui signale ne doit pas être divulgué.\n\n  Si la personne signalée est membre d’un groupe de traitement ou d’un groupe impliqué, la forme anonymisée n’est pas possible. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E3%29)\n- **4)** **Renseignements sur soi :** Chaque FS peut demander au LMG de son district d’origine les conséquences actuellement prononcées contre lui ou elle ainsi que les signalements correspondants sous forme anonymisée selon E3). [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E4%29)\n- **5)** **Renseignements pour les districts :** Chaque district peut demander au district d’origine de ses foodsavers une liste des conséquences existantes ; en cas de changement de district d’origine, le nouveau district d’origine peut aussi la demander à l’ancien. La liste ne contient pour chaque signalement que le numéro, la date et le motif ainsi que la conséquence avec la date de la décision. [*Explication*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E5%29)\n\n### <a id=\"f-tilgung-von-meldungen-und-konsequenzen\"></a>F) Effacement des signalements et des conséquences\n\n- **1)** La personne signalée peut demander au LMG l’effacement des signalements et conséquences qui la concernent. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F1%29)\n- **2)** Le LMG est alors tenu d’effacer tous les signalements pour lesquels il a été définitivement décidé de ne prononcer aucune conséquence. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F2%29)\n- **3)** Le LMG est alors en outre tenu d’effacer toutes les conséquences dont la décision remonte, pour un\n  - **i)** avertissement, à 6 mois\n  - **ii)** carton jaune, à 2 ans\n  - **iii)** carton jaune-rouge, à 3 ans\n  - **iv)** carton rouge, à 5 ans\n\n  et pour lesquelles aucune autre conséquence n’a été prononcée dans ce délai. Le LMG est alors tenu d’effacer tous les cartons rouges dont la conséquence a pris fin il y a plus de 5 ans, si aucune autre conséquence n’a été prononcée dans ce délai. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **4)** Si une conséquence est effacée, cela peut entraîner l’effacement de la conséquence immédiatement antérieure. [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **5)** Pour effacer une conséquence, le LMG informe tous les groupes ayant participé au traitement du signalement concerné. ([modèle d’e-mail](https://drive.google.com/file/d/1Bxffjz-JdtOOBaBHp74PkbkjIlpJb2su)) Ils suppriment ou détruisent, dans la mesure du possible techniquement :\n  - le signalement, les prises de position, la décision et toutes les autres contributions et commentaires du forum\n  - tous les e-mails, autres messages et fichiers, y compris dans la corbeille\n  - tous les documents papier\n\n  [Explication](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F5%29)\n\n---\n\n*Article de* : [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Contact](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Dernière révision le 20.08.2026*\n\n---\n\n*Original dans le wiki foodsharing : [Regelverletzungen – Konsequenzen und Bearbeitung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Konsequenzen_und_Bearbeitung)*\n"}

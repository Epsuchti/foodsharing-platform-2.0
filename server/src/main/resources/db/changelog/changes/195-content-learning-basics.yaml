              - column: {name: title, value: "Rule violations – consequences and handling"}
              - column: {name: body, value: "*Valid from 01.10.2020*\n\n***Explanations and reasons***\\\nThe handling of rule violations is explained in detail in the wiki article [Regelverletzungen](https://wiki.foodsharing.network/wiki/Regelverletzungen) (rule violations). The article [Regelverletzungen - Erläuterungen](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen) gives reasons and explanations for every single provision.\n\nThese provisions are developed further by the *AG Verhaltensregeln und Meldesystem* (working group code of conduct and reporting system). Suggestions and ideas can be sent to the working group at any time (preferably by email to [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nThe working group reviews all ideas and suggestions it receives.\n\nEveryone interested is warmly invited to [join the working group](https://foodsharing.de/?page=bezirk&bid=1640).\n\n### <a id=\"begriffe-und-abkuerzungen\"></a>Terms and abbreviations\n\n- Report of a rule violation (**MRV**)\n- [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (local reporting group, **LMG**)\n- [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (local arbitration board) in the district (**LS**)\n- People with BOT rights in a district, whatever they are called (**BOT**) - including federal state districts, country districts, continent districts and others\n\n### <a id=\"konsequenzen-fuer-regelverletzungen\"></a>Consequences of rule violations\n\n\"Rules\" in the sense of this section are all provisions in foodsharing basics 2 (\"code of conduct\") and 3 (\"rule violations - consequences and handling\").\n\n- **a)** A ***warning*** can be issued for any rule violation. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#a.29_.E2.80.93_Verwarnung)\n- **b)** A temporary ***suspension from pickups*** by withdrawing the verification and, if necessary, a ban from further activities within foodsharing for up to 3 months (***yellow card***) can be issued\n  - **i)** for violations of [rules A)-C)](/learn/code-of-conduct#a-allgemeines-verhalten-bei-foodsharing) that endanger the cooperation with a store\n  - **ii)** for violating rule [C6)](/learn/code-of-conduct#c-betriebe-betriebsteam-planung-von-abholungen)\n  - **iii)** for violations of the hygiene rules that endanger the health of third parties\n  - **iv)** for damaging the reputation of foodsharing with stores or in public\n  - **v)** for breaches of the legal agreement and rule violations that contradict the principles of foodsharing\n  - **vi)** if (after correct expunging) there are 3 warnings that have not been expunged\n\n  After the suspension ends, the foodsaver is verified again on request to a BOT of their home district.\n\n  [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#b.29_.E2.80.93_Suspendierung_.28Gelbe_Karte.29)\n- **c)** A ***downgrade to foodsharer*** (***yellow-red card***) can be issued if there are 2 yellow cards.\\\n  At the same time, a ban on retaking the FS quiz is set for 3-6 months, possibly also a ban from further activities within foodsharing for the same period.\\\n  The issuing district can lift the ban at any time. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#c.29_.E2.80.93_Herabstufung_zum_Foodsharer_.28Gelb-rote_Karte.29)\n- **d)** A ***permanent blocking of the account*** with a ban on registering again (***red card***) can be issued for\n  - **i)** a conviction for a criminal offence during activity for foodsharing\n  - **ii)** a conviction for a criminal offence against members or property of foodsharing\n  - **iii)** a violation of the [principles](/learn/principles) that happens for the 2nd time despite a previous yellow, yellow-red or red card\n  - **iv)** if there are 2 yellow-red cards. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#d.29_.E2.80.93_Sperrung_des_Accounts_.28Rote_Karte.29)\n  - **v)** if this is required by applicable law or if without immediate blocking there is an acute, considerable danger for foodsharing e.V. or third parties. In these cases the board of foodsharing e.V. decides on and documents the measure on its own responsibility.\n\nExplanation\n\n### <a id=\"a-umgang-mit-regelverletzungen\"></a>A) Dealing with rule violations\n\n- **1)** Reporting a rule violation is not meant to restrictively prosecute inappropriate behaviour. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **2)** Rather, the goal is to actively deal with certain situations, to create understanding for the rules and to find a solution that everyone involved can accept. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **3)** Issuing a consequence should only be the last resort. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **4)** The report should be handled by as small a circle of people as possible, as it is a very confidential matter. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A4%29)\n- **5)** For every MRV the individual case should be considered rather than making a sweeping judgement. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A5%29)\n\n### <a id=\"b-gruppen-fuer-die-meldungsbearbeitung\"></a>B) Groups that handle reports\n\n- **1)** To handle MRV, every district sets up a [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (LMG). It is called \"Meldungen *district name*\" and has the email address \"meldungen.*districtname*@foodsharing.network\". Until an LMG is set up in a district, the existing verification working group (under various names) takes over its task. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B1%29)\n- **2)** Setting up an additional [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (LS) is recommended, which can be called upon in the cases of C3) and D8). It is then called \"Schiedsstelle *district name*\" and has the email address \"schiedsstelle.*districtname*@foodsharing.network\". [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B2%29)\n- **3)** The members of the LMG and LS are democratically elected by the FS of the district. Nobody may be a member of more than one LMG or LS. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B3%29)\n- **4)** Foodsavers with yellow, yellow-red or red cards that have not been expunged may not be members of an LMG or LS. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B4%29)\n- **5)** For mediation under D8) ii), every district can democratically appoint a further working group. The members of this group may not be in the LMG or LS of the district and may not be a BOT for the district either. *Explanation*\n\n### <a id=\"c-zustaendigkeiten\"></a>C) Responsibilities\n\n- **1)** In principle, the home district of the reported person is responsible for handling an MRV.\\\n  If the home district changes, reports that are pending and not finally handled are finally handled by the previous home district, unless both districts jointly agree otherwise. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **2)** In principle, reports are handled by the LMG of the district. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **3)** For reports against members of the LMG or BOTs of their home district, the reporting person can decide instead that the report is handled by the LS. If there is no LS, the report goes to the LMG in this case as well. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C3%29)\n- **4)** For reports against foodsharers, the district responsible for the place of residence of the reported foodsharer is responsible, if the place of residence is known. Otherwise the home district of the reporting person is responsible. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C4%29)\n- **5)** Yellow-red and red cards are implemented and confirmed by the board of foodsharing e.V. according to the requirements for implementing yellow-red and red cards. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C5%29)\n- **6)** The reported person can reject individual members of a handling group whom they consider biased. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C6%29)\n- **7)** People involved may not handle an MRV. The reporting and the reported person as well as everyone present in the reported situation count as involved. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C7%29)\n\n### <a id=\"d-bearbeitung-einer-meldung\"></a>D) Handling a report\n\n- **1)** The reporting person sends the MRV directly to the responsible group. If a group receives an MRV for which it is not responsible, it forwards the MRV to the responsible group. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D1%29)\n- **2)** The report and all further contributions (messages, emails, notes and minutes of conversations, statements, decision, calling on another group) are documented in the forum of the group that is handling the report at that time. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D2%29)\n- **3)** The report is not handled if it is submitted more than 2 months after the reported event. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D3%29)\n- **4)** Before handling a report, the LMG must expunge reports and consequences for the reported person according to section F). [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D4%29)\n- **5)** The reported person must be informed of the report and the reason for it - in anonymised form according to E3) - and asked for a statement within 2 weeks of this notice. ([email template](https://drive.google.com/file/d/1nE8G9K16J4btsBVnh0TaPElf8nqfLyCK)) The reporting person is informed that handling has begun and of the possibility of a further statement within 2 weeks of this notice. ([email template](https://drive.google.com/file/d/1OjLUKYdfi0KXSTtPaeWCktTrovYS3W-y))\n\n  A consequence may only be issued once both messages and all statements received are available in writing (email or paper). [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D5%29)\n- **6)** The reporting person can waive the anonymised form according to E3) in the report form or later at the request of the handling group. ([email template](https://drive.google.com/file/d/1gYknWLB7uKJZXmnVPcZP1JdIL_eret93))\\\n  If not waiving prevents the report from being handled, handling by this group ends with the decision \"no consequence\". ([email template to GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [email template to MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D6%29)\n- **7)** The decision including the reasons is communicated to the reporting and the reported person by email or on paper, together with a deadline for asking for mediation according to D8). ([email template to GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [email template to MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D7%29)\n- **8)** The reporting and the reported person can ask the designated group for mediation within 2 weeks, if it exists. This group is\n  - **i)** for handling by the LMG, the LS, if it exists; otherwise mediation is not possible;\n  - **ii)** for handling by the LS, the group appointed by the district under B5).\n\n  The mediation group can refuse mediation without giving reasons. ([email template](https://drive.google.com/file/d/1pZTqeFJARkQC0Q4GYSIZNBb-1xuBfn3l)) [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D8%29)\n- **9)** If a consequence is issued, it is documented in the forum of the LMG responsible for the reported person. At least the date and reason of the report as well as the consequence with the date of the decision must be stored. ([email template](https://drive.google.com/file/d/1G-tvtx1j3im3QcBN_5nf40B54hnT5lom)) [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D9%29)\n- **10)** The issuing group can end a consequence early. For yellow-red and red cards, the board of foodsharing e.V. must agree. *Explanation*\n- **11)** With the consent of all other groups involved in handling the report, the issuing group can completely withdraw a consequence. For yellow-red and red cards, the board of foodsharing e.V. must agree. The decision is communicated with reasons to the reported and the reporting person. The reporting and the reported person can ask the group designated under D8) for mediation within 2 weeks. *Explanation*\n\n### <a id=\"e-datenschutz-vertraulichkeit-selbstauskunft\"></a>E) Data protection / confidentiality / information about oneself\n\n- **1)** **Confidentiality:** Everything concerning MRV must be treated strictly confidentially. Everyone involved is obliged to secrecy, unless the reporting person, the reported person and all people named in the report have agreed in writing to the release. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **2)** **Passing on:** Passing on is only allowed to people and bodies responsible for handling the individual case concerned. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **3)** **Anonymised form:** The report may only be communicated to the reported person in anonymised form, i.e. the name of the reporting person may not be given out.\n\n  If the reported person is a member of a handling or involved group, the anonymised form is not possible. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E3%29)\n- **4)** **Information about oneself:** Every FS can ask the LMG of their home district for the consequences currently on record against them and the corresponding reports in anonymised form according to E3). [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E4%29)\n- **5)** **Information for districts:** Every district can ask the home district of its foodsavers for a list of the consequences on record; when the home district changes, the new home district can also ask the previous one. The list contains for each report only its number, date and reason as well as the consequence with the date of the decision. [*Explanation*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E5%29)\n\n### <a id=\"f-tilgung-von-meldungen-und-konsequenzen\"></a>F) Expunging reports and consequences\n\n- **1)** The reported person can apply to the LMG for reports and consequences against them to be expunged. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F1%29)\n- **2)** The LMG is then obliged to expunge all reports for which it was finally decided not to issue a consequence. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F2%29)\n- **3)** The LMG is then also obliged to expunge all consequences where the decision on a\n  - **i)** warning 6 months\n  - **ii)** yellow card after 2 years\n  - **iii)** yellow-red card 3 years\n  - **iv)** red card 5 years\n\n  ago and no further consequence was issued within this period. The LMG is then obliged to expunge all red cards whose consequence ended more than 5 years ago, if no further consequence was issued within this period. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **4)** If a consequence is expunged, this can mean that the next earlier consequence must also be expunged. [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **5)** To expunge a consequence, the LMG informs all groups involved in handling the report concerned. ([email template](https://drive.google.com/file/d/1Bxffjz-JdtOOBaBHp74PkbkjIlpJb2su)) They delete or destroy, as far as technically possible:\n  - the report, statements, decision and all further forum posts and comments\n  - all emails, other messages and files, also from the recycle bin\n  - all paper documents\n\n  [Explanation](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F5%29)\n\n---\n\n*Article by*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Contact](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Last revised on 20.08.2026*\n\n---\n\n*Original in the foodsharing wiki: [Regelverletzungen – Konsequenzen und Bearbeitung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Konsequenzen_und_Bearbeitung)*\n"}

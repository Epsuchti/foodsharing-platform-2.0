              - column: {name: title, value: "Context and self-image"}
              - column: {name: body, value: "## <a id=\"lebensmittelverschwendung\"></a>Food waste\n\n- About 4 billion tonnes of food are produced worldwide every year. Of this, more than 1.3 billion tonnes are wasted. [1]\n- In industrialised countries, about 40% of the wasted food is completely edible. [1]\n- We are all responsible for the fact that food retailers, wholesalers, producers and restaurateurs throw away millions of tonnes of food every year.\n- 2/3 of all food waste could be avoided through the commitment of food businesses, foodsavers and private individuals.\n- Only together can we stop the madness of the affluent society, with everyone doing their part and acting responsibly.\n\n## <a id=\"ausgangssituation\"></a>Starting point\n\n- Every day food is wasted on an extreme scale, even though around 57,000 people still die of hunger every day. [2]\n- In industrialised nations, a particularly large share of this waste happens at consumer level: over 150 kg per person per year. [3]\n- Bruised apples, cucumbers that are too crooked, courgettes that are too small and even products that are either too expensive or too cheap end up in retailers' bins here very quickly, although in the vast majority of cases they would be perfectly edible.\n- Private households are not immune to waste either: packs that are too big, too many products, prices that are too low and often, unfortunately, simple thoughtlessness lead to a lot of avoidable food waste at home too.\n\n## <a id=\"ansatzpunkte\"></a>Where we start\n\nSince waste happens at many different points in the cycle of production and consumption, we can also fight it at many different points.\\\nSo we start at three points:\n\n1. *With food retailers and [businesses](https://wiki.foodsharing.network/wiki/Betrieb)*: on the basis of cooperations, food is saved from being thrown away, collected and redistributed. At the same time, we want to make our partners aware that better or more careful planning when buying and stocking, but also, for example, discounted offers for food that is no longer quite perfect, can also reduce food waste. As a side effect, the volume of residual and organic waste bins can drop by up to 70%. [4]\n2. *With consumers in the private sphere*: we provide the digital infrastructure on foodsharing.de for everyone who wants to save or share food themselves. We would like more and more people to use this offer, for example to give away their leftover food in a virtual food basket before leaving on holiday. Beyond that, we want to draw attention to the topic in general, spread knowledge and ideas about a more sustainable way of dealing with food through sound information and educational offers, and encourage more mindfulness towards food in general.\n3. *With producers*: we want to motivate people and support their commitment so that they save \"reject fruit and vegetables\" from rotting or spoiling. For example, at harvest time we organise campaigns to collect crops that do not meet the strict visual standards of the agricultural industry and its buyers from the fields where they would otherwise simply be left. In this way, huge amounts of crooked carrots, broken cucumbers or bruised apples can be saved.\n\n## <a id=\"selbstverstaendnis\"></a>Self-image\n\n- foodsharing is an [environmental movement](/learn/principles). Our goal is to protect the natural resources of our planet. Wasting food means wasting the resources used for it (water, energy, land and storage space, working time, raw materials for packaging, for example).\n\n- foodsharing is not a social (*more precisely: charitable*) organisation. We do not want to presume to decide which people are in need or which projects are more worthy of support than others. We want to make food available [unconditionally](/learn/principles) to all people and thereby promote respect for it.\n\n- We at foodsharing give away surplus food from businesses and private individuals. The food is always passed on free of charge and never sold or used for barter. Of course, foodsavers may eat the saved goods themselves.\n\n- foodsharing works [independently](/learn/principles) of political parties and religious denominations. foodsharing distributes food to all people. Any kind of exclusion or discrimination is not tolerated.\n\n- We do not compete with [other initiatives](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln) that fight food waste, such as the Tafeln (food banks), but cooperate with them. We welcome and support every commitment against food waste.\n\n  We are happy to let all charitable organisations go first in distributing saved food to people in need. foodsharing is meant to be only the \"last bastion before the bin\" for all food that other organisations cannot redistribute.\n\n- Together with the thousands of volunteer foodsavers all over Germany, foodsharing wants to live a new culture of respect for food, in order to give food, together with the cooperating shops, the appreciation it deserves.\n\n- The long-term goal of foodsharing is to make itself superfluous by ending the large-scale, systematic waste of food.\n\n- For further information on this topic, we warmly recommend the film \"Taste the Waste\" by our founding member Valentin Thurn.\n\n## <a id=\"foodsharing\"></a>foodsharing\n\nfoodsharing is an initiative to\n\n- organise [foodsavers](https://wiki.foodsharing.network/wiki/Foodsaver) who save food (and also other, non-edible products) from food businesses of all kinds\n- organise [foodsharers](https://wiki.foodsharing.network/wiki/Foodsharer) who want to pass on food free of charge\n- organise events on the topic, advance the internationalisation of foodsharing and much more\n\n- [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) runs the online platform, mainly with unpaid, highly committed volunteers who take care of central tasks, e.g. [programming](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform), [central press work](https://wiki.foodsharing.network/wiki/Pressetext), legal questions, central rules, coordination of [central working groups](https://foodsharing.de/?page=groups), [graphic design](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Materialien_-_Grafikdateien), coordination of the districts and [federal states](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Bundesland-Botschafter.2Ainnen), [national and international meetings, internationalisation and translation](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#International_-_foodsharing_International), supported only by a few mini-jobs and part-time positions.\n\n- In addition, more than 100 other very active foodsavers are involved in other areas.\n\n- Saving food is organised in districts that usually cover one or more cities or a county. Coordination in a district is in the hands of foodsharing [ambassadors](https://wiki.foodsharing.network/wiki/Botschafter*in); the cooperations with individual businesses are each looked after by [store managers](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r).\n\n- We try to grow in an organic way focused on reliability: not entering into as many cooperations and taking on as many people as possible as quickly as possible. We would rather take the time to do our work well and carefully before taking the next step.\n\n- All foodsavers are [carefully trained](https://wiki.foodsharing.network/wiki/Foodsaver#Wie_man_Foodsaver_wird) and reliable food savers whose work is guided and safeguarded by the internal [code of conduct](/learn/code-of-conduct), [hygiene rules](/learn/hygiene-rules) and the [legal agreement](/learn/legal-agreement). They can identify themselves at any time with their [foodsaver ID card](https://wiki.foodsharing.network/wiki/Ausweis).\n\n- All foodsavers must accept the disclaimer of liability with the [legal agreement](/learn/legal-agreement) before they can collect food. It has been drafted by two law firms so that all food businesses giving away food are legally released from any responsibility, including for negligence. Every foodsaver takes responsibility for the saved food and for passing it on.\n\n## <a id=\"die-foodsharing-plattform\"></a>The foodsharing platform\n\n- foodsharing.de is [free of charge](https://wiki.foodsharing.network/wiki/Umgang_mit_Geld_bei_foodsharing), non-commercial and without advertising, and it will stay that way.\n\n- The platform was programmed by volunteers and is constantly developed further by the many volunteers in the [tech team](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform).\n\n- Since summer 2012, more than 300,000 volunteers who want to do something about food waste have registered. More than 70,000 of them are already actively saving food at about 7,000 businesses.\n\nThanks to our eco partners [manitu.de](https://manitu.de) (web hosting, traffic costs) and [Greensta.de](https://Greensta.de) (email accounts), who support us free of charge, the servers of the foodsharing platform run on 100% hydroelectric power.\n\n## <a id=\"verweise\"></a>References\n\n[1] n.tv, 2011. Verschwendung ist schockierend. [Online]. http://www.n-tv.de/wissen/Verschwendung-ist-schockierend-article4210226.html. [Accessed 09.07.2013].\n\n[2] ver.di publik, 2013. Der Hunger ist von Menschen gemacht. [*No longer online*. https://publik.verdi.de/2013/ausgabe-03/spezial/finanzen/seiten-20-21/A0. [Accessed 09.07.2013]].\n\n[3] Swedish Institute for Food and Biotechnology (SIK), Gothenburg, Sweden, 2011. Global Food Losses and Food Waste. [Online]. http://large.stanford.edu/courses/2012/ph240/briggs1/docs/mb060e00.pdf\n\n[4] Bio Company (Berlin) customer magazine, 2013-07. Tonnen sind kein Platz für Lebensmittel. https://drive.google.com/file/d/12pIcqTvVaRGC-4iBnTu5xGafFGrdikkj\n\n---\n\n*Article by*: [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Contact](mailto:vorstand@foodsharing.network)*)\\\n*Last revised on 12.08.2026*\n\n---\n\n*Original in the foodsharing wiki: [Kontext und Selbstverständnis](https://wiki.foodsharing.network/wiki/Kontext_und_Selbstverst%C3%A4ndnis)*\n"}

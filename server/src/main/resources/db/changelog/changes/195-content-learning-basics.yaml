              - column: {name: title, value: "Regole di comportamento"}
              - column: {name: body, value: "*In vigore dal 02.01.2020*\n\n**Spiegazioni e motivazioni**\\\nPer le nuove regole di comportamento c’è una [pagina con spiegazioni](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen) che spiega per ogni singola regola perché è importante per foodsharing.\n\nLe regole di comportamento vengono sviluppate dall’*AG Verhaltensregeln und Meldesystem* (gruppo di lavoro regole di comportamento e sistema di segnalazione). Proposte di miglioramento e idee possono essere inviate in qualsiasi momento al gruppo di lavoro (possibilmente per e-mail a [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nIl gruppo di lavoro esamina tutte le idee e le proposte ricevute; una modifica delle regole in vigore è prevista due volte all’anno – di solito a maggio e a novembre.\\\nTutte le persone interessate sono cordialmente invitate a [collaborare nel gruppo di lavoro](https://foodsharing.de/?page=bezirk&bid=1640).\n\n### <a id=\"praeambel\"></a>Preambolo\n\nfoodsharing ha bisogno di regole di comportamento uniformi per tutti i foodsaver, per poter collaborare come grande movimento, ormai anche internazionale, e per creare e mantenere in pubblico – presso i negozi partner, i privati e nella politica – un’immagine positiva e la fiducia in noi.\n\nQueste regole sono quindi la base per tutti i foodsaver e tutti i distretti foodsharing. Viste le molte diverse prassi, non è però possibile stabilire regole generali per ogni situazione e per tutti i distretti. Per questo ci sono alcune regole (B7, C3 in parte, C4) che i distretti possono e devono adattare alle condizioni e alle idee locali; sono scritte in corsivo.\n\nInoltre ogni distretto è libero di aggiungere regole con misura, se le aggiunte non contraddicono le altre regole.\n\n**In questo testo si usano le seguenti abbreviazioni**:\\\nFS = foodsaver, BV = responsabile del negozio, BOT = ambasciatore/ambasciatrice\n\n## <a id=\"a-allgemeines-verhalten-bei-foodsharing\"></a>A) Comportamento generale in foodsharing\n\n- **A1)** I rapporti con gli altri FS sono sempre cordiali, rispettosi e pacifici. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A1.29_.E2.80.93_Freundlicher_Umgang_untereinander)\n- **A2)** Tra FS ci si dà del tu. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A2.29_.E2.80.93_Duzen_als_Standard)\n- **A3)** Le divergenze di opinione in un team di negozio vanno discusse all’interno del team, in un distretto all’interno del distretto. I litigi personali non vengono portati nei forum, sulle bacheche o nella chat del team. Vanno chiariti con un messaggio privato o di persona, oppure con il sostegno dei gruppi previsti per il distretto. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A4)** In caso di controversie e conflitti bisogna sempre restare oggettivi ed educati, evitare ironia e sarcasmo, mantenere la calma e rispondere in modo ponderato, soprattutto nelle discussioni politiche o su altri temi seri. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A3.29-A4.29_.E2.80.93_Diskussionen_im_Forum)\n- **A5)** I messaggi privati e le informazioni in essi contenute possono essere pubblicati o inoltrati solo con il permesso del mittente o della mittente. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A5.29_.E2.80.93_Ver.C3.B6ffentlichung_von_privaten_Nachrichten)\n- **A6)** Sulla piattaforma online non sono ammessi opere e materiali protetti dal diritto d’autore, pubblicità e spam.\\\n  I contributi che violano una di queste regole e i temi estranei a foodsharing possono essere cancellati. Sulla cancellazione decidono nei gruppi di lavoro i loro admin, per gli eventi chi li ha creati, sulle bacheche dei negozi i responsabili del negozio. Nei forum decide la [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (organo locale di conciliazione) su richiesta di un membro del forum; la cancellazione viene eseguita dalla ZMG. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_-_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A7)** Nei forum, prima di cancellare un contributo, si invia all’autore o all’autrice un messaggio privato con il testo e la motivazione della cancellazione.\\\n  La trasparenza è importante. Per questo ogni contributo cancellato viene contrassegnato così: «Questo contributo/questo tema di [...] è stato cancellato perché violava una regola di comportamento di foodsharing o perché il tema non rientra nell’ambito di foodsharing.» [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regeln_A6.29_und_A7.29_.E2.80.93_Erlaubte_Forumsbeitr.C3.A4ge.2C_L.C3.B6schen_von_Beitr.C3.A4gen)\n- **A8)** I FS sono tenuti a indicare correttamente nel loro profilo sulla piattaforma foodsharing nome, indirizzo postale, data di nascita, una foto profilo in cui siano riconoscibili e, se disponibile, un numero di telefono (consigliato), a tenerli aggiornati e a dimostrarli su richiesta con un documento d’identità. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A8.29_.E2.80.93_Verpflichtung_zur_Angabe_korrekter_pers.C3.B6nlicher_Daten)\n- **A9)** Le informazioni sui processi interni di foodsharing (ad es. dati personali di altri foodsaver, dettagli delle collaborazioni, orari di ritiro) possono essere comunicate solo all’interno di foodsharing e solo ai foodsaver che ne hanno bisogno per il loro lavoro in foodsharing. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_A9.29_-_Vertraulichkeit_von_Foodsaver-Daten_und_foodsharing-internen_Informationen)\n\n## <a id=\"b-verhalten-bei-abholungen\"></a>B) Comportamento durante i ritiri\n\n- **B1)** Ai ritiri sono importanti la puntualità e un comportamento adeguato. È vietato portare animali nel negozio.\\\n  Non è consentito portare bambini. In accordo con il negozio, i BV possono ammettere eccezioni per singoli FS e singoli bambini.\\\n  La tessera FS va sempre portata con sé durante i ritiri. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B1.29.2C_Satz_1_.E2.80.93_P.C3.BCnktlichkeit_und_Auftreten)\n- **B2)** I ritiri al di fuori degli orari stabiliti sono consentiti solo previo accordo con un/una BV. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B2.29_.E2.80.93_Abholungen_au.C3.9Ferhalb_der_vereinbarten_Termine)\n- **B3)** Se più FS ritirano insieme, entrano ed escono dal negozio insieme e svolgono il ritiro senza litigi o discussioni. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B3.29_.E2.80.93_mehrere_Abholer.2Ainnen)\n- **B4)** I FS che ritirano prendono sempre tutti gli alimenti consegnati dal negozio che sono ancora commestibili. Si possono concordare eccezioni con il negozio.\\\n  Tutti i FS prendono la stessa quantità di alimenti, a meno che tutti siano d’accordo su una ripartizione diversa. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B4.29_.E2.80.93_alle_LM_mitnehmen_.28.3F.29)\n- **B5)** Durante un ritiro possono entrare nel negozio solo:\\\n  – i FS iscritti per l’orario o che subentrano come sostituti, con la tessera;\\\n  – i futuri FS dopo l’accettazione dell’accordo legale, nell’ambito di un ritiro introduttivo insieme a un/una FS\\\n  Le altre persone devono aspettare lontano dal negozio come «aiuto per il trasporto». [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B5.29_.E2.80.93_Wer_darf_abholen_gehen)\n- **B6)** Durante il ritiro bisogna avere riguardo per la clientela e il personale del negozio. Non si fanno discussioni.\\\n  Chi ritira si attiene ai desideri del personale e lascia il luogo del ritiro in ordine. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B6.29_.E2.80.93_Verhalten_im_Betrieb)\n- **B7)** *Un tempo d’attesa richiesto dal negozio (scostamento dall’orario concordato) fino a 15 minuti va accettato; dopo, il ritiro può essere disdetto con cortesia.* [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B7.29_.E2.80.93_Wartezeit)\n- **B8)** Se il personale di un negozio si comporta in modo scortese, chi ritira resta comunque educato; in seguito può informare uno dei BV. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B8.29_.E2.80.93_Keine_Diskussionen_mit_Mitarbeitenden)\n- **B9)** Vanno evitati commenti sulla quantità, il tipo e l’uso degli alimenti salvati dai FS. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B9.29_-_Wenn_nichts_zu_retten_ist)\n- **B10)** Nessun alimento può essere venduto o usato come merce di scambio, neppure quelli preparati con alimenti salvati. Una cauzione per casse, bottiglie o simili può essere accettata o richiesta se è stata pagata al ritiro. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B10.29_-_kein_Verkauf.2C_kein_Tauschen)\n- **B11)** Per i ritiri vanno usati mezzi il più possibile rispettosi dell’ambiente. Lunghi viaggi in auto e l’uso inutile di articoli monouso vanno evitati per quanto possibile. Se il ritiro è possibile senza auto, i BV devono prevedere abbastanza posti per rendere possibile e promuovere questo tipo di ritiro. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B11.29_.E2.80.93_.C3.B6kologische_Mittel)\n- **B12)** L’obiettivo di foodsharing è salvare gli alimenti dalla spazzatura. Chi ritira decide autonomamente a chi dare gli alimenti. Il bisogno non è determinante. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B12.29_.E2.80.93_nicht_nur_an_Bed.C3.BCrftige)\n- **B13)** Tutti coloro che ritirano devono impegnarsi a consumare completamente gli alimenti salvati o a «fairteilen» (condividerli, con persone, se necessario anche con animali). [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_B13.29_.E2.80.93_gerettete_Lebensmittel_wegwerfen.3F)\n\n## <a id=\"c-betriebe-betriebsteam-planung-von-abholungen\"></a>C) Negozi, team del negozio, pianificazione dei ritiri\n\n- **C1)** Prima di un ritiro i FS devono conoscere la versione attuale delle particolarità del negozio e i messaggi attuali sulla bacheca e nella chat del team. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C1.29_.E2.80.93_aktuelle_Informationen_lesen_vor_Abholungen)\n- **C2)** Tutti i ritiri presso i negozi sono coordinati tramite la pagina del negozio sulla piattaforma online di foodsharing. Per singoli negozi si possono usare in aggiunta anche altri canali di comunicazione in accordo con i BOT, purché nessun membro del team ne sia escluso. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C2.29_.E2.80.93_Organisation_nur_.C3.BCber_die_foodsharing-Plattform)\n- **C3)** Chi si iscrive a un orario di ritiro è responsabile del ritiro. Chi in casi eccezionali non può fare un ritiro deve disiscriversi subito *e cercare un sostituto con un messaggio al team.\\\n  In caso di disdetta meno di 24 ore prima dell’orario, il/la FS deve cercare un sostituto con un messaggio al team e per telefono e, in caso di emergenza, informare un/una BV per telefono.* [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C3.29_.E2.80.93_Austragen_aus_Abholterminen)\n- **C4)** *Le comunicazioni del personale di un negozio a chi ritira devono essere trasmesse direttamente ad almeno un/una BV (raccomandazione).* [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C4_.E2.80.93_Mitteilungen_des_Betriebs)\n- **C5)** Regole particolari per un negozio vengono sempre concordate dai BV con il negozio e fissate nelle particolarità sulla pagina del negozio. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C5.29_.E2.80.93_Festlegungen_f.C3.BCr_Abholungen_in_einem_Betrieb)\n- **C6)** I nuovi negozi possono essere contattati di propria iniziativa solo da persone che hanno superato il quiz BV, in accordo con un/una BOT e, per le catene, con il/la KAM responsabile o con il gruppo catene di negozi. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C6.29_.E2.80.93_Ansprechen_von_Betrieben)\n- **C7)** Prima di contattare un negozio bisogna verificare se è già registrato sulla piattaforma online; se no, va registrato. [Spiegazione](https://wiki.foodsharing.network/wiki/Verhaltensregeln_-_Erl%C3%A4uterungen#Regel_C7.29_.E2.80.93_neue_Betriebe_eintragen_auf_Plattform)\n\n---\n\n*Articolo di*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Contatto](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Ultima revisione il 01.02.2020*\n\n---\n\n*Originale nel wiki di foodsharing: [Verhaltensregeln](https://wiki.foodsharing.network/wiki/Verhaltensregeln)*\n"}

              - column: {name: body, value: "*Gültig ab 13.12.2024*\\\n*[Änderige](https://drive.google.com/file/d/1XtVCJDSJlYDkLY2lctcN7s1zybYO8FhT) gägenüber de vorige Fassig (pdf)*\n\n**Usfüehrlichi Erlüüterige und Leitfäde für d Praxis**\\\nFür d praktischi Arbet als Foodsaver git s es paar wiiteri Text mit Tipps und Infos.\n\n- *[Erläuterungen zu den Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen)* - Erklärige zu jeder einzelne Regle, werum si für foodsharing wichtig isch und was si konkret bedüütet.\n- *[Hygiene-Ratgeber für Lebensmittel](https://wiki.foodsharing.network/wiki/Hygiene-Ratgeber_f%C3%BCr_Lebensmittel)* - e Reihe vo Artikel zum Umgang mit gerettete Läbesmittel\n\n*Wiiterentwicklig vo de Hygieneregle*\\\nD Hygieneregle wärded vo de *AG Hygiene* wiiterentwicklet. Verbesserigsvorschläg und Idee chönd jederziit a d AG Hygiene gschickt wärde (am beschte per Mail a [hygiene@foodsharing.network](mailto:hygiene@foodsharing.network)).\\\nD AG luegt alli Idee und Vorschläg aa, wo iigönd; e Änderig vo de gültige Regle isch einisch im Jahr – meistens im November – vorgseh.\\\nZur [Mitarbet i de Arbetsgruppe](https://foodsharing.de/?page=bezirk&bid=1686) sind alli Interessierte härzlich iiglade.\n\n### <a id=\"praeambel\"></a>Präambel\n\nD Hygieneregle leged Mindestaaforderige für foodsharing und alli Foodsaver fescht. Demit sölled bi de praktische Arbet mit Läbesmittel einersiits d gsetzliche Hygienevorschrifte iighalte wärde. Andersiits söled d Regle vor Fähler schütze und Hiiwiis gäh, wie mer mit Läbesmittel so umgaht, dass mer si ohni Bedänke ässe cha.\\\nEs cha debii durchus sinnvoll sii, für einzelni Situatione, Betriebe oder Bezirk Regle chli strenger z fasse, wänn d Gegäbeheite vor Ort das nötig mached.\n\n***Jede Bezirk cha drum d Regle für sin Bereich verschärfe; d Aapassige dörfed aber de Hygieneregle, wo da stönd, nöd widerspräche.***\n\n### <a id=\"a-taetigkeitsverbote-beim-umgang-mit-lebensmitteln-42-43-ifsg\"></a>A) Tätigkeitsverbot bim Umgang mit Läbesmittel (§§42, 43 IfSG)\n\n1\\) Für de Umgang mit Läbesmittel sind sauberi Chleider, Haar und Händ Vorussetzig.\n\n2\\) Bi de folgende Chrankheitssymptom isch mer verpflichtet, vor em Umgang mit offene, empfindliche Läbesmittel en Arzt ufzsueche:\n\n- bi Durchfall, starker Übelkeit, Erbräche, starkem Hueschte\n- bi aasteckende Chrankheite, bsunders Cholera, Typhus, Paratyphus, Ruhr, Salmonellose, EHEC, Hepatitis A oder E:\n- Hutchrankheite und offeni Wunde, wo entzündet sind, eitered oder nässed\n- bi Fieber über 38,5°C\n\nDe Umgang mit Läbesmittel isch nachher nur erlaubt, wänn de Arzt e schriftlichi Unbedänklichkeitsbescheinigung usstellt.\\\n[Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#A.29_T.C3.A4tigkeitsverbote_beim_Umgang_mit_Lebensmitteln_.28.C2.A7.C2.A742.2C_43_IfSG.29)\n\n### <a id=\"b-umgang-mit-lebensmitteln\"></a>B) Umgang mit Läbesmittel\n\n#### <a id=\"1-direkter-umgang-transport-und-lagerung\"></a>1) Direkte Umgang, Transport und Lagerig\n\n- **a)** *Unverpackti Backwaare*: Gebäckzange, Händsche (möglichst abwäschbari Mehrwäghändsche) oder sorgfältig gwäscheni Händ sind zwingend nötig.\n\n  Für alli andere Läbesmittel bruucht s i de Regle kei Händsche, ussert wänn si us bsundere Aaläss (oder wäg behördliche Aawiisige) empfohle sind.\n\n  Für Chueche und Torte söled möglichst feschti Behälter bruucht wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1a.29_-_Unverpackte_Backwaren)\n- **b)** *Chüehlwaare*: D Chüehlchette sött, wänn möglich, iighalte wärde: [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - *Transport* in ere Chüehltäsche oder Chüehlbox mit Chüehlelement mit maximal 20 Minute Unterbruch ohni Sunne oder Hitz\n  - *Lagerig* ohni Unterbruch im Chüehlschrank oder (nur für churzi Ziit) in ere Chüehltäsche oder Chüehlbox mit Chüehlelement\n- **c)** *Chüehlwaare* sind: [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1b.29.2C_B1c.29_-_K%C3%BChlkette)\n  - Läbesmittel, wo laut Verpackig bi +2 bis +8°C glageret wärde söled\n  - Teigwaare- und Härdöpfelsalat, zuebereiteti Speise mit Öl/Fett\n  - Chueche mit nöd durebachener Füllig, Creme- und Rahmtorte\n- **d)** *Aagfuulti Läbesmittel* söled getrennt vo andere Läbesmittel verpackt wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1d.29_-_Angefaulte_Lebensmittel)\n- **e)** Unverpackti Läbesmittel dörfed nur i *suubere*, *läbesmittelechte Verpackige* transportiert und glageret wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_1._Absatz_-_Lebensmittelechte_.28und_saubere.29_Verpackungen)\n\n  Läbesmittelechti Verpackige erkännt mer\n  - a de Aagab \"für Läbesmittel\" oder em Glas-und-Gable-Symbol\n  - a Original-Etikette, wo d ursprünglichi Verwändig für Läbesmittel belegged\n\n  [Bezugsquelle für läbesmittelechti Verpackige](https://docs.google.com/spreadsheets/d/1LpZBgtloqpNjDI9X3-7v91wSae61WqxbBAPyc7KrqoQ)\n\n  Bi *heisse Läbesmittel* dörfed nur Behälter bruucht wärde, wo für di entsprächend Temperatur gmacht sind.\n\n  *Usnahm*: [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B1e.29.2C_Ausnahme_-_nicht-lebensmittelechte_Verpackungen)\n  - Läbesmittel, wo en Betrieb in ere nöd läbesmittelechte oder dräckige Verpackig übergit, söled möglichst no am Abholort umpackt wärde. Si chönd allefalls au bi de Abholig als ungniessbar beurteilt und zrugglah wärde.\n\n#### <a id=\"2-weitergabe-allgemein\"></a>2) Wiitergab allgemein\n\nDie folgende Regle gälted nur für d ***Wiitergab*** vo gerettete Läbesmittel.\\\nFoodsaver chönd ohni Iischränkig alli gerettete Läbesmittel und au anderi gerettete Sache uf eigenes Risiko sälber bruuche oder als Tierfuetter näh.\\\n[Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_Weitergabe_allgemein)\n\n- **a)** Foodsaver sind *verantwortlich* für Läbesmittel, wo si wiitergänd. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2a.29_-_Verantwortlichkeit_der_Foodsaver)\n- **b)** En *Haftigsaaspruch* vom Empfänger oder de Empfängerin für Folgeschäde bestaht nur bi grober Fahrlässigkeit oder Absicht. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl%C3%A4ssigkeit_.28und_Vorsatz.29)\n- **c)** Zum *grobi Fahrlässigkeit* uszschlüüsse: [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2b.29.2C_B2c.29_-_Grobe_Fahrl.C3.A4ssigkeit_.28und_Vorsatz.29)\n  - müend d Läbesmittel korrekt transportiert und glageret wärde (lueg Abschnitt B1) )\n  - müend Läbesmittel nach em Verbruuchsdatum ussortiert wärde\n  - mues vor de Wiitergab jedes einzelne Stück uf Gniessbarkeit *prüeft wärde*:\n    - Nur wiitergäh, was mer au sälber no ässe würd!\n    - ***Aug-Nase-Muul-Test***: Ussehe, Geruch und allefalls Gschmack prüefe (soviel ohni Öffne vo de Verpackig möglich)!\n- **d)** *Verbote* isch d Wiitergab vo Läbesmittel [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2d.29_-_Verbotene_Lebensmittel)\n  - mit Schimmel oder schwarze Stelle\n  - nach em Verbruuchsdatum\n  - mit VD bi offener innerschter Verpackig\n  - mit MHD bi offener innerschter Verpackig, wänn mer nöd weiss, wänn si göffnet worde isch, oder wänn das lang här isch\n  - mit ufbläähte Vakuumverpackige\n- **e)** Verbote isch usserdem d Wiitergab vo *Medikament*. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2e.29_-_Arzneimittel)\n- **f)** *Tierfuetter* darf wiitergäh wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2f.29_-_Tierfutter)\n- **g)** *Nöd-Ässbars* (z.B. Putz- und Pflegeprodukt, Kosmetik, Büecher, Chleider) mues so klar vo Läbes- und Fuettermittel getrennt wiitergäh wärde, dass mer nüüt verwächsle cha. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_B2g.29_-_Nicht-Essbares)\n\n### <a id=\"c-zusaetzliche-regeln-fuer-verschiedene-stufen-der-weitergabe\"></a>C) Zuesätzlichi Regle für verschideni Stuefe vo de Wiitergab\n\nGerettete Läbesmittel müend uf 4 Stuefe vo de Wiitergab ufteilt wärde:\n\n- Stuefe 1: nöd-persönlichi Wiitergab\n- Stuefe 2: persönlichi Wiitergab\n- Stuefe 3: Eigekonsum oder Tierfuetter\n- Stuefe 4: Entsorgig.\n\nJe nach Stuefe gälted wiiteri Regle zuesätzlich zu dene us Abschnitt B). [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Teil_C.29_-_Stufen_der_Weitergabe)\n\n#### <a id=\"stufe-1-nicht-persoenliche-weitergabe\"></a>Stuefe 1) Nöd-persönlichi Wiitergab\n\nohni direkte Kontakt zu de Empfänger\\*innen (z.B. Fairteiler, anderi Organisatione) [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#1.29_-_Nicht-pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Verbote* isch d Wiitergab vo\n  - Hackfleisch, rohem Fisch, Produkt us nöd erhitzter Rohmilch\n  - früsch zuebereitete Speise mit rohem Ei, Flüssigei\n  - Creme, Pudding, Tiramisu, Mayonnaise (wänn sälber gmacht mit Ei oder Milch)\n  - rohe Eier nach em Ablauf vom MHD\n  - sälber gsammlete Pilz\n  - Alkohol, alkohol- oder THC-haltige Läbesmittel, Energy-Drinks\n  - Läbesmittel mit Schimmel oder fuule Stelle\n  - chüehlpflichtige Läbesmittel, wo d Chüehlchette unterbroche worde isch\n  - zuebereitete Speise, falls Kund\\*innen direkte Kontakt mit de Läbesmittel gha händ chönne\n  - zuebereitete, warm aabotne Speise\n  - zuebereitete Speise, wo gchüehlt wärde müend\n  - Läbesmittel mit VD oder MHD, wo d (innerscht) Packig offe isch\n  - Läbesmittel, wo i nöd läbesmittelechte oder dräckige Verpackige übergäh oder glageret worde sind\n\n  [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1a.29_-_Verbotene_Lebensmittel)\n- **b)** Läbesmittel *mit Ärde draa* dörfed nöd über andere Läbesmittel glageret wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1b.29_-_Erdbehaftete_Lebensmittel)\n- **c)** *Zuebereiteti* Speise müend abdeckt oder in eme verschlossene Behälter sii. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **d)** *Zuetatelischte*: Bi sälber gmachte Speise müend alli Zuetate und s Datum vo de Zuebereitig druf gschribe wärde. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n- **e)** *Umgfüllti* Läbesmittel müend mit de vollständige Zuetatelischte, em Umfülldatum und allefalls em MHD aagschribe sii. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C1c.29.2C_C1d.29.2C_C1e.29_-_Zubereitete_Speisen_und_das_Umf%C3%BCllen_von_Lebensmitteln)\n\n#### <a id=\"stufe-2-persoenliche-weitergabe\"></a>Stuefe 2) Persönlichi Wiitergab\n\nmit de Möglichkeit, mit de Empfänger\\*innen z rede [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#2.29_-_Pers%C3%B6nliche_Weitergabe)\n\n- **a)** *Verbote*: [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2a.29_-_Verbotene_Lebensmittel)\n  - Läbesmittel, wo nur no *bedingt und mit Vorsicht* gniessbar oder *sehr unappetitlich* sind (z.B. Obst/Gmües mit sehr weiche Stelle oder Teil, bruuner Hälfti, wild abgrissnigs oder zäch-vertröchnets Brot)\n  - Läbesmittel, wo d *Chüehlchette* länger unterbroche gsii isch (je nach Läbesmittel und Wätter – Fuustregle: de direkt Wäg vom Betrieb zum Chüehlschrank gaht)\n- **b)** *Entscheid nach Person im Einzelfall*: Läbesmittel dörfed nur wiitergäh wärde, wänn mer de Empfänger\\*innen *zuetraut*, dass si d Läbesmittel verantwortigsvoll behandled und beurteiled (z.B. bi Alkohol, Fisch oder aagfuultem Obst/Gmües). [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2b.29_-_Entscheidung_im_Einzelfall)\n- **c)** *Mündlichi Hiiwiis*: D Empfänger\\*innen söled allefalls druf hiigwise wärde, [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#Regel_C2c.29_-_M%C3%BCndliche_Hinweise)\n  - dass d Läbesmittel *schnell* bruucht wärde müend\n  - dass si d Läbesmittel vor em Ässe nomal *prüefe* söled\n  - falls d *Chüehlchette* nöd iighalte wärde hät chönne\n\n#### <a id=\"stufe-3-eigenkonsum-oder-tierfutter\"></a>Stuefe 3) Eigekonsum oder Tierfuetter\n\n- **a)** Foodsaver chönd Läbesmittel sälber bruuche oder als Fuetter für Tier wiitergäh. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n- **b)** Foodsaver dörfed anderi gerettete Sache ussert Läbes- und Fuettermittel sälber bruuche, aber nöd im Name vo foodsharing wiitergäh. [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#3.29_-_Eigenkonsum_oder_Tierfutter)\n\n#### <a id=\"stufe-4-entsorgung\"></a>Stuefe 4) Entsorgig\n\nLäbesmittel, wo nöd i d Kategorie 1), 2) oder 3) falled, müend fachgerecht entsorgt wärde (Abfallchübel, Kompost usw.). [Erlüüterig](https://wiki.foodsharing.network/wiki/Hygieneregeln_-_Erl%C3%A4uterungen#4.29_-_Entsorgung)\n\n---\n\n*Artikel vo*: [AG Hygiene - Austausch und (Fach)Wissen](https://foodsharing.de/?page=bezirk&bid=1686) (*[Kontakt](mailto:hygiene@foodsharing.network)*)\\\n*Letschti Überarbeitig am 13.12.2024*\n\n---\n\n*Original im foodsharing-Wiki: [Hygieneregeln](https://wiki.foodsharing.network/wiki/Hygieneregeln)*\n"}

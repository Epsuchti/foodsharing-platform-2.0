              - column: {name: title, value: "Violazioni delle regole – conseguenze e trattamento"}
              - column: {name: body, value: "*In vigore dal 01.10.2020*\n\n***Spiegazioni e motivazioni***\\\nIl trattamento delle violazioni delle regole è spiegato in dettaglio nell’articolo del wiki [Regelverletzungen](https://wiki.foodsharing.network/wiki/Regelverletzungen) (violazioni delle regole). L’articolo [Regelverletzungen - Erläuterungen](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen) offre motivazioni e spiegazioni per ogni singola disposizione.\n\nQueste disposizioni vengono sviluppate dall’*AG Verhaltensregeln und Meldesystem* (gruppo di lavoro regole di comportamento e sistema di segnalazione). Proposte e idee possono essere inviate in qualsiasi momento al gruppo di lavoro (possibilmente per e-mail a [verhaltensregeln@foodsharing.network](mailto:verhaltensregeln@foodsharing.network)).\\\nIl gruppo di lavoro esamina tutte le idee e le proposte ricevute.\n\nTutte le persone interessate sono cordialmente invitate a [collaborare nel gruppo di lavoro](https://foodsharing.de/?page=bezirk&bid=1640).\n\n### <a id=\"begriffe-und-abkuerzungen\"></a>Termini e abbreviazioni\n\n- Segnalazione di una violazione delle regole (**MRV**)\n- [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (gruppo locale delle segnalazioni, **LMG**)\n- [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (organo locale di conciliazione) nel distretto (**LS**)\n- Persone con diritti BOT in un distretto, qualunque sia la loro denominazione (**BOT**) - compresi i distretti di Land, di Stato, di continente e altri\n\n### <a id=\"konsequenzen-fuer-regelverletzungen\"></a>Conseguenze delle violazioni delle regole\n\nLe «regole» ai sensi di questa sezione sono tutte le disposizioni delle basi foodsharing 2 («regole di comportamento») e 3 («violazioni delle regole - conseguenze e trattamento»).\n\n- **a)** Un ***ammonimento*** può essere pronunciato per qualsiasi violazione delle regole. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#a.29_.E2.80.93_Verwarnung)\n- **b)** Una ***sospensione temporanea dai ritiri*** con revoca della verifica ed eventualmente il blocco di altre attività in foodsharing fino a 3 mesi (***cartellino giallo***) può essere pronunciata\n  - **i)** in caso di violazioni delle [regole A)-C)](/learn/code-of-conduct#a-allgemeines-verhalten-bei-foodsharing) che mettono in pericolo la collaborazione con un negozio\n  - **ii)** in caso di violazione della regola [C6)](/learn/code-of-conduct#c-betriebe-betriebsteam-planung-von-abholungen)\n  - **iii)** in caso di violazioni delle regole d’igiene che mettono in pericolo la salute di terzi\n  - **iv)** in caso di danno alla reputazione di foodsharing presso i negozi o in pubblico\n  - **v)** in caso di violazione dell’accordo legale e di violazioni delle regole contrarie ai principi di foodsharing\n  - **vi)** se (dopo una corretta cancellazione) ci sono 3 ammonimenti non cancellati\n\n  Alla fine della sospensione il o la foodsaver viene nuovamente verificato/a su richiesta a un/una BOT del distretto di appartenenza.\n\n  [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#b.29_.E2.80.93_Suspendierung_.28Gelbe_Karte.29)\n- **c)** Una ***retrocessione a foodsharer*** (***cartellino giallo-rosso***) può essere pronunciata se ci sono 2 cartellini gialli.\\\n  Contemporaneamente viene fissato per 3-6 mesi un divieto di ripetere il quiz FS, eventualmente anche un blocco di altre attività in foodsharing per la stessa durata.\\\n  Il distretto che lo pronuncia può revocare il divieto e il blocco in qualsiasi momento. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#c.29_.E2.80.93_Herabstufung_zum_Foodsharer_.28Gelb-rote_Karte.29)\n- **d)** Un ***blocco permanente dell’account*** con divieto di nuova registrazione (***cartellino rosso***) può essere pronunciato in caso di\n  - **i)** condanna per un reato commesso durante l’attività per foodsharing\n  - **ii)** condanna per un reato contro membri o beni di foodsharing\n  - **iii)** violazione dei [principi](/learn/principles) che avviene per la 2a volta nonostante un precedente cartellino giallo, giallo-rosso o rosso\n  - **iv)** presenza di 2 cartellini giallo-rossi. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#d.29_.E2.80.93_Sperrung_des_Accounts_.28Rote_Karte.29)\n  - **v)** se ciò è richiesto dal diritto vigente o se senza un blocco immediato sussiste un pericolo acuto e rilevante per foodsharing e.V. o per terzi. In questi casi il comitato di foodsharing e.V. decide e documenta la misura sotto la propria responsabilità.\n\nSpiegazione\n\n### <a id=\"a-umgang-mit-regelverletzungen\"></a>A) Gestione delle violazioni delle regole\n\n- **1)** La segnalazione di una violazione delle regole non ha lo scopo di perseguire in modo restrittivo un comportamento inappropriato. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **2)** L’obiettivo è piuttosto occuparsi attivamente di determinate situazioni, per creare comprensione per le regole e trovare una soluzione che tutte le persone coinvolte possano accettare. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **3)** Pronunciare una conseguenza dovrebbe essere solo l’ultima possibilità. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A1-3%29)\n- **4)** La segnalazione va trattata in una cerchia di persone il più ristretta possibile, perché si tratta di un tema molto confidenziale. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A4%29)\n- **5)** Per ogni MRV va considerato il singolo caso e non va espresso un giudizio generico. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_A5%29)\n\n### <a id=\"b-gruppen-fuer-die-meldungsbearbeitung\"></a>B) Gruppi per il trattamento delle segnalazioni\n\n- **1)** Per trattare le MRV ogni distretto istituisce un [Lokale Meldungsgruppe](https://wiki.foodsharing.network/wiki/Lokale_Meldungsgruppe) (LMG). Ha il nome «Meldungen *nome del distretto*» e l’indirizzo e-mail «meldungen.*nomedeldistretto*@foodsharing.network». Fino all’istituzione del LMG in un distretto, il compito è svolto dal gruppo di verifica esistente (con varie denominazioni). [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B1%29)\n- **2)** Si raccomanda di istituire anche una [Lokale Schiedsstelle](https://wiki.foodsharing.network/wiki/Lokale_Schiedsstelle) (LS), a cui ci si può rivolgere nei casi previsti da C3) e D8). Ha allora il nome «Schiedsstelle *nome del distretto*» e l’indirizzo e-mail «schiedsstelle.*nomedeldistretto*@foodsharing.network». [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B2%29)\n- **3)** I membri del LMG e della LS vengono eletti democraticamente dai FS del distretto. Nessuno può essere membro di più di un LMG o di una LS. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B3%29)\n- **4)** I foodsaver con cartellini gialli, giallo-rossi o rossi non cancellati non possono essere membri di un LMG o di una LS. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_B4%29)\n- **5)** Per la mediazione secondo D8) ii) ogni distretto può nominare democraticamente un ulteriore gruppo di lavoro. I membri di questo gruppo non possono far parte del LMG o della LS del distretto né essere BOT del distretto. *Spiegazione*\n\n### <a id=\"c-zustaendigkeiten\"></a>C) Competenze\n\n- **1)** Per il trattamento di una MRV è competente per principio il distretto di appartenenza della persona segnalata.\\\n  In caso di cambio del distretto di appartenenza, le segnalazioni pendenti non trattate definitivamente vengono concluse dal precedente distretto di appartenenza, a meno che i due distretti non concordino insieme diversamente. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **2)** Le segnalazioni vengono trattate per principio dal LMG del distretto. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C1-2%29)\n- **3)** Per segnalazioni contro membri del LMG o BOT del loro distretto di appartenenza, la persona che segnala può stabilire in deroga che la segnalazione sia trattata dalla LS. Se non esiste una LS, la segnalazione va in questo caso comunque al LMG. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C3%29)\n- **4)** Per segnalazioni contro foodsharer è competente il distretto del luogo di residenza del o della foodsharer segnalato/a, se il luogo di residenza è noto. Altrimenti è competente il distretto di appartenenza della persona che segnala. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C4%29)\n- **5)** L’attuazione e la conferma dei cartellini giallo-rossi e rossi avviene da parte del comitato di foodsharing e.V. secondo i requisiti per l’attuazione dei cartellini giallo-rossi e rossi. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C5%29)\n- **6)** La persona segnalata può ricusare singoli membri di un gruppo che tratta la segnalazione se li ritiene di parte. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C6%29)\n- **7)** Le persone coinvolte non possono trattare MRV. Sono considerate coinvolte la persona che segnala e quella segnalata nonché tutte le persone presenti nella situazione segnalata. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_C7%29)\n\n### <a id=\"d-bearbeitung-einer-meldung\"></a>D) Trattamento di una segnalazione\n\n- **1)** La MRV viene inviata dalla persona che segnala direttamente al gruppo competente. Se un gruppo riceve una MRV per cui non è competente, la inoltra al gruppo competente. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D1%29)\n- **2)** La segnalazione e tutti gli altri contributi (messaggi, e-mail, note e verbali di colloqui, prese di posizione, decisione, ricorso a un altro gruppo) vengono documentati nel forum del gruppo che in quel momento tratta la segnalazione. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D2%29)\n- **3)** La segnalazione non viene trattata se è presentata più di 2 mesi dopo l’evento segnalato. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D3%29)\n- **4)** Prima di trattare una segnalazione, il LMG deve effettuare per la persona segnalata la cancellazione di segnalazioni e conseguenze secondo la sezione F). [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D4%29)\n- **5)** La persona segnalata deve essere informata della segnalazione e del suo motivo - in forma anonimizzata secondo E3) - e invitata a prendere posizione entro 2 settimane da questa comunicazione. ([modello di e-mail](https://drive.google.com/file/d/1nE8G9K16J4btsBVnh0TaPElf8nqfLyCK)) La persona che segnala viene informata dell’inizio del trattamento e della possibilità di un’ulteriore presa di posizione entro 2 settimane da questa comunicazione. ([modello di e-mail](https://drive.google.com/file/d/1OjLUKYdfi0KXSTtPaeWCktTrovYS3W-y))\n\n  Una conseguenza può essere pronunciata solo quando entrambi i messaggi e tutte le prese di posizione ricevute sono disponibili per iscritto (e-mail o carta). [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D5%29)\n- **6)** La persona che segnala può rinunciare alla forma anonimizzata secondo E3) nel modulo di segnalazione o in seguito su richiesta del gruppo che tratta la segnalazione. ([modello di e-mail](https://drive.google.com/file/d/1gYknWLB7uKJZXmnVPcZP1JdIL_eret93))\\\n  Se la mancata rinuncia impedisce il trattamento della segnalazione, il trattamento da parte di questo gruppo termina con la decisione «nessuna conseguenza». ([modello di e-mail alla GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [modello di e-mail alla MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D6%29)\n- **7)** La decisione con la motivazione viene comunicata alla persona che segnala e a quella segnalata per e-mail o su carta, insieme a un termine per chiedere una mediazione secondo D8). ([modello di e-mail alla GP](https://drive.google.com/file/d/1ikXC3eoIwD0Ez9-UVyZDN69g8ZqjdkC-), [modello di e-mail alla MP](https://drive.google.com/file/d/1Tt3rvr6EzBjNO6M32fkDuAOvZrprM1gx)) [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D7%29)\n- **8)** La persona che segnala e quella segnalata possono chiedere entro 2 settimane una mediazione al gruppo previsto, se esiste. Questo gruppo è\n  - **i)** in caso di trattamento da parte del LMG, la LS, se esiste; altrimenti la mediazione non è possibile;\n  - **ii)** in caso di trattamento da parte della LS, il gruppo nominato dal distretto secondo B5).\n\n  Il gruppo di mediazione può rifiutare la mediazione senza motivazione. ([modello di e-mail](https://drive.google.com/file/d/1pZTqeFJARkQC0Q4GYSIZNBb-1xuBfn3l)) [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D8%29)\n- **9)** Se viene pronunciata una conseguenza, questa viene documentata nel forum del LMG competente per la persona segnalata. Vanno salvati almeno data e motivo della segnalazione nonché la conseguenza con la data della decisione. ([modello di e-mail](https://drive.google.com/file/d/1G-tvtx1j3im3QcBN_5nf40B54hnT5lom)) [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_D9%29)\n- **10)** Il gruppo che ha pronunciato una conseguenza può terminarla anticipatamente. Per i cartellini giallo-rossi e rossi deve essere d’accordo il comitato di foodsharing e.V. *Spiegazione*\n- **11)** Con il consenso di tutti gli altri gruppi coinvolti nel trattamento della segnalazione, il gruppo che ha pronunciato una conseguenza può revocarla completamente. Per i cartellini giallo-rossi e rossi deve essere d’accordo il comitato di foodsharing e.V. La decisione viene comunicata con motivazione alla persona segnalata e a quella che segnala. Queste possono chiedere entro 2 settimane una mediazione al gruppo previsto secondo D8). *Spiegazione*\n\n### <a id=\"e-datenschutz-vertraulichkeit-selbstauskunft\"></a>E) Protezione dei dati / riservatezza / informazioni su di sé\n\n- **1)** **Riservatezza:** Tutto ciò che riguarda le MRV va trattato in modo strettamente riservato. Tutte le persone coinvolte sono tenute al segreto, a meno che la persona che segnala, quella segnalata e tutte le persone nominate nella segnalazione abbiano acconsentito per iscritto alla divulgazione. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **2)** **Trasmissione:** La trasmissione è ammessa solo a persone e organi competenti per il trattamento del singolo caso. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E1-2%29)\n- **3)** **Forma anonimizzata:** La comunicazione della segnalazione alla persona segnalata è consentita solo in forma anonimizzata, cioè il nome della persona che segnala non può essere divulgato.\n\n  Se la persona segnalata è membro di un gruppo che tratta la segnalazione o di un gruppo coinvolto, la forma anonimizzata non è possibile. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E3%29)\n- **4)** **Informazioni su di sé:** Ogni FS può chiedere al LMG del suo distretto di appartenenza le conseguenze attualmente a suo carico e le relative segnalazioni in forma anonimizzata secondo E3). [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E4%29)\n- **5)** **Informazioni per i distretti:** Ogni distretto può chiedere al distretto di appartenenza dei suoi foodsaver un elenco delle conseguenze esistenti; in caso di cambio del distretto di appartenenza, anche il nuovo distretto può chiederlo al precedente. L’elenco contiene per ogni segnalazione solo numero, data e motivo nonché la conseguenza con la data della decisione. [*Spiegazione*](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_E5%29)\n\n### <a id=\"f-tilgung-von-meldungen-und-konsequenzen\"></a>F) Cancellazione di segnalazioni e conseguenze\n\n- **1)** La persona segnalata può chiedere al LMG la cancellazione delle segnalazioni e delle conseguenze a suo carico. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F1%29)\n- **2)** Il LMG è allora tenuto a cancellare tutte le segnalazioni per le quali è stato deciso definitivamente di non pronunciare alcuna conseguenza. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F2%29)\n- **3)** Il LMG è inoltre tenuto a cancellare tutte le conseguenze la cui decisione risale, per un\n  - **i)** ammonimento, a 6 mesi\n  - **ii)** cartellino giallo, a 2 anni\n  - **iii)** cartellino giallo-rosso, a 3 anni\n  - **iv)** cartellino rosso, a 5 anni\n\n  fa e per le quali in questo periodo non è stata pronunciata alcuna altra conseguenza. Il LMG è allora tenuto a cancellare tutti i cartellini rossi la cui conseguenza è terminata più di 5 anni fa, se in questo periodo non è stata pronunciata alcuna altra conseguenza. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **4)** Se una conseguenza viene cancellata, questo può comportare che anche la conseguenza immediatamente precedente debba essere cancellata. [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F3-4%29)\n- **5)** Per la cancellazione di una conseguenza il LMG informa tutti i gruppi coinvolti nel trattamento della relativa segnalazione. ([modello di e-mail](https://drive.google.com/file/d/1Bxffjz-JdtOOBaBHp74PkbkjIlpJb2su)) Questi cancellano o distruggono, per quanto tecnicamente possibile:\n  - la segnalazione, le prese di posizione, la decisione e tutti gli altri contributi e commenti del forum\n  - tutte le e-mail, gli altri messaggi e i file, anche dal cestino\n  - tutti i documenti cartacei\n\n  [Spiegazione](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Erl%C3%A4uterungen#Regel_F5%29)\n\n---\n\n*Articolo di*: [AG Verhaltensregeln und Meldesystem](https://wiki.foodsharing.network/wiki/Gruppe_Verhaltensregeln_und_Meldesystem) (*[Contatto](mailto:verhaltensregeln@foodsharing.network)*)\\\n*Ultima revisione il 20.08.2026*\n\n---\n\n*Originale nel wiki di foodsharing: [Regelverletzungen – Konsequenzen und Bearbeitung](https://wiki.foodsharing.network/wiki/Regelverletzungen_-_Konsequenzen_und_Bearbeitung)*\n"}

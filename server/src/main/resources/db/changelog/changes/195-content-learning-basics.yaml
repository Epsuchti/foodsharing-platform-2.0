              - column: {name: title, value: "Kontext und Sälbstverständnis"}
              - column: {name: body, value: "## <a id=\"lebensmittelverschwendung\"></a>Läbesmittelverschwändig\n\n- Öppe 4 Milliarde Tonne Läbesmittel wärded weltwiit jedes Jahr produziert. Devo wärded über 1,3 Milliarde Tonne verschwändet. [1]\n- I Industriestaate sind öppe 40% vo de verschwändete Nahrigsmittel völlig gniessbari Läbesmittel. [1]\n- Mir alli sind defür verantwortlich, dass Läbesmittelhändler, Zwüschehändler, Produzänte und Gastronome jedes Jahr Millione Tonne Läbesmittel wegrüered.\n- 2/3 vo de ganze Läbesmittelverschwändig chönnt mer dur s Engagement vo Läbesmittelbetriebe, Foodsaver und Privatpersone iispare.\n- Nur zäme chönd mir de Wahnsinn vo de Überflussgsellschaft stoppe, indem jede sin Teil dezue biiträit und verantwortlich handlet.\n\n## <a id=\"ausgangssituation\"></a>Usgangslag\n\n- Jede Tag wärded i extremem Uusmass Läbesmittel verschwändet, und das, obwohl immer no öppe 57'000 Mänsche pro Tag a Hunger stärbed. [2]\n- I de Industrienatione passiert bsunders vill vo dere Verschwändig bi de Konsumänte: über 150 kg pro Person und Jahr. [3]\n- Öpfel mit Druckstelle, z chrummi Gurke, z chliini Zucchetti und sogar Produkt, wo entweder z tüür oder z billig sind, landed bi eus sehr schnell im Abfall vo de Händler, obwohl si i de allermeischte Fäll absolut gniessbar wäred.\n- Au Privathushält sind nöd vor Verschwändig sicher: Z grossi Packige, z vill Produkt, z chliini Priis und oft leider eifach Gedankelosigkeit füehred au dihei zu vill vermeidbarem Läbesmittelabfall.\n\n## <a id=\"ansatzpunkte\"></a>Aasatzpünkt\n\nWill Verschwändig a vill verschidene Stelle vom Produktions- und Konsumchreislauf passiert, chönd mir si au a vill verschidene Stelle bekämpfe.\\\nMir setzed also a drei Stelle aa:\n\n1. *Bi Läbesmittelhändler und [Betriebe](https://wiki.foodsharing.network/wiki/Betrieb)*: Uf de Basis vo Kooperatione wärded einersiits Läbesmittel vor em Wegwärfe gerettet, abgholt und wiiterverteilt. Andersiits wänd mir eusi Partner defür sensibilisiere, dass mer mit besserer oder vorsichtigerer Planig bim Iichaufe und bim Vorrat, aber au z.B. mit vergünstigte Aagebot für nümme ganz perfekti Läbesmittel d Verschwändig vo Läbesmittel au verringere cha. Als Näbeeffekt cha au s Volume vo de Ghüder- und Biochübel um bis 70% zruggaa. [4]\n2. *Bi Konsumänt\\*innen im private Bereich*: Mir stelled allne Mänsche, wo sälber Ässe rette oder teile wänd, uf foodsharing.de di digital Infrastruktur zur Verfüegig. Mir wünsched eus, dass immer meh Mänsche das Aagebot nutzed, zum Biispiel, zum vor de Abreis i d Ferie ihri übrige Läbesmittel per virtuellem Ässechorb z verteile. Drüber use wänd mir generell uf s Thema ufmerksam mache, mit fundierte Informatione und Bildigsaagebot Wüsse und Idee zum nachhaltigere Umgang mit Läbesmittel verbreite und allgemein zu meh Achtsamkeit für Läbesmittel aarege.\n3. *Bi Produktionsbetriebe*: Mir wänd Mänsche motiviere und ihres Engagement fördere, damit si \"Usschussobst und -gmües\" vor em Verfuule oder Verderbe retted. Zum Biispiel mached mir zur Ärntiziit Aktione, zum d Feldfrücht, wo de strenge optische Standards vo de Agrarindustrie und ihrne Abnehmer nöd entspräched, vo de Fälder z sammle, wo si susch eifach ligge bliibe würed. So chönd mer Unmänge chrummi Rüebli, verbrocheni Gurke oder aadrückti Öpfel rette.\n\n## <a id=\"selbstverstaendnis\"></a>Sälbstverständnis\n\n- foodsharing isch e [Umweltbewegig](/learn/principles). Euses Ziel isch de Schutz vo de natürliche Ressource uf eusem Planet. Läbesmittel verschwände bedüütet, d Ressource z verschwände, wo defür bruucht worde sind (Wasser, Energie, Land- und Lagerflächi, Arbetsziit, Rohstoff zum Biispiel für Verpackige).\n\n- foodsharing isch kei soziali (*eigentlich: mildtätigi*) Organisation. Mir wänd eus nöd aamasse z entscheide, weli Mänsche bedürftig sind oder weli Projekt jetzt unterstützigswürdiger sind als anderi. Mir wänd Läbesmittel [bedingigslos](/learn/principles) allne Mänsche zuegänglich mache und demit d Achtig vor ihne fördere.\n\n- Mir vo foodsharing verschänked überschüssigi Läbesmittel vo Betriebe und Privatpersone. D Läbesmittel wärded immer gratis wiitergäh und nie verchauft oder als Tuuschmittel bruucht. Sälbverständlich dörfed Foodsaver di gerettete Waare sälber ässe.\n\n- foodsharing schaffet [unabhängig](/learn/principles) vo politische Parteie und Konfessione. foodsharing verteilt Läbesmittel a alli Mänsche. Jedi Art vo Usgränzig oder Benachteiligung wird nöd toleriert.\n\n- Mir stönd nöd in Konkurränz zu [andere Initiative](https://wiki.foodsharing.network/wiki/Pressemitteilung_zur_Kooperation_mit_den_Tafeln), wo sich gäge Ässeverschwändig iisetzed, wie zum Biispiel d Tafle, sondern schaffed mit ihne zäme. Mir begrüessed und unterstützed jedes Engagement gäge Läbesmittelverschwändig.\n\n  Mir lönd allne mildtätige Organisatione gärn de Vortritt, zum gerettete Läbesmittel a Bedürftigi z verteile. foodsharing sött nur di \"letscht Bastion vor em Abfallchübel\" sii für alli Läbesmittel, wo anderi Organisatione nöd wiiterverteile chönd.\n\n- foodsharing will zäme mit de Tuusige ehreamtliche Foodsaver i ganz Dütschland e neui Kultur vo de Achtig gägenüber em Ässe läbe, zum zäme mit de kooperierende Läde de Läbesmittel d Wertschätzig z gäh, wo si verdiened.\n\n- S langfrischtig Ziel vo foodsharing isch, sich sälber überflüssig z mache, indem di grossaagleit, systematisch Verschwändig vo Läbesmittel beändet wird.\n\n- Für wiiteri Informatione zu dem Thema legged mir eu de Film \"Taste the Waste\" vo eusem Gründigsmitglied Valentin Thurn as Härz.\n\n## <a id=\"foodsharing\"></a>foodsharing\n\nfoodsharing isch e Initiative, zum\n\n- [Foodsaver](https://wiki.foodsharing.network/wiki/Foodsaver) z organisiere, wo Läbesmittel (und au anderi, nöd ässbari Produkt) vo Läbesmittelbetriebe vo allne Arte retted\n- [Foodsharer](https://wiki.foodsharing.network/wiki/Foodsharer) z organisiere, wo Läbesmittel gratis wiitergäh wänd\n- Veraastaltige zum Thema z organisiere, d Internationalisierig vo foodsharing voraazbringe und vill meh\n\n- De [foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) betriibt d Online-Plattform, hauptsächlich mit unbezahlte, sehr engagierte Ehreamtliche, wo sich um zentrali Ufgabe kümmered, z.B. [Programmierig](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform), [zentrali Pressearbet](https://wiki.foodsharing.network/wiki/Pressetext), Rächtsfroge, zentrali Festlegige, Koordination vo [zentrale AGs](https://foodsharing.de/?page=groups), [Grafikdesign](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Materialien_-_Grafikdateien), Koordination vo de Bezirk und [Bundesländer](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#Bundesland-Botschafter.2Ainnen), [überregionali und internationali Träffe, Internationalisierig und Übersetzig](https://wiki.foodsharing.network/wiki/Arbeitsgruppen-Liste#International_-_foodsharing_International), unterstützt nur dur es paar Minijob- und Teilziit-Stelle.\n\n- Denäbe engagiered sich über 100 wiiteri sehr aktivi Foodsaver i andere Bereich.\n\n- S Rette vo Läbesmittel isch i Bezirk organisiert, wo meistens e oder mehreri Städt oder en Landchreis umfassed. D Koordination in eme Bezirk liit i de Händ vo foodsharing-[Botschafter\\*innen](https://wiki.foodsharing.network/wiki/Botschafter*in), d Kooperatione mit einzelne Betriebe wärded jewiils vo [Betriebsverantwortliche](https://wiki.foodsharing.network/wiki/Betriebsverantwortliche*r) betreut.\n\n- Mir probiered, uf e organischi und uf Zueverlässigkeit bedachti Art z wachse: nöd möglichst schnell möglichst vill Kooperatione iizgaa und Lüüt ufzneh. Lieber nämed mir eus d Ziit, eusi Arbet guet und sorgfältig z mache, bevor mir de nächscht Schritt mached.\n\n- Alli Foodsaver sind [sorgfältig usbildeti](https://wiki.foodsharing.network/wiki/Foodsaver#Wie_man_Foodsaver_wird) und zueverlässigi Läbesmittelretter\\*innen, wo ihri Arbet dur di interne [Verhaltensregle](/learn/code-of-conduct), [Hygieneregle](/learn/hygiene-rules) und d [Rächtsvereibarig](/learn/legal-agreement) gsteuret und abgsicheret wird. Si chönd sich jederziit mit ihrem [Foodsaver-Uswiis](https://wiki.foodsharing.network/wiki/Ausweis) identifiziere.\n\n- Alli Foodsaver müend mit de [Rächtsvereibarig](/learn/legal-agreement) de Haftigsusschluss akzeptiere, bevor si Läbesmittel abhole chönd. Er isch vo zwei Aawaltskanzleie so usgleit worde, dass alli abgäbende Läbesmittelbetriebe vo jeder Verantwortig, au vo Fahrlässigkeit, rächtlich befreit sind. Jede Foodsaver übernimmt sälber d Verantwortig für d gerettete Läbesmittel und dere Wiitergab.\n\n## <a id=\"die-foodsharing-plattform\"></a>D foodsharing-Plattform\n\n- foodsharing.de isch [gratis](https://wiki.foodsharing.network/wiki/Umgang_mit_Geld_bei_foodsharing), nöd kommerziell und ohni Wärbig und bliibt au so.\n\n- D Plattform isch ehreamtlich programmiert worde und wird vo de vile Freiwillige im [Tech-Team](https://wiki.foodsharing.network/wiki/Tech-Team_-_die_Entwickler_hinter_der_foodsharing-Plattform) ständig wiiterentwicklet.\n\n- Sit em Summer 2012 händ sich scho über 300'000 ehreamtlichi Mänsche aagmäldet, wo öppis gäge d Läbesmittelverschwändig undernäh wänd. Meh als 70'000 vo ihne retted scho aktiv i öppe 7000 Betriebe.\n\nDank eusne Öko-Partner [manitu.de](https://manitu.de) (Webhosting, Choschte für de Traffic) und [Greensta.de](https://Greensta.de) (Mail-Konte), wo eus gratis unterstützed, wärded d Server vo de foodsharing-Plattform zu 100% mit Strom us Wasserchraft versorgt.\n\n## <a id=\"verweise\"></a>Verwiis\n\n[1] n.tv, 2011. Verschwendung ist schockierend. [Online]. http://www.n-tv.de/wissen/Verschwendung-ist-schockierend-article4210226.html. [Accessed 09.07.2013].\n\n[2] ver.di publik, 2013. Der Hunger ist von Menschen gemacht. [*Nümme online*. https://publik.verdi.de/2013/ausgabe-03/spezial/finanzen/seiten-20-21/A0. [Accessed 09.07.2013]].\n\n[3] Swedish Institute for Food and Biotechnology (SIK), Gothenburg, Sweden, 2011. Global Food Losses and Food Waste. [Online]. http://large.stanford.edu/courses/2012/ph240/briggs1/docs/mb060e00.pdf\n\n[4] Bio Company (Berlin) Kundemagazin, 2013-07. Tonnen sind kein Platz für Lebensmittel. https://drive.google.com/file/d/12pIcqTvVaRGC-4iBnTu5xGafFGrdikkj\n\n---\n\n*Artikel vo*: [Vorstand foodsharing e.V.](https://wiki.foodsharing.network/wiki/Foodsharing_e.V._und_dessen_Vorstand) (*[Kontakt](mailto:vorstand@foodsharing.network)*)\\\n*Letschti Überarbeitig am 12.08.2026*\n\n---\n\n*Original im foodsharing-Wiki: [Kontext und Selbstverständnis](https://wiki.foodsharing.network/wiki/Kontext_und_Selbstverst%C3%A4ndnis)*\n"}

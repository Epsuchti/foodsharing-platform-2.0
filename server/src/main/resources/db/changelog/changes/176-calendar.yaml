# Milestone 6 (B4): personal calendar feed token (A11, upstream fs_apitoken).
databaseChangeLog:
  - changeSet:
      id: 176-1
      author: platform
      comment: 'One calendar feed token per user; the token is the secret of the public ICS URL.'
      changes:
        - createTable:
            tableName: calendar_token
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_calendar_token, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, unique: true, uniqueConstraintName: uq_calendar_token_user_id, foreignKeyName: fk_calendar_token_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: token, type: VARCHAR(64), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_calendar_token_token}}

# Milestone 2 (T14): versioned legal documents and the users' consents (plan §13.9 Ve1).
databaseChangeLog:
  - changeSet:
      id: 036-1
      author: platform
      comment: 'Versions of the legal documents with translations.'
      changes:
        - createTable:
            tableName: legal_document_version
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_legal_document_version, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: kind, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: document_version, type: VARCHAR(32), constraints: {nullable: false}}
              - column: {name: published_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: require_reconsent, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: legal_document_version
            columnNames: kind, document_version
            constraintName: uq_legal_document_version_kind_document_version
        - createTable:
            tableName: legal_document_version_i18n
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_legal_document_version_i18n, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: owner_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_legal_document_version_i18n_owner_id, references: legal_document_version(id), deleteCascade: true}}
              - column: {name: language, type: VARCHAR(5), constraints: {nullable: false}}
              - column: {name: summary, type: VARCHAR(4000)}
              - column: {name: body, type: VARCHAR(32600), constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: legal_document_version_i18n
            columnNames: owner_id, language
            constraintName: uq_legal_document_version_i18n_owner_id_language
  - changeSet:
      id: 036-2
      author: platform
      comment: 'Consents: which user accepted which version when.'
      changes:
        - createTable:
            tableName: legal_acceptance
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_legal_acceptance, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_legal_acceptance_user_id, references: user_account(id), deleteCascade: true}}
              - column: {name: kind, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: document_version, type: VARCHAR(32), constraints: {nullable: false}}
              - column: {name: accepted_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: ip_hash, type: VARCHAR(64)}
        - addUniqueConstraint:
            tableName: legal_acceptance
            columnNames: user_id, kind, document_version
            constraintName: uq_legal_acceptance_user_id_kind_document_version

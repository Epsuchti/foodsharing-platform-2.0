# Milestone 4 (B4): request policy (auto-accept applications, AU2) and its audit (A24).
databaseChangeLog:
  - changeSet:
      id: 106-1
      author: platform
      comment: 'Request policy per store and decision audits.'
      changes:
        - createTable:
            tableName: request_policy
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_request_policy, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_request_policy_store_id, references: store(id), deleteCascade: true}}
              - column: {name: enabled, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: dry_run, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: distance_rule_enabled, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: maximum_distance_km, type: DOUBLE, defaultValueNumeric: 0, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: request_policy
            columnNames: store_id
            constraintName: uq_request_policy_store_id
        - createTable:
            tableName: request_policy_audit
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_request_policy_audit, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: policy_id, type: UUID}
              - column: {name: store_id, type: UUID, constraints: {nullable: false}}
              - column: {name: region_id, type: UUID, constraints: {nullable: false}}
              - column: {name: user_id, type: UUID}
              - column: {name: dry_run, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: reason, type: VARCHAR(2000)}
              - column: {name: message, type: VARCHAR(4000)}
              - column: {name: error, type: VARCHAR(2000)}
        - createIndex:
            tableName: request_policy_audit
            indexName: ix_request_policy_audit_store_created
            columns:
              - column: {name: store_id}
              - column: {name: created_at, descending: true}
        - createIndex:
            tableName: request_policy_audit
            indexName: ix_request_policy_audit_region_created
            columns:
              - column: {name: region_id}
              - column: {name: created_at, descending: true}

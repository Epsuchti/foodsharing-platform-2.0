# Milestone 6 (B8): reports, report walls and mediation requests (G1, G2; upstream fs_report).
databaseChangeLog:
  - changeSet:
      id: 167-1
      author: platform
      comment: 'Reports about a member, handled by the report team of the region.'
      changes:
        - createTable:
            tableName: report
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_report, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: region_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_report_region_id, references: region(id)}}
              - column: {name: reported_user_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_report_reported_user, references: user_account(id)}}
              - column: {name: reporter_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_report_reporter, references: user_account(id)}}
              - column: {name: reason, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: reason_text, type: VARCHAR(500)}
              - column: {name: message, type: VARCHAR(32600), constraints: {nullable: false}}
              - column: {name: store_id, type: UUID, constraints: {foreignKeyName: fk_report_store_id, references: store(id)}}
              - column: {name: forum_thread_id, type: UUID}
              - column: {name: status, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: consequence, type: VARCHAR(4000)}
              - column: {name: reminder_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: deleted_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: report
            indexName: ix_report_region_status
            columns:
              - column: {name: region_id}
              - column: {name: status}
        - createIndex:
            tableName: report
            indexName: ix_report_reported_user
            columns:
              - column: {name: reported_user_id}
        - createIndex:
            tableName: report
            indexName: ix_report_reminder_at
            columns:
              - column: {name: reminder_at}
  - changeSet:
      id: 167-2
      author: platform
      comment: 'Internal wall of a report (handlers only, A42).'
      changes:
        - createTable:
            tableName: report_wall_post
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_report_wall_post, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: report_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_report_wall_post_report, references: report(id)}}
              - column: {name: author_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_report_wall_post_author, references: user_account(id)}}
              - column: {name: body, type: VARCHAR(4000), constraints: {nullable: false}}
              - column: {name: deleted_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: report_wall_post
            indexName: ix_report_wall_post_report
            columns:
              - column: {name: report_id}
              - column: {name: created_at}
  - changeSet:
      id: 167-3
      author: platform
      comment: 'Mediation requests sent to the mediation team of a region (G2).'
      changes:
        - createTable:
            tableName: mediation_request
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_mediation_request, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: region_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_mediation_request_region, references: region(id)}}
              - column: {name: requester_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_mediation_request_requester, references: user_account(id)}}
              - column: {name: counterpart_user_id, type: UUID, constraints: {foreignKeyName: fk_mediation_request_counterpart, references: user_account(id)}}
              - column: {name: message, type: VARCHAR(4000), constraints: {nullable: false}}
        - createIndex:
            tableName: mediation_request
            indexName: ix_mediation_request_region
            columns:
              - column: {name: region_id}

# Milestone 4 (B5): sign-out alerts (AU5): setting per store and recorded short-notice sign-outs.
databaseChangeLog:
  - changeSet:
      id: 108-1
      author: platform
      comment: 'Sign-out alert settings and cancellations.'
      changes:
        - createTable:
            tableName: signout_alert_setting
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_signout_alert_setting, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_signout_alert_setting_store_id, references: store(id), deleteCascade: true}}
              - column: {name: enabled, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: cutoff_enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: maximum_hours_before_pickup, type: INT, defaultValueNumeric: 72, constraints: {nullable: false}}
              - column: {name: channels, type: VARCHAR(100), defaultValue: '', constraints: {nullable: false}}
              - column: {name: telegram_chat_ids, type: VARCHAR(1000)}
              - column: {name: active_since, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: last_checked_at, type: TIMESTAMP WITH TIME ZONE}
        - addUniqueConstraint:
            tableName: signout_alert_setting
            columnNames: store_id
            constraintName: uq_signout_alert_setting_store
        - createTable:
            tableName: signout_cancellation
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_signout_cancellation, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: UUID}
              - column: {name: updated_by, type: UUID}
              - column: {name: store_id, type: UUID, constraints: {nullable: false}}
              - column: {name: region_id, type: UUID, constraints: {nullable: false}}
              - column: {name: pickup_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: user_id, type: UUID, constraints: {nullable: false}}
              - column: {name: cancelled_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: total_slots, type: INT}
              - column: {name: occupied_slots, type: INT}
              - column: {name: canceller_rejoined, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(20), defaultValue: 'OPEN', constraints: {nullable: false}}
              - column: {name: immediate_notified_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: final_checked_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: final_notified_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: dry_run, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: message, type: VARCHAR(4000)}
              - column: {name: error, type: VARCHAR(2000)}
        - addUniqueConstraint:
            tableName: signout_cancellation
            columnNames: store_id, pickup_at, user_id
            constraintName: uq_signout_cancellation_pickup
        - createIndex:
            tableName: signout_cancellation
            indexName: ix_signout_cancellation_status_pickup
            columns:
              - column: {name: status}
              - column: {name: pickup_at}
        - createIndex:
            tableName: signout_cancellation
            indexName: ix_signout_cancellation_region_created
            columns:
              - column: {name: region_id}
              - column: {name: created_at}

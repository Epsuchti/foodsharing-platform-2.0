# Unit/slice/integration tests: fresh in-memory H2 per Spring context, no seed data, no scheduling.

# --- common ---
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.liquibase.contexts=schema
app.scheduling.enabled=false
app.clock.fixed=2026-11-02T09:00:00Z
logging.level.org.springframework.security=WARN

# --- notification (mail) ---
app.mail.transport=capture

# --- M2 ---
app.geocoding.provider=static

# --- M4: push and Telegram are captured, never sent (committed dev VAPID key pair, never used in prod) ---
app.push.mode=log
app.push.vapid.public-key=BNZkvuKhT0eoQmgFIiOpL5Lz4sSfF5MvEphTq2BmKT0YeEDvQ2Qc-ra9CZ6RdL8KML-o5SLlBCPr4jWNURxj6B4
app.push.vapid.private-key=4dHXQbuN5M6-LbjnMXb8j4lOA6cnwNA1SJFgWfeUvRg
app.telegram.mode=log
app.telegram.bot-name=foodsharing_dev_bot

# --- M5 ---
app.mailbox.domain=local.test
app.uploads.dir=${java.io.tmpdir}/foodsharing-test-uploads
# Rate limits count per user over the whole (fixed-clock) run here; dedicated tests use small limits.
app.messaging.max-messages-per-minute=1000
app.baskets.max-requests-per-hour=1000

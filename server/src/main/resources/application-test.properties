# Unit/slice/integration tests: fresh in-memory H2 per Spring context, no seed data, no scheduling.

# --- common ---
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.liquibase.contexts=schema
app.scheduling.enabled=false
app.clock.fixed=2026-11-02T09:00:00Z
logging.level.org.springframework.security=WARN

# --- notification (mail) ---
app.mail.transport=capture

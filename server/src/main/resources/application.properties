spring.application.name=foodsharing-platform

# --- common ---
spring.datasource.url=jdbc:h2:file:./data/foodsharing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# Liquibase: changesets without context always run; seed changesets have context "seed" (local/e2e only).
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=schema
spring.mvc.problemdetails.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework
# gzip for the Angular bundles, i18n catalogs, prerendered pages and JSON responses (D11.5.3)
server.compression.enabled=true
server.compression.min-response-size=1KB
# Boot's default static handler (index.csr.html, manifest, …) also serves the precompressed .br/.gz siblings
spring.web.resources.chain.enabled=true
spring.web.resources.chain.compressed=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/manifest+json,image/svg+xml
server.tomcat.threads.max=50
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.domain=${APP_DOMAIN:localhost}
app.base-url=${APP_BASE_URL:http://localhost:4200}
app.scheduling.enabled=true
app.client-errors.max-per-minute-per-ip=30

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.version.include=appVersion
management.endpoint.health.group.version.show-details=always
management.info.env.enabled=false

# --- auth ---
app.auth.cookie-name=fs_session
app.auth.cookie-secure=false
app.auth.session-validity-days=365
app.auth.session-touch-interval-minutes=5
app.auth.ip-salt=${APP_IP_SALT:local-dev-salt}
app.auth.login-token-validity-minutes=30
app.auth.max-login-requests-per-email=3
app.auth.max-login-requests-per-ip=10
app.auth.login-request-window-minutes=15
# HMAC key of the signed fs_oauth_return cookie (Google login return URL); APP_SIGNING_SECRET in prod.
app.auth.signing-secret=${APP_SIGNING_SECRET:local-dev-signing-secret}
app.auth.default-return-path=/
app.auth.google.enabled=true
app.auth.google.issuer=https://accounts.google.com
app.auth.magic-link.enabled=true
app.auth.magic-link.verify-path=/login/verify
app.auth.passkeys.enabled=true
app.auth.passkeys.rp-id=${app.domain}
app.auth.passkeys.rp-name=foodsharing
app.auth.passkeys.allowed-origins=${app.base-url}
# Google OIDC with explicit endpoints: never issuer-uri (Boot would run discovery at startup, see A9).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-secret}
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

# --- notification (mail) ---
app.mail.from=${MAIL_FROM:noreply@foodsharing.network}
app.mail.transport=smtp
app.mail.outbox-interval-ms=10000
app.mail.outbox-batch-size=20
app.mail.outbox-max-attempts=8
app.mail.outbox-backoff-base-minutes=1
spring.mail.host=${SMTP_HOST:smtp.protonmail.ch}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- history ---
app.history.retention-enabled=true
app.history.retention-cron=0 30 3 * * *
app.history.export-max-rows=10000

# --- dev ---
app.dev.enabled=false

# --- jobs (M2) ---
app.jobs.result-ttl-minutes=60

# --- region (M2) ---
app.region.default-time-zone=Europe/Zurich
app.region.maintenance-cron=0 15 3 * * *
app.region.statistics-cron=0 45 3 * * *
app.region.conference-url-template=https://meet.jit.si/foodsharing-{slug}
app.region.suggestion-radius-km=50
app.region.group-mails-per-hour=5
# Function group members get these region permissions (A10).
app.permissions.function-grants.FSMANAGEMENT=CAN_MANAGE_USERS
app.permissions.function-grants.WELCOME=CAN_GIVE_INTRO_PICKUPS
app.permissions.function-grants.STORES_COORDINATION=CAN_USE_AUTOMATIONS,CAN_SEE_USER_PICKUP_COUNT_GROUPING,CAN_SEE_ALL_AUTOMATION_DECISIONS
app.permissions.function-grants.VOTING=CAN_MANAGE_SURVEYS

# --- geocoding (M2) ---
app.geocoding.provider=photon
app.geocoding.photon-url=https://photon.komoot.io
app.geocoding.connect-timeout-ms=3000
app.geocoding.read-timeout-ms=3000
app.geocoding.cache-hours=24
app.geocoding.failure-threshold=5
app.geocoding.open-seconds=60

# --- quiz (M2) ---
app.quiz.network-buffer-seconds=5
app.quiz.hygiene-validity-days=365
app.quiz.hygiene-warning-days=90
app.quiz.role-quiz-wait-days-third-try=30

# --- intropickup (M2) ---
app.intropickup.max-slot-count=3
app.intropickup.import-max-rows=5000
app.intropickup.gap-horizon-days=30
app.intropickup.stalled-after-days=30
app.intropickup.ical-allowed-hosts=foodsharing.network,foodsharing.de

# --- store / pickup (M3) ---
app.store.max-managers=3
app.store.default-prefetch-days=14
app.store.max-slots-per-pickup=50
app.store.wall-delete-after-days=30
app.pickup.reminder-hours-before=24
app.pickup.reminder-cron=0 0 * * * *
app.pickup.free-slot-status-days=5

# --- verification (M2) ---
app.verification.passport-validity-years=3

# --- wallet (M2) ---
app.wallet.apple.enabled=false
app.wallet.apple.pass-type-id=${APPLE_WALLET_PASS_TYPE_ID:}
app.wallet.apple.team-id=${APPLE_WALLET_TEAM_ID:}
app.wallet.apple.certificate-p12=${APPLE_WALLET_CERTIFICATE_P12:}
app.wallet.apple.certificate-password=${APPLE_WALLET_CERTIFICATE_PASSWORD:}
app.wallet.apple.wwdr-certificate=${APPLE_WALLET_WWDR_CERTIFICATE:}
app.wallet.google.enabled=false
app.wallet.google.issuer-id=${GOOGLE_WALLET_ISSUER_ID:}
app.wallet.google.class-id=${GOOGLE_WALLET_CLASS_ID:}
app.wallet.google.service-account-json=${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:}

# --- onboarding (M2) ---
app.onboarding.nudge-cron=0 0 9 * * *
app.onboarding.stalled-after-days=30

# --- jobs (M4, A25) ---
app.jobs.default-lock-at-most-for=PT30M
app.jobs.store-maintenance-cron=0 30 2 * * *
app.jobs.cleanup-cron=0 0 4 * * *
app.jobs.audit-retention-cron=0 15 3 * * *
app.jobs.run-retention-days=90

# --- notifications (M4, A23/A27) ---
app.notifications.poll-seconds=60
app.mail.rate-limit.per-user-per-hour=20
app.mail.rate-limit.per-template-per-user-per-day=5
app.mail.rate-limit.duplicate-window-minutes=10

# --- push (M4, A23) ---
app.push.mode=webpush
app.push.max-subscriptions-per-user=10
app.push.max-failures=5
app.push.vapid.public-key=${PUSH_VAPID_PUBLIC:}
app.push.vapid.private-key=${PUSH_VAPID_PRIVATE:}
app.push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:it@foodsharing.network}

# --- telegram (M4, A28) ---
app.telegram.mode=live
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-name=${TELEGRAM_BOT_NAME:foodsharing_bot}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
app.telegram.api-url=https://api.telegram.org
app.telegram.poll-interval=PT30S
app.telegram.link-token-minutes=15
app.telegram.timeout-seconds=10

# --- automation (M4, A24) ---
app.automation.enabled=true
app.automation.dry-run=false
app.automation.cleaning-back-check-months=12
app.automation.minimum-free-cleaning-slots=4
app.automation.max-request-approvals-per-run=50
app.automation.max-advertisements-per-run=50
app.automation.evaluate-cron=0 */5 * * * *
app.automation.adverts-cron=0 */5 * * * *
app.automation.signout-cron=0 0 * * * *
app.automation.signout-daily-time=03:00
app.automation.signout-retention-days=180
app.automation.audit-retention-days=7
app.automation.holiday-provider=static
app.automation.nager-url=https://date.nager.at

# --- newsletter (M4, N7) ---
app.newsletter.batch-size=50
app.newsletter.mails-per-minute=100
app.newsletter.send-cron=0 * * * * *
app.newsletter.secret=${NEWSLETTER_SECRET:local-newsletter-secret}

# --- integrations (M4, A26) ---
app.integrations.probe-interval=PT5M
app.integrations.outage-history-days=3

# --- realtime (A32) ---
app.realtime.enabled=true
app.realtime.heartbeat-ms=10000
# --- messaging (A33) ---
app.messaging.max-message-length=10000
app.messaging.mail-digest-minutes=30
app.messaging.sync-cron=0 15 * * * *
app.messaging.max-messages-per-minute=30
# --- uploads (A34) ---
app.uploads.dir=${UPLOADS_DIR:./data/uploads}
app.uploads.max-size-mb=20
app.uploads.allowed-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/csv,text/calendar,application/zip,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet
app.uploads.unclaimed-ttl-hours=24
app.uploads.image-sizes.sm=96
app.uploads.image-sizes.md=320
app.uploads.image-sizes.lg=1280
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# --- mailbox (A35) ---
app.mailbox.domain=${MAILBOX_DOMAIN:}
app.mailbox.inbound=log
app.mailbox.imap.host=${MAILBOX_IMAP_HOST:}
app.mailbox.imap.port=993
app.mailbox.imap.user=${MAILBOX_IMAP_USER:}
app.mailbox.imap.password=${MAILBOX_IMAP_PASSWORD:}
app.mailbox.imap.folder=INBOX
app.mailbox.imap.ssl=true
app.mailbox.webhook-secret=${MAILBOX_WEBHOOK_SECRET:}
app.mailbox.fetch-cron=0 * * * * *
app.mailbox.reserved-names=postmaster,abuse,noreply,admin,root,hostmaster,webmaster,mailer-daemon
app.mailbox.max-mails-per-hour-per-user=50
app.mailbox.max-attachment-total-mb=20
# --- forum (A36) ---
app.forum.search-min-length=2
# --- polls (A36) ---
app.polls.min-lead-time=PT1H
app.polls.end-notification-min-hours=30
app.polls.notify-cron=0 */15 * * * *

# --- M6 (docs/plan-m6.md B1) ---
app.calendar.max-reminders=5
app.baskets.max-distance-km=50
app.baskets.default-lifetime-days=7
app.baskets.expiry-cron=0 10 3 * * *
app.baskets.max-requests-per-hour=20
app.fsp.enabled=true
app.reports.reminder-cron=0 0 8 * * *
app.achievements.hygiene-validity-days=365
app.statistics.cron=0 30 2 * * *
app.search.reindex-cron=0 45 2 * * *
app.search.min-length=2
app.resources.max-per-user=10
app.support.max-per-hour=5
app.oauth.signing-key-pem=${OAUTH_SIGNING_KEY:}
app.oauth.access-token-minutes=60
app.oauth.refresh-token-days=30
app.oauth.code-minutes=10
app.activity.page-size=20
app.search.refresh-seconds=120

spring.application.name=foodsharing-platform

# --- common ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.liquibase.contexts=schema
app.domain=${APP_DOMAIN}
app.base-url=${APP_BASE_URL}
server.servlet.session.cookie.secure=true
# Structured JSON logs with traceId (plan §17)
logging.structured.format.console=logstash

# --- auth ---
app.auth.cookie-secure=true
app.auth.ip-salt=${APP_IP_SALT}
app.auth.signing-secret=${APP_SIGNING_SECRET}
app.newsletter.secret=${NEWSLETTER_SECRET}
# OAuth provider signing key (PKCS#8 PEM); no default, never a generated key in prod
app.oauth.signing-key-pem=${OAUTH_SIGNING_KEY}
app.oauth.allow-generated-key=false
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- notification (mail) ---
app.mail.transport=smtp

# --- M4: live push and Telegram (VAPID keys and bot token from the environment) ---
app.push.mode=webpush
app.telegram.mode=live

# --- operations (M7 B4, D19.1) ---
# Health and Prometheus only on the management port (never published publicly; local/e2e keep them on 8080).
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Graceful shutdown: in-flight requests finish (at most 30 s) before the context closes.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
# Fields added to every JSON log line (logstash format: @timestamp, level, logger_name, message, traceId from the MDC).
logging.structured.json.add.app=foodsharing-platform
logging.structured.json.add.version=${APP_VERSION:unknown}
# External services and storage
app.geocoding.photon-url=${PHOTON_URL:https://photon.komoot.io}
app.uploads.dir=${UPLOADS_DIR:/data/uploads}
app.mailbox.inbound=${MAILBOX_INBOUND:log}

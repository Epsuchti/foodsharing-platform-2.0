openapi: 3.0.3
info:
  title: Foodsharing Platform API
  version: 1.0.0
  description: |
    Contract for Foodsharing Platform 2.0. Split per tag: `paths/<tag>.yaml` holds the path items of one tag,
    `schemas/<tag>.yaml` its models, `schemas/common.yaml` the shared ones (ApiError, ApiErrorCode, paging, enums).
    Every operation documents `x-permission`; every mutating operation documents `x-history`
    (`<Module>Action.<VALUE>` or `NONE`). See docs/conventions.md (A5).
servers:
  - url: /
tags:
  - name: public
    description: Unauthenticated endpoints (app info, client error reports).
  - name: auth
    description: Session, login methods, sessions and security log.
  - name: users
    description: The current user's profile and settings.
  - name: history
    description: Action history (audit trail).
  - name: dev
    description: Development helpers, only present in the local and e2e profiles.
    x-dev-only: true
  - name: onboarding
    description: Onboarding journey of the current user (plan §11).
  - name: regions
    description: 'Regions: tree, membership, members, permissions, options, pin, statistics, settings, admin log.'
  - name: region-admin
    description: 'Region administration (ORGA): create, edit, move, delete, functions, CSV import.'
  - name: public-regions
    description: 'Public region pages, region suggestions and the region tree (logged out).'
  - name: groups
    description: 'Working groups: list, detail, applications, members, admins, group mail.'
  - name: admin-users
    description: 'User management for ambassadors / FS management / orga.'
  - name: quizzes
    description: 'Quizzes, quiz sessions and the quiz editor.'
  - name: content
    description: 'Content page administration (ORGA / PR).'
  - name: public-content
    description: 'Published content pages and learning chapters.'
  - name: legal
    description: 'Consents to legal documents and publishing new versions.'
  - name: public-legal
    description: 'Published legal documents.'
  - name: public-onboarding
    description: 'Explainer page data (logged out).'
  - name: intro-pickups
    description: 'Introductory pickups (EinAbs) for newcomers: bookable list, bookings, subscription.'
  - name: intro-pickup-guide
    description: 'EinAb guides: own EinAbs, bookings, comments, templates, iCal, newcomer funnel.'
  - name: intro-pickup-admin
    description: 'EinAb administration per region (CAN_MANAGE_USERS).'
  - name: public-intro-pickups
    description: 'Public EinAb list, guide iCal feeds and unsubscribe links.'
  - name: stores
    description: 'Stores: lists, detail, create/edit/delete, wall, store log, statistics (plan §12).'
  - name: store-team
    description: 'Store teams: applications, invitations, jumpers, managers.'
  - name: pickups
    description: 'Pickups: weekly schedule, slots, sign-ups, confirmations, history, agenda.'
  - name: store-chains
    description: 'Store chains and key account managers.'
  - name: store-categories
    description: 'Store categories and groceries (ORGA).'
  - name: bells
    description: 'Bells (in-app notifications) and notification channel settings.'
  - name: verification
    description: 'Verification queue, verify/unverify, identity confirmation.'
  - name: passports
    description: 'Foodsaver passports (PDF, requests, batch generation) and wallets.'
  - name: jobs
    description: 'Progress and results of long-running jobs.'
  - name: push
    description: 'Web push subscriptions (milestone 4).'
  - name: telegram
    description: 'Telegram linking and region/store alert chats (milestone 4).'
  - name: newsletters
    description: 'Global and region newsletters (ORGA, ambassadors).'
  - name: public-newsletter
    description: 'One-click newsletter unsubscribe (logged out).'
  - name: public-telegram
    description: 'Telegram Bot API webhook (secret path).'
  - name: automation
    description: 'Store and region automations: pickup and request policies, open-slot adverts, sign-out alerts, extra slot, audits.'
  - name: admin-integrations
    description: 'External integrations and circuit breakers (ORGA).'
  - name: admin-jobs
    description: 'Scheduled jobs: last runs, run now (ORGA).'
  - name: admin-mail
    description: 'Mail outbox: status, search, retry (ORGA).'
  - name: messaging
    description: 'Conversations: direct, group, store team/jumper and region chats, read state (milestone 5).'
  - name: uploads
    description: 'File uploads (minimal, milestone 5).'
  - name: mailboxes
    description: 'Region and personal mailboxes: folders, read, compose, reply, forward (milestone 5).'
  - name: public-mailbox
    description: 'Inbound mail webhook (secret path).'
  - name: forum
    description: 'Region and ambassador forums: threads, posts, reactions, moderation, follow, search.'
  - name: events
    description: 'Region events, invitations, wall, iCalendar.'
  - name: polls
    description: 'Polls (votings) of regions and working groups.'
  - name: surveys
    description: 'Surveys: editor, fill form, results.'
  - name: public-users
    description: Logged-out user account actions (email change abort link).
  - name: profiles
    description: 'Public profiles: profile page, commitments, wall, bananas, buddies.'
  - name: calendar
    description: Personal calendar feed token (iCal subscription).
  - name: public-calendar
    description: iCal feed by token (no login).
  - name: admin-uploads
    description: Upload administration (ORGA).
  - name: baskets
    description: Food baskets.
  - name: food-share-points
    description: Food share points (Fairteiler).
  - name: map
    description: Map layers for logged-in users.
  - name: public-map
    description: Public map layers (logged out).
  - name: activity
    description: Dashboard activity feed.
  - name: reports
    description: 'Reports (Meldungen), mediation, report log.'
  - name: achievements
    description: Achievements (badges) and awards.
  - name: admin-settings
    description: 'Feature toggles, configuration, email blocklist, IP blocks, donation settings (ORGA).'
  - name: public-settings
    description: Public feature toggles (client bootstrap).
  - name: support
    description: Support form (logged in).
  - name: public-support
    description: Support form (logged out).
  - name: statistics
    description: 'Region statistics (gender, age bands, pickups).'
  - name: search
    description: Global search.
  - name: resources
    description: Resource mosaic (lending library).
  - name: oauth
    description: OAuth consent flow (JSON side of /oauth/authorize).
  - name: admin-oauth
    description: OAuth client administration (ORGA).
x-framework-endpoints:
  - /ws
  - /oauth/authorize
  - /oauth/token
  - /oauth/userinfo
  - /.well-known/openid-configuration
  - /.well-known/jwks.json
  - /oauth2/authorization/google
  - /login/oauth2/code/google
  - /webauthn/register/options
  - /webauthn/register
  - /webauthn/authenticate/options
  - /login/webauthn
  - /dev/oidc/**
  - /actuator/**
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fs_session
security:
  - cookieAuth: []

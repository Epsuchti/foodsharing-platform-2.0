AppInfo:
  type: object
  required: [version, devMode, personaPanel, demoBanner, languages, loginMethods, serverTime]
  properties:
    version:
      type: string
    devMode:
      type: boolean
      description: True in the local and e2e profiles (dev user switcher, gallery).
    personaPanel:
      type: boolean
      description: True on the test environment (staging profile with a panel password); the login page offers the persona panel.
    demoBanner:
      type: boolean
      description: True on the test environment (app.demo-banner); the shell shows a red "test site" banner.
    languages:
      type: array
      items:
        $ref: './common.yaml#/Language'
    loginMethods:
      $ref: './public.yaml#/LoginMethods'
    serverTime:
      type: string
      format: date-time

LoginMethods:
  type: object
  required: [google, magicLink, passkeys]
  properties:
    google:
      type: boolean
    magicLink:
      type: boolean
    passkeys:
      type: boolean

ClientErrorReport:
  type: object
  required: [message, route, userAgent]
  properties:
    message:
      type: string
      maxLength: 2000
    stack:
      type: string
      maxLength: 16000
    route:
      type: string
      maxLength: 500
    traceId:
      type: string
      maxLength: 32
    userAgent:
      type: string
      maxLength: 500

# uploads (milestone 5, docs/plan-m5.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.
Upload:
  type: object
  required:
    - id
    - fileName
    - mimeType
    - size
    - url
  properties:
    id:
      type: string
      format: uuid
    fileName:
      type: string
      maxLength: 255
    mimeType:
      type: string
      maxLength: 120
    size:
      type: integer
      format: int64
    url:
      type: string
      description: Relative download URL.
    width:
      type: integer
      format: int32
      description: 'Pixel width (images only).'
    height:
      type: integer
      format: int32
    publicUrl:
      type: string
      description: 'Set when the upload is public (A41), readable without login.'
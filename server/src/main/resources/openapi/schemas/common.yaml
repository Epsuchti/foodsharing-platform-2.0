    - EMAIL_DOMAIN_BLOCKED
    - IP_BLOCKED
    - TOO_MANY_LOGIN_REQUESTS
    - GOOGLE_LOGIN_FAILED
    - GOOGLE_EMAIL_NOT_VERIFIED
    - LAST_LOGIN_METHOD_CANNOT_BE_REMOVED
    - INVALID_RETURN_URL
    - SESSION_NOT_FOUND
    - PASSKEY_NOT_FOUND
    - ACCOUNT_DISABLED
    # --- users ---
    - USER_NOT_FOUND
    # --- history ---
    - HISTORY_SUBJECT_NOT_READABLE
    # --- dev ---
    - DEV_USER_NOT_FOUND
    # --- users (M2) ---

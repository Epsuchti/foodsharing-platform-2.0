    # --- intro-pickups ---
    - INTRO_PICKUP_NOT_FOUND
    - SLOT_NOT_FOUND
    - SLOT_NOT_AVAILABLE
    - USER_ALREADY_BOOKED_IN_INTRO_PICKUP
    - USER_ALREADY_BOOKED_WITH_GUIDE
    - USER_ALREADY_BOOKED_IN_CATEGORY
    - USER_BOOKING_LIMIT_REACHED
    - MINIMUM_PICKUP_COUNT_NOT_REACHED
    - FAIRTEILER_VISIT_REQUIRED_FOR_THIRD_INTRO_PICKUP
    - GUIDES_CANNOT_BOOK
    - BOOKING_USER_DISABLED
    - NOT_REGION_MEMBER
    - GUIDE_NOT_FOUND
    - PAST_BOOKING_NOT_CANCELLABLE
    - ONLY_OWN_BOOKINGS_CANCELLABLE

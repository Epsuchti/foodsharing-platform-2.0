ApiError:
  type: object
  description: Every 4xx/5xx response body.
  required: [code, message, traceId, retryable]
  properties:
    code:
      $ref: './common.yaml#/ApiErrorCode'
    message:
      type: string
      description: English text for logs and developers; the UI translates `code` instead.
    traceId:
      type: string
      description: Also in the X-Trace-Id response header and the server logs.
    fieldErrors:
      type: array
      items:
        $ref: './common.yaml#/FieldError'
    retryable:
      type: boolean
    retryAfterSeconds:
      type: integer
      format: int32
    args:
      type: object
      description: Interpolation parameters for the translated `errors.<CODE>` text.
      additionalProperties:
        type: string

FieldError:
  type: object
  required: [field, code]
  properties:
    field:
      type: string
    code:
      type: string
      description: Validation constraint name, e.g. NotBlank, Size, Email.
    message:
      type: string

PageMeta:
  type: object
  required: [page, size, totalItems, totalPages]
  properties:
    page:
      type: integer
      format: int32
      description: Zero-based page index.
    size:
      type: integer
      format: int32
    totalItems:
      type: integer
      format: int64
    totalPages:
      type: integer
      format: int32

Language:
  type: string
  enum: [de, en, gws, fr, it]

Theme:
  type: string
  enum: [LIGHT, DARK, SYSTEM]

Role:
  type: string
  description: Global journey role. FOODSHARER < FOODSAVER < STORE_MANAGER < AMBASSADOR < ORGA.
  enum: [FOODSHARER, FOODSAVER, STORE_MANAGER, AMBASSADOR, ORGA]

MessageResponse:
  type: object
  required: [message]
  properties:
    message:
      type: string

Permission:
  type: string
  description: 'Region-scoped feature permission (plan §9 layer 3). Mirrors network.foodsharing.security.Permission.'
  enum: [CAN_GIVE_INTRO_PICKUPS, CAN_MANAGE_USERS, CAN_USE_AUTOMATIONS, CAN_SEE_USER_PICKUP_COUNT_GROUPING, CAN_SEE_ALL_AUTOMATION_DECISIONS, CAN_MANAGE_SURVEYS]

ReasonBody:
  type: object
  required: [reason]
  properties:
    reason:
      description: 'Required reason, stored in the action history.'
      type: string
      minLength: 1
      maxLength: 1000

OptionalReasonBody:
  type: object
  properties:
    reason:
      description: 'Optional reason, stored in the action history.'
      type: string
      maxLength: 1000

RequiredMessage:
  type: object
  required: [message]
  properties:
    message:
      description: 'Message to the user (at least 10 characters), also stored in the history.'
      type: string
      minLength: 10
      maxLength: 4000

JobRef:
  type: object
  required: [jobId]
  properties:
    jobId:
      type: string
      format: uuid

WallEntry:
  type: object
  description: 'A post on a profile, FSP or report wall (A42).'
  required: [id, author, body, createdAt, mayDelete]
  properties:
    id:
      type: string
      format: uuid
    author:
      $ref: './users.yaml#/UserSummary'
    body:
      type: string
    createdAt:
      type: string
      format: date-time
    mayDelete:
      type: boolean

WallEntryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: './common.yaml#/WallEntry'
    page:
      $ref: './common.yaml#/PageMeta'

WallEntryCreate:
  type: object
  required: [body]
  properties:
    body:
      type: string
      minLength: 1
      maxLength: 4000

MapMarkerKind:
  type: string
  enum: [STORE, FSP, BASKET, REGION, REGION_PIN, EVENT, USER]

MapMarker:
  type: object
  description: 'One map marker; positions of HOME baskets and users are rounded to 3 decimals.'
  required: [id, kind, lat, lon]
  properties:
    id:
      type: string
      format: uuid
    kind:
      $ref: './common.yaml#/MapMarkerKind'
    lat:
      type: number
      format: double
    lon:
      type: number
      format: double
    status:
      type: string

GeoResult:
  type: object
  required: [label, lat, lon]
  properties:
    label:
      type: string
    lat:
      type: number
      format: double
    lon:
      type: number
      format: double

BooleanValue:
  type: object
  required: [value]
  properties:
    value:
      type: boolean

TokenBody:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      maxLength: 200

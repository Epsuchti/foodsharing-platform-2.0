    - INTRO_PICKUP_BOOKED_GUIDE
    - INTRO_PICKUP_CANCELLED_BY_GUIDE
    - INTRO_PICKUP_CANCELLED_BY_USER
    - INTRO_PICKUP_DELETED_BY_ADMIN
    - INTRO_PICKUP_NEW_BOOKABLE
    - INTRO_PICKUP_SUBSCRIPTION_CONFIRMED
    - INTRO_PICKUP_UPDATED
    - STORE_NEW_REQUEST
    - STORE_REQUEST_ACCEPTED
    - STORE_REQUEST_DECLINED
    - STORE_INVITATION
    - STORE_INVITATION_ACCEPTED
    - STORE_INVITATION_DECLINED
    - STORE_MEMBER_REMOVED
    - STORE_MOVED_TO_STANDBY
    - STORE_MANAGER_APPOINTED
    - STORE_MANAGER_REMOVED
    - STORE_DELETED
    - STORE_REGULAR_PICKUP_CHANGED
    - STORE_TEAM_REOPENED
    - PICKUP_SIGNUP_UNCONFIRMED
    - PICKUP_CONFIRMED
    - PICKUP_REMOVED
    - PICKUP_REMINDER
    - USER_VERIFIED
    - PASSPORT_CREATED
    - QUIZ_PASSED
    - ONBOARDING_STALLED
    - ONBOARDING_STEP_UNBLOCKED
    - HYGIENE_EXPIRING
    - PICKUP_AUTO_CONFIRMED_WITH_MESSAGE
    - PICKUP_AUTO_DECLINED
    - STORE_REQUEST_AUTO_ACCEPTED
    - STORE_REQUEST_AUTO_DECLINED
    - PICKUP_OPEN_SLOT
    - PICKUP_LATE_CANCELLATION
    - PICKUP_SIGNOUT_ALERT
    - PICKUP_SIGNOUT_NOT_REPLACED
    - PICKUP_EXTRA_SLOT_ADDED
    - PICKUP_UNCONFIRMED_REMINDER
    - PICKUP_EMPTY_TOMORROW
    - STORE_MANAGER_INACTIVE
    - AUTOMATION_RUN_FAILED
    - TELEGRAM_LINKED
    - NEWSLETTER
    - INTEGRATION_DOWN
    - FORUM_THREAD_TO_ACTIVATE
    - FORUM_NEW_THREAD
    - FORUM_POST
    - FORUM_MENTION
    - POST_HIDDEN
    - EVENT_POST
    - POLL_NEW
    - POLL_STARTED
    - POLL_ENDING_SOON
    - BASKET_REQUEST
    - BASKET_REQUEST_ANSWERED
    - BUDDY_REQUEST
    - BANANA_GIVEN
    - REPORT_NEW
    - REPORT_REMINDER
    - FSP_ACTIVATE
    - STORE_WALL_POST
    - STORE_NEW_IN_REGION
    - STORE_ADDED_TO_CHAIN
    - CHAIN_INFO_UPDATED
    - BLOG_NEW_CHECK
    - NEW_RESOURCE
    - QUIZ_COMMENT
    - ADDRESS_CHANGED
    - NEW_MESSAGE
    - MAILBOX_NEW_MAIL
    - EVENT_INVITATION

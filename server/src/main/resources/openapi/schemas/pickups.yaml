# Pickup schemas (milestone 3).
Weekday:
  type: string
  enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

PickupEligibilityReason:
  type: string
  enum: [NOT_TEAM_MEMBER, JUMPER_CANNOT_PICKUP, NOT_VERIFIED, HYGIENE_CERTIFICATE_REQUIRED, PHONE_REQUIRED, SLEEPING, PICKUP_IN_PAST, SIGNUP_NOT_YET_OPEN, NO_FREE_SLOT, ALREADY_SIGNED_UP, REGION_RULE_TIMESPAN_LIMIT, REGION_RULE_DAY_LIMIT, AUTOMATION_RULE]
  description: 'AUTOMATION_RULE: an active rule of the store blocks the sign-up (details in PickupEligibility.ruleBlocks; decision 167 S2).'

RegularPickup:
  type: object
  required: [weekday, startTime, slotCount]
  properties:
    weekday:
      $ref: './pickups.yaml#/Weekday'
    startTime:
      description: 'HH:mm'
      type: string
      maxLength: 5
    slotCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 50
    description:
      type: string
      maxLength: 100

PickupSlot:
  type: object
  required: [user, confirmed]
  properties:
    user:
      $ref: './users.yaml#/UserSummary'
    confirmed:
      type: boolean
    linkMissingUntil:
      description: 'The linked-store pickup of this sign-up was signed out (decision 167 S3): until then the person may book another one, afterwards the slot is freed. Only on the caller''s own slot and for the store''s managers.'
      type: string
      format: date-time
    linkedIntroPickup:
      $ref: './pickups.yaml#/LinkedIntroPickup'

LinkedIntroPickup:
  type: object
  description: 'The EinAb linked to this sign-up (EA16, decision 169): signing out cancels it. Only on the caller''s own slot and for the store''s managers.'
  required: [introPickupId, bookedCount]
  properties:
    introPickupId:
      type: string
      format: uuid
    bookedCount:
      description: 'Newcomers booked on the EinAb; they are notified when it is cancelled.'
      type: integer
      format: int32

RegionPickupRuleState:
  type: object
  required: [active]
  properties:
    active:
      type: boolean
    timespanDays:
      type: integer
      format: int32
    limitNumber:
      type: integer
      format: int32
    limitDayNumber:
      type: integer
      format: int32
    inactiveHours:
      type: integer
      format: int32
    pickupsInTimespan:
      type: integer
      format: int32
    pickupsSameDay:
      type: integer
      format: int32

PickupEligibility:
  type: object
  required: [eligible, reasons]
  properties:
    eligible:
      type: boolean
    reasons:
      type: array
      items:
        $ref: './pickups.yaml#/PickupEligibilityReason'
    regionRule:
      $ref: './pickups.yaml#/RegionPickupRuleState'
    ruleBlocks:
      description: 'The store rules that block this sign-up for the caller (reason AUTOMATION_RULE). Never filled for store managers; the client renders its own sentences from the params.'
      type: array
      items:
        $ref: './pickups.yaml#/PolicyBlock'

PolicyBlock:
  type: object
  description: 'One store rule that blocks a sign-up (decision 167 S2).'
  required: [rule, params]
  properties:
    rule:
      $ref: './automation.yaml#/PolicyRule'
    params:
      $ref: './pickups.yaml#/PolicyBlockParams'

PolicyBlockParams:
  type: object
  description: 'The person''s own data behind a block, per rule. GAP: lastPickupAt (the pickup that is too close, past or upcoming), stores (its store when it is another store of the gap list), gapDays (the gap that applies), nextPossibleAt (start of the first later day that keeps the gap). LINKED_STORE: stores, windowMode, before, after, from and to (start of the first and of the last day of the window). CLEANING_REQUIRED: monthsAgo (null = never), monthsRequired, fspId (the Fairteiler with the earliest free shift). EXPERIENCE, NO_CLEANING_FAIRTEILER: none.'
  properties:
    lastPickupAt:
      type: string
      format: date-time
    nextPossibleAt:
      type: string
      format: date-time
    gapDays:
      type: integer
      format: int32
    stores:
      type: array
      items:
        $ref: './stores.yaml#/StoreRef'
    windowMode:
      $ref: './automation.yaml#/LinkedStoreWindowMode'
    before:
      type: integer
      format: int32
    after:
      type: integer
      format: int32
    from:
      type: string
      format: date-time
    to:
      type: string
      format: date-time
    monthsAgo:
      type: integer
      format: int32
    monthsRequired:
      type: integer
      format: int32
    fspId:
      type: string
      format: uuid

Pickup:
  type: object
  required: [storeId, pickupAt, slotCount, occupiedSlots, isAvailable, isRegular]
  properties:
    storeId:
      type: string
      format: uuid
    pickupAt:
      type: string
      format: date-time
    slotCount:
      type: integer
      format: int32
    description:
      type: string
    occupiedSlots:
      type: array
      items:
        $ref: './pickups.yaml#/PickupSlot'
    isAvailable:
      type: boolean
    isRegular:
      type: boolean
    eligibility:
      $ref: './pickups.yaml#/PickupEligibility'
    extraSlots:
      description: 'The extra slots the earliest sign-up added, oldest first (AU6).'
      type: array
      items:
        $ref: './pickups.yaml#/PickupExtraSlot'
    mayAddExtraSlot:
      type: boolean
      description: "The caller is the earliest sign-up of this future pickup, fewer than the store's maxExtraSlots were added and slotCount is below maxSlotsPerPickup (AU6)."

PickupExtraSlot:
  type: object
  description: 'An extra slot the earliest sign-up added (AU6).'
  required: [byUser, addedAt]
  properties:
    byUser:
      $ref: './users.yaml#/UserSummary'
    addedAt:
      type: string
      format: date-time

PickupSignupDetail:
  type: object
  description: 'One sign-up as shown in the slot dialog (PU3).'
  required: [user, confirmed, signedUpAt, pickupCount, upcomingSlots]
  properties:
    user:
      $ref: './users.yaml#/UserSummary'
    confirmed:
      type: boolean
    signedUpAt:
      type: string
      format: date-time
    phone:
      description: 'Only when the caller may see phone numbers (S9).'
      type: string
    pickupCount:
      description: 'Confirmed past pickups of the user at this store.'
      type: integer
      format: int32
    lastPickupAt:
      description: 'Last confirmed past pickup of the user at this store.'
      type: string
      format: date-time
    upcomingSlots:
      description: "The user's future slots at this store, soonest first."
      type: array
      items:
        type: string
        format: date-time

PickupDayConversation:
  type: object
  description: 'The day chat of a store (PU3); open it via the messaging API.'
  required: [conversationId, name, created, addedMembers]
  properties:
    conversationId:
      type: string
      format: uuid
    name:
      type: string
    created:
      description: 'True when this call created the chat.'
      type: boolean
    addedMembers:
      description: 'How many people this call added (the caller included).'
      type: integer
      format: int32

PickupDayConversationOpen:
  type: object
  required: [name]
  properties:
    name:
      description: 'Name of the chat; used only when it is created.'
      type: string
      minLength: 1
      maxLength: 200

PickupEdit:
  type: object
  required: [slotCount]
  properties:
    slotCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 50
    description:
      type: string
      maxLength: 100

PickupMove:
  type: object
  required: [newPickupAt]
  properties:
    newPickupAt:
      type: string
      format: date-time
      description: 'The new time; future, not the current one, and no other pickup of the store at that time.'
    message:
      type: string
      maxLength: 500
      description: 'Optional message to everyone signed up (bell and mail PICKUP_MOVED).'

SignupResult:
  type: object
  required: [confirmed]
  properties:
    confirmed:
      type: boolean

SignupRequest:
  type: object
  properties:
    linkedPickups:
      description: 'Pickups in linked stores to book together with this one (decision 167 S3).'
      type: array
      maxItems: 5
      items:
        $ref: './pickups.yaml#/LinkedPickupChoice'

LinkedPickupChoice:
  type: object
  required: [storeId, pickupAt]
  properties:
    storeId:
      type: string
      format: uuid
    pickupAt:
      type: string
      format: date-time

PickupHistoryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: './pickups.yaml#/Pickup'
    page:
      $ref: './common.yaml#/PageMeta'

UserPickup:
  type: object
  required: [store, pickupAt, confirmed, slotCount]
  properties:
    store:
      $ref: './stores.yaml#/StoreRef'
    pickupAt:
      type: string
      format: date-time
    confirmed:
      type: boolean
    slotCount:
      type: integer
      format: int32
    occupiedSlots:
      type: array
      items:
        $ref: './pickups.yaml#/PickupSlot'
    description:
      type: string
    mayAddExtraSlot:
      description: "AU6: the caller holds the earliest sign-up of this future pickup and may add another extra slot (fewer than the store's maxExtraSlots added, within maxSlotsPerPickup); false on other users' pickups"
      type: boolean

UserPickupPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: './pickups.yaml#/UserPickup'
    page:
      $ref: './common.yaml#/PageMeta'

PickupOption:
  type: object
  required: [store, pickupAt, slotCount, occupiedSlots, confirmedCount]
  properties:
    store:
      $ref: './stores.yaml#/StoreRef'
    pickupAt:
      type: string
      format: date-time
    slotCount:
      type: integer
      format: int32
    description:
      type: string
    occupiedSlots:
      type: array
      items:
        $ref: './users.yaml#/UserSummary'
    confirmedCount:
      type: integer
      format: int32
      minimum: 0
      description: How many of `occupiedSlots` are confirmed by a store manager.
    isConfirmed:
      type: boolean

AgendaDay:
  type: object
  required: [date, pickups, introPickups, cleaningShifts]
  properties:
    date:
      type: string
      format: date
    pickups:
      type: array
      items:
        $ref: './pickups.yaml#/UserPickup'
    introPickups:
      type: array
      items:
        $ref: './intro-pickups.yaml#/MyBooking'
    cleaningShifts:
      type: array
      items:
        $ref: './fsp-cleaning.yaml#/UserCleaningShift'

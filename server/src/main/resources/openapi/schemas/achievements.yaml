# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

AchievementVisibility:
  type: string
  enum: [HIDDEN, PRIVATE, STORE_MANAGERS, SCOPE, GLOBAL]

DuplicateMode:
  type: string
  enum: [OVERRIDE, MULTIPLE]

AchievementSystemKey:
  type: string
  enum: [HYGIENE_CERTIFICATE, KAM_CERTIFICATE]

AchievementTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 4000

Achievement:
  type: object
  required: [id, name, icon, visibility, duplicateMode, awardedCount, mayAdminister]
  properties:
    id:
      type: string
      format: uuid
    regionId:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    icon:
      type: string
    validityDays:
      type: integer
      format: int32
    visibility:
      $ref: './achievements.yaml#/AchievementVisibility'
    duplicateMode:
      $ref: './achievements.yaml#/DuplicateMode'
    systemKey:
      $ref: './achievements.yaml#/AchievementSystemKey'
    awardedCount:
      type: integer
      format: int32
    mayAdminister:
      type: boolean
    baseName:
      type: string
      description: 'German base name (`name` is in the viewer''s language); only when mayAdminister.'
    baseDescription:
      type: string
      description: 'German base description; only when mayAdminister and set.'
    translations:
      type: object
      description: 'Translations other than the German base text (never `de`).'
      additionalProperties:
        $ref: './achievements.yaml#/AchievementTranslation'

AchievementCreate:
  type: object
  required: [name, icon, visibility, duplicateMode]
  properties:
    regionId:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 200
    icon:
      type: string
      minLength: 1
      maxLength: 100
    visibility:
      $ref: './achievements.yaml#/AchievementVisibility'
    duplicateMode:
      $ref: './achievements.yaml#/DuplicateMode'
    description:
      type: string
      maxLength: 4000
    validityDays:
      type: integer
      format: int32
      minimum: 1
      maximum: 3650
    translations:
      type: object
      additionalProperties:
        $ref: './achievements.yaml#/AchievementTranslation'

AchievementUpdate:
  type: object
  description: 'Omitted fields stay unchanged. validityDays is set back to unlimited with clearValidityDays (400 VALIDATION_FAILED together with validityDays).'
  properties:
    clearValidityDays:
      type: boolean
      description: 'Awards of this achievement are valid without end again.'
    name:
      type: string
      minLength: 1
      maxLength: 200
    icon:
      type: string
      minLength: 1
      maxLength: 100
    visibility:
      $ref: './achievements.yaml#/AchievementVisibility'
    duplicateMode:
      $ref: './achievements.yaml#/DuplicateMode'
    description:
      type: string
      maxLength: 4000
    validityDays:
      type: integer
      format: int32
      minimum: 1
      maximum: 3650
    translations:
      type: object
      additionalProperties:
        $ref: './achievements.yaml#/AchievementTranslation'

Award:
  type: object
  required: [id, achievementId, achievementName, icon, user, awardedAt]
  properties:
    id:
      type: string
      format: uuid
    achievementId:
      type: string
      format: uuid
    achievementName:
      type: string
    icon:
      type: string
    user:
      $ref: './users.yaml#/UserSummary'
    awardedBy:
      $ref: './users.yaml#/UserSummary'
    awardedAt:
      type: string
      format: date-time
    validUntil:
      type: string
      format: date
    notice:
      type: string
    revokedAt:
      type: string
      format: date-time
    regionName:
      type: string

AwardCreate:
  type: object
  required: [userId]
  properties:
    userId:
      type: string
      format: uuid
    validUntil:
      type: string
      format: date
    notice:
      type: string
      maxLength: 1000

AwardUpdate:
  type: object
  description: 'Omitted fields stay unchanged; an empty notice clears it. validUntil is removed (valid without end) with clearValidUntil (400 VALIDATION_FAILED together with validUntil).'
  properties:
    validUntil:
      type: string
      format: date
    clearValidUntil:
      type: boolean
      description: 'The award is valid without end.'
    notice:
      type: string
      maxLength: 1000

DevUser:
  type: object
  required: [id, email, displayName, role, descriptionKey]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
    displayName:
      type: string
    role:
      $ref: './common.yaml#/Role'
    descriptionKey:
      type: string

DevLoginRequest:
  type: object
  required: [userId]
  properties:
    userId:
      type: string
      format: uuid

DevRoleRequest:
  type: object
  required: [role]
  properties:
    role:
      $ref: './common.yaml#/Role'

DevClockRequest:
  type: object
  properties:
    fixedAt:
      type: string
      format: date-time
      description: Fix the server clock at this instant; omit to return to the system clock.

DevClockState:
  type: object
  required: [now, fixed]
  properties:
    now:
      type: string
      format: date-time
    fixed:
      type: boolean

CapturedMail:
  type: object
  required: [id, to, subject, text, links, sentAt]
  properties:
    id:
      type: string
      format: uuid
    to:
      type: string
    subject:
      type: string
    text:
      type: string
    html:
      type: string
    links:
      type: array
      items:
        type: string
    sentAt:
      type: string
      format: date-time
    from:
      type: string
      description: Sender as delivered (mailbox mails use the mailbox address, A35); absent = default sender.
    attachmentNames:
      type: array
      description: File names of the attachments (mailbox mails).
      items:
        type: string

DevNotificationChannel:
  type: string
  enum: [BELL, MAIL, PUSH, TELEGRAM]

DevNotification:
  type: object
  required: [id, userId, type, channel, params, createdAt]
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    type:
      description: 'NotificationType name'
      type: string
    channel:
      $ref: './dev.yaml#/DevNotificationChannel'
    params:
      type: object
      additionalProperties:
        type: string
    link:
      type: string
    identifier:
      type: string
    body:
      description: 'PUSH/TELEGRAM: rendered text'
      type: string
    target:
      description: 'PUSH: subscription endpoint; TELEGRAM: chat id'
      type: string
    createdAt:
      type: string
      format: date-time

DevTelegramUpdate:
  type: object
  required: [chatId, text]
  properties:
    chatId:
      type: string
      maxLength: 40
    text:
      type: string
      maxLength: 4000
    title:
      description: 'Group title; absent = private chat'
      type: string
      maxLength: 200

DevRealtimeSessions:
  type: object
  required:
    - userIds
  properties:
    userIds:
      type: array
      items:
        type: string
        format: uuid

DevRealtimePing:
  type: object
  required:
    - userId
  properties:
    userId:
      type: string
      format: uuid

DevIncomingMail:
  type: object
  required:
    - rawMime
  properties:
    rawMime:
      type: string
      description: Raw RFC 822 message (plain text).

DevOAuthCode:
  type: object
  required: [code, clientId, redirectUri]
  properties:
    code:
      type: string
    clientId:
      type: string
    redirectUri:
      type: string
    state:
      type: string

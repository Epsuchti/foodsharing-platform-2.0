SessionInfo:
  type: object
  required: [authenticated, permissions]
  properties:
    authenticated:
      type: boolean
    user:
      $ref: './auth.yaml#/SessionUser'
    permissions:
      type: array
      description: >-
        Effective region-scoped permissions as "<PERMISSION>@<regionId>" ("<PERMISSION>@*" for ORGA), see
        docs/conventions.md A10.
      items:
        type: string
    sessionId:
      type: string
      format: uuid
    units:
      type: array
      description: Regions and working groups of the user (filled by the region module's SessionInfoEnricher).
      items:
        $ref: './regions.yaml#/UnitMembership'
    pendingConsents:
      type: array
      description: Legal documents the user still has to accept (filled by the legal enricher).
      items:
        $ref: './legal.yaml#/LegalDocumentKind'
    onboarding:
      $ref: './onboarding.yaml#/OnboardingState'

SessionUser:
  type: object
  required: [id, email, displayName, role, language, theme, verified]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: string
    role:
      $ref: './common.yaml#/Role'
    language:
      $ref: './common.yaml#/Language'
    theme:
      $ref: './common.yaml#/Theme'
    verified:
      type: boolean
    homeRegionId:
      type: string
      format: uuid
    foodsaverNumber:
      type: integer
      format: int64
    quizRole:
      $ref: './common.yaml#/Role'
    phone:
      type: string
      description: Mobile phone number (onboarding step 2 checks it is set).

MagicLinkRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 320
    returnUrl:
      type: string
      maxLength: 500
    language:
      $ref: './common.yaml#/Language'

MagicLinkVerifyRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      maxLength: 200

AuthProvider:
  type: string
  enum: [GOOGLE, EMAIL]

AuthMethods:
  type: object
  required: [identities, passkeys]
  properties:
    identities:
      type: array
      items:
        $ref: './auth.yaml#/AuthIdentityView'
    passkeys:
      type: array
      items:
        $ref: './auth.yaml#/PasskeyView'

AuthIdentityView:
  type: object
  required: [id, provider, label, createdAt]
  properties:
    id:
      type: string
      format: uuid
    provider:
      $ref: './auth.yaml#/AuthProvider'
    label:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time

PasskeyView:
  type: object
  required: [id, label, createdAt, transports]
  properties:
    id:
      type: string
      format: uuid
    label:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
    transports:
      type: array
      items:
        type: string

PasskeyRenameRequest:
  type: object
  required: [label]
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 100

SessionView:
  type: object
  required: [id, current, createdAt, lastSeenAt]
  properties:
    id:
      type: string
      format: uuid
    current:
      type: boolean
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    userAgent:
      type: string
    ipHint:
      type: string
      description: Short, non-identifying hint (first 8 hex chars of the IP hash).

SessionInfo:
  type: object
  required: [authenticated, permissions]
  properties:
    authenticated:
      type: boolean
    user:
      $ref: './auth.yaml#/SessionUser'
    permissions:
      type: array
      description: Effective permission names (M1 empty; region-scoped permissions arrive in M2).
      items:
        type: string
    sessionId:
      type: string
      format: uuid

SessionUser:
  type: object
  required: [id, email, displayName, role, language, theme, verified]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: string
    role:
      $ref: './common.yaml#/Role'
    language:
      $ref: './common.yaml#/Language'
    theme:
      $ref: './common.yaml#/Theme'
    verified:
      type: boolean

MagicLinkRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 320
    returnUrl:
      type: string
      maxLength: 500
    language:
      $ref: './common.yaml#/Language'

MagicLinkVerifyRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      maxLength: 200

AuthProvider:
  type: string
  enum: [GOOGLE, EMAIL]

AuthMethods:
  type: object
  required: [identities, passkeys]
  properties:
    identities:
      type: array
      items:
        $ref: './auth.yaml#/AuthIdentityView'
    passkeys:
      type: array
      items:
        $ref: './auth.yaml#/PasskeyView'

AuthIdentityView:
  type: object
  required: [id, provider, label, createdAt]
  properties:
    id:
      type: string
      format: uuid
    provider:
      $ref: './auth.yaml#/AuthProvider'
    label:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time

PasskeyView:
  type: object
  required: [id, label, createdAt, transports]
  properties:
    id:
      type: string
      format: uuid
    label:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
    transports:
      type: array
      items:
        type: string

PasskeyRenameRequest:
  type: object
  required: [label]
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 100

SessionView:
  type: object
  required: [id, current, createdAt, lastSeenAt]
  properties:
    id:
      type: string
      format: uuid
    current:
      type: boolean
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    userAgent:
      type: string
    ipHint:
      type: string
      description: Short, non-identifying hint (first 8 hex chars of the IP hash).

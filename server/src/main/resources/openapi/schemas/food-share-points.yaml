# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

FspStatus:
  type: string
  enum: [INACTIVE, ACTIVE]

FspSummary:
  type: object
  required: [id, name, city, status, followerCount, following]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    photoUrl:
      type: string
    city:
      type: string
    lat:
      type: number
      format: double
      description: 'Position of the food-share point (absent when it has none), so lists can pin every entry on a map.'
    lon:
      type: number
      format: double
    status:
      $ref: './food-share-points.yaml#/FspStatus'
    followerCount:
      type: integer
      format: int32
    following:
      type: boolean

FspRef:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

FspAddress:
  type: object
  required: [street, postcode, city]
  properties:
    street:
      type: string
    postcode:
      type: string
    city:
      type: string

FspFollowing:
  type: object
  required: [following, bell, mail]
  properties:
    following:
      type: boolean
    bell:
      type: boolean
    mail:
      type: boolean

FspPermissions:
  type: object
  required: [mayEdit, mayDelete, mayActivate, mayPost, mayFollow]
  properties:
    mayEdit:
      type: boolean
    mayDelete:
      type: boolean
    mayActivate:
      type: boolean
    mayPost:
      type: boolean
    mayFollow:
      type: boolean

Fsp:
  type: object
  required: [id, name, region, address, status, managers, createdAt, followerCount, following, permissions,
             cleaningEnabled, cleaningAutoConfirm, timeZone]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    photoUrl:
      type: string
    region:
      $ref: './regions.yaml#/RegionRef'
    address:
      $ref: './food-share-points.yaml#/FspAddress'
    lat:
      type: number
      format: double
    lon:
      type: number
      format: double
    status:
      $ref: './food-share-points.yaml#/FspStatus'
    managers:
      type: array
      items:
        $ref: './users.yaml#/UserSummary'
    creator:
      $ref: './users.yaml#/UserSummary'
    createdAt:
      type: string
      format: date-time
    followerCount:
      type: integer
      format: int32
    following:
      $ref: './food-share-points.yaml#/FspFollowing'
    permissions:
      $ref: './food-share-points.yaml#/FspPermissions'
    cleaningEnabled:
      description: 'The Fairteiler offers cleaning shifts (FS2).'
      type: boolean
    cleaningAutoConfirm:
      description: 'Cleaning sign-ups are confirmed automatically (decision 155).'
      type: boolean
    timeZone:
      description: 'Zone of the cleaning shifts (decision 155).'
      type: string

FspCreate:
  type: object
  required: [name, street, postcode, city]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    street:
      type: string
      minLength: 1
      maxLength: 200
    postcode:
      type: string
      minLength: 1
      maxLength: 20
    city:
      type: string
      minLength: 1
      maxLength: 200
    managerIds:
      type: array
      items:
        type: string
        format: uuid
    description:
      type: string
      maxLength: 32600
    lat:
      type: number
      format: double
    lon:
      type: number
      format: double
    photoUploadId:
      type: string
      format: uuid
    cleaningEnabled:
      description: 'Cleaning shifts on (FS2); switching off removes the Fairteiler from the regions cleaning rule.'
      type: boolean
    cleaningAutoConfirm:
      description: 'Confirm cleaning sign-ups automatically (decision 155).'
      type: boolean
    timeZone:
      description: "IANA zone of the cleaning shifts; on create the default is the region's zone (decision 155)."
      type: string
      maxLength: 60

FspUpdate:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    street:
      type: string
      minLength: 1
      maxLength: 200
    postcode:
      type: string
      minLength: 1
      maxLength: 20
    city:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 32600
    lat:
      type: number
      format: double
    lon:
      type: number
      format: double
    photoUploadId:
      type: string
      format: uuid
    cleaningEnabled:
      description: 'Cleaning shifts on (FS2); switching off removes the Fairteiler from the regions cleaning rule.'
      type: boolean
    cleaningAutoConfirm:
      description: 'Confirm cleaning sign-ups automatically (decision 155).'
      type: boolean
    timeZone:
      description: "IANA zone of the cleaning shifts; on create the default is the region's zone (decision 155)."
      type: string
      maxLength: 60

FspStatusUpdate:
  type: object
  required: [status]
  properties:
    status:
      $ref: './food-share-points.yaml#/FspStatus'

FspFollowUpdate:
  type: object
  required: [bell, mail]
  properties:
    bell:
      type: boolean
    mail:
      type: boolean

FspManagersUpdate:
  type: object
  required: [userIds]
  properties:
    userIds:
      type: array
      items:
        type: string
        format: uuid
      maxItems: 20

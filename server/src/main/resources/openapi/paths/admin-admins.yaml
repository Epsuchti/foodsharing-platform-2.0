/api/admin/admins:
  get:
    tags: [admin-admins]
    operationId: listAdmins
    summary: 'Admins list (plan §14.4, AD1): every ambassador / working-group admin with the units they administer, last login and active flag. Enable/disable uses PUT /api/admin/users/{userId}/active.'
    x-permission: 'ORGA'
    parameters:
      - name: q
        in: query
        description: 'Filter by display name or email (case-insensitive substring).'
        schema:
          type: string
          maxLength: 100
      - name: unitKind
        in: query
        description: 'Only admins of regions (REGION) or of working groups (WORKING_GROUP); omitted = both.'
        schema:
          $ref: '../schemas/admin-admins.yaml#/AdminUnitKind'
      - name: active
        in: query
        description: 'Only active (true) or disabled (false) accounts; omitted = both.'
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: 'OK, sorted by display name'
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-admins.yaml#/AdminListPage'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
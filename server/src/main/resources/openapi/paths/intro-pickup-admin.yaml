/api/regions/{regionId}/admin/store-aliases:
  get:
    tags: [intro-pickup-admin]
    operationId: listStoreAliases
    summary: 'Store name aliases used by the CSV import.'
    x-permission: 'CAN_MANAGE_USERS@region'
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/intro-pickups.yaml#/StoreAlias'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  post:
    tags: [intro-pickup-admin]
    operationId: createStoreAlias
    summary: 'Add a store name alias.'
    x-permission: 'CAN_MANAGE_USERS@region'
    x-history: IntroPickupAction.STORE_ALIAS_CHANGED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/StoreAliasUpdate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/StoreAlias'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'STORE_ALIAS_EXISTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/regions/{regionId}/admin/store-aliases/{aliasId}:
  put:
    tags: [intro-pickup-admin]
    operationId: updateStoreAlias
    summary: 'Change a store name alias.'
    x-permission: 'CAN_MANAGE_USERS@region'
    x-history: IntroPickupAction.STORE_ALIAS_CHANGED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: aliasId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/StoreAliasUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/StoreAlias'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND or STORE_ALIAS_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'STORE_ALIAS_EXISTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [intro-pickup-admin]
    operationId: deleteStoreAlias
    summary: 'Delete a store name alias.'
    x-permission: 'CAN_MANAGE_USERS@region'
    x-history: IntroPickupAction.STORE_ALIAS_CHANGED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: aliasId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND or STORE_ALIAS_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

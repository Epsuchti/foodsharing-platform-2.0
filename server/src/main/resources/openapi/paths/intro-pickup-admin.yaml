      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/intro-pickups/slots/{slotId}/counted:
  put:
    tags: [intro-pickup-admin]
    operationId: setBookingCounted
    summary: 'Count or uncount a past booking.'
    x-permission: 'CAN_MANAGE_USERS@region'
    x-history: IntroPickupAction.COUNTED
    parameters:
      - name: slotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/BookingCountedUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/GuideBooking'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'SLOT_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'ONLY_PAST_APPOINTMENTS_COUNTABLE, ONLY_CANCELLED_APPOINTMENTS_COUNTABLE or ONLY_COUNTED_APPOINTMENTS_NOT_COUNTABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/intro-pickups/slots/{slotId}/admin-comments:
  post:

/api/stores/{storeId}/automation:
  get:
    tags: [automation]
    operationId: getStoreAutomation
    summary: 'All automations of a store.'
    x-permission: 'mayUseAutomations(store)'
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/automation.yaml#/StoreAutomation'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/automation/pickup-policy:
  put:
    tags: [automation]
    operationId: putPickupPolicy
    summary: 'Create or replace the pickup policy.'
    x-permission: 'mayUseAutomations(store)'
    x-history: AutomationAction.PICKUP_POLICY_UPDATED
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/automation.yaml#/PickupPolicy'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/automation.yaml#/PickupPolicy'
      '400': {description: 'TOO_MANY_LINKED_STORES, TOO_MANY_STORES_PER_LINK, LINKED_STORE_WINDOW_INVALID, LINKED_STORE_SELF, INVALID_TEMPLATE_VARIABLE, GRACE_MINUTES_TOO_LOW or VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED (or a linked store)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'CONCURRENT_MODIFICATION', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [automation]
    operationId: deletePickupPolicy
    summary: 'Delete the pickup policy (and mirrored links).'
    x-permission: 'mayUseAutomations(store)'
    x-history: AutomationAction.PICKUP_POLICY_DELETED
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED or POLICY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/automation/pickup-policy/run:
  post:
    tags: [automation]
    operationId: runPickupPolicy
    summary: 'Evaluate all open sign-ups now.'
    x-permission: 'mayUseAutomations(store)'
    x-history: AutomationAction.PICKUP_DECISION
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dryRun
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/automation.yaml#/AutomationRunResult'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'POLICY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/automation/pickup-policy/preview:
  post:
    tags: [automation]
    operationId: previewPickupPolicy
    summary: 'What-if decision for a user and pickup (no audit).'

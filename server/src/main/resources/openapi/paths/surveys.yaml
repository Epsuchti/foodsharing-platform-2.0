# surveys (milestone 5, docs/plan-m5.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.
/api/surveys:
  get:
    tags:
      - surveys
    operationId: listSurveys
    summary: Surveys I own or co-author.
    x-permission: CAN_MANAGE_SURVEYS
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/surveys.yaml#/SurveySummary
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  post:
    tags:
      - surveys
    operationId: createSurvey
    summary: Create a survey.
    x-permission: CAN_MANAGE_SURVEYS
    x-history: SurveyAction.CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/SurveyWrite
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/Survey
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/surveys/coauthor-candidates:
  get:
    tags:
      - surveys
    operationId: listSurveyCoauthorCandidates
    summary: Users who may co-author.
    x-permission: CAN_MANAGE_SURVEYS
    parameters:
      - name: q
        in: query
        schema:
          type: string
          minLength: 0
          maxLength: 50
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/users.yaml#/UserSummary
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/surveys/{surveyId}:
  get:
    tags:
      - surveys
    operationId: getSurvey
    summary: Survey definition.
    x-permission: owner or co-author
    parameters:
      - name: surveyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/Survey
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: SURVEY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  put:
    tags:
      - surveys
    operationId: updateSurvey
    summary: Replace title, questions and co-authors.
    x-permission: owner or co-author
    x-history: SurveyAction.UPDATED
    parameters:
      - name: surveyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/SurveyWrite
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/Survey
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: SURVEY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  delete:
    tags:
      - surveys
    operationId: deleteSurvey
    summary: Delete a survey and its responses.
    x-permission: owner or co-author
    x-history: SurveyAction.DELETED
    parameters:
      - name: surveyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Done
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: SURVEY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/surveys/{surveyId}/results:
  get:
    tags:
      - surveys
    operationId: getSurveyResults
    summary: All responses.
    x-permission: owner or co-author
    parameters:
      - name: surveyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyResults
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: SURVEY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/surveys/{surveyId}/form:
  get:
    tags:
      - surveys
    operationId: getSurveyForm
    summary: Form to fill (storeId from the store link).
    x-permission: authenticated
    parameters:
      - name: surveyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyForm
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: SURVEY_NOT_FOUND, STORE_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/surveys/{surveyId}/responses:
  post:
    tags:
      - surveys
    operationId: submitSurveyResponse
    summary: Submit my answers.
    x-permission: authenticated, once
    x-history: SurveyAction.RESPONSE_SUBMITTED
    parameters:
      - name: surveyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/SurveyResponseCreate
    responses:
      "204":
        description: Done
      "400":
        description: SURVEY_QUESTION_REQUIRED, SURVEY_ANSWER_INVALID
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: SURVEY_NOT_FOUND, STORE_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "409":
        description: SURVEY_ALREADY_SUBMITTED, STORE_ANSWER_LINK_ONLY
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

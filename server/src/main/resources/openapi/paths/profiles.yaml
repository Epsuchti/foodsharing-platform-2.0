# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/users/{userId}/profile:
  get:
    tags: [profiles]
    operationId: getPublicProfile
    summary: Profile page of a user.
    x-permission: authenticated
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/profiles.yaml#/PublicProfile'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/commitments:
  get:
    tags: [profiles]
    operationId: getUserCommitments
    summary: Weekly commitments of a user.
    x-permission: maySeeCommitments
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: weeks
        in: query
        schema:
          type: integer
          format: int32
          minimum: 4
          maximum: 104
          default: 4
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/profiles.yaml#/Commitments'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/wall:
  get:
    tags: [profiles]
    operationId: listUserWallPosts
    summary: Profile wall.
    x-permission: authenticated
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/WallEntryPage'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: WALL_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  post:
    tags: [profiles]
    operationId: createUserWallPost
    summary: Write on a profile wall.
    x-permission: authenticated
    x-history: UserAction.WALL_POST_CREATED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/WallEntryCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/WallEntry'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: WALL_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/wall/{postId}:
  delete:
    tags: [profiles]
    operationId: deleteUserWallPost
    summary: Delete a profile wall post.
    x-permission: 'ORGA, author or the profile owner'
    x-history: UserAction.WALL_POST_DELETED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: WALL_POST_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/bananas:
  get:
    tags: [profiles]
    operationId: listBananas
    summary: Bananas received or sent by a user.
    x-permission: authenticated
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: direction
        in: query
        schema:
          type: string
          enum: [received, sent]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/profiles.yaml#/Banana'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  post:
    tags: [profiles]
    operationId: giveBanana
    summary: Give a trust banana.
    x-permission: 'verified, not self, recipient verified'
    x-history: UserAction.BANANA_GIVEN
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/profiles.yaml#/BananaCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/profiles.yaml#/Banana'
      "400":
        description: BANANA_MESSAGE_TOO_SHORT or VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: BANANA_NOT_ALLOWED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: BANANA_ALREADY_GIVEN
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/bananas/{senderId}:
  delete:
    tags: [profiles]
    operationId: deleteBanana
    summary: Delete a banana.
    x-permission: 'recipient, sender or ORGA'
    x-history: UserAction.BANANA_DELETED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: senderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BANANA_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


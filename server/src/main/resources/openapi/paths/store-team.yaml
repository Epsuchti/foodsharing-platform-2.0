/api/stores/{storeId}/team/{userId}:
  delete:
    tags: [store-team]
    operationId: removeMember
    summary: 'Remove a member (message required) or leave (self, message optional); future sign-ups are deleted.'
    x-permission: 'mayEditTeam or self'
    x-history: StoreLogAction.REMOVED_FROM_STORE
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/RequiredMessage'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NOT_TEAM_MEMBER or MANAGER_CANNOT_LEAVE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  post:
    tags: [store-team]
    operationId: addMemberDirectly
    summary: 'Add a user to the team without an application.'
    x-permission: 'mayEditTeam'
    x-history: StoreLogAction.ADDED_WITHOUT_REQUEST
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: standby
        in: query
        schema:
          type: boolean
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED or ROLE_TOO_LOW', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'ALREADY_IN_TEAM', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}


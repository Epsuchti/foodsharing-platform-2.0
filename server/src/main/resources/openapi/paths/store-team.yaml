/api/stores/{storeId}/team:
  get:
    tags: [store-team]
    operationId: getStoreTeam
    summary: 'Team, jumpers, applications and invitations.'
    x-permission: 'mayAccessStore'
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/stores.yaml#/StoreTeam'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/applications:
  post:
    tags: [store-team]
    operationId: applyToStore
    summary: 'Apply to the store team.'
    x-permission: 'AUTHENTICATED'
    x-history: StoreLogAction.REQUEST_TO_JOIN
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/stores.yaml#/StoreApplicationCreate'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED or APPLICATION_TEXT_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'NOT_VERIFIED or ROLE_TOO_LOW', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'ALREADY_IN_TEAM, TEAM_CLOSED, NOT_REGION_MEMBER, PROFILE_INCOMPLETE, NO_HOME_REGION, PHONE_REQUIRED or HYGIENE_CERTIFICATE_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/applications/me:
  delete:
    tags: [store-team]
    operationId: cancelMyStoreApplication
    summary: 'Withdraw the own application.'
    x-permission: 'self'
    x-history: StoreLogAction.REQUEST_CANCELLED
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NOT_APPLIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/applications/{userId}/accept:
  post:
    tags: [store-team]
    operationId: acceptApplication
    summary: 'Accept an application (optionally onto the waiting list).'
    x-permission: 'mayEditTeam'
    x-history: StoreLogAction.REQUEST_APPROVED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moveToStandby
        in: query
        schema:
          type: boolean
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NOT_APPLIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/applications/{userId}/decline:
  post:
    tags: [store-team]
    operationId: declineApplication
    summary: 'Decline an application with a message.'
    x-permission: 'mayEditTeam'
    x-history: StoreLogAction.REQUEST_DECLINED
    parameters:
      - name: userId

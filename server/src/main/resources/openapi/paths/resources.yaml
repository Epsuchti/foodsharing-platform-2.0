/api/resources:
  post:
    tags: [resources]
    operationId: createResource
    summary: Add a resource.
    x-permission: 'authenticated (commons: region admin)'
    x-history: ResourceAction.CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/resources.yaml#/ResourceCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/resources.yaml#/Resource'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: COMMONS_NOT_ALLOWED or ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: RESOURCE_LIMIT_REACHED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/resources/{resourceId}:
  patch:
    tags: [resources]
    operationId: updateResource
    summary: Edit a resource.
    x-permission: mayEdit
    x-history: ResourceAction.UPDATED
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/resources.yaml#/ResourceUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/resources.yaml#/Resource'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: RESOURCE_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [resources]
    operationId: deleteResource
    summary: Delete a resource.
    x-permission: mayDelete
    x-history: ResourceAction.DELETED
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: RESOURCE_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


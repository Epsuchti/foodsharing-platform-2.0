# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/resources/categories:
  get:
    tags: [resources]
    operationId: listResourceCategories
    summary: Resource categories.
    x-permission: authenticated
    parameters:
      - name: lang
        in: query
        schema:
          $ref: '../schemas/common.yaml#/Language'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/resources.yaml#/ResourceCategory'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/regions/{regionId}/resources:
  get:
    tags: [resources]
    operationId: listRegionResources
    summary: Resources of a region.
    x-permission: region member
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/resources.yaml#/Resource'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: RESOURCES_NOT_AVAILABLE or ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REGION_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/regions/{regionId}/resources/permissions:
  get:
    tags: [resources]
    operationId: getResourcePermissions
    summary: What the user may do here.
    x-permission: region member
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/resources.yaml#/ResourcePermissions'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REGION_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/resources/mine:
  get:
    tags: [resources]
    operationId: listMyResources

# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/map/markers/stores:
  get:
    tags: [map]
    operationId: listStoreMarkers
    summary: Store markers.
    x-permission: authenticated
    parameters:
      - name: status
        in: query
        schema:
          $ref: '../schemas/map.yaml#/StoreMarkerStatus'
      - name: help
        in: query
        schema:
          $ref: '../schemas/map.yaml#/StoreMarkerHelp'
      - name: scope
        in: query
        schema:
          $ref: '../schemas/map.yaml#/StoreMarkerScope'
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/map.yaml#/StoreMarker'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/map/markers/events:
  get:
    tags: [map]
    operationId: listEventMarkers
    summary: Upcoming offline events with a location.
    x-permission: authenticated
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/MapMarker'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/map/markers/users:
  get:
    tags: [map]
    operationId: listUserMarkers
    summary: Members of a region (positions rounded).
    x-permission: mayAdministrateRegion(regionId)
    parameters:
      - name: regionId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: query
        schema:
          $ref: '../schemas/map.yaml#/UserMarkerRole'
      - name: activity
        in: query
        schema:
          $ref: '../schemas/map.yaml#/UserMarkerActivity'
      - name: member
        in: query
        schema:
          $ref: '../schemas/map.yaml#/UserMarkerMember'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/MapMarker'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/map/markers/baskets:
  get:
    tags: [map]
    operationId: listBasketMarkers
    summary: Active baskets (HOME positions rounded).
    x-permission: authenticated
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/MapMarker'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/map/bubbles/{kind}/{id}:
  get:
    tags: [map]
    operationId: getMapBubble
    summary: Popup content of a marker.
    x-permission: authenticated (visibility per kind)
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/map.yaml#/MapBubble'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: MARKER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/map/search:
  get:
    tags: [map]
    operationId: searchMapLocation
    summary: Geocode a place for the map.
    x-permission: authenticated
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 200
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/GeoResult'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "503":
        description: INTEGRATION_UNAVAILABLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

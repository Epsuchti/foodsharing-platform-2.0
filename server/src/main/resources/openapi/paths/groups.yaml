/api/regions/{regionId}/groups:
  get:
    tags: [groups]
    operationId: listGroupsInRegion
    summary: 'Working groups of a region.'
    x-permission: 'AUTHENTICATED'
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: includeArchived
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/groups.yaml#/WorkingGroupSummary'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  post:
    tags: [groups]
    operationId: createGroup
    summary: 'Create a working group in a region.'
    x-permission: 'ambassador or ORGA (restricted function: ORGA)'
    x-history: GroupAction.CREATED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/groups.yaml#/WorkingGroupCreate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/WorkingGroupDetail'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED or RESTRICTED_FUNCTION', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'DUPLICATE_FUNCTION_GROUP', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/mine:
  get:
    tags: [groups]
    operationId: listMyGroups
    summary: 'Working groups of the current user.'
    x-permission: 'AUTHENTICATED'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/groups.yaml#/WorkingGroupSummary'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}:
  get:
    tags: [groups]
    operationId: getGroup
    summary: 'Working group detail.'
    x-permission: 'AUTHENTICATED'
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/WorkingGroupDetail'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  patch:
    tags: [groups]
    operationId: updateGroup
    summary: 'Edit a working group.'
    x-permission: 'group admin or ORGA (restricted function: ORGA)'
    x-history: GroupAction.UPDATED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/groups.yaml#/WorkingGroupUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/WorkingGroupDetail'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'CONCURRENT_MODIFICATION', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/archive:
  post:
    tags: [groups]
    operationId: archiveGroup
    summary: 'Archive a working group.'
    x-permission: 'group admin or ORGA'
    x-history: GroupAction.ARCHIVED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/OptionalReasonBody'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/WorkingGroupDetail'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/members/me:
  put:
    tags: [groups]
    operationId: joinOpenGroup
    summary: 'Join an OPEN working group.'
    x-permission: 'AUTHENTICATED'
    x-history: GroupAction.MEMBER_JOINED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/WorkingGroupDetail'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'GROUP_NOT_OPEN, ALREADY_MEMBER or NOT_A_MEMBER (not in the parent region)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/applications:
  post:
    tags: [groups]
    operationId: applyToGroup
    summary: 'Apply to a working group.'
    x-permission: 'AUTHENTICATED'
    x-history: GroupAction.APPLICATION_SUBMITTED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/groups.yaml#/GroupApplicationCreate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/GroupApplication'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'GROUP_APPLICATIONS_CLOSED, ALREADY_APPLIED, ALREADY_MEMBER, NOT_A_MEMBER (not in the parent region) or GROUP_REQUIREMENTS_NOT_MET (args)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  get:
    tags: [groups]
    operationId: listGroupApplications
    summary: 'Pending applications.'
    x-permission: 'group admin or ORGA'
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '../schemas/groups.yaml#/GroupApplicationStatus'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/groups.yaml#/GroupApplication'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/applications/me:
  delete:
    tags: [groups]
    operationId: cancelMyApplication
    summary: 'Withdraw the own pending application.'
    x-permission: 'self'
    x-history: GroupAction.APPLICATION_CANCELLED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND or APPLICATION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/applications/{applicationId}/decision:
  post:
    tags: [groups]
    operationId: decideGroupApplication
    summary: 'Accept or decline an application (the applicant gets a bell and a mail).'
    x-permission: 'group admin or ORGA'
    x-history: GroupAction.APPLICATION_ACCEPTED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/groups.yaml#/GroupApplicationDecision'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/GroupApplication'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND or APPLICATION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'APPLICATION_NOT_PENDING', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/members:
  get:
    tags: [groups]
    operationId: listGroupMembers
    summary: 'Members of a working group.'
    x-permission: 'AUTHENTICATED'
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/groups.yaml#/GroupMember'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/members/{userId}:
  put:
    tags: [groups]
    operationId: addGroupMember
    summary: 'Add a member directly.'
    x-permission: 'group admin or ORGA'
    x-history: GroupAction.MEMBER_ADDED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/GroupMember'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND or USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'ALREADY_MEMBER', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [groups]
    operationId: removeGroupMember
    summary: 'Remove a member.'
    x-permission: 'group admin or ORGA or self'
    x-history: GroupAction.MEMBER_REMOVED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/ReasonBody'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NOT_A_MEMBER', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/admins/{userId}:
  put:
    tags: [groups]
    operationId: setGroupAdmin
    summary: 'Make a member group admin.'
    x-permission: 'group admin or ORGA'
    x-history: GroupAction.ADMIN_GRANTED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/groups.yaml#/GroupMember'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NOT_A_MEMBER', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [groups]
    operationId: removeGroupAdmin
    summary: 'Revoke group admin rights.'
    x-permission: 'group admin or ORGA'
    x-history: GroupAction.ADMIN_REVOKED
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/mail:
  post:
    tags: [groups]
    operationId: sendGroupMail
    summary: 'Mail every group member (rate limited).'
    x-permission: 'member'
    x-history: GroupAction.MAIL_SENT
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/groups.yaml#/GroupMail'
    responses:
      '202':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/MessageResponse'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '429': {description: 'TOO_MANY_REQUESTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/groups/{groupId}/conference:
  get:
    tags: [groups]
    operationId: getGroupConference
    summary: 'Video conference link of a group.'
    x-permission: 'member'
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/regions.yaml#/ConferenceLink'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'GROUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

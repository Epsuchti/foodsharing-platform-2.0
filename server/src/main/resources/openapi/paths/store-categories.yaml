/api/store-categories:
  get:
    tags: [store-categories]
    operationId: listStoreCategories
    summary: 'All store categories (sorted by name); every signed-in user, `storeCount` only for ORGA.'
    description: >-
      Category names are shared vocabulary (map store filter, store pages), so every signed-in user may read them,
      like the store markers. Usage counts are an administration view and are omitted unless the caller is ORGA.
      Creating, renaming, merging and deleting stay ORGA-only.
    x-permission: authenticated
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/stores.yaml#/StoreCategory'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  post:
    tags: [store-categories]
    operationId: createStoreCategory
    summary: 'Create a category.'
    x-permission: 'ORGA'
    x-history: StoreCategoryAction.CATEGORY_CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/store-categories.yaml#/NamedItemUpdate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/stores.yaml#/StoreCategory'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NAME_TAKEN', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/store-categories/{id}:
  patch:
    tags: [store-categories]
    operationId: updateStoreCategory
    summary: 'Rename a category.'
    x-permission: 'ORGA'
    x-history: StoreCategoryAction.CATEGORY_UPDATED
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/store-categories.yaml#/NamedItemUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/stores.yaml#/StoreCategory'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'CATEGORY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NAME_TAKEN', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [store-categories]
    operationId: deleteStoreCategory
    summary: 'Delete an unused category.'
    x-permission: 'ORGA'
    x-history: StoreCategoryAction.CATEGORY_DELETED
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'CATEGORY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'CATEGORY_IN_USE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/store-categories/{id}/merge:
  post:
    tags: [store-categories]
    operationId: mergeStoreCategory
    summary: 'Merge a category into another one.'
    x-permission: 'ORGA'
    x-history: StoreCategoryAction.CATEGORY_MERGED
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/store-categories.yaml#/MergeRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/stores.yaml#/StoreCategory'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'CATEGORY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}


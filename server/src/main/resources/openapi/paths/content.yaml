/api/content/pages:
  get:
    tags: [content]
    operationId: listContentPages
    summary: 'All content pages incl. unpublished.'
    x-permission: 'ORGA or hasFunction(PR)'
    parameters:
      - name: kind
        in: query
        schema:
          $ref: '../schemas/content.yaml#/ContentPageKind'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/content.yaml#/ContentPageSummary'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  post:
    tags: [content]
    operationId: createContentPage
    summary: Create a content page.
    x-permission: ORGA or PR group admin (only ORGA picks another editor function)
    x-history: ContentAction.PAGE_CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content.yaml#/ContentPageCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPage'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: CONTENT_PAGE_EXISTS
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/content/pages/{slug}:
  get:
    tags: [content]
    operationId: getContentPageForEdit
    summary: 'A content page in all languages.'
    x-permission: 'ORGA or hasFunction(PR)'
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPageUpdate'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'CONTENT_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  put:
    tags: [content]
    operationId: upsertContentPage
    summary: 'Create or update a content page.'
    x-permission: 'ORGA or hasFunction(PR)'
    x-history: ContentAction.PAGE_UPDATED
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content.yaml#/ContentPageUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPageSummary'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'CONCURRENT_MODIFICATION', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/blog:
  get:
    tags: [content]
    operationId: listBlogPosts
    summary: Blog posts incl. unpublished (editors).
    x-permission: ORGA, PR group admin or ambassador (only posts of their regions and their own drafts)
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/BlogPostPage'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  post:
    tags: [content]
    operationId: createBlogPost
    summary: Write a blog post (unpublished).
    x-permission: ORGA, PR group admin or ambassador of the post's region
    x-history: ContentAction.BLOG_CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content.yaml#/BlogPostCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/BlogPost'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/blog/{blogPostId}:
  get:
    tags: [content]
    operationId: getBlogPost
    summary: Blog post for editing.
    x-permission: published posts for everybody signed in; drafts for whoever may edit them
    parameters:
      - name: blogPostId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/BlogPost'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BLOG_POST_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  patch:
    tags: [content]
    operationId: updateBlogPost
    summary: Edit a blog post.
    x-permission: ORGA, PR group admin, ambassador of the post's region, or the author of an unpublished post
    x-history: ContentAction.BLOG_UPDATED
    parameters:
      - name: blogPostId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content.yaml#/BlogPostUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/BlogPost'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BLOG_POST_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [content]
    operationId: deleteBlogPost
    summary: Delete a blog post.
    x-permission: ORGA, PR group admin, ambassador of the post's region, or the author of an unpublished post
    x-history: ContentAction.BLOG_DELETED
    parameters:
      - name: blogPostId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BLOG_POST_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


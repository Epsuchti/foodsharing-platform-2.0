/api/content/pages:
  get:
    tags: [content]
    operationId: listContentPages
    summary: 'All content pages incl. unpublished.'
    x-permission: 'ORGA or hasFunction(PR)'
    parameters:
      - name: kind
        in: query
        schema:
          $ref: '../schemas/content.yaml#/ContentPageKind'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/content.yaml#/ContentPageSummary'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/content/pages/{slug}:
  get:
    tags: [content]
    operationId: getContentPageForEdit
    summary: 'A content page in all languages.'
    x-permission: 'ORGA or hasFunction(PR)'
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPageUpdate'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'CONTENT_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  put:
    tags: [content]
    operationId: upsertContentPage
    summary: 'Create or update a content page.'
    x-permission: 'ORGA or hasFunction(PR)'
    x-history: ContentAction.PAGE_UPDATED
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content.yaml#/ContentPageUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPageSummary'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'CONCURRENT_MODIFICATION', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

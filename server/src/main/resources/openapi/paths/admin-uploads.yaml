# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/admin/uploads:
  get:
    tags: [admin-uploads]
    operationId: listAdminUploads
    summary: All uploads.
    x-permission: ORGA
    parameters:
      - name: unclaimed
        in: query
        schema:
          type: boolean
      - name: module
        in: query
        schema:
          type: string
          maxLength: 60
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-uploads.yaml#/UploadAdminPage'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/admin/uploads/summary:
  get:
    tags: [admin-uploads]
    operationId: getUploadSummary
    summary: Upload storage summary.
    x-permission: ORGA
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-uploads.yaml#/UploadAdminSummary'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/admin/uploads/{uploadId}:
  delete:
    tags: [admin-uploads]
    operationId: deleteAdminUpload
    summary: Delete an upload.
    x-permission: ORGA
    x-history: AdminAction.UPLOAD_DELETED_BY_ADMIN
    parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: UPLOAD_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

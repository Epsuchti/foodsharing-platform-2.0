              $ref: '../schemas/regions.yaml#/RegionPin'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND or RESOURCE_NOT_FOUND (no pin)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  put:
    tags: [regions]
    operationId: updateRegionPin
    summary: 'Set the region pin (PR function).'
    x-permission: 'hasFunction(PR)'
    x-history: RegionAction.PIN_CHANGED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/regions.yaml#/RegionPin'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/regions.yaml#/RegionPin'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/regions/{regionId}/statistics:
  get:
    tags: [regions]
    operationId: getRegionStatistics
    summary: 'Region statistics (cache refreshed nightly).'

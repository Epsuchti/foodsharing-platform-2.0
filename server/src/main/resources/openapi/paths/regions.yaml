/api/regions/{regionId}/history:
  get:
    tags: [regions]
    operationId: getRegionHistory
    summary: 'Region admin log (plan §10.2).'
    x-permission: 'ambassador or ORGA'
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actions
        in: query
        style: form

# mailboxes (milestone 5, docs/plan-m5.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.
/api/mailboxes:
  get:
    tags:
      - mailboxes
    operationId: listMailboxes
    summary: Mailboxes I may read.
    x-permission: authenticated (mailboxes I may read)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/mailboxes.yaml#/Mailbox
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/unread-count:
  get:
    tags:
      - mailboxes
    operationId: getMailboxUnreadCount
    summary: Unread INBOX mails over all my mailboxes.
    x-permission: authenticated
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/MailboxUnreadCount
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/regions/{regionId}/mailbox:
  post:
    tags:
      - mailboxes
    operationId: createRegionMailbox
    summary: Create the mailbox of a region or working group.
    x-permission: mayAdministrateRegion
    x-history: MailboxAction.MAILBOX_CREATED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/mailboxes.yaml#/MailboxCreate
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/Mailbox
      "400":
        description: EMAIL_NAME_INVALID
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "409":
        description: EMAIL_NAME_TAKEN, EMAIL_NAME_RESERVED, MAILBOX_ALREADY_EXISTS
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/regions/mailboxes:
  get:
    tags:
      - mailboxes
    operationId: listRegionMailboxes
    summary: Directory of region mailbox addresses.
    x-permission: authenticated
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/mailboxes.yaml#/RegionMailbox
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/users/{userId}/mailbox:
  post:
    tags:
      - mailboxes
    operationId: createUserMailbox
    summary: Create a personal mailbox (MB6).
    x-permission: ORGA or mayAdministrateUser; target role >= AMBASSADOR
    x-history: MailboxAction.MAILBOX_CREATED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/mailboxes.yaml#/MailboxCreate
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/Mailbox
      "400":
        description: EMAIL_NAME_INVALID
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED, MAILBOX_NOT_ALLOWED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "409":
        description: EMAIL_NAME_TAKEN, EMAIL_NAME_RESERVED, MAILBOX_ALREADY_EXISTS
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/{mailboxId}:
  patch:
    tags:
      - mailboxes
    operationId: updateMailbox
    summary: Change name or email name.
    x-permission: mayManage (region admin / ORGA)
    x-history: MailboxAction.FIELD_CHANGED
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/mailboxes.yaml#/MailboxUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/Mailbox
      "400":
        description: EMAIL_NAME_INVALID
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "409":
        description: EMAIL_NAME_TAKEN, EMAIL_NAME_RESERVED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  delete:
    tags:
      - mailboxes
    operationId: deleteMailbox
    summary: Delete a mailbox (with mails only with force).
    x-permission: ORGA
    x-history: MailboxAction.MAILBOX_DELETED
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: force
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "204":
        description: Done
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "409":
        description: MAILBOX_NOT_EMPTY
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/{mailboxId}/members:
  get:
    tags:
      - mailboxes
    operationId: listMailboxMembers
    summary: Members of a mailbox.
    x-permission: mailbox reader
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/users.yaml#/UserSummary
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  put:
    tags:
      - mailboxes
    operationId: setMailboxMembers
    summary: Replace the member list.
    x-permission: mayManage (region admin / group admin / ORGA)
    x-history: MailboxAction.MEMBER_ADDED
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/mailboxes.yaml#/MailboxMembersUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/users.yaml#/UserSummary
      "400":
        description: 'VALIDATION_FAILED, MAILBOX_MEMBER_NOT_ELIGIBLE (role below STORE_MANAGER; args.userIds lists them)'
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_NOT_FOUND, USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/{mailboxId}/folders/{folder}/mails:
  get:
    tags:
      - mailboxes
    operationId: listMails
    summary: Mails of a folder, newest first.
    x-permission: mailbox reader
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: folder
        in: path
        required: true
        schema:
          $ref: ../schemas/mailboxes.yaml#/MailFolder
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/MailPage
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/{mailboxId}/mails:
  post:
    tags:
      - mailboxes
    operationId: sendMail
    summary: Compose, reply or forward.
    x-permission: mailbox reader
    x-history: MailboxAction.MAIL_SENT
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/mailboxes.yaml#/MailCompose
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/Mail
      "400":
        description: INVALID_RECIPIENT, TOO_MANY_RECIPIENTS, TOO_MANY_ATTACHMENTS, ATTACHMENT_TOO_LARGE
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_NOT_FOUND, MAILBOX_MAIL_NOT_FOUND, UPLOAD_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "429":
        description: MAILBOX_RATE_LIMITED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "503":
        description: MAILBOX_DOMAIN_NOT_CONFIGURED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/mails/{mailId}:
  get:
    tags:
      - mailboxes
    operationId: getMail
    summary: One mail (marks it read unless keepUnread).
    x-permission: mailbox reader
    parameters:
      - name: mailId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: keepUnread
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/Mail
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_MAIL_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  patch:
    tags:
      - mailboxes
    operationId: moveOrFlagMail
    summary: Mark read/unread or move to a folder.
    x-permission: mailbox reader
    x-history: MailboxAction.MAIL_MOVED
    parameters:
      - name: mailId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/mailboxes.yaml#/MailUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/MailSummary
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_MAIL_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  delete:
    tags:
      - mailboxes
    operationId: deleteMail
    summary: Move to TRASH; in TRASH delete permanently.
    x-permission: mailbox reader
    x-history: MailboxAction.MAIL_DELETED
    parameters:
      - name: mailId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Done
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_MAIL_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/mailboxes/mails/{mailId}/attachments/{attachmentId}:
  get:
    tags:
      - mailboxes
    operationId: downloadMailAttachment
    summary: Download an attachment.
    x-permission: mailbox reader
    parameters:
      - name: mailId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: File
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: MAILBOX_MAIL_NOT_FOUND, ATTACHMENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/admin/mailboxes:
  get:
    tags:
      - mailboxes
    operationId: listAdminMailboxes
    summary: All mailboxes (ORGA), e.g. to find and delete personal mailboxes; mails are not readable from here.
    x-permission: ORGA
    parameters:
      - name: ownerType
        in: query
        schema:
          $ref: ../schemas/mailboxes.yaml#/MailboxOwnerType
      - name: q
        in: query
        description: Substring of the email name or mailbox name (case-insensitive).
        schema:
          type: string
          maxLength: 100
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/mailboxes.yaml#/AdminMailboxPage
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

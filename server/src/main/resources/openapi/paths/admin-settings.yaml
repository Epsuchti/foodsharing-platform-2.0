# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/admin/feature-toggles:
  get:
    tags: [admin-settings]
    operationId: listFeatureToggles
    summary: All feature toggles.
    x-permission: ORGA
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/admin-settings.yaml#/FeatureToggleState'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/admin/feature-toggles/{key}:
  patch:
    tags: [admin-settings]
    operationId: updateFeatureToggle
    summary: Switch a feature on or off.
    x-permission: ORGA
    x-history: AdminAction.FEATURE_TOGGLE_CHANGED
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/admin-settings.yaml#/FeatureToggleUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-settings.yaml#/FeatureToggleState'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: FEATURE_TOGGLE_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


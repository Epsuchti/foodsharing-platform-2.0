/api/admin/email-blocklist/{entryId}:
  patch:
    tags: [admin-settings]
    operationId: updateEmailBlocklistEntry
    summary: Edit a blocklist entry.
    x-permission: ORGA
    x-history: AdminAction.BLOCKLIST_ENTRY_UPDATED
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/admin-settings.yaml#/EmailBlocklistUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-settings.yaml#/EmailBlocklistEntry'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BLOCKLIST_ENTRY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: BLOCKLIST_DUPLICATE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [admin-settings]
    operationId: deleteEmailBlocklistEntry
    summary: Remove a blocklist entry.
    x-permission: ORGA
    x-history: AdminAction.BLOCKLIST_ENTRY_REMOVED
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BLOCKLIST_ENTRY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


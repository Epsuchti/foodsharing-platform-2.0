/api/admin/configuration/{key}:
  put:
    tags: [admin-settings]
    operationId: updateConfiguration
    summary: Change a configuration value.
    x-permission: ORGA
    x-history: AdminAction.CONFIGURATION_CHANGED
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/admin-settings.yaml#/ConfigurationUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-settings.yaml#/ConfigurationEntry'
      "400":
        description: CONFIGURATION_VALUE_INVALID or VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: CONFIGURATION_KEY_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


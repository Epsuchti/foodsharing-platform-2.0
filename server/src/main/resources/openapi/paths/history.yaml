/api/history:
  get:
    tags: [history]
    operationId: listHistory
    summary: History entries. With subjectType+subjectId the subject's access rule decides; without a subject only ORGA.
    x-permission: HistoryAccessPolicy (subject rule) or ORGA
    parameters:
      - name: subjectType
        in: query
        schema:
          $ref: '../schemas/history.yaml#/HistorySubjectType'
      - name: subjectId
        in: query
        schema:
          type: string
          format: uuid
      - name: actorId
        in: query
        schema:
          type: string
          format: uuid
      - name: actions
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: History page
        content:
          application/json:
            schema:
              $ref: '../schemas/history.yaml#/HistoryEntryPage'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'HISTORY_SUBJECT_NOT_READABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/history/me:
  get:
    tags: [history]
    operationId: listMyActivity
    summary: Actions the current user performed or that concern them.
    x-permission: self
    parameters:
      - name: actions
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: History page
        content:
          application/json:
            schema:
              $ref: '../schemas/history.yaml#/HistoryEntryPage'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/history/actions:
  get:
    tags: [history]
    operationId: listHistoryActions
    summary: All known history actions (for filters), optionally for one subject type.
    x-permission: AUTHENTICATED
    parameters:
      - name: subjectType
        in: query
        schema:
          $ref: '../schemas/history.yaml#/HistorySubjectType'
    responses:
      '200':
        description: Actions
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/history.yaml#/HistoryActionInfo'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/history/export:
  get:
    tags: [history]
    operationId: exportHistoryCsv
    summary: CSV export of the filtered history (max 10000 rows).
    x-permission: ORGA
    parameters:
      - name: subjectType
        in: query
        schema:
          $ref: '../schemas/history.yaml#/HistorySubjectType'
      - name: subjectId
        in: query
        schema:
          type: string
          format: uuid
      - name: actorId
        in: query
        schema:
          type: string
          format: uuid
      - name: actions
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: CSV file
        content:
          text/csv:
            schema:
              type: string
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

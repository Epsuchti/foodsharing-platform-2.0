/api/jobs/{jobId}:
  get:
    tags: [jobs]
    operationId: getJob
    summary: 'Progress of a long-running job (owner only).'
    x-permission: 'job owner'
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/jobs.yaml#/JobProgress'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'JOB_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/jobs/{jobId}/result:
  get:
    tags: [jobs]
    operationId: downloadJobResult
    summary: 'Result file of a finished job (owner only).'
    x-permission: 'job owner'
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'JOB_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'JOB_RESULT_NOT_AVAILABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

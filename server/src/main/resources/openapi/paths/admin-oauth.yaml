# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/admin/oauth-clients:
  get:
    tags: [admin-oauth]
    operationId: listOAuthClients
    summary: All OAuth clients.
    x-permission: ORGA
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/admin-oauth.yaml#/OAuthClient'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  post:
    tags: [admin-oauth]
    operationId: createOAuthClient
    summary: Register an OAuth client.
    x-permission: ORGA
    x-history: OAuthAction.CLIENT_CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/admin-oauth.yaml#/OAuthClientCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-oauth.yaml#/OAuthClientCreated'
      "400":
        description: OAUTH_REDIRECT_URI_INVALID or VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: OAUTH_CLIENT_EXISTS
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/admin/oauth-clients/{clientId}:
  get:
    tags: [admin-oauth]
    operationId: getOAuthClient
    summary: An OAuth client.
    x-permission: ORGA
    parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-oauth.yaml#/OAuthClient'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: OAUTH_CLIENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  patch:
    tags: [admin-oauth]
    operationId: updateOAuthClient
    summary: Edit an OAuth client.
    description: >-
      The client kind is fixed at creation in one direction: confidential → public drops the secret, public →
      confidential is refused (400 VALIDATION_FAILED, args.field = confidential) because a PATCH never hands out a
      secret. To make a public client confidential, create a new confidential client.
    x-permission: ORGA
    x-history: OAuthAction.CLIENT_UPDATED
    parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/admin-oauth.yaml#/OAuthClientUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-oauth.yaml#/OAuthClient'
      "400":
        description: OAUTH_REDIRECT_URI_INVALID or VALIDATION_FAILED (also public → confidential, args.field = confidential)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: OAUTH_CLIENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [admin-oauth]
    operationId: deleteOAuthClient
    summary: Delete an OAuth client (revokes tokens).
    x-permission: ORGA
    x-history: OAuthAction.CLIENT_DELETED
    parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: OAUTH_CLIENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/admin/oauth-clients/{clientId}/secret:
  post:
    tags: [admin-oauth]
    operationId: rotateOAuthClientSecret
    summary: Generate a new client secret.
    x-permission: ORGA
    x-history: OAuthAction.SECRET_ROTATED
    parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin-oauth.yaml#/OAuthClientSecret'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: OAUTH_CLIENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: OAUTH_CLIENT_PUBLIC
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

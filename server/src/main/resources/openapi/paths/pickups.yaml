/api/stores/{storeId}/regular-pickups:
  get:
    tags: [pickups]
    operationId: getRegularPickups
    summary: 'Weekly pickup schedule.'
    x-permission: 'maySeePickups'
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/pickups.yaml#/RegularPickup'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  put:
    tags: [pickups]
    operationId: replaceRegularPickups
    summary: 'Replace the weekly schedule.'
    x-permission: 'mayEditPickups'
    x-history: StoreLogAction.UPDATE_REGULAR_PICKUP_SETTINGS
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/pickups.yaml#/RegularPickup'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/pickups.yaml#/RegularPickup'
      '400': {description: 'VALIDATION_FAILED, SLOT_COUNT_OUT_OF_RANGE or DUPLICATE_PICKUP_DAY_TIME', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups:
  get:
    tags: [pickups]
    operationId: listPickups
    summary: 'Pickups in a range (default now .. now + prefetch days, plus later sign-ups).'
    x-permission: 'maySeePickups'
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/pickups.yaml#/Pickup'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups/{pickupAt}:
  put:
    tags: [pickups]
    operationId: editPickup
    summary: 'Change slot count / description of one pickup (0 slots cancels it).'
    x-permission: 'mayEditPickups'
    x-history: StoreLogAction.UPDATE_SLOT_COUNT
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/pickups.yaml#/PickupEdit'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/pickups.yaml#/Pickup'
      '400': {description: 'VALIDATION_FAILED, PICKUP_IN_PAST, SLOT_COUNT_OUT_OF_RANGE or DESCRIPTION_TOO_LONG', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'MORE_OCCUPIED_SLOTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups/{pickupAt}/move:
  post:
    tags: [pickups]
    operationId: movePickup
    summary: 'Move one future pickup (one-time or one regular occurrence) to another future time of the same store (PU10). Sign-ups move along and keep their confirmation; everyone signed up except the mover gets PICKUP_MOVED; linked EinAbs move along (EA16).'
    x-permission: 'mayEditPickups'
    x-history: StoreLogAction.PICKUP_MOVED
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/pickups.yaml#/PickupMove'
    responses:
      '200':
        description: The pickup at its new time
        content:
          application/json:
            schema:
              $ref: '../schemas/pickups.yaml#/Pickup'
      '400': {description: 'VALIDATION_FAILED (same time, message too long) or PICKUP_IN_PAST (old or new time)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or PICKUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'PICKUP_TIME_TAKEN (the store already has a pickup at the new time)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups/{pickupAt}/eligibility:
  get:
    tags: [pickups]
    operationId: checkEligibility
    summary: 'Whether the current user may sign up, with all failing reasons.'
    x-permission: 'verified (else 404), and maySeePickups or any team relation (jumper, applicant, invited: reasons instead of 403)'
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/pickups.yaml#/PickupEligibility'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED (no relation to the store team)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND (also when not verified) or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups/{pickupAt}/signups:
  post:
    tags: [pickups]
    operationId: signUp
    summary: 'Sign up for a pickup.'
    x-permission: 'maySeePickups'
    x-history: StoreLogAction.SIGN_UP_SLOT
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    requestBody:
      required: false
      description: 'Linked-store pickups booked in the same step (decision 167 S3): every sign-up goes through the normal eligibility and rules of its store; all are stored or none.'
      content:
        application/json:
          schema:
            $ref: '../schemas/pickups.yaml#/SignupRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/pickups.yaml#/SignupResult'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '400': {description: 'VALIDATION_FAILED (more than 5 linked pickups, duplicates, or the pickup itself)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'PICKUP_NOT_ELIGIBLE (args.reason; AUTOMATION_RULE when an active store rule blocks it, args.rule = the first blocking rule); LINKED_PICKUP_REQUIRED when only a linked-store rule is missing its pickup (args.rule = index of the first such rule in getLinkedOptions); LINKED_PICKUP_FULL (args.storeId, args.pickupAt) when a chosen linked pickup has no free slot; LINKED_PICKUP_BLOCKED (args.storeId, args.pickupAt, args.reason, args.rule) when the eligibility or the rules of its store refuse a chosen linked pickup', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups/{pickupAt}/signups/{userId}:
  get:
    tags: [pickups]
    operationId: getPickupSignupDetail
    summary: 'Details of one sign-up for the slot dialog (PU3): sign-up time, state, counts at this store, upcoming slots here.'
    x-permission: 'mayConfirmPickups or mayEditPickups or signed up for the same pickup'
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/pickups.yaml#/PickupSignupDetail'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or SIGNUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [pickups]
    operationId: signOut
    summary: 'Sign out (self) or remove someone (mayEditPickups, optional message).'
    x-permission: 'self or mayEditPickups'
    x-history: StoreLogAction.SIGN_OUT_SLOT
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/stores.yaml#/OptionalMessage'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED or PICKUP_IN_PAST', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or SIGNUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickups/{pickupAt}/signups/{userId}/confirm:
  post:
    tags: [pickups]
    operationId: confirmSignup
    summary: 'Confirm a sign-up.'
    x-permission: 'mayConfirmPickups'
    x-history: StoreLogAction.SLOT_CONFIRMED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pickupAt
        in: path
        required: true
        schema:
          type: string
          format: date-time
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND, STORE_DELETED or SIGNUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'ALREADY_CONFIRMED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/stores/{storeId}/pickup-days/{date}/conversation:
  post:
    tags: [pickups]
    operationId: openPickupDayConversation
    summary: "Find or create the named group chat of a store's pickup day (PU3, M5); adds everyone signed up that day who is not a member yet, never removes anyone."
    x-permission: 'team member of the store or signed up that day'
    x-history: PickupAction.DAY_CONVERSATION_OPENED
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: path
        required: true
        description: "Calendar day in the store's time zone."
        schema:
          type: string
          format: date
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/pickups.yaml#/PickupDayConversationOpen'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/pickups.yaml#/PickupDayConversation'
      '400': {description: 'VALIDATION_FAILED or NO_SIGNUPS (nobody but the caller signed up that day and no chat exists yet)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'STORE_NOT_FOUND or STORE_DELETED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}


/api/public/petition:
  get:
    tags: [public-content]
    operationId: getPetition
    summary: Current petition banner.
    x-permission: public
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/Petition'
      "404":
        description: FEATURE_DISABLED (PETITION_BANNER off)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "503":
        description: PETITION_INACTIVE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


/api/public/content/learning:
  get:
    tags: [public-content]
    operationId: listLearningChapters
    summary: 'Learning chapters (onboarding step 3).'
    security: []
    x-permission: 'PUBLIC'
    parameters:
      - name: lang
        in: query
        schema:
          $ref: '../schemas/common.yaml#/Language'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/content.yaml#/LearningChapter'
      '429': {description: 'TOO_MANY_REQUESTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/public/content/learning/{key}:
  get:
    tags: [public-content]
    operationId: getLearningChapter
    summary: 'One learning chapter.'
    security: []
    x-permission: 'PUBLIC'
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          $ref: '../schemas/common.yaml#/Language'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPage'
      '404': {description: 'CONTENT_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/public/content/{slug}:
  get:
    tags: [public-content]
    operationId: getContentPage
    summary: 'A published content page (fallback requested language -> de -> any).'
    security: []
    x-permission: 'PUBLIC'
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          $ref: '../schemas/common.yaml#/Language'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/content.yaml#/ContentPage'
      '404': {description: 'CONTENT_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/events/{eventId}/invitation:
  put:
    tags:
      - events
    operationId: respondToEvent
    summary: Accept, maybe or decline.
    x-permission: may see the event; until ends_at + 24 h
    x-history: EventAction.RSVP_CHANGED
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/events.yaml#/EventRsvp
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/Event
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: EVENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "409":
        description: EVENT_RSVP_CLOSED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError


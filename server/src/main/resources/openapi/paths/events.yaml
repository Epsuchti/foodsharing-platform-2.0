# events (milestone 5, docs/plan-m5.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.
/api/regions/{regionId}/events:
  get:
    tags:
      - events
    operationId: listRegionEvents
    summary: Events of a region.
    x-permission: "region member (public events: authenticated)"
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: includePast
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/events.yaml#/EventSummary
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/events/mine:
  get:
    tags:
      - events
    operationId: listMyEvents
    summary: Events I am invited to or attend.
    x-permission: authenticated
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/events.yaml#/EventSummary
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/events/mine/ics:
  get:
    tags:
      - events
    operationId: getMyEventsIcs
    summary: My accepted/maybe events as iCalendar.
    x-permission: authenticated
    responses:
      "200":
        description: File
        content:
          text/calendar:
            schema:
              type: string
              format: binary
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/events:
  post:
    tags:
      - events
    operationId: createEvent
    summary: Create an event.
    x-permission: region member
    x-history: EventAction.CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/events.yaml#/EventCreate
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/Event
      "400":
        description: EVENT_DATES_INVALID, LOCATION_REQUIRED, ONLINE_LINK_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

/api/events/{eventId}:
  get:
    tags:
      - events
    operationId: getEvent
    summary: Event with participants and wall.
    x-permission: public event or region member
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/Event
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: EVENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  patch:
    tags:
      - events
    operationId: updateEvent
    summary: Change an event (EVENT_UPDATED bell to accepted/maybe).
    x-permission: ORGA, region admin, author
    x-history: EventAction.UPDATED
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/events.yaml#/EventUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/Event
      "400":
        description: EVENT_DATES_INVALID, LOCATION_REQUIRED, ONLINE_LINK_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: EVENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  delete:
    tags:
      - events
    operationId: deleteEvent
    summary: Delete an event.
    x-permission: ORGA, region admin, author
    x-history: EventAction.DELETED
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Done
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: EVENT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError


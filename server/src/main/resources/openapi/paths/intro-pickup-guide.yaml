      '409': {description: 'ONLY_BOOKED_APPOINTMENTS_COMPLETABLE or FUTURE_APPOINTMENT_NOT_COMPLETABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}


/api/guide/profile:
  get:
    tags: [intro-pickup-guide]
    operationId: getGuideProfile
    summary: 'Own guide profile.'
    x-permission: 'CAN_GIVE_INTRO_PICKUPS@region'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/GuideProfile'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  patch:
    tags: [intro-pickup-guide]
    operationId: updateGuideProfile
    summary: 'Change iCal link and phone.'
    x-permission: 'CAN_GIVE_INTRO_PICKUPS@region'
    x-history: IntroPickupAction.GUIDE_PROFILE_UPDATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/GuideProfileUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/GuideProfile'
      '400': {description: 'VALIDATION_FAILED, ICAL_LINK_NOT_ALLOWED or INVALID_PHONE_NUMBER', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/guide/regions:
  get:
    tags: [intro-pickup-guide]
    operationId: listGuideRegions
    summary: 'Regions where the user may give EinAbs.'
    x-permission: 'AUTHENTICATED'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/regions.yaml#/RegionRef'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/regions/{regionId}/guide/intro-pickups:
  get:
    tags: [intro-pickup-guide]
    operationId: listGuideIntroPickups
    summary: 'Own EinAbs in a region.'
    x-permission: 'CAN_GIVE_INTRO_PICKUPS@region'
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: past
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          format: int32
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/IntroPickupDetailPage'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  post:
    tags: [intro-pickup-guide]
    operationId: createIntroPickup
    summary: 'Create an EinAb.'
    x-permission: 'CAN_GIVE_INTRO_PICKUPS@region'
    x-history: IntroPickupAction.CREATED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/IntroPickupCreate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/IntroPickupDetail'
      '400': {description: 'VALIDATION_FAILED, LOCATION_REQUIRED, PUBLIC_LOCATION_REQUIRED, BUSINESS_NAME_REQUIRED, SLOT_COUNT_OUT_OF_RANGE, ONLINE_CALL_LINK_REQUIRED or INTRO_PICKUP_START_IN_PAST', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED or GUIDE_INACTIVE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/intro-pickups/{introPickupId}:
  get:
    tags: [intro-pickup-guide]
    operationId: getIntroPickup
    summary: 'EinAb with slots.'
    x-permission: 'guide of the EinAb or CAN_MANAGE_USERS@region'
    parameters:
      - name: introPickupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/IntroPickupDetail'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'INTRO_PICKUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  patch:
    tags: [intro-pickup-guide]
    operationId: updateIntroPickup
    summary: 'Edit an own EinAb.'
    x-permission: 'guide of the EinAb'
    x-history: IntroPickupAction.UPDATED
    parameters:
      - name: introPickupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/IntroPickupUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/IntroPickupDetail'
      '400': {description: 'VALIDATION_FAILED, LOCATION_REQUIRED, PUBLIC_LOCATION_REQUIRED, BUSINESS_NAME_REQUIRED, SLOT_COUNT_OUT_OF_RANGE or ONLINE_CALL_LINK_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ONLY_OWN_INTRO_PICKUPS_MANAGEABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'INTRO_PICKUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'PAST_INTRO_PICKUP_NOT_EDITABLE or SLOT_COUNT_REDUCTION_NOT_SUPPORTED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [intro-pickup-guide]
    operationId: deleteIntroPickup
    summary: 'Delete an own EinAb.'
    x-permission: 'guide of the EinAb'
    x-history: IntroPickupAction.DELETED
    parameters:
      - name: introPickupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ONLY_OWN_INTRO_PICKUPS_MANAGEABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'INTRO_PICKUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'PAST_INTRO_PICKUP_NOT_DELETABLE or BOOKED_SLOTS_PREVENT_DELETE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/intro-pickups/{introPickupId}/guide:
  put:
    tags: [intro-pickup-guide]
    operationId: assignGuide
    summary: 'Hand an own future EinAb to another active guide of the region.'
    x-permission: 'guide of the EinAb'
    x-history: IntroPickupAction.GUIDE_ASSIGNED
    parameters:
      - name: introPickupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/AssignGuideRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/IntroPickupDetail'
      '400': {description: 'VALIDATION_FAILED or ASSIGNABLE_GUIDE_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ONLY_OWN_INTRO_PICKUPS_MANAGEABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'INTRO_PICKUP_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'PAST_INTRO_PICKUP_NOT_REASSIGNABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}


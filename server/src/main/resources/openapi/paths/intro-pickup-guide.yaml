/api/intro-pickups/slots/{slotId}/book-for:
  post:
    tags: [intro-pickup-guide]
    operationId: bookSlotForUser
    summary: 'Book a slot on behalf of a newcomer (same rules as bookSlot).'
    x-permission: 'guide of the EinAb'
    x-history: IntroPickupAction.SLOT_BOOKED_BY_GUIDE
    parameters:
      - name: slotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/intro-pickups.yaml#/BookForUserRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/intro-pickups.yaml#/GuideBooking'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'SLOT_NOT_FOUND or USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'NOT_REGION_MEMBER, SLOT_NOT_AVAILABLE, USER_ALREADY_BOOKED_IN_INTRO_PICKUP, USER_ALREADY_BOOKED_WITH_GUIDE, USER_ALREADY_BOOKED_IN_CATEGORY, USER_BOOKING_LIMIT_REACHED, FAIRTEILER_VISIT_REQUIRED_FOR_THIRD_INTRO_PICKUP or MINIMUM_PICKUP_COUNT_NOT_REACHED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/intro-pickups/slots/{slotId}/booking/by-guide:
  delete:
    tags: [intro-pickup-guide]
    operationId: cancelBookingAsGuide
    summary: 'Cancel a booking as guide (future: slot free again; past: CANCELLED).'
    x-permission: 'guide of the EinAb'
    x-history: IntroPickupAction.BOOKING_CANCELLED_BY_GUIDE
    parameters:
      - name: slotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/OptionalReasonBody'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'SLOT_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'ONLY_BOOKED_APPOINTMENTS_CANCELLABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}


/api/admin/jobs:
  get:
    tags: [admin-jobs]
    operationId: listAdminJobs
    summary: 'Scheduled jobs with their last run.'
    x-permission: 'ORGA'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/admin.yaml#/JobInfo'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/admin/jobs/{name}/run:
  post:
    tags: [admin-jobs]
    operationId: runAdminJob
    summary: 'Run a job now (bypasses the lock).'
    x-permission: 'ORGA'
    x-history: AdminAction.JOB_RUN_MANUAL
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/JobRun'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'JOB_UNKNOWN', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/admin/jobs/{name}/runs:
  get:
    tags: [admin-jobs]
    operationId: listAdminJobRuns
    summary: 'Run history of a job, newest first (job_run keeps failures, manual runs and runs of most jobs).'
    x-permission: 'ORGA'
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/JobRunPage'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCESS_DENIED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'JOB_UNKNOWN', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

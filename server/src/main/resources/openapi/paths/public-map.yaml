/api/public/map/bubbles/{kind}/{id}:
  get:
    tags: [public-map]
    operationId: getPublicMapBubble
    summary: 'Popup content (FSP, REGION, BASKET).'
    x-permission: public
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/map.yaml#/MapBubble'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: MARKER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

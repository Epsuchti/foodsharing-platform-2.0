# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/public/map/markers/food-share-points:
  get:
    tags: [public-map]
    operationId: listPublicFspMarkers
    summary: Active food share points.
    x-permission: public
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/common.yaml#/MapMarker'
      "404":
        description: FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/public/map/markers/regions:
  get:
    tags: [public-map]
    operationId: listPublicRegionMarkers
    summary: Regions with a pin or coordinates.
    x-permission: public
    responses:

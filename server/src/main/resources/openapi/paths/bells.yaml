/api/bells:
  get:
    tags: [bells]
    operationId: listBells
    summary: 'My bells, newest first.'
    x-permission: 'authenticated'
    parameters:
      - name: unreadOnly
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          format: int32
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/notifications.yaml#/BellPage'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [bells]
    operationId: deleteBells
    summary: 'Delete my bells (readOnly=true: only the read ones).'
    x-permission: 'authenticated'
    x-history: NotificationAction.BELL_DELETED
    parameters:
      - name: readOnly
        in: query
        schema:
          type: boolean
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/bells/unread-count:
  get:
    tags: [bells]
    operationId: countUnreadBells
    summary: 'Number of my unread bells (polled every notifications.poll-seconds).'
    x-permission: 'authenticated'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/notifications.yaml#/BellCount'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/bells/read:
  post:
    tags: [bells]
    operationId: markBellsRead
    summary: 'Mark some of my bells read (unknown or foreign ids are ignored).'
    x-permission: 'authenticated'
    x-history: NotificationAction.BELL_READ
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/notifications.yaml#/BellIds'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/bells/read-all:
  post:
    tags: [bells]
    operationId: markAllBellsRead
    summary: 'Mark all my bells read.'
    x-permission: 'authenticated'
    x-history: NotificationAction.BELL_READ
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/bells/{bellId}:
  delete:
    tags: [bells]
    operationId: deleteBell
    summary: 'Delete one of my bells.'
    x-permission: 'own bell'
    x-history: NotificationAction.BELL_DELETED
    parameters:
      - name: bellId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Done
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'BELL_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/users/me/notification-settings:
  get:
    tags: [bells]
    operationId: getNotificationSettings
    summary: 'My channel settings per notification category.'
    x-permission: 'authenticated'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/notifications.yaml#/NotificationSettings'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  put:
    tags: [bells]
    operationId: updateNotificationSettings
    summary: 'Replace my channel settings (SYSTEM cannot be switched off: 400 VALIDATION_FAILED).'
    x-permission: 'authenticated'
    x-history: NotificationAction.SETTINGS_CHANGED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/notifications.yaml#/NotificationSettingsUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/notifications.yaml#/NotificationSettings'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

# Only served in the local and e2e profiles (DevController is @Profile({"local","e2e"})).
/api/dev/users:
  get:
    tags: [dev]
    operationId: listDevUsers
    summary: Seed users for the dev user switcher, ordered by journey stage.
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    responses:
      '200':
        description: Seed users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dev.yaml#/DevUser'
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/login-as:
  post:
    tags: [dev]
    operationId: loginAsDevUser
    summary: Log in as a seed user (sets the session cookie).
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    x-history: AuthAction.LOGIN
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dev.yaml#/DevLoginRequest'
    responses:
      '200':
        description: Logged in
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/SessionInfo'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'DEV_USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/seed/reset:
  post:
    tags: [dev]
    operationId: resetSeed
    summary: Drop the H2 database and re-run Liquibase incl. seed data.
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    x-history: NONE
    responses:
      '204':
        description: Reset done
      '409': {description: 'Not an H2 database', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/mails:
  get:
    tags: [dev]
    operationId: listCapturedMails
    summary: Mails captured by the capturing mail transport, newest first.
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    parameters:
      - name: to
        in: query
        schema:
          type: string
    responses:
      '200':
        description: Captured mails
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dev.yaml#/CapturedMail'
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [dev]
    operationId: clearCapturedMails
    summary: Forget all captured mails.
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    x-history: NONE
    responses:
      '204':
        description: Cleared
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/users/{userId}/role:
  put:
    tags: [dev]
    operationId: setDevUserRole
    summary: Change a user's global role (for session refresh tests).
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    x-history: UserAction.ROLE_CHANGED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dev.yaml#/DevRoleRequest'
    responses:
      '200':
        description: Updated user
        content:
          application/json:
            schema:
              $ref: '../schemas/dev.yaml#/DevUser'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'DEV_USER_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/clock:
  put:
    tags: [dev]
    operationId: setDevClock
    summary: Fix the server clock (or release it).
    security: []
    x-dev-only: true
    x-permission: DEV_PROFILE
    x-history: NONE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dev.yaml#/DevClockRequest'
    responses:
      '200':
        description: Clock state
        content:
          application/json:
            schema:
              $ref: '../schemas/dev.yaml#/DevClockState'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/notifications:
  get:
    tags: [dev]
    operationId: listDevNotifications
    summary: 'Persisted notifications (bells and notification mails) for tests, newest first.'
    security: []
    x-dev-only: true
    x-permission: 'DEV_PROFILE'
    parameters:
      - name: userId
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          type: string
      - name: channel
        in: query
        schema:
          $ref: '../schemas/dev.yaml#/DevNotificationChannel'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dev.yaml#/DevNotification'
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [dev]
    operationId: clearDevNotifications
    summary: 'Forget captured push and Telegram messages (bells and mails stay in the database).'
    security: []
    x-dev-only: true
    x-permission: 'DEV_PROFILE'
    x-history: NONE
    responses:
      '204':
        description: Done
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/telegram/incoming:
  post:
    tags: [dev]
    operationId: simulateTelegramUpdate
    summary: 'Process a simulated incoming Telegram message (e.g. /start <token>).'
    security: []
    x-dev-only: true
    x-permission: 'DEV_PROFILE'
    x-history: NONE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dev.yaml#/DevTelegramUpdate'
    responses:
      '204':
        description: Done
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/jobs/{name}/run:
  post:
    tags: [dev]
    operationId: runDevJob
    summary: 'Run a scheduled job now (e.g. region-maintenance).'
    security: []
    x-dev-only: true
    x-permission: 'DEV_PROFILE'
    x-history: NONE
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Done
      '404': {description: 'DEV_JOB_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/integrations/{integration}/fail:
  post:
    tags: [dev]
    operationId: simulateIntegrationFailure
    summary: 'Open the integration breaker as if an outage had been detected (publishes IntegrationDownEvent once).'
    security: []
    x-dev-only: true
    x-permission: 'DEV_PROFILE'
    x-history: NONE
    parameters:
      - name: integration
        in: path
        required: true
        schema:
          $ref: '../schemas/admin.yaml#/Integration'
    responses:
      '204':
        description: Done
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/dev/fixtures/ical:
  get:
    tags: [dev]
    operationId: getDevIcalFixture
    summary: 'Static iCal fixture for the guide iCal import tests.'
    security: []
    x-dev-only: true
    x-permission: 'DEV_PROFILE'
    responses:
      '200':
        description: OK
        content:
          text/calendar:
            schema:
              type: string
      '404': {description: 'Not available outside local/e2e', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

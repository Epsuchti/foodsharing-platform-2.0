# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/activity:
  get:
    tags: [activity]
    operationId: getActivityFeed
    summary: 'Activity feed (filtered by the user''s excluded types).'
    x-permission: authenticated
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/activity.yaml#/ActivityPage'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

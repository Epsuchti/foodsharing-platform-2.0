# forum (milestone 5, docs/plan-m5.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.
/api/regions/{regionId}/forum/threads:
  get:
    tags:
      - forum
    operationId: listForumThreads
    summary: "Threads: sticky first, then latest post."
    x-permission: mayAccessForum
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ambassadorForum
        in: query
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/forum.yaml#/ForumThreadPage
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: FORUM_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  post:
    tags:
      - forum
    operationId: createForumThread
    summary: Start a thread.
    x-permission: mayAccessForum (verified); inactive unless mayStartUnmoderatedThread
    x-history: ForumAction.THREAD_CREATED
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ambassadorForum
        in: query
        schema:
          type: boolean
          default: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/forum.yaml#/ForumThreadCreate
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/forum.yaml#/ForumThread
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: FORUM_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError


/api/forum/threads/{threadId}:
  get:
    tags:
      - forum
    operationId: getForumThread
    summary: Thread with posts and permissions.
    x-permission: mayAccessForum
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/forum.yaml#/ForumThread
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: FORUM_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: THREAD_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  patch:
    tags:
      - forum
    operationId: updateForumThread
    summary: Rename, close/open, sticky, activate.
    x-permission: "per field: rename = moderator or creator; status/sticky/active = moderator"
    x-history: ForumAction.THREAD_RENAMED
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/forum.yaml#/ForumThreadUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/forum.yaml#/ForumThread
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED, FORUM_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: THREAD_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
  delete:
    tags:
      - forum
    operationId: deleteForumThread
    summary: Delete a thread.
    x-permission: moderator (inactive thread) or ORGA
    x-history: ForumAction.THREAD_DELETED
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Done
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: THREAD_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError


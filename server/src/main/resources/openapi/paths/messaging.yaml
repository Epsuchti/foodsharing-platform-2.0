        application/json:
          schema:
            $ref: ../schemas/messaging.yaml#/RegionConversationUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/messaging.yaml#/RegionConversation
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError

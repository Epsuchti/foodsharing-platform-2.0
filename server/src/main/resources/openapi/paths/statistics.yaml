/api/regions/{regionId}/statistics/pickups:
  get:
    tags: [statistics]
    operationId: getRegionPickupStatistics
    summary: 'Region statistics: pickups.'
    x-permission: region member
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: months
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 36
          default: 12
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/statistics.yaml#/MonthlyPickups'
      "400":

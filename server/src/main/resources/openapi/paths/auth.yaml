/api/auth/session:
  get:
    tags: [auth]
    operationId: getSession
    summary: The only session bootstrap. Returns authenticated=false when there is no valid session cookie.
    security: []
    x-permission: PUBLIC
    responses:
      '200':
        description: Current session
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/SessionInfo'
      '429': {description: 'Too many requests', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/logout:
  post:
    tags: [auth]
    operationId: logout
    summary: Revoke the current session and clear the cookie (also fine without a session).
    security: []
    x-permission: PUBLIC
    x-history: AuthAction.LOGOUT
    responses:
      '204':
        description: Logged out
      '403': {description: 'CSRF token missing', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/magic-link:
  post:
    tags: [auth]
    operationId: requestMagicLink
    summary: Send a login / sign-up link by email. Always 202 so account existence is not leaked.
    security: []
    x-permission: PUBLIC
    x-history: AuthAction.MAGIC_LINK_REQUESTED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/MagicLinkRequest'
    responses:
      '202':
        description: Link sent (if allowed)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/MessageResponse'
      '400': {description: 'VALIDATION_FAILED, EMAIL_DOMAIN_BLOCKED or INVALID_RETURN_URL', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'IP_BLOCKED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '429': {description: 'TOO_MANY_LOGIN_REQUESTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '501': {description: 'NOT_IMPLEMENTED (until T4)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/magic-link/verify:
  post:
    tags: [auth]
    operationId: verifyMagicLink
    summary: Exchange a magic-link token for a session cookie (creates the account on first use).
    security: []
    x-permission: PUBLIC
    x-history: AuthAction.LOGIN
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/MagicLinkVerifyRequest'
    responses:
      '200':
        description: Logged in
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/SessionInfo'
      '400': {description: 'INVALID_LOGIN_TOKEN or LOGIN_TOKEN_EXPIRED_OR_USED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '403': {description: 'ACCOUNT_DISABLED, EMAIL_DOMAIN_BLOCKED or IP_BLOCKED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '501': {description: 'NOT_IMPLEMENTED (until T4)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/methods:
  get:
    tags: [auth]
    operationId: listAuthMethods
    summary: Linked login identities and passkeys of the current user.
    x-permission: self
    responses:
      '200':
        description: Login methods
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthMethods'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '501': {description: 'NOT_IMPLEMENTED (until T4)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/methods/{identityId}:
  delete:
    tags: [auth]
    operationId: unlinkAuthMethod
    summary: Unlink a login identity (never the last login method).
    x-permission: self
    x-history: AuthAction.METHOD_REMOVED
    parameters:
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Unlinked
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'RESOURCE_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'LAST_LOGIN_METHOD_CANNOT_BE_REMOVED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '501': {description: 'NOT_IMPLEMENTED (until T4)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/passkeys/{passkeyId}:
  patch:
    tags: [auth]
    operationId: renamePasskey
    summary: Rename one of the current user's passkeys.
    x-permission: self
    x-history: AuthAction.PASSKEY_RENAMED
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/PasskeyRenameRequest'
    responses:
      '200':
        description: Renamed
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/PasskeyView'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'PASSKEY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '501': {description: 'NOT_IMPLEMENTED (until T4)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
  delete:
    tags: [auth]
    operationId: deletePasskey
    summary: Delete one of the current user's passkeys (never the last login method).
    x-permission: self
    x-history: AuthAction.PASSKEY_DELETED
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Deleted
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'PASSKEY_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '409': {description: 'LAST_LOGIN_METHOD_CANNOT_BE_REMOVED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '501': {description: 'NOT_IMPLEMENTED (until T4)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/sessions:
  get:
    tags: [auth]
    operationId: listSessions
    summary: Active (not revoked, not expired) sessions of the current user, newest activity first.
    x-permission: self
    responses:
      '200':
        description: Sessions
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/auth.yaml#/SessionView'
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/sessions/{sessionId}:
  delete:
    tags: [auth]
    operationId: revokeSession
    summary: Revoke one of the current user's sessions (revoking the current one logs out).
    x-permission: self
    x-history: AuthAction.SESSION_REVOKED
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Revoked
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '404': {description: 'SESSION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/sessions/revoke-others:
  post:
    tags: [auth]
    operationId: logoutEverywhere
    summary: Revoke all sessions of the current user except the current one.
    x-permission: self
    x-history: AuthAction.SESSIONS_REVOKED_ALL
    responses:
      '204':
        description: Other sessions revoked
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/auth/security-log:
  get:
    tags: [auth]
    operationId: getSecurityLog
    summary: Login and security history of the current user (logins, method changes, revocations).
    x-permission: self
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: Security log page
        content:
          application/json:
            schema:
              $ref: '../schemas/history.yaml#/HistoryEntryPage'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '401': {description: 'AUTHENTICATION_REQUIRED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/public/regions/suggest:
  get:
    tags: [public-regions]
    operationId: suggestRegions
    summary: 'Regions for a postcode or position (postcode table first, then nearest active region within 50 km).'
    security: []
    x-permission: 'PUBLIC'
    parameters:
      - name: postcode
        in: query
        schema:
          type: string
      - name: lat
        in: query
        schema:
          type: number
          format: double
      - name: lon
        in: query
        schema:
          type: number
          format: double
      - name: country
        in: query
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/public-regions.yaml#/RegionSuggestion'
      '400': {description: 'VALIDATION_FAILED', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '429': {description: 'TOO_MANY_REQUESTS', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '503': {description: 'GEOCODING_UNAVAILABLE', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/public/regions/tree:
  get:
    tags: [public-regions]
    operationId: getPublicRegionTree
    summary: 'Region tree (regions with ambassadors are active).'
    security: []
    x-permission: 'PUBLIC'
    parameters:
      - name: rootSlug
        in: query
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/public-regions.yaml#/PublicRegionNode'
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '429': {description: 'TOO_MANY_REQUESTS (per-IP limit of /api/public/**)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/public/regions/{slug}:
  get:
    tags: [public-regions]
    operationId: getPublicRegion
    summary: 'Public region page (logged out).'
    security: []
    x-permission: 'PUBLIC'
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/public-regions.yaml#/PublicRegion'
      '404': {description: 'REGION_NOT_FOUND', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}
      '429': {description: 'TOO_MANY_REQUESTS (per-IP limit of /api/public/**)', content: {application/json: {schema: {$ref: '../schemas/common.yaml#/ApiError'}}}}

/api/baskets:
  post:
    tags: [baskets]
    operationId: createBasket
    summary: Offer a food basket.
    x-permission: authenticated
    x-history: BasketAction.CREATED
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/baskets.yaml#/BasketCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/baskets.yaml#/Basket'
      "400":
        description: BASKET_LOCATION_REQUIRED or BASKET_CONTACT_REQUIRED or VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/baskets/{basketId}:
  get:
    tags: [baskets]
    operationId: getBasket
    summary: Basket detail.
    x-permission: authenticated
    parameters:
      - name: basketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/baskets.yaml#/Basket'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BASKET_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  patch:
    tags: [baskets]
    operationId: updateBasket
    summary: Edit a basket.
    x-permission: owner
    x-history: BasketAction.UPDATED
    parameters:
      - name: basketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/baskets.yaml#/BasketUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/baskets.yaml#/Basket'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BASKET_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [baskets]
    operationId: deleteBasket
    summary: Delete a basket.
    x-permission: owner or ORGA
    x-history: BasketAction.DELETED
    parameters:
      - name: basketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BASKET_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/baskets/{basketId}/requests:
  post:
    tags: [baskets]
    operationId: requestBasket
    summary: Request a basket.
    x-permission: 'authenticated, not owner'
    x-history: BasketAction.REQUESTED
    parameters:
      - name: basketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/baskets.yaml#/BasketRequestCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/baskets.yaml#/BasketRequest'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "429":
        description: BASKET_REQUEST_RATE_LIMITED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BASKET_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: BASKET_OWN or BASKET_ALREADY_REQUESTED or BASKET_NOT_ACTIVE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [baskets]
    operationId: withdrawBasketRequest
    summary: Withdraw the own request.
    x-permission: requester
    x-history: BasketAction.REQUEST_WITHDRAWN
    parameters:
      - name: basketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BASKET_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/baskets/{basketId}/requests/{requesterId}:
  patch:
    tags: [baskets]
    operationId: answerBasketRequest
    summary: Answer a request.
    x-permission: owner
    x-history: BasketAction.REQUEST_STATUS_CHANGED
    parameters:
      - name: basketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requesterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/baskets.yaml#/BasketRequestAnswer'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/baskets.yaml#/BasketRequest'
      "400":
        description: VALIDATION_FAILED
        content:

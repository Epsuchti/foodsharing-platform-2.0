      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: BASKET_NOT_FOUND or FEATURE_DISABLED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


# milestone 6 (docs/plan-m6.md B1). Operations without an implementation answer 501 NOT_IMPLEMENTED.

/api/regions/{regionId}/reports:
  get:
    tags: [reports]
    operationId: listRegionReports
    summary: Reports of a region.
    x-permission: report handlers of the region
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '../schemas/reports.yaml#/ReportStatus'
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/ReportPage'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: REPORTS_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REGION_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/reports:
  get:
    tags: [reports]
    operationId: listUserReports
    summary: Reports about a user.
    x-permission: 'ORGA or report handler of one of the user''s regions'
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/reports.yaml#/ReportSummary'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: REPORTS_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  post:
    tags: [reports]
    operationId: createReport
    summary: Report a user.
    x-permission: 'verified, shares a region with the report button'
    x-history: ReportAction.CREATED
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/reports.yaml#/ReportCreate'
    responses:
      "201":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/Report'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: REPORT_BUTTON_DISABLED or ACCESS_DENIED (reporter not verified)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "409":
        description: REPORT_SELF
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/users/{userId}/report-options:
  get:
    tags: [reports]
    operationId: getReportOptions
    summary: 'Reason options of the region a report about this user would go to (the store''s region when storeId is given, else the user''s home region), and whether the actor may file it.'
    description: 'The reporter need not be a member of that region. buttonEnabled follows the same rule as createReport; denialCode says why it is false.'
    x-permission: signed in
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storeId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/ReportOptions'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: USER_NOT_FOUND or STORE_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'

/api/reports/{reportId}:
  get:
    tags: [reports]
    operationId: getReport
    summary: Report detail.
    x-permission: report handlers
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/Report'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: REPORTS_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REPORT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  patch:
    tags: [reports]
    operationId: updateReport
    summary: 'Change status, consequence, reminder or linked thread.'
    x-permission: report handlers
    x-history: ReportAction.STATUS_CHANGED
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/reports.yaml#/ReportUpdate'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/Report'
      "400":
        description: VALIDATION_FAILED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: REPORTS_NOT_ACCESSIBLE
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REPORT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
  delete:
    tags: [reports]
    operationId: deleteReport
    summary: Delete a report.
    x-permission: ORGA
    x-history: ReportAction.DELETED
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        description: AUTHENTICATION_REQUIRED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "403":
        description: ACCESS_DENIED
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'
      "404":
        description: REPORT_NOT_FOUND
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiError'


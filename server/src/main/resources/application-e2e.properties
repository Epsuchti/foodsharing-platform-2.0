spring.application.name=foodsharing-platform-e2e
# Same as local, but an in-memory database (reset per test file via /api/dev/seed/reset), a fixed clock and
# captured mails. The packaged jar is started by e2e/global-setup.ts.

# --- common ---
server.port=${E2E_PORT:8081}
spring.datasource.url=jdbc:h2:mem:e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.liquibase.contexts=schema,seed
app.base-url=http://localhost:${E2E_PORT:8081}
app.clock.fixed=2026-11-02T09:00:00Z
management.endpoint.health.show-details=always

# --- auth ---
spring.security.oauth2.client.registration.google.client-id=dev-client
spring.security.oauth2.client.registration.google.client-secret=dev-secret
spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:${E2E_PORT:8081}/dev/oidc/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost:${E2E_PORT:8081}/dev/oidc/token
spring.security.oauth2.client.provider.google.jwk-set-uri=http://localhost:${E2E_PORT:8081}/dev/oidc/jwks
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost:${E2E_PORT:8081}/dev/oidc/userinfo
app.auth.google.issuer=http://localhost:${E2E_PORT:8081}/dev/oidc
app.auth.passkeys.rp-id=localhost

# --- notification (mail) ---
app.mail.from=noreply@localhost
app.mail.transport=capture

# --- dev ---
app.dev.enabled=true

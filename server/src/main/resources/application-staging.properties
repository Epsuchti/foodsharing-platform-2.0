# Public test environment (https://test.foodsharing.site, decision 173). Always activated on top of prod:
#   SPRING_PROFILES_ACTIVE=prod,staging
# (not a profile group: group members load after the group and prod's spring.liquibase.contexts=schema would win).
# Everything else is inherited from prod; StagingProfileGuard refuses to start with another combination.

# --- common ---
# Seed data like local (fixed ids, docs/seed-ids.md); SeedDateShiftRunner keeps it current, UploadSeedFiles writes
# the seeded files.
spring.liquibase.contexts=schema,seed
# Red "test site" banner in the client shell; X-Robots-Tag noindex (StagingNoIndexFilter).
app.demo-banner=true

# --- persona panel (the dev user switcher behind a password; blank = off) ---
app.staging.persona-panel.password=${PERSONA_PANEL_PASSWORD:}
app.staging.persona-panel.max-failures-per-ip=10
app.staging.persona-panel.failure-window=15m

# --- notification (mail): only to real testers (MailRecipientPolicy) ---
app.mail.recipient-policy=staging
app.mail.allowed-recipients=${MAIL_ALLOWED_RECIPIENTS:}

# --- M4: Telegram is logged, never sent (the seed has fake chat ids) ---
app.telegram.mode=log

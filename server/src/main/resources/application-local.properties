spring.application.name=foodsharing-platform-local
# Real credentials for local runs live in server/local-secrets.properties (gitignored, see local-secrets.example.properties).
spring.config.import=optional:file:./local-secrets.properties

# --- common ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.liquibase.contexts=schema,seed
app.base-url=http://localhost:4200
management.endpoint.health.show-details=always

# --- auth ---
# Fake OIDC provider embedded in the app (dev module, decision #2); explicit endpoints, no discovery.
spring.security.oauth2.client.registration.google.client-id=dev-client
spring.security.oauth2.client.registration.google.client-secret=dev-secret
spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:${server.port:8080}/dev/oidc/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost:${server.port:8080}/dev/oidc/token
spring.security.oauth2.client.provider.google.jwk-set-uri=http://localhost:${server.port:8080}/dev/oidc/jwks
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost:${server.port:8080}/dev/oidc/userinfo
app.auth.google.issuer=http://localhost:${server.port:8080}/dev/oidc
app.auth.passkeys.rp-id=localhost
# ng serve (proxy) and the packaged jar
app.auth.passkeys.allowed-origins=http://localhost:4200,http://localhost:${server.port:8080}

# --- notification (mail) ---
# Mailpit (server/start_smtp_server.sh): SMTP :2525, UI http://localhost:8025
app.mail.from=noreply@localhost
app.mail.transport=smtp
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- dev ---
app.dev.enabled=true

management.health.mail.enabled=false

# --- M2 ---
# Offline geocoding from db/seed/region/geocoding.csv; the guide iCal import may read the local dev fixture.
app.geocoding.provider=static
app.intropickup.ical-allowed-hosts=foodsharing.network,foodsharing.de,localhost
# EA16: the dev iCal fixture (/api/dev/fixtures/ical) is served by the app itself over http.
app.intropickup.ical-allow-own-base-url=true


# Monitoring add-on (D19.3, docs/monitoring.md): Prometheus (scrapes app:9090), Alertmanager (mail to the IT team)
# and Grafana with the provisioned dashboard. All UIs bound to 127.0.0.1 (SSH tunnel), never public.
#   docker compose -f compose.yaml -f compose.monitoring.yaml up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # SMTP token of the alerts sender, created on the host (chmod 600), never committed
      - ./monitoring/smtp_password:/etc/alertmanager/smtp_password:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/foodsharing.json:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]

volumes:
  prometheus:
  grafana:

# Prometheus for the foodsharing platform (D19.3, docs/monitoring.md). Started by compose.monitoring.yaml on the
# compose network "backend"; scrapes the management port of the app (never published publicly).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: foodsharing
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:9090"]
        labels:
          instance: production

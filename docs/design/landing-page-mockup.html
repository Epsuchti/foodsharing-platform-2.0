<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Page – drei Varianten – Mockup</title>
<style>
/* ---- app tokens: copied from client/src/styles.scss (light / .fs-dark) ---- */
:root {
  --fs-bg:#f6f8f4; --fs-surface:#fff; --fs-surface-muted:#f3f6f1; --fs-border:#e1e8dd; --fs-border-strong:#c7d4c2;
  --fs-text:#1a2a20; --fs-text-muted:#5c6b60; --fs-primary:#25834a; --fs-on-primary:#fff; --fs-primary-strong:#195d35;
  --fs-primary-soft:#e3f3e7; --fs-primary-200:#b4e7c2; --fs-accent:#f2b84b; --fs-danger:#b53c35; --fs-danger-soft:#fdf1ef; --fs-danger-border:#f2c9c4;
  --fs-radius-sm:.625rem; --fs-radius-md:.875rem; --fs-radius-lg:1.125rem; --fs-radius-xl:1.5rem;
  --fs-shadow-sm:0 1px 2px rgb(26 42 32/.05),0 2px 8px rgb(26 42 32/.04); --fs-shadow-md:0 6px 20px rgb(26 42 32/.08); --fs-shadow-lg:0 18px 44px rgb(26 42 32/.12);
  --fs-header-bg:rgb(255 255 255/.86); --fs-header-border:rgb(199 212 194/.7); --fs-header-h:4rem;
  --fs-font:'Inter Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  /* public tokens of the public-site round: only the stylised map */
  --fs-pub-map-land:#eef1e8; --fs-pub-map-water:#c6dfe4; --fs-pub-map-park:#d8e8cf; --fs-pub-map-line:#d5dccf;
  color-scheme:light;
}
:root.fs-dark {
  --fs-bg:#111611; --fs-surface:#1a201a; --fs-surface-muted:#212821; --fs-border:#2c352b; --fs-border-strong:#3d473b;
  --fs-text:#ecf2ea; --fs-text-muted:#a3b09f; --fs-primary:#4cba70; --fs-on-primary:#0d1f13; --fs-primary-strong:#82d59b;
  --fs-primary-soft:rgb(76 186 112/.14); --fs-primary-200:#1f4a2f; --fs-accent:#9c7a3c; --fs-danger:#f08a80; --fs-danger-soft:rgb(240 138 128/.1); --fs-danger-border:rgb(240 138 128/.3);
  --fs-shadow-sm:0 1px 2px rgb(0 0 0/.3); --fs-shadow-md:0 6px 20px rgb(0 0 0/.35); --fs-shadow-lg:0 18px 44px rgb(0 0 0/.45);
  --fs-header-bg:rgb(17 22 17/.82); --fs-header-border:rgb(61 71 59/.7);
  --fs-pub-map-land:#1d241c; --fs-pub-map-water:#1d3a42; --fs-pub-map-park:#24351f; --fs-pub-map-line:#2f3a2d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#2a3034;color:var(--fs-text);font-family:var(--fs-font);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--fs-primary) 45%,transparent);outline-offset:2px}
.vh{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
.ico{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
.muted{color:var(--fs-text-muted)}
.ill{width:7rem;height:5.5rem;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- mockup controls (not part of the design) ---- */
.bar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;padding:.5rem .75rem;background:#20262a;color:#f2f2f2;font-size:.78rem;line-height:1.2}
.bar b{font-weight:700;opacity:.65;margin-right:.3rem}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.seg button{border:0;background:#363d42;color:#f2f2f2;padding:.3rem .55rem;border-radius:.35rem}
.seg button[aria-pressed=true]{background:#fff;color:#1a1a1a;font-weight:700}
.vp{container:vp/inline-size;margin:0 auto;width:100%;background:var(--fs-bg);min-height:90vh;position:relative;--gut:clamp(1rem,.6rem + 2cqi,2rem)}
.w-412 .vp{max-width:412px;box-shadow:0 0 0 1px var(--fs-border-strong)}
.wrap{max-width:74rem;margin-inline:auto;padding-inline:var(--gut)}
.mock-note{display:flex;gap:.5rem;padding:.5rem var(--gut);background:var(--fs-surface-muted);color:var(--fs-text-muted);font-size:.82rem;border-bottom:1px solid var(--fs-border)}
.opt-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .5rem;border:1px dashed var(--fs-border-strong);border-radius:999px;color:var(--fs-text-muted);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;margin-left:.5rem}
.optional{position:relative}
.no-optional .optional{display:none}

/* ---- buttons / chips (today's fs-btn classes) ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:2.75rem;padding:.55rem 1.1rem;border:1.5px solid transparent;border-radius:var(--fs-radius-md);font-weight:700;text-decoration:none;white-space:normal;text-align:center;background:none;color:var(--fs-text)}
.btn-solid{background:var(--fs-primary);color:var(--fs-on-primary)}
.btn-solid:hover{filter:brightness(.93)}
.btn-line{border-color:var(--fs-border-strong);color:var(--fs-text);background:var(--fs-surface)}
.btn-line:hover{border-color:var(--fs-primary);background:var(--fs-primary-soft);color:var(--fs-primary-strong)}
.btn-accent{background:var(--fs-accent);color:#1a2a20}
.fs-dark .btn-accent{color:#ecf2ea}
.btn-lg{min-height:3.25rem;padding:.75rem 1.5rem;font-size:1.05rem}
.btn-sm{min-height:2.25rem;padding:.3rem .8rem;font-size:.9rem}
.link{color:var(--fs-primary-strong);font-weight:650;text-underline-offset:.2em}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .6rem;border-radius:999px;background:var(--fs-primary-soft);color:var(--fs-primary-strong);font-size:.78rem;font-weight:700}
.chip-accent{background:var(--fs-accent);color:#1a2a20}
.fs-dark .chip-accent{color:#ecf2ea}
.g-logo{width:1.1em;height:1.1em}
.field{display:flex;gap:.5rem;align-items:stretch}
.field input{flex:1;min-width:0;min-height:2.75rem;padding:.5rem .9rem;border:1.5px solid var(--fs-border-strong);border-radius:var(--fs-radius-md);background:var(--fs-surface)}
.field input:focus{border-color:var(--fs-primary)}
.field-label{display:block;font-weight:650;font-size:.9rem;margin-bottom:.35rem}

/* ---- header (today's logged-out header, mirrored) ---- */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:1rem;height:var(--fs-header-h);padding-inline:var(--gut);background:var(--fs-header-bg);border-bottom:1px solid var(--fs-header-border);backdrop-filter:blur(10px)}
.brand{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-weight:800;letter-spacing:-.02em;flex:none}
.brand svg{width:2rem;height:2rem}
.brand span span{color:var(--fs-primary)}
.hdr nav{display:flex;gap:.25rem;flex:1}
.hdr nav a{padding:.4rem .7rem;border-radius:var(--fs-radius-sm);text-decoration:none;font-weight:600;color:var(--fs-text-muted);font-size:.95rem}
.hdr nav a[aria-current]{color:var(--fs-primary-strong);background:var(--fs-primary-soft)}
.hdr-actions{display:flex;align-items:center;gap:.4rem;margin-left:auto}
.hdr-btn{display:inline-grid;place-items:center;width:2.25rem;height:2.25rem;border:0;background:none;border-radius:var(--fs-radius-sm);color:var(--fs-text-muted)}
@container vp (max-width:700px){.hdr nav{display:none}}

/* ---- footer (today's four-column footer, abbreviated) ---- */
.foot{margin-top:4rem;padding:2rem var(--gut) 5rem;border-top:1px solid var(--fs-border);color:var(--fs-text-muted);font-size:.85rem}
.foot .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem}
.foot b{display:block;color:var(--fs-text);margin-bottom:.3rem}

/* ---- common sections ---- */
.sec{padding-block:clamp(2.5rem,2rem + 3cqi,4.5rem)}
.sec-title{font-size:clamp(1.5rem,1.1rem + 1.4cqi,2.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.sec-lead{max-width:44rem;color:var(--fs-text-muted);font-size:1.05rem;margin-top:.6rem}
.eyebrow{display:inline-flex;padding:.3rem .8rem;border-radius:999px;background:var(--fs-primary-soft);color:var(--fs-primary-strong);font-size:.8rem;font-weight:700}
.card{padding:1.4rem;border:1px solid var(--fs-border);border-radius:var(--fs-radius-lg);background:var(--fs-surface);box-shadow:var(--fs-shadow-sm)}
.grid3{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.grid2{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))}
.icon-tile{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:var(--fs-radius-md);background:var(--fs-primary-soft);color:var(--fs-primary-strong);margin-bottom:.8rem}
.icon-tile .ico{width:1.4rem;height:1.4rem}
.h3{font-size:1.1rem;font-weight:750;margin-bottom:.3rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.2rem}
.hero-actions .btn{flex:1 1 14rem}
@container vp (min-width:640px){.hero-actions .btn{flex:0 0 auto}}
.login-line{margin-top:.8rem;color:var(--fs-text-muted);font-size:.95rem}

/* counters */
.counters{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
@container vp (min-width:700px){.counters{grid-template-columns:repeat(4,1fr)}}
.counter{display:grid;gap:.2rem;padding:1.2rem;border-radius:var(--fs-radius-lg);background:var(--fs-primary-soft)}
.counter .num{color:var(--fs-primary-strong);font-size:clamp(1.7rem,1.3rem + 1.6cqi,2.6rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.counter .lbl{color:var(--fs-text);font-size:.92rem}

/* stepper (shared pieces) */
.steps{display:grid;gap:.75rem;counter-reset:s}
.step{border:1px solid var(--fs-border);border-radius:var(--fs-radius-lg);background:var(--fs-surface);overflow:hidden}
.step-h{display:flex;align-items:center;gap:.8rem;width:100%;padding:1rem 1.1rem;border:0;background:none;text-align:left}
.step-n{display:grid;place-items:center;flex:none;width:2.2rem;height:2.2rem;border-radius:999px;background:var(--fs-primary-soft);color:var(--fs-primary-strong);font-weight:800}
.step[aria-current=step] .step-n{background:var(--fs-primary);color:var(--fs-on-primary)}
.step-t{flex:1;font-weight:750}
.step-body{display:none;padding:0 1.1rem 1.1rem 4.1rem;color:var(--fs-text-muted)}
.step[aria-current=step] .step-body{display:grid;gap:.6rem}
.step-body ul{display:grid;gap:.25rem;padding-left:1.1rem;list-style:disc}
.step-nav{display:flex;gap:.5rem;justify-content:space-between;margin-top:.8rem}

/* FAQ */
.faq{display:grid;gap:.5rem}
.faq details{padding:.85rem 1rem;border:1px solid var(--fs-border);border-radius:.75rem;background:var(--fs-surface)}
.faq summary{cursor:pointer;font-weight:650}
.faq p{margin-top:.6rem;color:var(--fs-text-muted)}

/* business */
.benefits{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.benefit{display:flex;gap:.7rem;align-items:flex-start}
.benefit .ico{width:1.5rem;height:1.5rem;color:var(--fs-primary);margin-top:.15rem}
.benefit b{display:block}
.benefit span{color:var(--fs-text-muted);font-size:.93rem}
.quote{position:relative;padding:1.4rem 1.4rem 1.4rem 2.2rem;border-left:4px solid var(--fs-accent);background:var(--fs-surface);border-radius:0 var(--fs-radius-lg) var(--fs-radius-lg) 0;font-size:1.05rem}
.quote footer{margin-top:.6rem;color:var(--fs-text-muted);font-size:.9rem}

/* sticky mobile CTA */
.sticky{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:.6rem var(--gut);background:var(--fs-header-bg);border-top:1px solid var(--fs-header-border);backdrop-filter:blur(10px)}
.sticky .btn{width:100%}
.w-412 .vp[data-scrolled] .sticky{display:block}
.w-412 .vp{padding-bottom:0}

/* data states */
.ds-skel{background:linear-gradient(90deg,var(--fs-surface-muted),var(--fs-border),var(--fs-surface-muted));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:var(--fs-radius-md)}
@keyframes sh{to{background-position:-200% 0}}
.ds-msg{display:grid;justify-items:start;gap:.6rem;padding:1.4rem;border:1px solid var(--fs-border);border-radius:var(--fs-radius-lg);background:var(--fs-surface)}
.ds-msg.err{border-color:var(--fs-danger-border);background:var(--fs-danger-soft)}
.ds-msg b{display:flex;align-items:center;gap:.5rem}

/* ---- map ---- */
.map{position:relative;border:1px solid var(--fs-border);border-radius:var(--fs-radius-lg);background:var(--fs-pub-map-water);overflow:hidden;min-height:22rem;height:30rem}
.map svg.land{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:.3rem;border:0;padding:0;background:none;z-index:2}
.pin .glyph{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:var(--fs-shadow-md);border:2px solid #fff}
.fs-dark .pin .glyph{border-color:#1a201a}
.pin .glyph .ico{transform:rotate(45deg);width:1rem;height:1rem;stroke-width:2.2}
.pin-region .glyph{background:var(--fs-primary);color:#fff}
.pin-fsp .glyph{background:var(--fs-accent);color:#1a2a20}
.pin .name{position:absolute;left:50%;top:100%;transform:translate(-50%,.15rem);white-space:nowrap;font-size:.72rem;font-weight:700;color:var(--fs-text);background:color-mix(in srgb,var(--fs-surface) 85%,transparent);padding:0 .35rem;border-radius:.3rem;pointer-events:none}
.pin[aria-expanded=true] .glyph{outline:3px solid color-mix(in srgb,var(--fs-text) 50%,transparent);outline-offset:1px}
.cluster{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid #fff;background:var(--fs-primary-strong);color:#fff;font-weight:800;font-size:.9rem;box-shadow:var(--fs-shadow-md);z-index:2}
.fs-dark .cluster{border-color:#1a201a;color:#0d1f13}
.cluster.c-fsp{background:var(--fs-accent);color:#1a2a20}
.map-ctl{position:absolute;right:.6rem;top:.6rem;display:grid;gap:.3rem;z-index:3}
.map-ctl button{width:2.2rem;height:2.2rem;border:1px solid var(--fs-border-strong);border-radius:var(--fs-radius-sm);background:var(--fs-surface);font-weight:800}
.legend{position:absolute;left:.6rem;bottom:.6rem;display:flex;gap:.8rem;padding:.35rem .6rem;border-radius:var(--fs-radius-sm);background:color-mix(in srgb,var(--fs-surface) 90%,transparent);font-size:.78rem;font-weight:650;z-index:3}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
.legend .lr{background:var(--fs-primary)}.legend .lf{background:var(--fs-accent)}
.popup{position:absolute;z-index:5;width:min(20rem,calc(100% - 1.2rem));padding:1rem 1rem 1rem;border:1px solid var(--fs-border);border-radius:var(--fs-radius-lg);background:var(--fs-surface);box-shadow:var(--fs-shadow-lg);display:grid;gap:.4rem}
.popup .close{position:absolute;right:.4rem;top:.4rem;width:2rem;height:2rem;border:0;background:none;border-radius:50%;color:var(--fs-text-muted)}
.popup h3{font-size:1.05rem;padding-right:2rem}
.popup .kind{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fs-text-muted)}
.popup .facts{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.92rem}
.popup .facts b{font-weight:750}
.w-412 .popup{left:.6rem!important;right:.6rem!important;top:auto!important;bottom:.6rem;width:auto}
.map-activate{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:color-mix(in srgb,var(--fs-bg) 35%,transparent)}
.w-412 .map:not([data-active]) .map-activate{display:grid}
.map-search{display:grid;gap:.35rem;margin-bottom:1rem}
.map-search .field{max-width:26rem}
.map-hint{font-size:.9rem;color:var(--fs-text-muted);min-height:1.3em}
.map-list{margin-top:1rem}
.map-list ul{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
.map-list li{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border:1px solid var(--fs-border);border-radius:var(--fs-radius-md);background:var(--fs-surface);font-size:.92rem}
.map-list li i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;flex:none}
.map-list .lr{background:var(--fs-primary)}.map-list .lf{background:var(--fs-accent)}
.map-list a{margin-left:auto}

/* ---- Variant A: Karte zuerst ---- */
.A .hero-map{position:relative;min-height:34rem;background:var(--fs-pub-map-water);border-bottom:1px solid var(--fs-border)}
.A .hero-map .map{position:absolute;inset:0;border:0;border-radius:0;height:auto;min-height:0}
.A .hero-card{position:relative;z-index:6;max-width:30rem;margin:clamp(1.5rem,1rem + 3cqi,4rem) var(--gut);padding:1.6rem;border-radius:var(--fs-radius-xl);background:color-mix(in srgb,var(--fs-surface) 94%,transparent);border:1px solid var(--fs-border);box-shadow:var(--fs-shadow-lg);backdrop-filter:blur(8px)}
.A .hero-card h1{font-size:clamp(1.9rem,1.1rem + 3.4cqi,3rem);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:.8rem;text-wrap:balance}
.A .hero-card .lead{margin-top:.8rem;color:var(--fs-text-muted);font-size:1.05rem}
.A .hero-card .map-search{margin:1.1rem 0 0}
.A .hero-card .hero-actions{margin-top:1rem}
.A .hero-card .btn{flex:1 1 auto}
.A .counters-strip{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr);padding:1.4rem;border-radius:var(--fs-radius-lg);background:var(--fs-primary-strong);color:#fff}
.fs-dark .A .counters-strip{background:var(--fs-primary-soft);color:var(--fs-text)}
@container vp (min-width:700px){.A .counters-strip{grid-template-columns:repeat(4,1fr)}}
.A .counters-strip .num{font-size:clamp(1.6rem,1.2rem + 1.6cqi,2.4rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fs-dark .A .counters-strip .num{color:var(--fs-primary-strong)}
.A .counters-strip .lbl{font-size:.9rem;opacity:.9}
.A .hsteps{display:grid;gap:.75rem}
@container vp (min-width:900px){.A .hsteps{grid-template-columns:repeat(4,1fr)} .A .hsteps .step-body{padding-left:1.1rem} .A .hsteps .step-h{flex-direction:column;align-items:flex-start} .A .hsteps .step{display:grid;align-content:start}}
@container vp (max-width:700px){.A .hero-map{min-height:0;display:grid} .A .hero-map .map{position:relative;height:14rem;order:2} .A .hero-card{margin:1rem var(--gut)}}
.A .cta-band{display:grid;gap:1rem;justify-items:start;padding:2rem;border-radius:var(--fs-radius-xl);background:var(--fs-primary-soft)}

/* ---- Variant B: Scroll-Reise ---- */
.B .hero{padding:clamp(3rem,2rem + 5cqi,7rem) 0 clamp(2rem,1rem + 3cqi,4rem)}
.B .hero h1{font-size:clamp(2.6rem,1.4rem + 5.4cqi,5.2rem);font-weight:850;letter-spacing:-.045em;line-height:.98;max-width:16ch;text-wrap:balance}
.B .hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--fs-accent) 62%)}
.B .hero .lead{max-width:36rem;margin-top:1.4rem;font-size:clamp(1.1rem,1rem + .6cqi,1.35rem);color:var(--fs-text-muted);line-height:1.5}
.B .hero .map-search{margin-top:1.4rem}
.B .chapter{padding-block:clamp(3rem,2rem + 4cqi,6rem);border-top:1px solid var(--fs-border)}
.B .chapter-h{display:grid;gap:.4rem;grid-template-columns:auto 1fr;align-items:baseline;column-gap:1.2rem;margin-bottom:1.6rem}
.B .chapter-n{font-size:clamp(2.6rem,2rem + 3cqi,4.6rem);font-weight:850;letter-spacing:-.05em;line-height:1;color:var(--fs-accent)}
.B .chapter-h h2{font-size:clamp(1.8rem,1.3rem + 2.2cqi,3rem);font-weight:800;letter-spacing:-.035em;line-height:1.08;text-wrap:balance}
.B .chapter-h p{grid-column:2;max-width:40rem;color:var(--fs-text-muted);font-size:1.08rem}
.B .bignum{display:grid;gap:.2rem;padding:1.6rem 0}
.B .bignum .num{font-size:clamp(3rem,2rem + 6cqi,6rem);font-weight:850;letter-spacing:-.05em;line-height:1;color:var(--fs-primary-strong);font-variant-numeric:tabular-nums}
.B .ways{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.B .way{display:grid;gap:.4rem;padding-top:1rem;border-top:3px solid var(--fs-primary)}
.B .way .h3{font-size:1.25rem}

  if(kind==='empty') return `<div class="ds-msg" data-testid="${testid}"><b>${I.pin} ${what==='map'?'Noch keine Bezirke auf der Karte.':'Noch keine Zahlen.'}</b><span class="muted">${what==='map'?'Werde die erste Foodsaver:in in deiner Gegend.':'Sobald die erste Abholung gezählt ist, erscheinen sie hier.'}</span>${what==='map'?`<a class="btn btn-solid btn-sm" href="#">${C.join}</a>`:''}</div>`;
  return '';
}

function mapBlock(withSearch=true,extraClass=''){

}
let view={...OVERVIEW};
function project(x,y){return{l:(x-view.x)/view.w*100,t:(y-view.y)/view.h*100}}
function drawPins(){
  const el=$('#pins'); if(!el) return;
  const k=OVERVIEW.w/view.w;
  const out=[];
  REGIONS.forEach(r=>{const p=project(r.x,r.y); if(p.l<-5||p.l>105||p.t<-5||p.t>105) return;
    out.push(`<button class="pin pin-region" style="left:${p.l}%;top:${p.t}%" aria-label="Bezirk ${r.n}" aria-expanded="${S.popup==='r'+r.id}" onclick="openPopup('r','${r.id}',this)" data-testid="public.landing.map.pin.region.${r.slug}"><span class="glyph">${I.users}</span>${k>3?`<span class="name">${r.n}</span>`:''}</button>`);});
  /* Fairteiler cluster per ~12 units at overview, singles when zoomed in */
  const radius=12/k; const used=new Set();
  FSPS.forEach((f,i)=>{if(used.has(i)) return; const grp=[f]; used.add(i);
    FSPS.forEach((g,j)=>{if(!used.has(j)&&Math.hypot(g.x-f.x,g.y-f.y)<radius){grp.push(g);used.add(j);}});
    const cx=grp.reduce((a,b)=>a+b.x,0)/grp.length, cy=grp.reduce((a,b)=>a+b.y,0)/grp.length; const p=project(cx,cy);
    if(p.l<-5||p.l>105||p.t<-5||p.t>105) return;
    if(grp.length>1) out.push(`<button class="cluster c-fsp" style="left:${p.l}%;top:${p.t}%" aria-label="${grp.length} Fairteiler, zum Vergrössern" onclick="zoomTo({x:${cx},y:${cy},w:${Math.max(20,view.w/3)}})" data-testid="public.landing.map.cluster">${grp.length}</button>`);
    else out.push(`<button class="pin pin-fsp" style="left:${p.l}%;top:${p.t}%" aria-label="${f.n}" aria-expanded="${S.popup==='f'+f.id}" onclick="openPopup('f','${f.id}',this)" data-testid="public.landing.map.pin.fsp.${f.id}"><span class="glyph">${I.fridge}</span>${k>3?`<span class="name">${f.n.replace('Fairteiler ','')}</span>`:''}</button>`);
  });
  el.innerHTML=out.join('');
}
function setView(v){view=v; const svg=$('#map svg.land'); if(svg) svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`); drawPins();}
function zoomTo(t){
  const target=t?{w:t.w,h:t.w*OVERVIEW.h/OVERVIEW.w,x:t.x-t.w/2,y:t.y-(t.w*OVERVIEW.h/OVERVIEW.w)/2}:{...OVERVIEW};
  S.popup=null; $('#popup')&&($('#popup').innerHTML='');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){setView(target);return;}
  const from={...view}, t0=performance.now(), dur=350;
  const step=now=>{const u=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-u,3);
    setView({x:from.x+(target.x-from.x)*e,y:from.y+(target.y-from.y)*e,w:from.w+(target.w-from.w)*e,h:from.h+(target.h-from.h)*e});
    if(u<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function zoomBy(d){const w=d>0?view.w/1.8:Math.min(OVERVIEW.w,view.w*1.8); zoomTo({x:view.x+view.w/2,y:view.y+view.h/2,w});}
function openPopup(kind,id,btn){
  const key=kind+id; if(S.popup===key){closePopup();return;}
  S.popup=key; drawPins();
  const host=$('#popup'); if(!host) return;
  let html;
  if(kind==='r'){const r=REGIONS.find(r=>r.id===id);
    html=`<span class="kind">Bezirk</span><h3 id="pp-t">${r.n}</h3><div class="facts"><span><b>${r.stores}</b> aktive Kooperationen</span><span><b>${fmt(r.members)}</b> Mitglieder</span></div><a class="link" href="#/r/${r.slug}" data-testid="public.landing.map.popup.link">Zur Bezirksseite →</a>`;
  } else {const f=FSPS.find(f=>f.id===id);
    html=`<span class="kind">Fairteiler</span><h3 id="pp-t">${f.n}</h3><p class="muted" style="font-size:.92rem">${I.pin} ${f.loc}</p><p style="font-size:.95rem">Alle dürfen Lebensmittel bringen und nehmen – ohne Konto.</p>`;}
  /* position next to the pin (desktop); the phone CSS pins it to the bottom */
  const map=$('#map'), b=btn.getBoundingClientRect(), m=map.getBoundingClientRect();
  let left=b.left-m.left+20, top=b.top-m.top-10; if(left>m.width-340) left=Math.max(10,b.left-m.left-330); if(top<10) top=10; if(top>m.height-170) top=m.height-170;
  host.innerHTML=`<div class="popup" role="dialog" aria-labelledby="pp-t" style="left:${left}px;top:${top}px" data-testid="public.landing.map.popup"><button class="close" aria-label="Schliessen" onclick="closePopup()">${I.x}</button>${html}</div>`;
  host.querySelector('.close').focus();
}
function closePopup(){S.popup=null; const h=$('#popup'); if(h) h.innerHTML=''; drawPins();}
function search(e){e.preventDefault(); const f=e.target, pc=f.pc.value.trim(), hint=f.querySelector('[data-hint]');
  if(!/^\d{4,5}$/.test(pc)){hint.textContent='Bitte eine Postleitzahl mit 4 oder 5 Ziffern.';return false;}
  const r=pcMatch(pc);
  if(!r){hint.textContent='Noch kein Bezirk in deiner Nähe – gründe einen, wir helfen dir dabei.';return false;}
  hint.innerHTML=`Dein Bezirk: <b>${r.n}</b> · ${r.stores} Kooperationen · <a class="link" href="#/r/${r.slug}">Bezirksseite</a>`;
  const map=$('#map'); if(map){S.mapActive=true; map.setAttribute('data-active',''); map.scrollIntoView({behavior:'smooth',block:'center'});}
  zoomTo({x:r.x,y:r.y,w:40}); return false;}

  <section class="sec" style="padding-top:0" data-testid="public.explainer.business" aria-labelledby="d-b"><div class="bizcard"><div class="card"><span class="eyebrow">Für Betriebe</span><h2 class="sec-title" id="d-b" style="font-size:1.6rem">${BIZ_D.title}</h2><p class="muted">${BIZ_D.lead}</p><div>${`<a class="btn btn-solid btn-lg" href="#/support?from=/&subject=partner" data-testid="public.landing.business.cta">${I.store}<span>${BIZ_D.cta}</span></a>`}</div>
      <ul class="benefits">${BIZ_D.benefits.map(b=>`<li class="benefit" data-testid="public.landing.business.benefit.${b.id}">${I[b.ic]}<div><b>${b.t}</b><span>${b.x}</span></div></li>`).join('')}</ul><p class="muted" style="font-size:.85rem">${I.leaf} ${BIZ_D.tag}</p></div>
    <div class="bizpanel">${bubble('business',true)}<blockquote class="optional" data-testid="public.landing.business.quote" style="margin-top:.5rem;font-size:.98rem"><p>${C.biz.quote}</p><footer class="muted" style="font-size:.85rem;margin-top:.4rem">${C.biz.quoteBy}<span class="opt-tag">optional</span></footer></blockquote></div></div></section>
  <section class="sec optional" style="padding-top:0" data-testid="public.landing.moreWays" aria-labelledby="d-w"><div class="split flip"><div><h2 class="sec-title" id="d-w">${C.ways2.title}<span class="opt-tag">optional</span></h2><p class="sec-lead">foodsharing ist ehrenamtlich, unabhängig, werbefrei und open source. Es gibt mehr als einen Weg, dabei zu sein.</p><ul style="display:grid;gap:.7rem;margin-top:1.2rem">${C.ways2.items.map((w,i)=>`<li class="benefit" data-testid="public.landing.moreWays.${['basket','donate','it'][i]}">${I[w.ic]}<div><b>${w.t}</b><span>${w.x}</span></div></li>`).join('')}</ul></div>${bubble('ways',true)}</div></section>
  <section class="sec" style="padding-top:0" data-testid="public.landing.duties" aria-labelledby="d-du"><h2 class="sec-title" id="d-du">${C.duties.title}</h2><p class="sec-lead">${C.duties.lead}</p>
    <div class="duties" style="margin-top:1.4rem"><div class="duty-card"><h3>Das versprichst du</h3><ul>${C.duties.yes.map(d=>`<li class="benefit" data-testid="public.landing.duties.${d.id}">${I[d.ic]}<div><b>${d.t}</b><span>${d.x}</span></div></li>`).join('')}</ul>
      <p class="duty-foot">${I.book} <a href="https://wiki.foodsharing.network/wiki/Verhaltensregeln" data-testid="public.landing.duties.rules">${C.duties.rulesLink}</a></p></div>
      <div class="duty-card soft"><h3>Das musst du nicht</h3><ul>${C.duties.no.map(d=>`<li class="benefit" data-testid="public.landing.duties.not.${d.id}">${I.check}<div><b>${d.t}</b><span>${d.x}</span></div></li>`).join('')}</ul></div></div></section>
  <section class="sec" style="padding-top:0" data-testid="public.explainer.faq" aria-labelledby="d-q"><h2 class="sec-title" id="d-q">${C.faqTitle}</h2>
    <div class="faq-groups">${C.faqGroups.map(g=>`<div class="faq-group" data-testid="public.explainer.faq.group.${g.id}"><h3 id="fq-${g.id}">${g.t}</h3><div class="faq" role="list" aria-labelledby="fq-${g.id}">${g.items.map(f=>`<details role="listitem" data-testid="public.explainer.faq.${f.id}"><summary>${f.q}</summary><p>${f.a}</p></details>`).join('')}</div></div>`).join('')}</div>
    <p class="faq-more muted">Noch etwas offen? <a href="https://wiki.foodsharing.network/wiki/Foodsharer" data-testid="public.explainer.faq.wiki">Im Wiki nachlesen</a> oder <a href="#/support" data-testid="public.explainer.faq.support">uns schreiben</a>.</p></section>
  <section class="sec" style="padding-top:0"><div class="cta-band"><h2 class="sec-title">Bereit? Dein Bezirk wartet.</h2><p class="muted">Konto in zwei Minuten, der Rest Schritt für Schritt.</p><div class="hero-actions"><a class="btn btn-lg btn-solid" href="#">${I.mail}<span>Mit E-Mail mitmachen</span></a><a class="btn btn-lg btn-line" href="#">${I.google}<span>${C.joinGoogle}</span></a></div></div></section>
  </main>${footer()}${sticky()}</div>`;
}

/* ============ Today (rough sketch of the current page) ============ */

  const todaySteps=['Konto erstellen','Profil & Bezirk','Grundlagen lernen','Vereinbarung','Foodsaver-Quiz','Einführungsabholungen','Ausweis prüfen','Foodsaver-Ausweis'];
  return `<div class="T">${header()}<main class="wrap">
  <div class="mock-note">Heute: grobe Skizze der aktuellen Seite (<code>landing-page.component.ts</code>) zum Vergleich.</div>
  <section class="hero" data-testid="public.landing.hero"><span class="eyebrow">Gemeinsam gegen Lebensmittelverschwendung</span><h1>Retten statt wegwerfen.</h1><p class="muted" style="max-width:34rem">Mit foodsharing holst du überschüssige Lebensmittel bei Betrieben in deiner Nähe ab und teilst sie – freiwillig, kostenlos und gemeinsam mit vielen anderen.</p>
    <div class="hero-actions"><a class="btn btn-lg btn-line" href="#">${I.google}<span>Mit Google mitmachen</span></a><a class="btn btn-lg btn-line" href="#">${I.mail}<span>Mit E-Mail mitmachen</span></a></div><p class="login-line">Schon dabei? <a class="link" href="#">Anmelden</a></p></section>
  <section class="values">${[['bag','Lebensmittel abholen','Bäckereien, Läden und Restaurants geben uns, was sie nicht mehr verkaufen können.'],['home','Teilen statt wegwerfen','Gerettetes landet bei dir, deinen Nachbar:innen oder in einem Fair-Teiler.'],['users','Eine starke Gemeinschaft','Tausende Freiwillige in der ganzen Schweiz – wir zeigen dir Schritt für Schritt, wie es geht.']].map(v=>`<article class="card"><div class="icon-tile">${I[v[0]]}</div><h2 class="h3">${v[1]}</h2><p class="muted">${v[2]}</p></article>`).join('')}</section>
  <section class="sec"><h2 class="sec-title">Was wir gemeinsam bewegen</h2><ul class="counters" style="margin-top:1rem">${[['12 480','Foodsaver:innen'],['14','aktive Bezirke'],['0','kooperierende Betriebe'],['0','kg gerettet']].map(c=>`<li class="counter"><span class="num">${c[0]}</span><span class="lbl">${c[1]}</span></li>`).join('')}</ul></section>
  <section class="sec" style="padding-top:0"><h2 class="sec-title">So wirst du Foodsaver:in</h2><p class="sec-lead">Acht Schritte, die meisten davon online. Du siehst jederzeit, wo du stehst.</p><ol class="today-steps" style="margin-top:1rem">${todaySteps.map((s,i)=>`<li><span class="step-n">${i+1}</span>${s}</li>`).join('')}</ol></section>
  <section class="sec" style="padding-top:0"><h2 class="sec-title">Finde deinen Bezirk</h2><p class="sec-lead">Gib deine Postleitzahl ein und sieh die nächsten Einführungstermine.</p><div class="region" style="margin-top:1rem"><div class="card"><label class="field-label">Postleitzahl oder Ort</label><div class="field"><input placeholder="8004"><button class="btn btn-solid">Suchen</button></div></div><div class="card muted">(Bezirkskarte erscheint nach Auswahl: Botschafter:innen, nächste Einführungstermine)</div></div></section>
  <section class="sec" style="padding-top:0"><h2 class="sec-title">Häufige Fragen</h2><div class="faq" style="margin-top:1rem;max-width:48rem">${C.faq.slice(0,5).map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join('')}</div></section>
  <section class="sec" style="padding-top:0"><div class="contact"><h2 class="sec-title">Für Betriebe</h2><p class="muted">Sie möchten Lebensmittel retten lassen? Wir holen zuverlässig und kostenlos ab.</p><a class="btn btn-line" href="#">${I.mail}<span>Kontakt aufnehmen</span></a></div></section>
  </main>${footer()}</div>`;
}

/* ============ bar + render ============ */
function bar(){
  const seg=(label,key,opts)=>`<span class="seg"><b>${label}</b>${opts.map(([v,l])=>`<button aria-pressed="${S[key]===v}" onclick="set('${key}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${l}</button>`).join('')}</span>`;
  $('#bar').innerHTML=seg('Variante','variant',[['D','D · Neu (Hero + Bubbles)'],['A','A'],['B','B'],['C','C'],['T','Heute']])
    +seg('Thema','dark',[[false,'Hell'],[true,'Dunkel']])
    +seg('Breite','width',[['win','Fenster'],['412','412 px']])
    +seg('Akzent','accent',[['sparsam','sparsam'],['ohne','ohne']])
    +seg('Daten','data',[['ok','OK'],['skeleton','Skeleton'],['error','Fehler'],['empty','Leer'],['offline','Offline']])
    +seg('Optionale Sektionen','optional',[[true,'An'],[false,'Aus']])
    +`<span class="seg" style="margin-left:auto;opacity:.7">PLZ 8004 / 8400 / 4051 / 10115 / 1160 · Schritte 1–4 · A–C: Klick auf Pins</span>`;
}
function set(k,v){S[k]=v; if(k==='variant'){S.popup=null;S.list=false;} render();}
function setData(v){S.data=v;render();}
function render(){
  bar();
  document.documentElement.classList.toggle('fs-dark',S.dark);
  document.documentElement.classList.toggle('no-accent',S.accent==='ohne');
  document.body.className=(S.width==='412'?'w-412 ':'')+(S.optional?'':'no-optional');
  const root=$('#root');
  root.innerHTML=`<div class="vp" id="vp">${({A:pageA,B:pageB,C:pageC,D:pageD,T:pageT})[S.variant]()}</div>`;
  view={...view}; if(!$('#map')) view={...OVERVIEW}; setView(view);
  countUp();
}
function countUp(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.cu').forEach(el=>{const target=+el.dataset.value; if(reduced){el.textContent=fmt(target);return;}
    const t0=performance.now(), dur=1200; const step=now=>{const u=Math.min(1,(now-t0)/dur); el.textContent=fmt(target*(1-Math.pow(1-u,3))); if(u<1) requestAnimationFrame(step);}; requestAnimationFrame(step);});
}
addEventListener('scroll',()=>{const vp=$('#vp'); if(!vp) return; if(scrollY>420) vp.setAttribute('data-scrolled',''); else vp.removeAttribute('data-scrolled');});
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.popup) closePopup();});
render();
</script>

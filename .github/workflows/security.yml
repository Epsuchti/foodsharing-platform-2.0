name: Security

# D17.2: OWASP dependency-check of the server's runtime dependencies (CVSS >= 7 fails) and npm audit of the
# production dependencies, weekly and on demand. npm audit also runs on every PR in ci.yml (fast); the NVD-based
# dependency-check stays off the PR path (it downloads the NVD database).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache the NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: ./mvnw -Pskip-client,security verify
        working-directory: server
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Pskip-client,security verify -DskipTests
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: server/target/dependency-check-report.*
          retention-days: 30

  npm-audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [., client, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
      - name: npm audit --omit=dev --audit-level=high (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

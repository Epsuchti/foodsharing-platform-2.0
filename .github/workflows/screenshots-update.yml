name: Update screenshots

# Regenerates screenshot baselines (e2e/__screenshots__) on a branch and commits them back to it, so baselines can be
# updated without Docker on a local machine (decision 69: deliberate batch updates, reviewed in the PR).
#
#   gh workflow run screenshots-update.yml --ref <branch> [-f mode=changed|all|missing] [-f grep=@S6] [-f shards=2]
#   gh run watch "$(gh run list -w screenshots-update.yml -b <branch> -L 1 --json databaseId -q '.[0].databaseId')"
#   git pull   # the bot commit "Update screenshot baselines (<mode>)"
#
# The commit is pushed with GITHUB_TOKEN, so it does not start ci.yml again; push again (or re-run CI) when the PR
# checks must see the new baselines. Never runs on main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Playwright --update-snapshots mode'
        type: choice
        options: [changed, all, missing]
        default: changed
      grep:
        description: 'Optional --grep filter (e.g. @S6); empty = every screenshot spec'
        type: string
        default: ''
      shards:
        description: 'Jars / Playwright shards on the runner (screenshots.sh --shards)'
        type: string
        default: '1'

concurrency:
  group: screenshots-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24.15.0'

jobs:
  update:
    name: Update screenshot baselines (${{ inputs.mode }})
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the jar (./mvnw package, tests skipped)
        working-directory: server
        run: ./mvnw -B -ntp -DskipTests package
      # Starts the jar on the runner and runs Playwright inside mcr.microsoft.com/playwright:v1.64.1-noble, the same
      # image ci.yml compares with. A failing test does not stop the commit of the baselines that were written; the
      # job fails at the end instead.
      - name: screenshots.sh --update-snapshots=${{ inputs.mode }}
        id: run
        env:
          MODE: ${{ inputs.mode }}
          GREP: ${{ inputs.grep }}
          SHARDS: ${{ inputs.shards }}
        run: |
          args=("--update-snapshots=${MODE}" "--shards=${SHARDS}")
          if [[ -n "${GREP}" ]]; then args+=(--grep "${GREP}"); fi
          status=0
          bash e2e/scripts/screenshots.sh "${args[@]}" || status=$?
          echo "status=${status}" >>"${GITHUB_OUTPUT}"
      - name: Add results to the run summary
        if: ${{ !cancelled() }}
        run: node e2e/scripts/run-sharded.mjs --step-summary "Screenshot update" e2e/test-results/results.json
      - name: Commit and push changed baselines
        env:
          MODE: ${{ inputs.mode }}
          GREP: ${{ inputs.grep }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -A e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No baseline changed." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "### Changed baselines"
            echo '```'
            git diff --cached --name-status
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="Update screenshot baselines (${MODE}${GREP:+, ${GREP}})"
          git commit -q -m "${message}" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The branch may have moved during the run; baselines rarely conflict with code commits.
          git pull -q --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
      - name: Upload screenshot report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-update-report
          path: |
            e2e/playwright-report
            e2e/test-results/server-screenshots*.log
          retention-days: 14
      - name: Fail when Playwright failed
        if: steps.run.outputs.status != '0'
        run: |
          echo "::error::screenshots.sh exited with ${{ steps.run.outputs.status }}; see the report artifact. Baselines that were written are committed."
          exit 1

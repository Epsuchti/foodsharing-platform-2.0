name: Tiles builder image

# Publishes the map basemap builder (MT2, decision 163 D3) as ghcr.io/<owner>/foodsharing-tiles-builder:<version>
# and :latest for linux/amd64 + linux/arm64. <version> is server/deploy/tiles-builder/version.txt; bump it with every
# change of that folder. An existing <version> tag is never overwritten (the run fails instead).
#
#   gh workflow run tiles-image.yml --ref main
on:
  push:
    branches: [main]
    paths:
      - 'server/deploy/tiles-builder/**'
  workflow_dispatch:

concurrency:
  group: tiles-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the tiles builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version and image
        id: meta
        run: |
          version="$(tr -d '[:space:]' < server/deploy/tiles-builder/version.txt)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::server/deploy/tiles-builder/version.txt is '${version}', expected digits, e.g. 2"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/foodsharing-tiles-builder" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists; bump server/deploy/tiles-builder/version.txt"
            exit 1
          fi
      - name: Build and push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg TILES_BUILDER_VERSION="${VERSION}" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" --push server/deploy/tiles-builder
